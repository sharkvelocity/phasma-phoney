<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Phasma‑Phoney v2.3.1 — Master Build</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Phasma‑Phoney: Turn-based ghost investigation horror game with cursed items and orb mini-game." />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background: black;
      overflow: hidden;
      font-family: monospace, sans-serif;
      color: #eee;
    }
    #title-screen {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      display: flex; justify-content: center; align-items: center;
      background: black; z-index: 100;
      opacity: 1; transition: opacity 2s ease-in-out;
    }
    #title-screen img {
      max-width: 80%;
      animation: pulse 5s infinite ease-in-out;
      opacity: 0.9;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.9; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.04); }
    }
    #startButton {
      position: absolute;
      bottom: 20%;
      left: 50%;
      transform: translateX(-50%);
      padding: 16px 48px;
      font-size: 24px;
      background-color: #111;
      color: #eee;
      border: 2px solid #444;
      cursor: pointer;
      z-index: 101;
      transition: all 0.3s ease;
    }
    #startButton:hover {
      background-color: #222;
      border-color: #888;
    }
    #main-scene {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: none;
      overflow: hidden;
      background: black;
    }
    #background, #rain-layer, #lightning, #foreground, #fog-layer, #orbCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    #background { z-index:1; background-size:cover; background-position:center; }
    #rain-layer { z-index:1.5; pointer-events:none; }
    #lightning { z-index:3; background:white; opacity:0; pointer-events:none; }
    #foreground { z-index:4; pointer-events:none; }
    #fog-layer { z-index:5; pointer-events:none; }
    #orbCanvas { z-index:6; pointer-events:none; }
    #narrator-ui {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 40%;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(4px);
      display: none;
      flex-direction: column;
      justify-content: space-between;
      z-index: 10;
    }
    #game-log {
      flex:1;
      overflow-y:auto;
      padding:10px;
      font-size:14px;
      line-height:1.4;
      opacity:0.95;
    }
    #game-log::-webkit-scrollbar { width:6px; }
    #game-log::-webkit-scrollbar-thumb {
      background:#444;
      border-radius:3px;
    }
    .log-entry {
      opacity:0.85;
      transition:opacity 1s ease-in-out;
    }
    .log-entry.fade { opacity:0.4; }
    #command-buttons {
      display:flex;
      justify-content:space-around;
      padding:10px;
      border-top:1px solid #555;
      background:rgba(0,0,0,0.5);
    }
    #command-buttons button {
      padding:8px 12px;
      background:#222;
      color:#eee;
      border:1px solid #555;
      cursor:pointer;
      font-size:14px;
    }
    #command-buttons button:hover { background:#333; }
    #hud {
      position: absolute;
      top:10px;
      left:10px;
      background: rgba(0,0,0,0.5);
      padding:8px 12px;
      border:1px solid #444;
      font-size:14px;
      z-index:11;
    }
    #sanity-bar-container {
      width:120px;
      height:10px;
      background:#222;
      border:1px solid #555;
      margin-top:4px;
      position:relative;
    }
    #sanity-bar {
      position:absolute;
      top:0;
      left:0;
      height:100%;
      background:#0f0;
      width:100%;
      transition:width 0.3s ease;
    }
    #inventory-display {
      position: absolute;
      top:10px;
      right:10px;
      background: rgba(0,0,0,0.5);
      padding:6px 10px;
      border:1px solid #444;
      font-size:12px;
      z-index:11;
    }
    #loadout-screen {
      position:fixed;
      top:0;
      left:0;
      width:100vw;
      height:100vh;
      background:rgba(0,0,0,0.9);
      display:none;
      justify-content:center;
      align-items:center;
      flex-direction:column;
      z-index:200;
    }
    #loadout-container {
      background:#111;
      padding:20px;
      border:1px solid #555;
      max-width:400px;
      width:90%;
      color:#eee;
    }
    #van-inventory, #held-items { margin-bottom:10px; }
    .item-button {
      background:#222;
      color:#eee;
      border:1px solid #555;
      padding:4px 6px;
      margin:2px;
      cursor:pointer;
      font-size:12px;
    }
    .item-button:hover { background:#333; }
    #confirm-loadout {
      margin-top:10px;
      padding:8px 12px;
      background:#111;
      color:#eee;
      border:1px solid #555;
      cursor:pointer;
    }
    #move-overlay, #item-overlay, #inventory-overlay, #inspect-overlay, #monitor-overlay {
      position:fixed;
      top:0;
      left:0;
      width:100vw;
      height:100vh;
      background:rgba(0,0,0,0.8);
      display:none;
      justify-content:center;
      align-items:center;
      flex-direction:column;
      z-index:250;
    }
    #move-options, #item-options, #inventory-options, #inspect-content, #monitor-screen {
      background:#111;
      padding:20px;
      border:1px solid #444;
      max-height:70%;
      overflow-y:auto;
      color:#eee;
    }
    #move-options button, #item-options button, #inventory-options button {
      display:block;
      width:100%;
      margin:4px 0;
      padding:6px;
      background:#222;
      color:#eee;
      border:1px solid #555;
      cursor:pointer;
    }
    #move-options button:hover, #item-options button:hover, #inventory-options button:hover {
      background:#333;
    }
    #inspect-content {
      width:300px;
      text-align:center;
    }
    #inspect-title {
      font-size:16px;
      color:#0f0;
      margin-bottom:10px;
    }
    #inspect-description {
      font-size:13px;
      line-height:1.4;
      color:#ccc;
    }
    #monitor-screen {
      width:400px;
      height:300px;
      text-align:center;
      font-family:monospace;
    }
    #monitor-border {
      border:6px solid #444;
      padding:10px;
      width:100%;
      height:100%;
      background:#000;
      display:flex;
      flex-direction:column;
      align-items:center;
      overflow:hidden;
    }
    #monitor-logo { width:150px; margin-bottom:10px; }
    #loading-bar-container {
      width:80%;
      height:12px;
      background:#111;
      border:1px solid #444;
      margin-top:10px;
      overflow:hidden;
      position:relative;
    }
    #loading-bar {
      width:0%;
      height:100%;
      background:#0f0;
      transition:width 2s linear;
    }
    #login-fields {
      display:none;
      text-align:left;
      margin-top:15px;
      width:80%;
    }
    .login-line {
      background:#000;
      border:1px solid #333;
      padding:4px;
      margin:5px 0;
      color:#0f0;
      font-family:monospace;
    }
    #orb-game-canvas {
      display:none;
      background:black;
      border:4px solid #444;
      width:360px;
      height:240px;
      margin-top:10px;
    }
    #orb-game-score, #orb-game-timer {
      color:#0f0;
      margin-top:5px;
      font-size:14px;
    }
    #orb-game-controls button {
      margin:4px;
      background:#222;
      color:#eee;
      border:1px solid #555;
      cursor:pointer;
    }
    #flip-clock {
      font-family:monospace;
      color:#0f0;
      font-size:18px;
      margin-top:4px;
    }
    #guess-popup {
      position:fixed;
      top:0;
      left:0;
      width:100vw;
      height:100vh;
      background:rgba(0,0,0,0.8);
      display:none;
      justify-content:center;
      align-items:center;
      z-index:300;
    }
    #guess-list {
      background:#111;
      padding:20px;
      border:1px solid #444;
      max-height:70%;
      overflow-y:auto;
    }
    #guess-list button {
      display:block;
      width:100%;
      margin:4px 0;
      padding:6px;
      background:#222;
      color:#eee;
      border:1px solid #555;
      cursor:pointer;
    }
    #guess-list button:hover { background:#333; }
    footer {
      position:fixed;
      bottom:0;
      width:100%;
      text-align:center;
      background:#111;
      color:#555;
      font-size:10px;
      padding:2px 0;
      z-index:500;
    }
  </style>
</head>
<body>
  <div id="title-screen">
    <img src="logo.png" alt="Phasma-Phoney Logo" />
    <button id="startButton">Start New Game</button>
  </div>
  <div id="main-scene">
    <div id="background"></div>
    <canvas id="rain-layer"></canvas>
    <div id="lightning"></div>
    <div id="foreground"></div>
    <canvas id="fog-layer"></canvas>
    <canvas id="orbCanvas"></canvas>
    <div id="hud">
      <div>Location: <span id="hud-location">Van</span> | Weather: <span id="hud-weather">--</span></div>
      <div>Turns: <span id="hud-turns">0</span></div>
      <div>Sanity:</div>
      <div id="sanity-bar-container"><div id="sanity-bar"></div></div>
      <div>Temp: <span id="hud-temp">--°C</span></div>
    </div>
    <div id="inventory-display">
      <div>Held:</div>
      <div id="held-items-display">None</div>
    </div>
    <div id="narrator-ui">
      <div id="game-log"></div>
      <div id="command-buttons">
        <button data-cmd="move">Move</button>
        <button data-cmd="look">Look Around</button>
        <button data-cmd="use">Use Item</button>
        <button data-cmd="inventory">Inventory</button>
        <button data-cmd="monitor">Monitor</button>
        <button data-cmd="guess">Ghost Guess</button>
      </div>
    </div>
  <!-- === LOADOUT SCREEN === -->
  <div id="loadout-screen">
    <div id="loadout-container">
      <h3>Select Your Starting Loadout (Max 3 Items)</h3>
      <div id="held-items"><strong>Holding:</strong> <div id="held-list"></div></div>
      <div id="van-inventory"><strong>Van Inventory:</strong> <div id="van-list"></div></div>
      <button id="confirm-loadout">Confirm</button>
    </div>
  </div>

  <!-- === OVERLAYS === -->
  <div id="move-overlay"><div id="move-options"></div></div>
  <div id="item-overlay"><div id="item-options"></div></div>
  <div id="inventory-overlay"><div id="inventory-options"></div></div>
  <div id="inspect-overlay"><div id="inspect-content">
    <div id="inspect-title"></div>
    <div id="inspect-description"></div>
    <button onclick="closeInspect()">Close</button>
  </div></div>
  <div id="monitor-overlay">
    <div id="monitor-screen">
      <div id="monitor-border">
        <img id="monitor-logo" src="logo.png" alt="Monitor Logo" />
        <div id="loading-bar-container"><div id="loading-bar"></div></div>
        <div id="login-fields">
          <div class="login-line">Username: <span id="login-username"></span></div>
          <div class="login-line">Password: <span id="login-password"></span></div>
        </div>
      </div>
      <canvas id="orb-game-canvas"></canvas>
      <div id="flip-clock"></div>
      <div id="orb-game-score"></div>
      <div id="orb-game-timer"></div>
      <div id="orb-game-controls">
        <button id="start-orb-game">Play Orb Capture</button>
        <button id="close-monitor" style="margin-top:10px;">Close</button>
      </div>
    </div>
  </div>

  <div id="guess-popup"><div id="guess-list"></div></div>
  <footer>Phasma‑Phoney v2.3.1 — Master Build</footer>
  <script>
    /* === GLOBAL GAME STATE === */
    const allLoadoutItems = [
      "EMF Reader","Spirit Box","Camera","UV Light","D.O.T.S Projector",
      "Thermometer","Ghost Writing Book","Video Camera","Crucifix",
      "Smudge Stick","Salt","Parabolic Microphone","Motion Sensor","Sound Sensor"
    ];
    const cursedItemList = [
      "Ouija Board","Tarot Cards","Music Box","Voodoo Doll",
      "Haunted Mirror","Summoning Circle","Monkey Paw"
    ];
    const possibleWeather = ["Stormy","Rain","Clear","Foggy"];

    const game = {
      ghost: null, ghostRoom: null, playerRoom: "Van",
      inventory: [], vanStock: [...allLoadoutItems], roomItems: {},
      selectedEvidence: new Set(), currentTurn: 0, sanity: 100,
      mimicForm: null, nextMimicShift: 0, huntCooldown: 0, smudgeActive: 0,
      weather: null, cameraActive: false, placedCrucifix: {},
      titleShown: false, monitorBooted: false, placedCameras: {},
      usedCursedItems: {}, spawnedCursedItem: null, spawnedCursedRoom: null,
      orbSpawnInterval: null
    };

    const cursedItemDescriptions = {
      "Ouija Board":"A wooden spirit board; lets you ask the ghost questions, but drains sanity each time. Breaks may trigger an immediate hunt.",
      "Tarot Cards":"A mysterious deck; pulling a card may bless or curse you — expect sanity loss, ghost activity spikes, or even an instant hunt.",
      "Music Box":"A delicate box playing a haunted melody; the ghost will approach. Overuse risks triggering a hunt.",
      "Voodoo Doll":"A cursed doll with pins; poking it forces ghost interaction at a cost to your sanity.",
      "Haunted Mirror":"A cracked mirror showing glimpses of the ghost room; staring too long drains sanity fast.",
      "Summoning Circle":"An occult circle with candles; lighting them forces the ghost to appear. It cannot be moved.",
      "Monkey Paw":"A cursed paw granting twisted wishes; each wish comes with sanity loss and increased ghost aggression."
    };

    const cursedItemSanityCost = {
      "Ouija Board":10,"Tarot Cards":5,"Music Box":8,
      "Voodoo Doll":6,"Haunted Mirror":15,
      "Summoning Circle":20,"Monkey Paw":25
    };

    const ghostProfiles = {
      Spirit:{evidence:["EMF Level 5","Spirit Box","Ghost Writing"],behavior:"Average activity, standard hunts."},
      Wraith:{evidence:["EMF Level 5","Spirit Box","D.O.T.S"],behavior:"Rarely touches ground, teleports to player."},
      Phantom:{evidence:["Spirit Box","Fingerprints","D.O.T.S"],behavior:"Looking at it drops sanity quickly."},
      Poltergeist:{evidence:["Spirit Box","Fingerprints","Ghost Writing"],behavior:"Throws multiple objects at once."},
      Banshee:{evidence:["Fingerprints","Orbs","D.O.T.S"],behavior:"Targets one player, shrieks on parabolic."},
      Jinn:{evidence:["EMF Level 5","Fingerprints","Freezing Temps"],behavior:"Fast when far, kills power to slow hunts."},
      Mare:{evidence:["Spirit Box","Ghost Writing","Orbs"],behavior:"Prefers darkness, more active with lights off."},
      Revenant:{evidence:["Ghost Writing","Orbs","Freezing Temps"],behavior:"Slow if not hunting, fast when hunting."},
      Shade:{evidence:["EMF Level 5","Ghost Writing","Freezing Temps"],behavior:"Shy, less active with multiple people."},
      Demon:{evidence:["Fingerprints","Ghost Writing","Freezing Temps"],behavior:"Very aggressive, hunts often, early."},
      Yurei:{evidence:["Orbs","Freezing Temps","D.O.T.S"],behavior:"Sanity drain on room close, smudge locks it."},
      Oni:{evidence:["EMF Level 5","Freezing Temps","D.O.T.S"],behavior:"Very active, throws objects often."},
      Hantu:{evidence:["Fingerprints","Orbs","Freezing Temps"],behavior:"Faster in cold, slower in warm areas."},
      Goryo:{evidence:["EMF Level 5","Fingerprints","D.O.T.S"],behavior:"Shows only on cameras, stays in ghost room."},
      Myling:{evidence:["EMF Level 5","Fingerprints","Ghost Writing"],behavior:"Quieter footsteps, more frequent sounds."},
      Onryo:{evidence:["Spirit Box","Orbs","Freezing Temps"],behavior:"Flame trigger, extinguishing fire can cause hunt."},
      TheTwins:{evidence:["EMF Level 5","Spirit Box","Freezing Temps"],behavior:"Different speeds, interacts in two spots."},
      Raiju:{evidence:["EMF Level 5","Orbs","D.O.T.S"],behavior:"Faster near electronics, disrupts devices."},
      Obake:{evidence:["EMF Level 5","Fingerprints","Orbs"],behavior:"Rare fingerprint types, shapeshifts visually."},
      TheMimic:{evidence:["Spirit Box","Fingerprints","Freezing Temps"],behavior:"Mimics other ghosts, shows fake orbs."},
      Moroi:{evidence:["Spirit Box","Ghost Writing","Freezing Temps"],behavior:"Curses players, drains sanity faster."},
      Deogen:{evidence:["Spirit Box","Ghost Writing","D.O.T.S"],behavior:"Knows your location, very slow near player."},
      Thaye:{evidence:["Orbs","Ghost Writing","D.O.T.S"],behavior:"Very active early, slows down over time."},
      Yokai:{evidence:["Spirit Box","Orbs","D.O.T.S"],behavior:"Talks more, hunts near voices."},
      Succubus:{evidence:["Spirit Box","Ghost Writing","Fingerprints"],behavior:"Targets males, drains sanity faster during interactions."}
    };

    const roomVisuals = {
      Van:{N:"Van_N.png",S:"Van_S.png",E:"Van_E.png",W:"Van_W.png"},
      Foyer:{N:"Foyer_N.png",S:"Foyer_S.png",E:"Foyer_E.png",W:"Foyer_W.png"},
      "Living Room":{N:"LivingRoom_N.png",S:"LivingRoom_S.png",E:"LivingRoom_E.png",W:"LivingRoom_W.png"},
      Kitchen:{N:"Kitchen_N.png",S:"Kitchen_S.png",E:"Kitchen_E.png",W:"Kitchen_W.png"},
      "Dining Room":{N:"DiningRoom_N.png",S:"DiningRoom_S.png",E:"DiningRoom_E.png",W:"DiningRoom_W.png"},
      Garage:{N:"Garage_N.png",S:"Garage_S.png",E:"Garage_E.png",W:"Garage_W.png"},
      Basement:{N:"Basement_N.png",S:"Basement_S.png",E:"Basement_E.png",W:"Basement_W.png"},
      Bathroom:{N:"Bathroom_N.png",S:"Bathroom_S.png",E:"Bathroom_E.png",W:"Bathroom_W.png"},
      "Kids Bedroom":{N:"KidsBedroom_N.png",S:"KidsBedroom_S.png",E:"KidsBedroom_E.png",W:"KidsBedroom_W.png"},
      "Master Bedroom":{N:"MasterBedroom_N.png",S:"MasterBedroom_S.png",E:"MasterBedroom_E.png",W:"MasterBedroom_W.png"}
    };

    const mapConnections = {
      Van:["Foyer"],
      Foyer:["Van","Living Room","Kitchen","Bathroom"],
      "Living Room":["Foyer","Dining Room","Garage","Kids Bedroom","Master Bedroom"],
      Kitchen:["Foyer","Dining Room"],
      "Dining Room":["Living Room","Kitchen","Basement"],
      Garage:["Living Room"],
      Basement:["Dining Room"],
      Bathroom:["Foyer"],
      "Kids Bedroom":["Living Room"],
      "Master Bedroom":["Living Room"]
    };

    const allRooms = Object.keys(roomVisuals);

    /* === LOGGING & HUD === */
    function randomFromArray(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
    function logToGame(text){
      const log=document.getElementById("game-log");
      const e=document.createElement("div");
      e.className="log-entry";
      e.textContent=text;
      log.appendChild(e);
      log.scrollTop=log.scrollHeight;
      setTimeout(()=>{e.classList.add("fade");},8000);
    }
    function updateSanityBar(){
      const bar=document.getElementById("sanity-bar");
      bar.style.width=game.sanity+"%";
      if(game.sanity>66)bar.style.background="#0f0";
      else if(game.sanity>33)bar.style.background="#ff0";
      else bar.style.background="#f00";
    }

    /* === STARTUP FIX (Title → Loadout → Investigation) === */
    function startTitleScreen() {
      if (!game.titleShown) {
        game.titleShown = true;
        document.getElementById("title-screen").style.display = "flex";
        document.getElementById("title-screen").style.opacity = "1";
        document.getElementById("main-scene").style.display = "none";
        document.getElementById("loadout-screen").style.display = "none";
        resetGameState();
      } else {
        resetGameState();
        showLoadout();
      }
    }

    function resetGameState() {
      game.ghost = null; game.ghostRoom = null;
      game.playerRoom = "Van";
      game.inventory = [];
      game.vanStock = [...allLoadoutItems];
      game.roomItems = {};
      game.selectedEvidence.clear();
      game.currentTurn = 0; game.sanity = 100;
      game.mimicForm = null; game.nextMimicShift = 0;
      game.huntCooldown = 0; game.smudgeActive = 0;
      game.weather = null; game.cameraActive = false;
      game.placedCrucifix = {}; game.monitorBooted = false;
      game.placedCameras = {}; game.usedCursedItems = {};
      game.spawnedCursedItem = null; game.spawnedCursedRoom = null;

      // Clear ambient effects & orbs
      if (game.orbSpawnInterval) clearInterval(game.orbSpawnInterval);
      const orbCanvas = document.getElementById("orbCanvas");
      const ctx = orbCanvas.getContext("2d");
      ctx.clearRect(0,0,orbCanvas.width,orbCanvas.height);

      updateSanityBar();
      document.getElementById("narrator-ui").style.display = "none";
      document.getElementById("move-overlay").style.display = "none";
      document.getElementById("item-overlay").style.display = "none";
      document.getElementById("inventory-overlay").style.display = "none";
      document.getElementById("inspect-overlay").style.display = "none";
      document.getElementById("monitor-overlay").style.display = "none";
    }

    document.getElementById("startButton").addEventListener("click", () => {
      document.getElementById("title-screen").style.opacity = "0";
      setTimeout(() => {
        document.getElementById("title-screen").style.display = "none";
        showLoadout();
      }, 2000);
    });

    let tempHeld = [], tempVan = [...allLoadoutItems];
    function showLoadout() {
      document.getElementById("loadout-screen").style.display = "flex";
      renderLoadout();
    }
    function renderLoadout() {
      const h=document.getElementById("held-list"),v=document.getElementById("van-list");
      h.innerHTML="";v.innerHTML="";
      tempHeld.forEach(i=>{
        const b=document.createElement("button");
        b.textContent=i+" (Remove)";
        b.className="item-button";
        b.onclick=()=>{
          tempVan.push(i);
          tempHeld=tempHeld.filter(x=>x!==i);
          renderLoadout();
        };
        h.appendChild(b);
      });
      tempVan.forEach(i=>{
        const b=document.createElement("button");
        b.textContent=i+" (Add)";
        b.className="item-button";
        b.onclick=()=>{
          if(tempHeld.length<3){
            tempHeld.push(i);
            tempVan=tempVan.filter(x=>x!==i);
            renderLoadout();
          } else alert("You can only hold 3 items!");
        };
        v.appendChild(b);
      });
    }

    document.getElementById("confirm-loadout").addEventListener("click", () => {
      game.inventory=[...tempHeld,"Notebook","Lighter"];
      game.vanStock=[...tempVan];
      document.getElementById("loadout-screen").style.display="none";
      startInvestigation();
    });

    /* === START INVESTIGATION === */
    function startInvestigation() {
      document.getElementById("main-scene").style.display="block";
      document.getElementById("narrator-ui").style.display="flex";
      game.weather=randomFromArray(possibleWeather);
      assignRandomGhost();
      assignRandomGhostRoom();
      spawnRandomCursedItem();
      logToGame("You are in the van. The weather outside is "+game.weather.toLowerCase()+"...");
      renderHUD();
      updateBackground();
      randomLightning();
      animateRain();
      randomOrbs();
    }

    function assignRandomGhost() {
      const g = Object.keys(ghostProfiles);
      game.ghost = randomFromArray(g);
      if(game.ghost === "TheMimic") assignMimicForm();
    }
    function assignRandomGhostRoom() {
      const r = allRooms.filter(x=>x!=="Van");
      game.ghostRoom = randomFromArray(r);
    }
    function assignMimicForm() {
      const g = Object.keys(ghostProfiles).filter(x=>"TheMimic"!==x);
      game.mimicForm = randomFromArray(g);
      game.nextMimicShift = game.currentTurn + Math.floor(Math.random()*4)+3;
    }

    function spawnRandomCursedItem() {
      const item = randomFromArray(cursedItemList);
      const room = randomFromArray(allRooms.filter(x=>x!=="Van"));
      game.roomItems[room]=game.roomItems[room]||[];
      game.roomItems[room].push(item);
      game.spawnedCursedItem=item;
      game.spawnedCursedRoom=room;
      logToGame("Somewhere in this house, a cursed item lies waiting...");
    }

    function renderHUD() {
      document.getElementById("hud-location").textContent=game.playerRoom;
      document.getElementById("hud-weather").textContent=game.weather;
      document.getElementById("hud-turns").textContent=game.currentTurn;
      document.getElementById("held-items-display").textContent=game.inventory.join(", ");
      updateSanityBar();
      if(game.inventory.includes("Thermometer") && game.playerRoom!=="Van") {
        const t=game.playerRoom===game.ghostRoom?(Math.random()<0.3?-5:2+Math.random()*3):15+Math.random()*5;
        document.getElementById("hud-temp").textContent=t.toFixed(1)+"°C";
      } else document.getElementById("hud-temp").textContent="--°C";
    }

    function updateBackground(d="N") {
      const v=roomVisuals[game.playerRoom]||roomVisuals["Van"];
      document.getElementById("background").style.backgroundImage=`url('${v[d]}')`;
    }
    /* === COMMAND HANDLER === */
    document.querySelectorAll("#command-buttons button").forEach(b=>{
      b.addEventListener("click",()=>handleCommand(b.dataset.cmd));
    });

    function handleCommand(c){
      switch(c){
        case "move": openMoveOverlay(); break;
        case "look": lookAround(); break;
        case "use": openItemOverlay(); break;
        case "inventory": openInventoryOverlay(); break;
        case "monitor": openMonitor(); break;
        case "guess": openGuess(); break;
      }
    }

    /* === MOVEMENT === */
    function openMoveOverlay(){
      const o=mapConnections[game.playerRoom]||[],
            c=document.getElementById("move-options");
      c.innerHTML="";
      if(!o.length){logToGame("No available paths from here.");return;}
      o.forEach(r=>{
        const b=document.createElement("button");
        b.textContent="Go to "+r;
        b.onclick=()=>{
          document.getElementById("move-overlay").style.display="none";
          moveToRoom(r);
        };
        c.appendChild(b);
      });
      document.getElementById("move-overlay").style.display="flex";
    }

    function moveToRoom(r){
      game.playerRoom=r;
      game.currentTurn++;
      logToGame("You move to "+r+".");
      renderHUD();
      updateBackground();
      checkTurnEvents();
    }

    function lookAround(){
      game.currentTurn++;
      if(game.playerRoom===game.ghostRoom){
        logToGame("You feel an eerie presence here...");
        if(game.ghost==="TheMimic"||game.mimicForm==="TheMimic")
          logToGame("Through the camera, you notice strange ghost orbs flickering...");
      }else logToGame("Nothing unusual here.");
      renderHUD();
      checkTurnEvents();
    }

    /* === ITEM OVERLAY & CONTEXT MENU === */
    function openItemOverlay(){
      if(!game.inventory.length){
        logToGame("You have no items to use.");
        return;
      }
      const c=document.getElementById("item-options");
      c.innerHTML="<h3>Choose an Item Action</h3>";
      game.inventory.forEach(i=>{
        const inspect=document.createElement("button");
        inspect.textContent="Inspect: "+i;
        inspect.onclick=()=>{
          document.getElementById("item-overlay").style.display="none";
          inspectItem(i);
        };
        c.appendChild(inspect);

        if(i!=="Notebook"&&i!=="Lighter"){
          if(!cursedItemDescriptions[i]){
            const use=document.createElement("button");
            use.textContent="Use: "+i;
            use.onclick=()=>{
              document.getElementById("item-overlay").style.display="none";
              useItem(i);
            };
            c.appendChild(use);
          } else {
            const cursed=document.createElement("button");
            cursed.textContent="Use Cursed: "+i;
            cursed.onclick=()=>{
              document.getElementById("item-overlay").style.display="none";
              handleCursedItem(i);
            };
            c.appendChild(cursed);
          }

          if(game.playerRoom!=="Van" && i!=="Summoning Circle"){
            const place=document.createElement("button");
            place.textContent="Place: "+i;
            place.onclick=()=>{
              document.getElementById("item-overlay").style.display="none";
              placeItem(i);
            };
            c.appendChild(place);
          }

          const drop=document.createElement("button");
          drop.textContent="Drop: "+i;
          drop.onclick=()=>{
            document.getElementById("item-overlay").style.display="none";
            dropItem(i);
          };
          c.appendChild(drop);
        }
      });
      document.getElementById("item-overlay").style.display="flex";
    }

    /* === INSPECT ITEM === */
    function inspectItem(i){
      document.getElementById("inspect-title").textContent=i;
      let desc="A standard investigation tool.";
      if(cursedItemDescriptions[i]) desc=cursedItemDescriptions[i];
      if(i==="Crucifix") desc="Stops hunts when placed in the ghost room. Two uses before breaking.";
      if(i==="Camera"||i==="Video Camera") desc="Use to see orbs. Place to monitor from van.";
      if(i==="EMF Reader") desc="Detects EMF spikes, ghost activity may reach level 5.";
      if(i==="Spirit Box") desc="Allows communication with ghost voices.";
      if(i==="Thermometer") desc="Reads temperature; freezing temps indicate ghost presence.";
      if(i==="Ghost Writing Book") desc="Place to allow the ghost to write messages.";
      document.getElementById("inspect-description").textContent=desc;
      document.getElementById("inspect-overlay").style.display="flex";
    }
    function closeInspect(){
      document.getElementById("inspect-overlay").style.display="none";
    }

    /* === ITEM ACTIONS === */
    function useItem(i){
      switch(i){
        case "Smudge Stick":
          if(game.playerRoom===game.ghostRoom){
            game.smudgeActive=3;
            logToGame("You smudge the room, calming the ghost temporarily.");
            if(game.ghost==="Yurei") logToGame("The Yurei seems locked in place for a while.");
          } else logToGame("You smudge, but nothing happens.");
          break;
        case "Camera":
        case "Video Camera":
          if(game.playerRoom!=="Van"){
            game.cameraActive=!game.cameraActive;
            if(game.cameraActive)
              logToGame("You turn on the camera night vision to look for orbs.");
            else logToGame("You turn off the camera.");
          } else logToGame("You cannot use the camera in the van.");
          break;
        default:
          logToGame("You use the "+i+", but nothing significant happens.");
      }
      game.currentTurn++;
      renderHUD();
      checkTurnEvents();
    }

    function placeItem(i){
      if(game.playerRoom==="Van"){logToGame("You cannot place items in the van.");return;}
      if(cursedItemDescriptions[i] && i==="Summoning Circle"){
        logToGame("The Summoning Circle cannot be moved.");return;
      }
      if(i==="Crucifix"){
        if(!game.placedCrucifix[game.playerRoom])
          game.placedCrucifix[game.playerRoom]=2;
        logToGame("You place a crucifix in this room.");
      }
      if(i==="Camera"||i==="Video Camera"){
        game.placedCameras[game.playerRoom]=true;
        logToGame("You place a camera in this room.");
      }
      game.inventory=game.inventory.filter(x=>x!==i);
      game.roomItems[game.playerRoom]=game.roomItems[game.playerRoom]||[];
      game.roomItems[game.playerRoom].push(i);
      renderHUD();
    }

    function dropItem(i){
      if(cursedItemDescriptions[i] && i==="Summoning Circle"){
        logToGame("The Summoning Circle cannot be dropped or moved.");
        return;
      }
      if(game.playerRoom==="Van"){
        game.vanStock.push(i);
        logToGame("You return the "+i+" to the van.");
      } else {
        game.roomItems[game.playerRoom]=game.roomItems[game.playerRoom]||[];
        game.roomItems[game.playerRoom].push(i);
        logToGame("You drop the "+i+" in this room.");
      }
      game.inventory=game.inventory.filter(x=>x!==i);
      renderHUD();
    }

    function pickItem(i){
      if(game.inventory.length>=3){
        logToGame("You can only hold 3 items."); return;
      }
      if(cursedItemDescriptions[i] && i==="Summoning Circle"){
        logToGame("The Summoning Circle is bound to this room."); return;
      }
      game.roomItems[game.playerRoom]=game.roomItems[game.playerRoom].filter(x=>x!==i);
      game.inventory.push(i);
      logToGame("You pick up the "+i+".");
      renderHUD();
    }

    function openInventoryOverlay(){
      const c=document.getElementById("inventory-options");
      c.innerHTML="<h3>Inventory Management</h3>";
      game.inventory.forEach(i=>{
        const inspect=document.createElement("button");
        inspect.textContent="Inspect: "+i;
        inspect.onclick=()=>{
          document.getElementById("inventory-overlay").style.display="none";
          inspectItem(i);
        };
        c.appendChild(inspect);

        if(i!=="Notebook"&&i!=="Lighter"){
          const drop=document.createElement("button");
          drop.textContent="Drop: "+i;
          drop.onclick=()=>{
            document.getElementById("inventory-overlay").style.display="none";
            dropItem(i);
          };
          c.appendChild(drop);
        }
      });
      const roomInv=game.roomItems[game.playerRoom]||[];
      roomInv.forEach(i=>{
        const pick=document.createElement("button");
        pick.textContent="Pick up: "+i;
        pick.onclick=()=>{
          document.getElementById("inventory-overlay").style.display="none";
          pickItem(i);
        };
        c.appendChild(pick);
      });
      document.getElementById("inventory-overlay").style.display="flex";
    }

    /* === CURSED ITEM LOGIC === */
    function handleCursedItem(i){
      if(game.usedCursedItems[i]){
        logToGame("The "+i+" seems inactive now."); return;
      }
      logToGame("You use the "+i+"...");
      game.sanity-=cursedItemSanityCost[i];
      if(game.sanity<0)game.sanity=0;

      if(i==="Ouija Board"){
        logToGame("The board shifts under your hands; you feel drained...");
        if(Math.random()<0.2){logToGame("The board snaps!");startHunt();}
      }
      if(i==="Tarot Cards"){
        const outcome=Math.random();
        if(outcome<0.2) logToGame("The Fool! Nothing happens.");
        else if(outcome<0.4){logToGame("The Tower! Ghost activity spikes.");checkTurnEvents();}
        else if(outcome<0.6){logToGame("The Death card! The ghost begins hunting!");startHunt();}
        else {logToGame("The Sun! You feel refreshed.");game.sanity=Math.min(100,game.sanity+10);}
      }
      if(i==="Music Box"){
        logToGame("The melody echoes... the ghost is drawn closer.");
        if(Math.random()<0.3){logToGame("The music halts abruptly! The ghost starts hunting.");startHunt();}
      }
      if(i==="Voodoo Doll"){
        logToGame("You poke a pin... something stirs in the house.");
        if(Math.random()<0.4)checkTurnEvents();
      }
      if(i==="Haunted Mirror"){
        logToGame("You glimpse the ghost room for a split second...");
        if(Math.random()<0.3){logToGame("The mirror cracks violently! The ghost starts hunting.");startHunt();}
      }
      if(i==="Summoning Circle"){
        logToGame("The candles ignite, and the ghost manifests before you!");
        startHunt();
      }
      if(i==="Monkey Paw"){
        logToGame("You whisper a wish to the monkey paw... you feel cursed.");
        game.huntCooldown=0;
        if(Math.random()<0.5)startHunt();
      }
      game.usedCursedItems[i]=true;
      updateSanityBar();
      renderHUD();
      checkTurnEvents();
    }

    /* === TURN EVENTS & HUNT === */
    function checkTurnEvents(){
      if(game.ghost==="TheMimic" && game.currentTurn>=game.nextMimicShift){
        assignMimicForm();
        logToGame("You sense a change in ghost behavior...");
      }
      if(game.playerRoom===game.ghostRoom && Math.random()<0.4)
        game.sanity -= 3+Math.random()*3;
      else game.sanity -= 1;
      if(game.sanity<0)game.sanity=0;
      if(game.playerRoom===game.ghostRoom){
        const g = game.ghost==="TheMimic"?game.mimicForm:game.ghost;
        if(Math.random()<0.3) logToGame("[Ambient] "+ghostProfiles[g].behavior);
      }
      updateSanityBar();
      attemptHunt();
    }

    function attemptHunt(){
      if(game.smudgeActive>0){game.smudgeActive--;return;}
      if(game.huntCooldown>0){game.huntCooldown--;return;}
      if(game.sanity<30 && Math.random()<0.25) startHunt();
    }

    function startHunt(){
      logToGame("The ghost is hunting!");
      flashRed();
      if(game.playerRoom===game.ghostRoom){
        if(game.placedCrucifix[game.playerRoom] && game.placedCrucifix[game.playerRoom]>0){
          game.placedCrucifix[game.playerRoom]--;
          logToGame("The crucifix glows, preventing the hunt! ("+game.placedCrucifix[game.playerRoom]+" uses left)");
        } else {
          setTimeout(()=>{alert("The ghost caught you. You died.");resetGameState();startInvestigation();},2000);
        }
      } else logToGame("You survive the hunt.");
      game.huntCooldown=5;
    }

    function flashRed(){
      const l=document.getElementById("lightning");
      l.style.background="red";
      l.style.opacity=0.5;
      setTimeout(()=>{l.style.opacity=0;},500);
    }
    /* === AMBIENT WEATHER & VISUALS === */
    function randomLightning(){
      setTimeout(()=>{
        const l=document.getElementById("lightning");
        l.style.background="white";
        l.style.opacity=0.8;
        setTimeout(()=>{l.style.opacity=0;},200);
        randomLightning();
      },Math.random()*8000+4000);
    }

    function animateRain(){
      const c=document.getElementById("rain-layer"),ctx=c.getContext("2d");
      c.width=window.innerWidth; c.height=window.innerHeight;
      const drops=[];
      for(let i=0;i<200;i++)
        drops.push({x:Math.random()*c.width,y:Math.random()*c.height,len:Math.random()*20+10,ys:Math.random()*4+4});
      function draw(){
        ctx.clearRect(0,0,c.width,c.height);
        ctx.strokeStyle="rgba(174,194,224,0.5)";
        ctx.lineWidth=1; ctx.beginPath();
        for(let i=0;i<drops.length;i++){
          const d=drops[i];
          ctx.moveTo(d.x,d.y); ctx.lineTo(d.x,d.y+d.len);
        }
        ctx.stroke(); move();
        requestAnimationFrame(draw);
      }
      function move(){
        for(let i=0;i<drops.length;i++){
          const d=drops[i];
          d.y+=d.ys;
          if(d.y>c.height){d.y=0; d.x=Math.random()*c.width;}
        }
      }
      draw();
    }

    function randomOrbs(){
      const c=document.getElementById("orbCanvas"),x=c.getContext("2d");
      c.width=window.innerWidth; c.height=window.innerHeight;
      let o=[];
      function spawn(){
        if(o.length<10){
          o.push({x:Math.random()*c.width,y:Math.random()*c.height,
            r:Math.random()*3+2,alpha:Math.random(),fade:Math.random()*0.02+0.005});
        }
      }
      function animate(){
        x.clearRect(0,0,c.width,c.height);
        for(let i=0;i<o.length;i++){
          const b=o[i];
          b.alpha+=b.fade;
          if(b.alpha<=0||b.alpha>=1) b.fade*=-1;
          b.y-=0.2;
          x.beginPath();
          x.arc(b.x,b.y,b.r,0,Math.PI*2);
          x.fillStyle="rgba(255,255,255,"+b.alpha+")";
          x.fill();
          if(b.y<-10) o.splice(i,1);
        }
        requestAnimationFrame(animate);
      }
      game.orbSpawnInterval=setInterval(spawn,2000);
      animate();
    }

    /* === MONITOR BOOT SEQUENCE === */
    function openMonitor(){
      if(game.playerRoom!=="Van"){
        logToGame("You can only use the monitor in the van.");
        return;
      }
      if(!game.monitorBooted){bootMonitorSequence();}
      else openMonitorMenu();
    }

    function bootMonitorSequence(){
      document.getElementById("monitor-overlay").style.display="flex";
      const bar=document.getElementById("loading-bar"),
            login=document.getElementById("login-fields"),
            uname=document.getElementById("login-username"),
            pass=document.getElementById("login-password");
      bar.style.width="0%"; login.style.display="none";
      uname.textContent=""; pass.textContent="";
      setTimeout(()=>{bar.style.transition="width 2s linear";bar.style.width="50%";},100);
      setTimeout(()=>{bar.style.transition="width 4s linear";bar.style.width="100%";},2100);
      setTimeout(()=>{
        login.style.display="block";
        typeText(uname,"papa smurf",50,()=>{
          typeText(pass,"***********",80,()=>{
            setTimeout(()=>{game.monitorBooted=true;openMonitorMenu();},800);
          });
        });
      },6200);
    }

    function typeText(el,txt,speed,cb){
      let i=0;
      function t(){
        if(i<txt.length){
          el.textContent+=txt.charAt(i);
          i++; setTimeout(t,speed);
        } else if(cb) cb();
      }
      t();
    }

    function openMonitorMenu(){
      document.getElementById("monitor-overlay").style.display="flex";
      const border=document.getElementById("monitor-border");
      border.innerHTML="<h3 style='color:#0f0;'>Camera Monitor</h3>";
      const cams=Object.keys(game.placedCameras);
      if(!cams.length){
        border.innerHTML+="<div style='color:#555;'>No cameras placed.</div>";
      }else{
        cams.forEach(r=>{
          const b=document.createElement("button");
          b.textContent="View: "+r;
          b.style.width="100%";
          b.onclick=()=>{viewCameraFeed(r);};
          border.appendChild(b);
        });
      }
      const close=document.createElement("button");
      close.textContent="Close Monitor";
      close.onclick=()=>{document.getElementById("monitor-overlay").style.display="none";};
      border.appendChild(close);
    }

    function viewCameraFeed(room){
      const b=document.getElementById("monitor-border");
      b.innerHTML="<h3 style='color:#0f0;'>Camera Feed: "+room+"</h3><div>(Static simulated feed)</div>";
      if(room===game.ghostRoom){
        b.innerHTML+="<div style='color:#0f0;'>Ghost orbs visible!</div>";
        const orbBtn=document.createElement("button");
        orbBtn.textContent="Play Orb Capture Mini-Game";
        orbBtn.onclick=startOrbGame;
        b.appendChild(orbBtn);
      } else b.innerHTML+="<div style='color:#555;'>No ghost activity detected.</div>";
      const back=document.createElement("button");
      back.textContent="Back";
      back.onclick=openMonitorMenu;
      b.appendChild(back);
    }

    document.getElementById("close-monitor").addEventListener("click",()=>{
      document.getElementById("monitor-overlay").style.display="none";
    });

    /* === ORB CAPTURE MINI-GAME === */
    let orbGameActive=false, orbScore=0, orbTime=60, orbOrbs=[], orbCtx, orbTimerInterval;
    const clockTickAudio=new Audio("data:audio/wav;base64,INSERT_TICK_BASE64");
    const heartbeatAudio=new Audio("data:audio/wav;base64,INSERT_HEARTBEAT_BASE64");

    function startOrbGame(){
      orbGameActive=true;
      orbScore=0; orbTime=60; orbOrbs=[];
      const canvas=document.getElementById("orb-game-canvas");
      canvas.width=360; canvas.height=240; canvas.style.display="block";
      orbCtx=canvas.getContext("2d");
      canvas.addEventListener("click",shootOrb);
      spawnOrb(); updateOrbHUD();
      orbTimerInterval=setInterval(()=>{
        orbTime--; updateFlipClock();
        if(orbTime<=20 && orbTime>10){clockTickAudio.play();}
        if(orbTime<=10){heartbeatAudio.play();}
        updateOrbHUD();
        if(orbTime<=0) endOrbGame();
      },1000);
      animateOrbGame();
    }

    function spawnOrb(){
      if(!orbGameActive) return;
      if(orbOrbs.length<6){
        const rare=Math.random()<0.1;
        orbOrbs.push({
          x:Math.random()*340+10,
          y:Math.random()*220+10,
          r:rare?8:5,
          color:rare?"#00f":"#fff",
          speed:rare?2:0.5,
          fade:Math.random()*0.02+0.01
        });
      }
      setTimeout(spawn,800);
    }

    function animateOrbGame(){
      if(!orbGameActive) return;
      orbCtx.clearRect(0,0,360,240);
      orbOrbs.forEach((o,i)=>{
        o.y+=Math.sin(o.fade*50)*o.speed;
        orbCtx.beginPath();
        orbCtx.arc(o.x,o.y,o.r,0,Math.PI*2);
        orbCtx.fillStyle=o.color;
        orbCtx.fill();
      });
      requestAnimationFrame(animateOrbGame);
    }

    function shootOrb(e){
      if(!orbGameActive) return;
      const rect=e.target.getBoundingClientRect(),
            x=e.clientX-rect.left, y=e.clientY-rect.top;
      orbOrbs.forEach((o,i)=>{
        const dx=o.x-x, dy=o.y-y;
        if(Math.sqrt(dx*dx+dy*dy)<o.r){
          orbScore+=o.color==="#00f"?100:10;
          screenFlash();
          orbTime+=o.color==="#00f"?5:1;
          orbOrbs.splice(i,1);
        }
      });
      updateOrbHUD();
    }

    function screenFlash(){
      const l=document.getElementById("lightning");
      l.style.background="white"; l.style.opacity=0.8;
      setTimeout(()=>{l.style.opacity=0;},100);
    }

    function updateOrbHUD(){
      document.getElementById("orb-game-score").textContent="Score: "+orbScore;
      document.getElementById("orb-game-timer").textContent="Time: "+orbTime+"s";
    }

    function updateFlipClock(){
      document.getElementById("flip-clock").textContent="⏱ "+String(orbTime).padStart(2,"0")+"s";
    }

    function endOrbGame(){
      orbGameActive=false;
      clearInterval(orbTimerInterval);
      document.getElementById("orb-game-score").textContent+=" | Game Over";
      document.getElementById("orb-game-canvas").removeEventListener("click",shootOrb);
      const b=document.createElement("button");
      b.textContent="Restart Mini-Game";
      b.onclick=startOrbGame;
      document.getElementById("monitor-border").appendChild(b);
    }

    /* === GHOST GUESSING SYSTEM === */
    function openGuess(){
      const p=document.getElementById("guess-popup"), l=document.getElementById("guess-list");
      l.innerHTML="";
      Object.keys(ghostProfiles).forEach(g=>{
        const b=document.createElement("button");
        b.textContent=g;
        b.onclick=()=>{makeGuess(g); closeGuess();};
        l.appendChild(b);
      });
      p.style.display="flex";
    }
    function closeGuess(){ document.getElementById("guess-popup").style.display="none"; }
    function makeGuess(g){
      if(g===game.ghost) logToGame("Correct! The ghost was indeed "+g+"!");
      else logToGame("Wrong. The ghost was "+game.ghost+".");
      setTimeout(()=>{
        alert("Game Over. Restarting in van.");
        resetGameState();
        startInvestigation();
      },2000);
    }

    /* === INITIALIZE === */
    document.addEventListener("DOMContentLoaded",()=>{startTitleScreen();});
  </script>
</body>
</html>
