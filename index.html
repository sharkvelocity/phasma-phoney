<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Phasma‑Phoney v2.5 — Master Build</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Phasma‑Phoney: Turn-based ghost investigation horror with 25 ghosts, mimic logic, cursed items, and full hunt system.">
  <style>
    html, body {
      margin:0; padding:0; width:100vw; height:100vh;
      background:black; color:#eee;
      font-family:monospace, sans-serif;
      overflow:hidden;
      -webkit-user-select:none; user-select:none;
    }
    body, button, #hud, #game-log {
      font-size:calc(10px + 0.8vw);
    }
    button {
      min-width:60px; min-height:30px;
      padding:calc(4px + 0.4vw) calc(6px + 0.6vw);
      border-radius:4px;
    }

    /* === TITLE SCREEN === */
    #title-screen {
      position:fixed; top:0; left:0;
      width:100vw; height:100vh;
      display:flex; justify-content:center; align-items:center;
      background:#000; z-index:1000;
      opacity:1; transition:opacity 1.5s ease;
    }
    #title-screen img {
      max-width:70%;
      animation:pulse 5s infinite ease-in-out;
    }
    @keyframes pulse {
      0%,100%{opacity:0.9; transform:scale(1);}
      50%{opacity:1; transform:scale(1.04);}
    }
    #startButton {
      position:absolute; bottom:20%; left:50%;
      transform:translateX(-50%);
      font-size:calc(12px + 1vw);
      background:#111; color:#eee;
      border:2px solid #444; cursor:pointer;
      transition:all 0.3s ease;
    }
    #startButton:hover {background:#222; border-color:#888;}

    /* === MAIN SCENE LAYERS === */
    #main-scene {
      position:relative; width:100vw; height:100vh;
      display:none; overflow:hidden; background:black;
    }
    #background, #lightning, #fog-layer, #orbCanvas {
      position:absolute; top:0; left:0; width:100%; height:100%;
    }
    #background {z-index:1; background-size:cover; background-position:center;}
    #lightning {z-index:3; background:white; opacity:0; pointer-events:none;}
    #fog-layer {z-index:4; pointer-events:none;}
    #orbCanvas {z-index:5; pointer-events:none;}

    /* === HUD === */
    #hud {
      position:absolute; top:1%; left:1%;
      background:rgba(0,0,0,0.5);
      padding:0.6em 0.8em;
      border:1px solid #444;
      font-size:calc(10px + 0.5vw);
      z-index:10;
      max-width:45%; word-wrap:break-word;
    }
    #sanity-bar-container {
      width:calc(60px + 5vw); height:10px;
      background:#222; border:1px solid #555;
      margin-top:4px; position:relative;
    }
    #sanity-bar {
      position:absolute; top:0; left:0; height:100%;
      background:#0f0; width:100%; transition:width 0.3s ease;
    }
    #inventory-display {
      position:absolute; top:1%; right:1%;
      background:rgba(0,0,0,0.5);
      padding:0.4em 0.6em; border:1px solid #444;
      font-size:calc(9px + 0.4vw);
      z-index:10; max-width:40%; word-wrap:break-word;
    }

    /* === NARRATOR UI === */
    #narrator-ui {
      position:absolute; bottom:0; left:0;
      width:100%; height:40%;
      background:rgba(0,0,0,0.4);
      display:none; flex-direction:column; justify-content:space-between;
      z-index:10;
    }
    #game-log {
      flex:1; overflow-y:auto; padding:10px;
      font-size:calc(9px + 0.5vw); line-height:1.4;
      max-height:65%;
    }
    .log-entry {opacity:0.85; transition:opacity 1s ease-in-out;}
    .log-entry.fade {opacity:0.4;}
    #command-buttons {
      display:flex; flex-wrap:wrap; justify-content:space-around;
      padding:0.5em; border-top:1px solid #555;
      background:rgba(0,0,0,0.5);
    }
    #command-buttons button {
      flex:1 1 18%; margin:0.2em;
      font-size:calc(9px + 0.5vw);
      background:#222; color:#eee;
      border:1px solid #555; cursor:pointer;
    }
    #command-buttons button:hover {background:#333;}

    /* === LOADOUT SCREEN === */
    #loadout-screen {
      position:fixed; top:0; left:0;
      width:100vw; height:100vh;
      background:rgba(0,0,0,0.85);
      display:none; justify-content:center; align-items:center;
      flex-direction:column; z-index:2000;
    }
    #loadout-container {
      background:rgba(15,15,15,0.9);
      padding:2em; border:2px solid #444;
      border-radius:8px; max-width:480px; width:90%;
      color:#eee; text-align:center;
      box-shadow:0 0 15px rgba(0,255,255,0.2);
    }
    .item-button {
      background:#222; color:#eee;
      border:1px solid #555;
      border-radius:4px;
      padding:6px 10px; margin:4px;
      cursor:pointer; transition:all 0.2s ease-in-out;
    }
    .item-button.selected {background:#0a0; border-color:#0f0;}
    #confirm-loadout {
      margin-top:1em; padding:10px 20px;
      background:#111; color:#666;
      border:1px solid #333;
      cursor:not-allowed; border-radius:4px;
    }
    #confirm-loadout.active {
      background:#0a0; color:#fff; border-color:#0f0;
      cursor:pointer;
    }

    /* === GUESS POPUP === */
    #guess-popup {
      position:fixed; top:0; left:0;
      width:100vw; height:100vh;
      background:rgba(0,0,0,0.8);
      display:none; justify-content:center; align-items:center;
      z-index:3000;
    }
    #guess-list {
      background:#111; padding:20px;
      border:1px solid #444; max-height:70%; overflow-y:auto;
    }
    #guess-list button {
      display:block; width:100%; margin:4px 0;
      padding:6px; background:#222; color:#eee;
      border:1px solid #555; cursor:pointer;
    }
    #guess-list button:hover {background:#333;}

    /* === FOOTER === */
    footer {
      position:fixed; bottom:0; width:100%;
      text-align:center; background:#111; color:#555;
      font-size:calc(7px + 0.3vw);
      padding:2px 0; z-index:3500;
    }
  </style>
</head>

  <!-- === TITLE SCREEN === -->
  <div id="title-screen">
    <img src="logo.png" alt="Phasma-Phoney Logo">

  <div id="main-scene">

      <div><strong>Van Inventory:</strong><div id="van-list"></div></div>
      <button id="confirm-loadout">Confirm</button>
    </div>
  </div>

  <div id="guess-popup"><div id="guess-list"></div></div>
  <footer>Phasma‑Phoney v2.5 — Master Build</footer>

<script>

</script>
<script>
"use strict";

/***********************
 === GLOBAL CONSTANTS & GHOST PROFILES ===
************************/
const allLoadoutItems = [
  "EMF Reader","Spirit Box","Camera","UV Light","D.O.T.S Projector",
  "Thermometer","Ghost Writing Book","Video Camera","Crucifix",
  "Smudge Stick","Salt","Parabolic Microphone","Motion Sensor",
  "Sound Sensor","Candle"
];
const possibleWeather = ["Stormy","Clear","Foggy","Blood Moon"];

// === FULL 25 GHOST PROFILES (Succubus Included) ===
const ghostProfiles = {
  Spirit:{evidence:["EMF Reader","Spirit Box","Ghost Writing"],behavior:"Standard activity; calmer with smudge."},
  Wraith:{evidence:["EMF Reader","Spirit Box","D.O.T.S Projector"],behavior:"Rarely touches ground; teleporting behavior."},
  Phantom:{evidence:["Spirit Box","Fingerprints","D.O.T.S Projector"],behavior:"Long visual contact drops sanity faster."},
  Poltergeist:{evidence:["Spirit Box","Fingerprints","Ghost Writing"],behavior:"Throws multiple objects at once."},
  Banshee:{evidence:["Fingerprints","Orbs","D.O.T.S Projector"],behavior:"Focuses on one target."},
  Jinn:{evidence:["EMF Reader","Fingerprints","Freezing Temps"],behavior:"Moves quickly when power is on."},
  Mare:{evidence:["Spirit Box","Ghost Writing","Orbs"],behavior:"Prefers darkness; active in dark rooms."},
  Revenant:{evidence:["Ghost Writing","Orbs","Freezing Temps"],behavior:"Very fast during hunts if target seen."},
  Shade:{evidence:["EMF Reader","Ghost Writing","Freezing Temps"],behavior:"Shy; less active with multiple people."},
  Demon:{evidence:["Fingerprints","Ghost Writing","Freezing Temps"],behavior:"Aggressive; hunts more often."},
  Yurei:{evidence:["Orbs","Freezing Temps","D.O.T.S Projector"],behavior:"Strong sanity drain; trapped by smudge."},
  Oni:{evidence:["EMF Reader","Freezing Temps","D.O.T.S Projector"],behavior:"Very active when visible."},
  Yokai:{evidence:["Spirit Box","Orbs","D.O.T.S Projector"],behavior:"Talkative; attracted to voices."},
  Hantu:{evidence:["Fingerprints","Orbs","Freezing Temps"],behavior:"Faster in cold rooms."},
  Goryo:{evidence:["EMF Reader","Fingerprints","D.O.T.S Projector"],behavior:"Seen only through camera; rarely changes rooms."},
  Myling:{evidence:["EMF Reader","Fingerprints","Ghost Writing"],behavior:"Quieter footsteps; active on sound equipment."},
  Onryo:{evidence:["Spirit Box","Orbs","Freezing Temps"],behavior:"Hunts after extinguishing flames; avoids lit candles."},
  TheTwins:{evidence:["EMF Reader","Spirit Box","Freezing Temps"],behavior:"Alternates activity between rooms."},
  Raiju:{evidence:["EMF Reader","Orbs","D.O.T.S Projector"],behavior:"Faster near electronic equipment."},
  Obake:{evidence:["EMF Reader","Fingerprints","Orbs"],behavior:"Rare ghostly fingerprint changes."},
  TheMimic:{evidence:["Spirit Box","Fingerprints","Freezing Temps"],behavior:"Mimics other ghosts; fake orbs appear on camera only."},
  Moroi:{evidence:["Spirit Box","Ghost Writing","Freezing Temps"],behavior:"Curses sanity when responding on Spirit Box."},
  Deogen:{evidence:["Spirit Box","Ghost Writing","D.O.T.S Projector"],behavior:"Always knows player’s location but very slow close."},
  Thaye:{evidence:["Ghost Writing","Orbs","D.O.T.S Projector"],behavior:"Very active early, weaker over time."},
  Raikiri:{evidence:["EMF Reader","Freezing Temps","D.O.T.S Projector"],behavior:"Electrifies devices; surges cause false EMF."},
  Succubus:{evidence:["Spirit Box","Ghost Writing","Fingerprints"],behavior:"Drains sanity faster if alone; active at night."}
};

/***********************
 === ROOM VISUALS & MAP ===
************************/
const roomVisuals = {
  Van:{N:"Van_N.png",S:"Van_S.png",E:"Van_E.png",W:"Van_W.png"},
  Foyer:{N:"Foyer_N.png",S:"Foyer_S.png",E:"Foyer_E.png",W:"Foyer_W.png"},
  LivingRoom:{N:"LivingRoom_N.png",S:"LivingRoom_S.png",E:"LivingRoom_E.png",W:"LivingRoom_W.png"},
  Kitchen:{N:"Kitchen_N.png",S:"Kitchen_S.png",E:"Kitchen_E.png",W:"Kitchen_W.png"},
  DiningRoom:{N:"DiningRoom_N.png",S:"DiningRoom_S.png",E:"DiningRoom_E.png",W:"DiningRoom_W.png"},
  Basement:{N:"Basement_N.png",S:"Basement_S.png",E:"Basement_E.png",W:"Basement_W.png"},
  Bathroom:{N:"Bathroom_N.png",S:"Bathroom_S.png",E:"Bathroom_E.png",W:"Bathroom_W.png"},
  Garage:{N:"Garage_N.png",S:"Garage_S.png",E:"Garage_E.png",W:"Garage_W.png"},
  KidsBedroom:{N:"KidsBedroom_N.png",S:"KidsBedroom_S.png",E:"KidsBedroom_E.png",W:"KidsBedroom_W.png"},
  MasterBedroom:{N:"MasterBedroom_N.png",S:"MasterBedroom_S.png",E:"MasterBedroom_E.png",W:"MasterBedroom_W.png"}
};
const mapConnections = {
  Van:["Foyer"],
  Foyer:["Van","LivingRoom","Kitchen","Bathroom"],
  LivingRoom:["Foyer","DiningRoom","Garage","KidsBedroom","MasterBedroom"],
  Kitchen:["Foyer","DiningRoom","Basement"],
  DiningRoom:["Kitchen","LivingRoom"],
  Basement:["Kitchen"], Garage:["LivingRoom"], Bathroom:["Foyer"],
  KidsBedroom:["LivingRoom"], MasterBedroom:["LivingRoom"]
};

/***********************
 === GAME STATE OBJECT ===
************************/
const game = {
  ghost:null, ghostRoom:null, playerRoom:"Van",
  playerDirection:"N",
  inventory:[], vanStock:[...allLoadoutItems],
  selectedEvidence:new Set(),
  currentTurn:0, sanity:100,
  weather:null, mimicForm:null, nextMimicShift:0,
  cameraActive:false,
  huntCooldown:0, smudgeActive:0,
  placedCrucifix:{}, roomItems:{}, usedCursedItems:{}
};

/***********************
 === UTILITY FUNCTIONS ===
************************/
function logToGame(msg){
  const log=document.getElementById("game-log");
  const e=document.createElement("div");
  e.className="log-entry"; e.textContent=msg;
  log.appendChild(e); log.scrollTop=log.scrollHeight;
  setTimeout(()=>{e.classList.add("fade");},8000);
}
function randomFromArray(a){return a[Math.floor(Math.random()*a.length)];}
function updateSanityBar(){
  const b=document.getElementById("sanity-bar");
  const s=Math.max(0,Math.floor(game.sanity));
  b.style.width=s+"%";
  b.style.background=s>66?"#0f0":s>33?"#ff0":"#f00";
}

/***********************
 === GAME RESET & START ===
************************/
function resetGame(){
  game.ghost=null; game.ghostRoom=null; game.playerRoom="Van";
  game.playerDirection="N";
  game.inventory=[]; game.vanStock=[...allLoadoutItems];
  game.selectedEvidence.clear(); game.currentTurn=0; game.sanity=100;
  game.weather=null; game.mimicForm=null; game.nextMimicShift=0;
  game.huntCooldown=0; game.smudgeActive=0;
  game.placedCrucifix={}; game.roomItems={}; game.usedCursedItems={};
  updateSanityBar();
}

function startInvestigation(){
  document.getElementById("main-scene").style.display="block";
  document.getElementById("narrator-ui").style.display="flex";
  document.getElementById("game-log").innerHTML="";
  game.weather=randomFromArray(possibleWeather);
  game.ghost=randomFromArray(Object.keys(ghostProfiles));
  if(game.ghost==="TheMimic")assignMimicForm();
  game.ghostRoom=randomFromArray(Object.keys(roomVisuals).filter(r=>r!=="Van"));
  // Random cursed items
  placeCursedItems();
  logToGame("You are in the van. The weather is "+game.weather.toLowerCase()+".");
  renderHUD(); updateBackground();
  bootVisuals();
}

function assignMimicForm(){
  const g=Object.keys(ghostProfiles).filter(x=>x!=="TheMimic");
  game.mimicForm=randomFromArray(g);
  game.nextMimicShift=game.currentTurn+3+Math.floor(Math.random()*4);
}

function renderHUD(){
  document.getElementById("hud-location").textContent=game.playerRoom;
  document.getElementById("hud-weather").textContent=game.weather||"--";
  document.getElementById("hud-turns").textContent=game.currentTurn;
  document.getElementById("held-items-display").textContent=game.inventory.join(", ")||"None";
  if(game.inventory.includes("Thermometer") && game.playerRoom!=="Van"){
    const t = game.playerRoom===game.ghostRoom ?
      (Math.random()<0.3?-5:2+Math.random()*3) :
      15+Math.random()*5;
    document.getElementById("hud-temp").textContent=t.toFixed(1)+"°C";
  } else document.getElementById("hud-temp").textContent="--°C";
  updateSanityBar();
}

function updateBackground(){
  const v=roomVisuals[game.playerRoom]||roomVisuals["Van"];
  const d=game.playerDirection||"N";
  document.getElementById("background").style.backgroundImage=`url('${v[d]}')`;
}
/***********************
 === MOVEMENT & COMMAND HANDLER ===
************************/
function handleCommand(c){
  switch(c){
    case"move":openMoveOverlay();break;
    case"look":lookAround();break;
    case"inventory":openInventoryOverlay();break;
    case"guess":openGuess();break;
    case"van":moveToRoom("Van");break;
    default:logToGame("Unknown command.");break;
  }
}

function openMoveOverlay(){
  const exits=mapConnections[game.playerRoom]||[];
  if(!exits.length){logToGame("No available exits.");return;}
  const overlay=document.createElement("div");
  overlay.id="move-temp";
  Object.assign(overlay.style,{
    position:"fixed",top:"50%",left:"50%",
    transform:"translate(-50%,-50%)",
    background:"#111",padding:"10px",
    maxWidth:"90%"
  });
  overlay.innerHTML=exits.map(r=>
    `<button onclick="moveToRoom('${r}')">Go to ${r}</button>`
  ).join("")+
  `<button onclick="document.body.removeChild(document.getElementById('move-temp'))">Close</button>`;
  document.body.appendChild(overlay);
}

function moveToRoom(r){
  game.playerRoom=r; game.currentTurn++;
  logToGame("You move to "+r+".");
  renderHUD(); updateBackground();
  if(document.getElementById("move-temp"))document.body.removeChild(document.getElementById("move-temp"));
  checkTurnEvents();
}

function lookAround(){
  game.currentTurn++;
  if(game.playerRoom===game.ghostRoom){
    logToGame("You feel an eerie presence...");
    // Salt footprints
    if(game.roomItems[game.playerRoom] && game.roomItems[game.playerRoom].includes("Salt")){
      if(Math.random()<0.5){
        logToGame("You notice disturbed salt... Try using a UV Light.");
        if(!game.roomItems[game.playerRoom].includes("Footprints"))
          game.roomItems[game.playerRoom].push("Footprints");
        setTimeout(()=>{
          if(game.roomItems[game.playerRoom]){
            game.roomItems[game.playerRoom]=game.roomItems[game.playerRoom].filter(x=>x!=="Footprints");
            logToGame("The footprints have faded.");
          }
        },9000);
      }
    }
    // Onryo candle snuffing
    if(game.ghost==="Onryo" && game.roomItems[game.playerRoom] && game.roomItems[game.playerRoom].includes("Candle")){
      if(Math.random()<0.5){
        game.roomItems[game.playerRoom]=game.roomItems[game.playerRoom].filter(x=>x!=="Candle");
        logToGame("The flame suddenly extinguishes!");
      }
    }
    // Mimic fake orbs
    if(game.ghost==="TheMimic"||game.mimicForm==="TheMimic")logToGame("Fake orbs shimmer briefly.");
  } else logToGame("Nothing unusual.");
  renderHUD(); checkTurnEvents();
}

/***********************
 === INVENTORY SYSTEM ===
************************/
function openInventoryOverlay(){
  const existing=document.getElementById("inventory-temp");
  if(existing)document.body.removeChild(existing);
  const c=document.createElement("div");
  c.id="inventory-temp";
  Object.assign(c.style,{
    position:"fixed",top:"50%",left:"50%",
    transform:"translate(-50%,-50%)",
    background:"#111",padding:"10px",
    maxHeight:"70%",overflowY:"auto",maxWidth:"90%"
  });
  let html="<h3>Inventory</h3>";
  game.inventory.forEach(i=>{
    html+=`<button onclick="inspectItem('${i}')">Inspect: ${i}</button>`;
    html+=`<button onclick="dropItem('${i}');document.body.removeChild(document.getElementById('inventory-temp'))">Drop: ${i}</button>`;
    html+=`<button onclick="useItem('${i}');document.body.removeChild(document.getElementById('inventory-temp'))">Use: ${i}</button>`;
  });
  const roomInv=game.roomItems[game.playerRoom]||[];
  roomInv.forEach(i=>{
    html+=`<button onclick="pickItem('${i}');document.body.removeChild(document.getElementById('inventory-temp'))">Pick up: ${i}</button>`;
  });
  html+="<button onclick=\"document.body.removeChild(document.getElementById('inventory-temp'))\">Close</button>";
  c.innerHTML=html;
  document.body.appendChild(c);
}

function inspectItem(i){
  let desc="Standard investigation gear.";
  if(cursedItemDescriptions[i])desc=cursedItemDescriptions[i];
  if(i==="Crucifix")desc="Placed to prevent hunts. 2 uses.";
  if(i==="Camera"||i==="Video Camera")desc="Detects orbs via night vision.";
  if(i==="UV Light")desc="Reveals fingerprints or footprints (salt needed).";
  if(i==="Salt")desc="Sprinkle to reveal footprints with UV.";
  if(i==="Motion Sensor")desc="Alerts you in van when ghost triggers it.";
  if(i==="Candle")desc="Prevents Onryo hunts while lit.";
  logToGame("Inspecting "+i+": "+desc);
}

function dropItem(i){
  if(game.playerRoom==="Van"){
    game.vanStock.push(i); logToGame("Returned "+i+" to van.");
  } else {
    game.roomItems[game.playerRoom]=game.roomItems[game.playerRoom]||[];
    game.roomItems[game.playerRoom].push(i);
    logToGame("Dropped "+i+" here.");
  }
  game.inventory=game.inventory.filter(x=>x!==i);
  renderHUD();
}

function pickItem(i){
  if(game.inventory.length>=3){logToGame("Max 3 items.");return;}
  if(cursedItemDescriptions[i] && i==="Summoning Circle"){logToGame("The circle cannot be moved.");return;}
  game.roomItems[game.playerRoom]=game.roomItems[game.playerRoom].filter(x=>x!==i);
  game.inventory.push(i); logToGame("Picked up "+i+".");
  renderHUD();
}

/***********************
 === ITEM USE ===
************************/
const cursedItemList=["Ouija Board","Tarot Cards","Music Box","Voodoo Doll","Haunted Mirror","Summoning Circle","Monkey Paw"];
const cursedItemDescriptions={
  "Ouija Board":"Ask ghost questions; drains sanity, can break triggering hunt.",
  "Tarot Cards":"Draw cards for random effects.",
  "Music Box":"Plays a melody attracting ghost.",
  "Voodoo Doll":"Forces ghost interaction; costs sanity.",
  "Haunted Mirror":"Shows ghost room but drains sanity rapidly.",
  "Summoning Circle":"Forces ghost manifestation.",
  "Monkey Paw":"Grants wishes with consequences."
};
const cursedItemSanityCost={
  "Ouija Board":10,"Tarot Cards":5,"Music Box":8,"Voodoo Doll":6,
  "Haunted Mirror":15,"Summoning Circle":20,"Monkey Paw":25
};

function useItem(i){
  switch(i){
    case"Smudge Stick":
      if(game.playerRoom===game.ghostRoom){
        game.smudgeActive=3; logToGame("You smudge the room, calming the ghost.");
      } else logToGame("You smudge, but nothing happens.");
      break;
    case"Camera":
    case"Video Camera":
      if(game.playerRoom!=="Van"){
        game.cameraActive=!game.cameraActive;
        logToGame(game.cameraActive?"Camera on: watching for orbs.":"Camera off.");
      } else logToGame("Cannot use cameras in the van.");
      break;
    case"Crucifix":
      if(game.playerRoom!=="Van"){
        game.placedCrucifix[game.playerRoom]=2;
        logToGame("You place the crucifix. It may stop two hunts.");
        game.inventory=game.inventory.filter(x=>x!==i);
      } else logToGame("Cannot place crucifix in van.");
      break;
    case"Salt":
      if(game.playerRoom!=="Van"){
        game.roomItems[game.playerRoom]=game.roomItems[game.playerRoom]||[];
        if(!game.roomItems[game.playerRoom].includes("Salt")){
          game.roomItems[game.playerRoom].push("Salt");
          logToGame("You sprinkle salt on the ground.");
        }
      }
      break;
    case"UV Light":
      if(game.roomItems[game.playerRoom] && game.roomItems[game.playerRoom].includes("Footprints")){
        logToGame("You see glowing footprints under UV!");
        game.selectedEvidence.add("Fingerprints");
      } else logToGame("No visible prints under UV.");
      break;
    case"Candle":
      if(game.playerRoom!=="Van"){
        game.roomItems[game.playerRoom]=game.roomItems[game.playerRoom]||[];
        game.roomItems[game.playerRoom].push("Candle");
        logToGame("You place and light a candle here.");
      }
      break;
    case"Motion Sensor":
      if(game.playerRoom!=="Van"){
        game.roomItems[game.playerRoom]=game.roomItems[game.playerRoom]||[];
        if(!game.roomItems[game.playerRoom].includes("Motion Sensor")){
          game.roomItems[game.playerRoom].push("Motion Sensor");
          logToGame("You place a motion sensor in this room.");
        }
      }
      break;
    default:
      if(cursedItemDescriptions[i])handleCursedItem(i);
      else logToGame("You use the "+i+", but nothing significant occurs.");
  }
  game.currentTurn++;
  renderHUD(); checkTurnEvents();
}

function handleCursedItem(i){
  if(game.usedCursedItems[i]){logToGame("The "+i+" is inert now.");return;}
  logToGame("You use the "+i+"...");
  game.sanity-=cursedItemSanityCost[i]||0;
  if(game.sanity<0)game.sanity=0;
  switch(i){
    case"Ouija Board":if(Math.random()<0.2)startHunt();break;
    case"Tarot Cards":
      const r=Math.random();
      if(r<0.2)logToGame("The Fool — nothing happens.");
      else if(r<0.4)logToGame("The Tower — ghost activity spikes!");
      else if(r<0.6){logToGame("The Death card — hunt triggered!");startHunt();}
      else{logToGame("The Sun — sanity restored.");game.sanity=Math.min(100,game.sanity+10);}
      break;
    case"Music Box":if(Math.random()<0.3)startHunt();break;
    case"Haunted Mirror":if(Math.random()<0.3)startHunt();break;
    case"Summoning Circle":startHunt();break;
    case"Monkey Paw":if(Math.random()<0.5)startHunt();break;
  }
  game.usedCursedItems[i]=true; updateSanityBar();
}
/***********************
 === TURN EVENTS, MIMIC & HUNT LOGIC ===
************************/
function checkTurnEvents(){
  // Mimic shifting
  if(game.ghost==="TheMimic" && game.currentTurn>=game.nextMimicShift){
    assignMimicForm();
    logToGame("The Mimic shifts behavior...");
  }
  
  // Sanity drain
  if(game.playerRoom===game.ghostRoom){
    game.sanity -= 3 + Math.random()*3;
    if(Math.random()<0.3){
      const g=(game.ghost==="TheMimic"?game.mimicForm:game.ghost);
      logToGame("[Ambient] "+(ghostProfiles[g].behavior || "The air feels heavy..."));
    }
  } else {
    game.sanity -=1;
  }

  // Motion sensor alerts (if in van)
  if(game.playerRoom==="Van"){
    Object.keys(game.roomItems).forEach(r=>{
      if(game.roomItems[r].includes("Motion Sensor") && Math.random()<0.2){
        logToGame("[Van Monitor] Motion detected in "+r+"!");
      }
    });
  }

  if(game.sanity<0)game.sanity=0;
  updateSanityBar();
  attemptHunt();
}

function attemptHunt(){
  if(game.smudgeActive>0){game.smudgeActive--;return;}
  if(game.huntCooldown>0){game.huntCooldown--;return;}
  // Onryo won't hunt if any candle lit
  if(game.ghost==="Onryo" && Object.values(game.roomItems).some(a=>a.includes("Candle")))return;
  if(game.sanity<30 && Math.random()<0.25)startHunt();
}

function startHunt(){
  logToGame("💀 The ghost is hunting!");
  flashRed();
  if(game.playerRoom===game.ghostRoom){
    if(game.placedCrucifix && game.placedCrucifix[game.playerRoom]>0){
      game.placedCrucifix[game.playerRoom]--;
      logToGame("The crucifix burns, stopping the hunt. ("+game.placedCrucifix[game.playerRoom]+" uses left)");
    } else {
      setTimeout(()=>{
        alert("The ghost caught you! You died.");
        resetGame();
        showLoadout();
      },1500);
    }
  } else {
    logToGame("You survived the hunt...");
  }
  game.huntCooldown=5;
}

function flashRed(){
  const l=document.getElementById("lightning");
  l.style.background="red"; l.style.opacity=0.6;
  setTimeout(()=>{l.style.opacity=0;},600);
}

/***********************
 === AMBIENT VISUALS & ORBS ===
************************/
function bootVisuals(){
  if(game.weather==="Stormy" || game.weather==="Blood Moon"){randomLightning();}
  if(game.weather==="Foggy" || game.weather==="Stormy" || game.weather==="Blood Moon"){initFog();}
  initOrbs();
}

function randomLightning(){
  setTimeout(()=>{
    const l=document.getElementById("lightning");
    l.style.background="white"; l.style.opacity=0.8;
    setTimeout(()=>{l.style.opacity=0;},200);
    randomLightning();
  },Math.random()*8000+4000);
}

function initFog(){
  const c=document.getElementById("fog-layer"),ctx=c.getContext("2d");
  c.width=window.innerWidth; c.height=window.innerHeight;
  const fogs=[];
  for(let i=0;i<3;i++){
    fogs.push({x:Math.random()*c.width,y:Math.random()*c.height,alpha:0.1+i*0.05,speed:0.1+i*0.05});
  }
  const fogImg=new Image(); fogImg.src="fog.png";
  function draw(){
    ctx.clearRect(0,0,c.width,c.height);
    fogs.forEach(f=>{
      ctx.globalAlpha=f.alpha;
      ctx.drawImage(fogImg,f.x,f.y,c.width,200);
      f.y+=f.speed; if(f.y>c.height)f.y=-200;
    });
    ctx.globalAlpha=1; requestAnimationFrame(draw);
  }
  draw();
}

function initOrbs(){
  const c=document.getElementById("orbCanvas"),x=c.getContext("2d");
  c.width=window.innerWidth; c.height=window.innerHeight;
  let o=[];
  function spawn(){
    if(game.cameraActive && o.length<10){
      const g=(game.ghost==="TheMimic"?game.mimicForm:game.ghost);
      if(ghostProfiles[g].evidence.includes("Orbs") || game.ghost==="TheMimic"){
        o.push({
          x:Math.random()*c.width,y:Math.random()*c.height,
          r:Math.random()*3+2,alpha:Math.random(),
          fade:Math.random()*0.02+0.005
        });
      }
    }
  }
  function animate(){
    x.clearRect(0,0,c.width,c.height);
    if(game.cameraActive){
      for(let i=0;i<o.length;i++){
        const b=o[i];
        b.alpha+=b.fade;
        if(b.alpha<=0||b.alpha>=1)b.fade*=-1;
        b.y-=0.2;
        x.beginPath();
        x.arc(b.x,b.y,b.r,0,Math.PI*2);
        x.fillStyle="rgba(255,255,255,"+b.alpha+")";
        x.fill();
        if(b.y<-10)o.splice(i,1);
      }
    } else {o=[];}
    requestAnimationFrame(animate);
  }
  setInterval(spawn,2000); animate();
}

window.addEventListener("resize",()=>{
  const orb=document.getElementById("orbCanvas"),fog=document.getElementById("fog-layer");
  orb.width=window.innerWidth; orb.height=window.innerHeight;
  fog.width=window.innerWidth; fog.height=window.innerHeight;
});

/***********************
 === GHOST GUESS & ENDGAME ===
************************/
function openGuess(){
  const list=document.getElementById("guess-list");
  list.innerHTML="";
  Object.keys(ghostProfiles).forEach(g=>{
    const b=document.createElement("button");
    b.textContent=g;
    b.style.fontSize="14px";
    b.onclick=()=>{
      makeGuess(g);
      document.getElementById("guess-popup").style.display="none";
    };
    list.appendChild(b);
  });
  document.getElementById("guess-popup").style.display="flex";
}

function makeGuess(g){
  if(g===game.ghost){
    logToGame("✅ Correct! The ghost was "+g+"!");
  } else {
    logToGame("❌ Wrong. The ghost was "+game.ghost+".");
  }
  setTimeout(endGame,1500);
}

function endGame(){
  const overlay=document.createElement("div");
  overlay.id="end-game";
  Object.assign(overlay.style,{
    position:"fixed",top:"0",left:"0",width:"100vw",height:"100vh",
    background:"rgba(0,0,0,0.8)",
    display:"flex",justifyContent:"center",alignItems:"center",
    flexDirection:"column",color:"#eee",fontSize:"20px",zIndex:"4000"
  });
  overlay.innerHTML="<h2>Investigation Complete</h2>"+
    "<button style='padding:10px 20px;background:#222;color:#eee;border:1px solid #555;cursor:pointer;' onclick='resetAndRestart()'>Start New Game</button>";
  document.body.appendChild(overlay);
}

function resetAndRestart(){
  const e=document.getElementById("end-game");
  if(e)document.body.removeChild(e);
  resetGame();
  showLoadout();
}

/***********************
 === STARTUP ===
************************/
document.addEventListener("DOMContentLoaded",()=>{
  resetGame();
  const startBtn=document.getElementById("startButton");
  const confirmBtn=document.getElementById("confirm-loadout");

  startBtn.addEventListener("click",()=>{
    startBtn.disabled=true;
    const t=document.getElementById("title-screen");
    t.style.opacity="0";
    setTimeout(()=>{
      t.style.display="none";
      showLoadout();
    },1500);
  });

  confirmBtn.addEventListener("click",()=>{
    if(typeof tempHeld==="undefined")tempHeld=[];
    if(typeof tempVan==="undefined")tempVan=[...allLoadoutItems];
    game.inventory=[...tempHeld,"Notebook","Lighter"];
    game.vanStock=[...tempVan];
    document.getElementById("loadout-screen").style.display="none";
    startInvestigation();
    window.dispatchEvent(new Event("resize"));
  });

  document.querySelectorAll("#command-buttons button").forEach(b=>{
    b.addEventListener("click",()=>handleCommand(b.dataset.cmd));
  });
});
</script>
