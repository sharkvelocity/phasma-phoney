<!DOCTYPE html>
<html lang="en">
<head>

<style>
  html, body {
    margin:0; padding:0;

  #sanity-bar-container {

  }
  #sanity-bar {
    height:100%;width:100%;background:#0f0;transition:width .3s ease;
  }
  #inventory-display {
    position:absolute;top:1%;right:1%;

    z-index:10;font-size:12px;max-width:40%;
  }
  #narrator-ui {
    position:absolute;bottom:0;left:0;width:100%;height:40%;
    background:rgba(0,0,0,0.4);display:none;
    flex-direction:row;justify-content:space-between;align-items:stretch;z-index:10;

  #game-log {
    flex:3;overflow-y:auto;padding:6px;font-size:12px;line-height:1.3;

  #command-buttons {

    background:rgba(15,15,15,0.9);padding:1em;border:2px solid #444;border-radius:6px;
    max-width:420px;width:90%;color:#eee;text-align:center;
  }
  .item-button {
    background:#222;color:#eee;border:1px solid #555;border-radius:4px;
    padding:4px 6px;margin:2px;font-size:12px;
  }
  .item-button.selected {background:#0a0;border-color:#0f0;color:#fff;}
  #confirm-loadout {margin-top:8px;}
  #confirm-loadout.active {background:#0a0;color:#fff;border-color:#0f0;}
  #guess-popup {
    position:fixed;top:0;left:0;width:100vw;height:100vh;
    background:rgba(0,0,0,0.8);display:none;justify-content:center;align-items:center;z-index:3000;
  }
  #guess-list {
    background:#111;padding:10px;border:1px solid #444;max-height:70%;overflow-y:auto;
  }
  #van-monitor {
    position:fixed;top:10%;left:10%;width:80%;height:80%;
    background:#000;border:2px solid #0f0;color:#0f0;font-family:monospace;

  }
  footer {
    position:fixed;bottom:0;width:100%;text-align:center;background:#111;
    color:#555;font-size:10px;padding:2px;z-index:3500;

  </div>
</div>

<script>
"use strict";

/***********************
 === GLOBAL SETUP & GHOST PROFILES ===
************************/
const allLoadoutItems=["EMF Reader","Spirit Box","Camera","UV Light","D.O.T.S Projector","Thermometer","Ghost Writing Book","Video Camera","Crucifix","Smudge Stick","Salt","Parabolic Microphone","Motion Sensor","Sound Sensor","Candle"];
const possibleWeather=["Stormy","Clear","Foggy","Blood Moon"];
const ghostProfiles={
  Spirit:{evidence:["EMF Reader","Spirit Box","Ghost Writing"],behavior:"Standard; calmer with smudge."},
  Wraith:{evidence:["EMF Reader","Spirit Box","D.O.T.S Projector"],behavior:"Rarely touches ground; teleports."},
  Phantom:{evidence:["Spirit Box","Fingerprints","D.O.T.S Projector"],behavior:"Long view drains sanity faster."},
  Poltergeist:{evidence:["Spirit Box","Fingerprints","Ghost Writing"],behavior:"Throws multiple objects."},
  Banshee:{evidence:["Fingerprints","Orbs","D.O.T.S Projector"],behavior:"Focuses on one target."},
  Jinn:{evidence:["EMF Reader","Fingerprints","Freezing Temps"],behavior:"Faster with power on."},
  Mare:{evidence:["Spirit Box","Ghost Writing","Orbs"],behavior:"Active in darkness."},
  Revenant:{evidence:["Ghost Writing","Orbs","Freezing Temps"],behavior:"Very fast if target seen."},
  Shade:{evidence:["EMF Reader","Ghost Writing","Freezing Temps"],behavior:"Shy; less active with groups."},
  Demon:{evidence:["Fingerprints","Ghost Writing","Freezing Temps"],behavior:"Hunts more often."},
  Yurei:{evidence:["Orbs","Freezing Temps","D.O.T.S Projector"],behavior:"Strong sanity drain; trapped by smudge."},
  Oni:{evidence:["EMF Reader","Freezing Temps","D.O.T.S Projector"],behavior:"Active when visible."},
  Yokai:{evidence:["Spirit Box","Orbs","D.O.T.S Projector"],behavior:"Talkative; hunts near voices."},
  Hantu:{evidence:["Fingerprints","Orbs","Freezing Temps"],behavior:"Faster in cold rooms."},
  Goryo:{evidence:["EMF Reader","Fingerprints","D.O.T.S Projector"],behavior:"Seen only via camera; stays in same room."},
  Myling:{evidence:["EMF Reader","Fingerprints","Ghost Writing"],behavior:"Quieter footsteps; sound eq active."},
  Onryo:{evidence:["Spirit Box","Orbs","Freezing Temps"],behavior:"Hunts after extinguishing flames."},
  TheTwins:{evidence:["EMF Reader","Spirit Box","Freezing Temps"],behavior:"Alternates activity between rooms."},
  Raiju:{evidence:["EMF Reader","Orbs","D.O.T.S Projector"],behavior:"Faster near electronics."},
  Obake:{evidence:["EMF Reader","Fingerprints","Orbs"],behavior:"Rare fingerprint changes."},
  TheMimic:{evidence:["Spirit Box","Fingerprints","Freezing Temps"],behavior:"Mimics others; fake orbs on camera."},
  Moroi:{evidence:["Spirit Box","Ghost Writing","Freezing Temps"],behavior:"Curses sanity with Spirit Box."},
  Deogen:{evidence:["Spirit Box","Ghost Writing","D.O.T.S Projector"],behavior:"Knows location; slow when near."},
  Thaye:{evidence:["Ghost Writing","Orbs","D.O.T.S Projector"],behavior:"Very active early; weakens over time."},
  Raikiri:{evidence:["EMF Reader","Freezing Temps","D.O.T.S Projector"],behavior:"EMF surges; false readings."},
  Succubus:{evidence:["Spirit Box","Ghost Writing","Fingerprints"],behavior:"Drains sanity faster when alone."}
};
const roomVisuals={Van:{N:"Van_N.png"},Foyer:{N:"Foyer_N.png"},LivingRoom:{N:"LivingRoom_N.png"},Kitchen:{N:"Kitchen_N.png"},DiningRoom:{N:"DiningRoom_N.png"},Basement:{N:"Basement_N.png"},Bathroom:{N:"Bathroom_N.png"},Garage:{N:"Garage_N.png"},KidsBedroom:{N:"KidsBedroom_N.png"},MasterBedroom:{N:"MasterBedroom_N.png"}};
const mapConnections={Van:["Foyer"],Foyer:["Van","LivingRoom","Kitchen","Bathroom"],LivingRoom:["Foyer","DiningRoom","Garage","KidsBedroom","MasterBedroom"],Kitchen:["Foyer","DiningRoom","Basement"],DiningRoom:["Kitchen","LivingRoom"],Basement:["Kitchen"],Garage:["LivingRoom"],Bathroom:["Foyer"]};

/***********************
 === GAME STATE ===
************************/
const game={ghost:null,ghostRoom:null,playerRoom:"Van",inventory:[],vanStock:[...allLoadoutItems],selectedEvidence:new Set(),currentTurn:0,sanity:100,weather:null,mimicForm:null,nextMimicShift:0,cameraActive:false,huntCooldown:0,smudgeActive:0,placedCrucifix:{},roomItems:{},usedCursedItems:{}};
let tempHeld=[],tempVan=[...allLoadoutItems],vanMonitorBooted=false;

/***********************
 === BASIC UTILS ===
************************/
function logToGame(t){const log=document.getElementById("game-log");const e=document.createElement("div");e.textContent=t;log.appendChild(e);log.scrollTop=log.scrollHeight;}
function randomFromArray(a){return a[Math.floor(Math.random()*a.length)];}
function updateSanityBar(){const b=document.getElementById("sanity-bar");b.style.width=game.sanity+"%";b.style.background=game.sanity>66?"#0f0":game.sanity>33?"#ff0":"#f00";}

/***********************
 === RESET & START ===
************************/
function resetGame(){game.ghost=null;game.ghostRoom=null;game.playerRoom="Van";game.inventory=[];game.vanStock=[...allLoadoutItems];game.selectedEvidence.clear();game.currentTurn=0;game.sanity=100;game.weather=null;game.mimicForm=null;game.nextMimicShift=0;game.huntCooldown=0;game.smudgeActive=0;game.placedCrucifix={};game.roomItems={};game.usedCursedItems={};updateSanityBar();}
function startInvestigation(){document.getElementById("main-scene").style.display="block";document.getElementById("narrator-ui").style.display="flex";document.getElementById("game-log").innerHTML="";game.weather=randomFromArray(possibleWeather);game.ghost=randomFromArray(Object.keys(ghostProfiles));if(game.ghost==="TheMimic")assignMimicForm();game.ghostRoom=randomFromArray(Object.keys(roomVisuals).filter(r=>r!=="Van"));logToGame("You are in the van. Weather is "+game.weather.toLowerCase()+".");renderHUD();updateBackground();bootVisuals();}
function assignMimicForm(){const g=Object.keys(ghostProfiles).filter(x=>x!=="TheMimic");game.mimicForm=randomFromArray(g);game.nextMimicShift=game.currentTurn+3+Math.floor(Math.random()*4);}
function renderHUD(){document.getElementById("hud-location").textContent=game.playerRoom;document.getElementById("hud-weather").textContent=game.weather||"--";document.getElementById("hud-turns").textContent=game.currentTurn;document.getElementById("held-items-display").textContent=game.inventory.join(", ")||"None";updateSanityBar();}
function updateBackground(){document.getElementById("background").style.backgroundImage=`url('${roomVisuals[game.playerRoom].N}')`;}

"use strict";

/***********************
 === COMMAND HANDLER ===
************************/
function handleCommand(c){
  switch(c){
    case"move":openMoveOverlay();break;
    case"look":lookAround();break;
    case"inventory":openInventoryOverlay();break;
    case"guess":openGuess();break;
    case"van":if(game.playerRoom!=="Van"){moveToRoom("Van");}else{openVanMenu();}break;
    case"monitor":openVanMonitor();break;
    default:logToGame("Unknown command.");
  }
}

/***********************
 === MOVEMENT & LOOK ===
************************/
function openMoveOverlay(){
  const o=mapConnections[game.playerRoom]||[];
  if(!o.length){logToGame("No available exits.");return;}
  const overlay=document.createElement("div");
  overlay.id="move-temp";
  Object.assign(overlay.style,{position:"fixed",top:"50%",left:"50%",transform:"translate(-50%,-50%)",background:"#111",padding:"10px",maxWidth:"90%",zIndex:"3500"});
  overlay.innerHTML=o.map(r=>`<button onclick="moveToRoom('${r}')">Go to ${r}</button>`).join("")+
  `<button onclick="document.body.removeChild(document.getElementById('move-temp'))">Close</button>`;
  document.body.appendChild(overlay);
}

function moveToRoom(r){
  if(r==="Van"&&game.playerRoom!=="Van"){game.currentTurn++;}
  game.playerRoom=r;logToGame("You move to "+r+".");
  renderHUD();updateBackground();
  if(document.getElementById("move-temp"))document.body.removeChild(document.getElementById("move-temp"));
  checkTurnEvents();
}

function lookAround(){
  game.currentTurn++;
  if(game.playerRoom===game.ghostRoom){
    logToGame("You feel an eerie presence...");
    if(game.roomItems[game.playerRoom]&&game.roomItems[game.playerRoom].includes("Salt")){
      if(Math.random()<0.5){
        logToGame("You notice disturbed salt... Try using a UV Light.");
        if(!game.roomItems[game.playerRoom].includes("Footprints"))
          game.roomItems[game.playerRoom].push("Footprints");
        setTimeout(()=>{if(game.roomItems[game.playerRoom]){
          game.roomItems[game.playerRoom]=game.roomItems[game.playerRoom].filter(x=>x!=="Footprints");
          logToGame("The footprints have faded.");}},9000);
      }
    }
    if(game.ghost==="Onryo"&&game.roomItems[game.playerRoom]&&game.roomItems[game.playerRoom].includes("Candle")){
      if(Math.random()<0.5){
        game.roomItems[game.playerRoom]=game.roomItems[game.playerRoom].filter(x=>x!=="Candle");
        logToGame("The flame suddenly extinguishes!");
      }
    }
    if(game.ghost==="TheMimic"||game.mimicForm==="TheMimic")logToGame("Fake orbs shimmer briefly.");
  }else logToGame("Nothing unusual.");
  renderHUD();checkTurnEvents();
}

/***********************
 === INVENTORY & VAN MENU ===
************************/
function openInventoryOverlay(){
  const existing=document.getElementById("inventory-temp");
  if(existing)document.body.removeChild(existing);
  const c=document.createElement("div");
  c.id="inventory-temp";
  Object.assign(c.style,{position:"fixed",top:"50%",left:"50%",transform:"translate(-50%,-50%)",background:"#111",padding:"10px",maxHeight:"70%",overflowY:"auto",maxWidth:"90%",width:"90%",zIndex:"3500"});
  let html="<h3>Inventory</h3>";
  game.inventory.forEach(i=>{
    html+=`<button onclick="inspectItem('${i}')">Inspect: ${i}</button>`;
    if(i!=="Notebook"&&i!=="Lighter")
      html+=`<button onclick="dropItem('${i}');document.body.removeChild(document.getElementById('inventory-temp'))">Drop: ${i}</button>`;
    html+=`<button onclick="useItem('${i}');document.body.removeChild(document.getElementById('inventory-temp'))">Use: ${i}</button>`;
  });
  const roomInv=game.roomItems&&game.roomItems[game.playerRoom]||[];
  roomInv.forEach(i=>{html+=`<button onclick="pickItem('${i}');document.body.removeChild(document.getElementById('inventory-temp'))">Pick up: ${i}</button>`;});
  html+="<button onclick=\"document.body.removeChild(document.getElementById('inventory-temp'))\">Close</button>";
  c.innerHTML=html;document.body.appendChild(c);
}

function openVanMenu(){
  if(game.playerRoom!=="Van"){moveToRoom("Van");return;}
  const existing=document.getElementById("inventory-temp");
  if(existing)document.body.removeChild(existing);
  const c=document.createElement("div");
  c.id="inventory-temp";
  Object.assign(c.style,{position:"fixed",top:"50%",left:"50%",transform:"translate(-50%,-50%)",background:"#111",padding:"10px",maxHeight:"70%",overflowY:"auto",maxWidth:"90%",width:"90%",zIndex:"3500"});
  let html="<h3>Check Gear / Swap Items</h3><p><strong>Held Items:</strong></p>";
  game.inventory.forEach(i=>{if(i!=="Notebook"&&i!=="Lighter")html+=`<button onclick="returnItemToVan('${i}')">Return: ${i}</button>`;});
  html+="<p><strong>Van Inventory:</strong></p>";
  game.vanStock.forEach(i=>{html+=`<button onclick="takeItemFromVan('${i}')">Take: ${i}</button>`;});
  html+="<hr/><button onclick='openVanMonitor();document.body.removeChild(document.getElementById(\"inventory-temp\"))'>Van Monitor</button>";
  html+="<button onclick=\"document.body.removeChild(document.getElementById('inventory-temp'))\">Close</button>";
  c.innerHTML=html;document.body.appendChild(c);
}

function returnItemToVan(i){
  if(game.inventory.includes(i)){game.inventory=game.inventory.filter(x=>x!==i);game.vanStock.push(i);logToGame("Returned "+i+" to van.");openVanMenu();renderHUD();}
}
function takeItemFromVan(i){
  const gearCount=game.inventory.filter(x=>x!=="Notebook"&&x!=="Lighter").length;
  if(gearCount>=3){logToGame("Max 3 items (Notebook & Lighter don’t count).");return;}
  if(game.vanStock.includes(i)){game.vanStock=game.vanStock.filter(x=>x!==i);game.inventory.push(i);logToGame("Took "+i+" from van.");openVanMenu();renderHUD();}
}

/***********************
 === HUNT, TURN, MIMIC LOGIC ===
************************/
function checkTurnEvents(){
  if(game.ghost==="TheMimic"&&game.currentTurn>=game.nextMimicShift){assignMimicForm();logToGame("The Mimic shifts behavior...");}
  if(game.playerRoom===game.ghostRoom){
    game.sanity-=3+Math.random()*3;
    if(Math.random()<0.3){const g=(game.ghost==="TheMimic"?game.mimicForm:game.ghost);logToGame("[Ambient] "+(ghostProfiles[g].behavior||"The air feels heavy..."));}
  }else game.sanity-=1;
  if(game.playerRoom==="Van"){Object.keys(game.roomItems).forEach(r=>{if(game.roomItems[r].includes("Motion Sensor")&&Math.random()<0.2)logToGame("[Van Monitor] Motion detected in "+r+"!");});}
  if(game.sanity<0)game.sanity=0;updateSanityBar();attemptHunt();
}
function attemptHunt(){if(game.smudgeActive>0){game.smudgeActive--;return;}if(game.huntCooldown>0){game.huntCooldown--;return;}if(game.ghost==="Onryo"&&Object.values(game.roomItems).some(a=>a.includes("Candle")))return;if(game.sanity<30&&Math.random()<0.25)startHunt();}
function startHunt(){
  logToGame("💀 The ghost is hunting!");flashRed();
  if(game.playerRoom===game.ghostRoom){
    if(game.placedCrucifix&&game.placedCrucifix[game.playerRoom]>0){
      game.placedCrucifix[game.playerRoom]--;
      logToGame("The crucifix burns, stopping the hunt. ("+game.placedCrucifix[game.playerRoom]+" uses left)");
    }else setTimeout(()=>{alert("The ghost caught you! You died.");resetGame();showLoadout();},1500);
  }else logToGame("You survived the hunt...");
  game.huntCooldown=5;
}
function flashRed(){const l=document.getElementById("lightning");l.style.background="red";l.style.opacity=0.6;setTimeout(()=>{l.style.opacity=0;},600);}

/***********************
 === NEXT: Van Monitor Boot + Guess + Endgame ===
************************/

"use strict";

/***********************
 === VAN MONITOR FULL BOOT (1x PER INVESTIGATION) ===
************************/
/***********************
 === VAN MONITOR FULL BOOT (1x PER INVESTIGATION) ===
************************/
let vanMonitorBooted = false;

function openVanMonitor() {
  if (document.getElementById("van-monitor")) return;

  const monitor = document.createElement("div");
  monitor.id = "van-monitor";
  Object.assign(monitor.style, {
    position: "fixed",
    top: "10%", left: "10%",
    width: "80%", height: "80%",
    background: "#000",
    border: "2px solid #0f0",
    color: "#0f0",
    fontFamily: "monospace",
    fontSize: "16px",
    padding: "10px",
    zIndex: "4000",
    overflow: "hidden"
  });

  monitor.innerHTML = `
    <div id="monitor-text" style="white-space:pre-line;"></div>
    <button style="position:absolute;top:5px;right:5px;background:#222;color:#eee;
      border:1px solid #555;cursor:pointer;"
      onclick="document.body.removeChild(document.getElementById('van-monitor'))">X</button>
  `;
  document.body.appendChild(monitor);

  if (!vanMonitorBooted) {
    vanMonitorBooted = true;
    runBootSequence();
  } else {
    showCameraGrid();
  }

  /***********************
   === BOOT SEQUENCE ===
  ************************/
  function runBootSequence() {
    const text = document.getElementById("monitor-text");
    let cursorBlink = 0;

    function blinkCursor() {
      text.textContent = `>C:/` + (cursorBlink % 2 === 0 ? "|" : " ");
      cursorBlink++;
      if (cursorBlink < 6) {
        setTimeout(blinkCursor, 500);
      } else {
        typeBootCommand();
      }
    }

    function typeBootCommand() {
      let cmd = ">C:/boot ghost.os";
      let i = 0;
      text.textContent = "";
      const typer = setInterval(() => {
        text.textContent += cmd[i];
        i++;
        if (i >= cmd.length) {
          clearInterval(typer);
          setTimeout(showLogoLoading, 800);
        }
      }, 80);
    }

    function showLogoLoading() {
      const text = document.getElementById("monitor-text");
      text.innerHTML = `
        <div style="display:flex;flex-direction:column;align-items:center;
            justify-content:center;height:100%;">
          <img src="logo.png" style="max-width:60%;margin-bottom:20px;">
          <div style="width:60%;height:20px;border:1px solid #0f0;">
            <div id="boot-bar" style="width:0%;height:100%;background:#0f0"></div>
          </div>
        </div>`;
      let bar = document.getElementById("boot-bar");
      let width = 0;
      const loadInterval = setInterval(() => {
        width += 4;
        bar.style.width = width + "%";
        if (width >= 100) {
          clearInterval(loadInterval);
          setTimeout(showLoginScreen, 800);
        }
      }, 100);
    }

    function showLoginScreen() {
      const text = document.getElementById("monitor-text");
      const funnyUsers = [
        "ghost_buster69","sp00kyLad","orbSlurper","saltDaddy",
        "cameraGremlin","crucifixFan","vanGoblin","Ada4Lyfe",
        "freezingTemps4u","bootLoopPhantom"
      ];
      const user = funnyUsers[Math.floor(Math.random() * funnyUsers.length)];

      text.style.textAlign = "center";
      text.style.color = "#0f0";
      text.innerHTML = `<h2>GhostOS Login</h2>
        <p id="login-username">Username: </p>
        <p id="login-password">Password: </p>`;

      let uField = document.getElementById("login-username");
      let pField = document.getElementById("login-password");

      let i = 0;
      function typeUsername() {
        if (i < user.length) {
          uField.textContent += user[i];
          i++;
          setTimeout(typeUsername, 100);
        } else {
          typePassword();
        }
      }

      let pCount = 0;
      function typePassword() {
        if (pCount < 8) {
          pField.textContent += "*";
          pCount++;
          setTimeout(typePassword, 150);
        } else {
          setTimeout(showCameraGrid, 1200);
        }
      }
      typeUsername();
    }

    blinkCursor();
  }

  /***********************
   === CAMERA GRID ===
  ************************/
  function showCameraGrid() {
    const text = document.getElementById("monitor-text");
    text.style.textAlign = "left";
    text.innerHTML = "";

    const grid = document.createElement("div");
    Object.assign(grid.style, {
      display: "grid",
      gridTemplateColumns: "1fr 1fr",
      gridTemplateRows: "1fr 1fr",
      gap: "4px",
      width: "100%",
      height: "calc(100% - 50px)",
      marginTop: "10px"
    });

    let cams = 0;
    Object.keys(game.roomItems).forEach(r => {
      if (game.roomItems[r].includes("Video Camera")) cams++;
    });

    for (let j = 1; j <= 4; j++) {
      const cell = document.createElement("div");
      Object.assign(cell.style, {
        background: "#111",
        color: "#eee",
        border: "1px solid #0f0",
        display: "flex",
        justifyContent: "center",
        alignItems: "center"
      });
      cell.textContent = j <= cams ? `Live Feed: ${game.ghostRoom}` : "NO SIGNAL";
      grid.appendChild(cell);
    }
    text.appendChild(grid);
  }
}

/***********************
 === GHOST GUESS & ENDGAME ===
************************/
function openGuess(){
  const list=document.getElementById("guess-list");
  list.innerHTML="";
  Object.keys(ghostProfiles).forEach(g=>{
    const b=document.createElement("button");
    b.textContent=g;
    b.style.fontSize="14px";
    b.onclick=()=>{makeGuess(g);document.getElementById("guess-popup").style.display="none";};
    list.appendChild(b);
  });
  document.getElementById("guess-popup").style.display="flex";
}

function makeGuess(g){
  if(g===game.ghost){logToGame("✅ Correct! The ghost was "+g+"!");}
  else{logToGame("❌ Wrong. The ghost was "+game.ghost+".");}
  setTimeout(endGame,1500);
}

function endGame(){
  const overlay=document.createElement("div");
  overlay.id="end-game";
  Object.assign(overlay.style,{
    position:"fixed",top:"0",left:"0",width:"100vw",height:"100vh",
    background:"rgba(0,0,0,0.8)",display:"flex",justifyContent:"center",
    alignItems:"center",flexDirection:"column",color:"#eee",fontSize:"20px",zIndex:"4000"
  });
  overlay.innerHTML="<h2>Investigation Complete</h2>"+
  "<button style='padding:10px 20px;background:#222;color:#eee;border:1px solid #555;cursor:pointer;' onclick='resetAndRestart()'>Start New Game</button>";
  document.body.appendChild(overlay);
}

function resetAndRestart(){
  const e=document.getElementById("end-game");
  if(e)document.body.removeChild(e);
  vanMonitorBooted=false;
  resetGame();
  showLoadout();
}

/***********************
 === LOADOUT SCREEN LOGIC (NOTEBOOK & LIGHTER FIXED) ===
************************/
let tempHeld=[];
let tempVan=[...allLoadoutItems];

function showLoadout(){
  tempHeld=[];tempVan=[...allLoadoutItems];
  const heldList=document.getElementById("held-list");
  const vanList=document.getElementById("van-list");
  heldList.innerHTML="";vanList.innerHTML="";
  function renderLoadout(){
    heldList.innerHTML=tempHeld.map(i=>`<button class="item-button selected" onclick="removeHeldItem('${i}')">${i}</button>`).join("");
    vanList.innerHTML=tempVan.map(i=>`<button class="item-button" onclick="addHeldItem('${i}')">${i}</button>`).join("");
    const confirmBtn=document.getElementById("confirm-loadout");
    if(tempHeld.length>0){confirmBtn.classList.add("active");confirmBtn.disabled=false;}
    else{confirmBtn.classList.remove("active");confirmBtn.disabled=true;}
  }
  window.addHeldItem=function(item){
    if(tempHeld.length>=3){alert("You can only hold 3 items.");return;}
    tempHeld.push(item);tempVan=tempVan.filter(v=>v!==item);renderLoadout();
  };
  window.removeHeldItem=function(item){
    tempVan.push(item);tempHeld=tempHeld.filter(h=>h!==item);renderLoadout();
  };
  renderLoadout();
  document.getElementById("loadout-screen").style.display="flex";
}

/***********************
 === FINAL EVENT LISTENERS ===
************************/
document.addEventListener("DOMContentLoaded",()=>{
  resetGame();
  const startBtn=document.getElementById("startButton");
  const confirmBtn=document.getElementById("confirm-loadout");

  startBtn.addEventListener("click",()=>{
    startBtn.disabled=true;
    const t=document.getElementById("title-screen");
    t.style.opacity="0";
    setTimeout(()=>{t.style.display="none";showLoadout();},1500);
  });

  confirmBtn.addEventListener("click",()=>{
    if(typeof tempHeld==="undefined")tempHeld=[];
    if(typeof tempVan==="undefined")tempVan=[...allLoadoutItems];
    game.inventory=[...tempHeld,"Notebook","Lighter"];
    game.vanStock=[...tempVan];
    document.getElementById("loadout-screen").style.display="none";
    startInvestigation();
    window.dispatchEvent(new Event("resize"));
  });

  document.querySelectorAll("#command-buttons button").forEach((b)=>{
    b.addEventListener("click",()=>handleCommand(b.dataset.cmd));
  });
});
</script>
