<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Phasma‑Phoney</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Phasma-Phoney: Turn-based ghost investigation horror game" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background: black;
      overflow: hidden;
      font-family: monospace, sans-serif;
      color: #eee;
    }
    #title-screen {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: black;
      z-index: 100;
      opacity: 1;
      transition: opacity 2s ease-in-out;
    }
    #title-screen img {
      max-width: 80%;
      animation: pulse 5s infinite ease-in-out;
      opacity: 0.9;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.9; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.04); }
    }
    #startButton {
      position: absolute;
      bottom: 20%;
      left: 50%;
      transform: translateX(-50%);
      padding: 16px 48px;
      font-size: 24px;
      background-color: #111;
      color: #eee;
      border: 2px solid #444;
      cursor: pointer;
      z-index: 101;
      transition: all 0.3s ease;
    }
    #startButton:hover { background-color: #222; border-color: #888; }
    #main-scene {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: none;
      overflow: hidden;
      background: black;
    }
    #background, #rain-layer, #lightning, #foreground, #fog-layer, #orbCanvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
    }
    #background { z-index:1; background-size:cover; background-position:center; }
    #rain-layer { z-index:2; pointer-events:none; background:rgba(255,255,255,0.05); }
    #lightning { z-index:3; background:white; opacity:0; pointer-events:none; }
    #foreground { z-index:4; pointer-events:none; }
    #fog-layer { z-index:5; pointer-events:none; }
    #orbCanvas { z-index:6; pointer-events:none; }
    #narrator-ui {
      position:absolute; bottom:0; left:0;
      width:100%; height:40%;
      background:rgba(0,0,0,0.4);
      backdrop-filter:blur(4px);
      display:none; flex-direction:column; justify-content:space-between;
      z-index:10;
    }
    #game-log {
      flex:1; overflow-y:auto; padding:10px; font-size:14px; line-height:1.4; opacity:0.95;
    }
    #game-log::-webkit-scrollbar { width:6px; }
    #game-log::-webkit-scrollbar-thumb { background:#444; border-radius:3px; }
    .log-entry { opacity:0.85; transition:opacity 1s ease-in-out; }
    .log-entry.fade { opacity:0.4; }
    #command-buttons {
      display:flex; justify-content:space-around;
      padding:10px; border-top:1px solid #555; background:rgba(0,0,0,0.5);
    }
    #command-buttons button {
      padding:8px 12px; background:#222; color:#eee; border:1px solid #555;
      cursor:pointer; font-size:14px;
    }
    #command-buttons button:hover { background:#333; }
    #hud {
      position:absolute; top:10px; left:10px;
      background:rgba(0,0,0,0.5); padding:8px 12px; border:1px solid #444;
      font-size:14px; z-index:11;
    }
    #sanity-bar-container {
      width:120px; height:10px; background:#222; border:1px solid #555;
      margin-top:4px; position:relative;
    }
    #sanity-bar {
      position:absolute; top:0; left:0; height:100%;
      background:#0f0; width:100%; transition:width 0.3s ease;
    }
    #inventory-display {
      position:absolute; bottom:10px; left:10px;
      background:rgba(0,0,0,0.5); padding:6px 10px; border:1px solid #444;
      font-size:12px; z-index:11;
    }
    #loadout-screen {
      position:fixed; top:0; left:0;
      width:100vw; height:100vh;
      background:rgba(0,0,0,0.9);
      display:none; justify-content:center; align-items:center;
      flex-direction:column; z-index:200;
    }
    #loadout-container {
      background:#111; padding:20px; border:1px solid #555;
      max-width:400px; width:90%; color:#eee;
    }
    #van-inventory, #held-items { margin-bottom:10px; }
    .item-button {
      background:#222; color:#eee; border:1px solid #555;
      padding:4px 6px; margin:2px; cursor:pointer; font-size:12px;
    }
    .item-button:hover { background:#333; }
    #confirm-loadout {
      margin-top:10px; padding:8px 12px; background:#111; color:#eee;
      border:1px solid #555; cursor:pointer;
    }
    #move-overlay {
      position:fixed; top:0; left:0;
      width:100vw; height:100vh;
      background:rgba(0,0,0,0.8);
      display:none; justify-content:center; align-items:center;
      flex-direction:column; z-index:250;
    }
    #move-options {
      background:#111; padding:20px; border:1px solid #444;
      max-height:70%; overflow-y:auto;
    }
    #move-options button {
      display:block; width:100%; margin:4px 0; padding:6px;
      background:#222; color:#eee; border:1px solid #555; cursor:pointer;
    }
    #move-options button:hover { background:#333; }
    #guess-popup {
      position:fixed; top:0; left:0;
      width:100vw; height:100vh;
      background:rgba(0,0,0,0.8);
      display:none; justify-content:center; align-items:center;
      z-index:300;
    }
    #guess-list {
      background:#111; padding:20px; border:1px solid #444;
      max-height:70%; overflow-y:auto;
    }
    #guess-list button {
      display:block; width:100%; margin:4px 0; padding:6px;
      background:#222; color:#eee; border:1px solid #555; cursor:pointer;
    }
    #guess-list button:hover { background:#333; }
    footer {
      position:fixed; bottom:0; width:100%; text-align:center;
      background:#111; color:#555; font-size:10px; padding:2px 0; z-index:500;
    }
  </style>
</head>
<body>
  <div id="title-screen">
    <img src="logo.png" alt="Phasma-Phoney Logo" />
    <button id="startButton">Start New Game</button>
  </div>
  <div id="main-scene">
    <div id="background"></div>
    <div id="rain-layer"></div>
    <div id="lightning"></div>
    <div id="foreground"></div>
    <canvas id="fog-layer"></canvas>
    <canvas id="orbCanvas"></canvas>
    <div id="hud">
      <div>Location: <span id="hud-location">Van</span> | Weather: <span id="hud-weather">--</span></div>
      <div>Turns: <span id="hud-turns">0</span></div>
      <div>Sanity:</div>
      <div id="sanity-bar-container"><div id="sanity-bar"></div></div>
      <div>Temp: <span id="hud-temp">--°C</span></div>
    </div>
    <div id="inventory-display">
      <div>Held:</div>
      <div id="held-items-display">None</div>
      <button id="return-van-btn">Return to Van</button>
    </div>
    <div id="narrator-ui">
      <div id="game-log"></div>
      <div id="command-buttons">
        <button data-cmd="move">Move</button>
        <button data-cmd="look">Look Around</button>
        <button data-cmd="use">Use Item</button>
        <button data-cmd="inventory">Inventory</button>
        <button data-cmd="guess">Ghost Guess</button>
      </div>
    </div>
  </div>
  <div id="loadout-screen">
    <div id="loadout-container">
      <h3>Select Your Starting Loadout (Max 3 Items)</h3>
      <div id="held-items"><strong>Holding:</strong> <div id="held-list"></div></div>
      <div id="van-inventory"><strong>Van Inventory:</strong> <div id="van-list"></div></div>
      <button id="confirm-loadout">Confirm</button>
    </div>
  </div>
  <div id="move-overlay"><div id="move-options"></div></div>
  <div id="guess-popup"><div id="guess-list"></div></div>
  <footer>Phasma‑Phoney v1.4.0 — Master Build</footer>
  <script>
    const allLoadoutItems=["EMF Reader","Spirit Box","Camera","UV Light","D.O.T.S Projector","Thermometer","Ghost Writing Book","Video Camera","Crucifix","Smudge Stick","Salt","Parabolic Microphone","Motion Sensor","Sound Sensor"];
    const possibleWeather=["Stormy","Rain","Clear","Foggy"];
    const game={ghost:null,ghostRoom:null,playerRoom:"Van",inventory:[],vanStock:[...allLoadoutItems],selectedEvidence:new Set(),currentTurn:0,sanity:100,mimicForm:null,nextMimicShift:0,huntCooldown:0,smudgeActive:0,weather:null};
    const ghostProfiles={Spirit:{evidence:["EMF Level 5","Spirit Box","Ghost Writing"],behavior:"Average activity, standard hunts."},Wraith:{evidence:["EMF Level 5","Spirit Box","D.O.T.S"],behavior:"Rarely touches ground, teleports to player."},Phantom:{evidence:["Spirit Box","Fingerprints","D.O.T.S"],behavior:"Looking at it drops sanity quickly."},Poltergeist:{evidence:["Spirit Box","Fingerprints","Ghost Writing"],behavior:"Throws multiple objects at once."},Banshee:{evidence:["Fingerprints","Orbs","D.O.T.S"],behavior:"Targets one player, shrieks on parabolic."},Jinn:{evidence:["EMF Level 5","Fingerprints","Freezing Temps"],behavior:"Fast when far, kills power to slow hunts."},Mare:{evidence:["Spirit Box","Ghost Writing","Orbs"],behavior:"Prefers darkness, more active with lights off."},Revenant:{evidence:["Ghost Writing","Orbs","Freezing Temps"],behavior:"Slow if not hunting, fast when hunting."},Shade:{evidence:["EMF Level 5","Ghost Writing","Freezing Temps"],behavior:"Shy, less active with multiple people."},Demon:{evidence:["Fingerprints","Ghost Writing","Freezing Temps"],behavior:"Very aggressive, hunts often, early."},Yurei:{evidence:["Orbs","Freezing Temps","D.O.T.S"],behavior:"Sanity drain on room close, smudge locks it."},Oni:{evidence:["EMF Level 5","Freezing Temps","D.O.T.S"],behavior:"Very active, throws objects often."},Hantu:{evidence:["Fingerprints","Orbs","Freezing Temps"],behavior:"Faster in cold, slower in warm areas."},Goryo:{evidence:["EMF Level 5","Fingerprints","D.O.T.S"],behavior:"Shows only on cameras, stays in ghost room."},Myling:{evidence:["EMF Level 5","Fingerprints","Ghost Writing"],behavior:"Quieter footsteps, more frequent sounds."},Onryo:{evidence:["Spirit Box","Orbs","Freezing Temps"],behavior:"Flame trigger, extinguishing fire can cause hunt."},TheTwins:{evidence:["EMF Level 5","Spirit Box","Freezing Temps"],behavior:"Different speeds, interacts in two spots."},Raiju:{evidence:["EMF Level 5","Orbs","D.O.T.S"],behavior:"Faster near electronics, disrupts devices."},Obake:{evidence:["EMF Level 5","Fingerprints","Orbs"],behavior:"Rare fingerprint types, shapeshifts visually."},TheMimic:{evidence:["Spirit Box","Fingerprints","Freezing Temps"],behavior:"Mimics other ghosts, shows fake orbs."},Moroi:{evidence:["Spirit Box","Ghost Writing","Freezing Temps"],behavior:"Curses players, drains sanity faster."},Deogen:{evidence:["Spirit Box","Ghost Writing","D.O.T.S"],behavior:"Knows your location, very slow near player."},Thaye:{evidence:["Orbs","Ghost Writing","D.O.T.S"],behavior:"Very active early, slows down over time."},Yokai:{evidence:["Spirit Box","Orbs","D.O.T.S"],behavior:"Talks more, hunts near voices."},Succubus:{evidence:["Spirit Box","Ghost Writing","Fingerprints"],behavior:"Targets males, drains sanity faster during interactions."}};
    const roomVisuals={Van:{N:"Van_N.png",S:"Van_S.png",E:"Van_E.png",W:"Van_W.png"},Foyer:{N:"Foyer_N.png",S:"Foyer_S.png",E:"Foyer_E.png",W:"Foyer_W.png"},"Living Room":{N:"LivingRoom_N.png",S:"LivingRoom_S.png",E:"LivingRoom_E.png",W:"LivingRoom_W.png"},Kitchen:{N:"Kitchen_N.png",S:"Kitchen_S.png",E:"Kitchen_E.png",W:"Kitchen_W.png"},"Dining Room":{N:"DiningRoom_N.png",S:"DiningRoom_S.png",E:"DiningRoom_E.png",W:"DiningRoom_W.png"},Garage:{N:"Garage_N.png",S:"Garage_S.png",E:"Garage_E.png",W:"Garage_W.png"},Basement:{N:"Basement_N.png",S:"Basement_S.png",E:"Basement_E.png",W:"Basement_W.png"},Bathroom:{N:"Bathroom_N.png",S:"Bathroom_S.png",E:"Bathroom_E.png",W:"Bathroom_W.png"},"Kids Bedroom":{N:"KidsBedroom_N.png",S:"KidsBedroom_S.png",E:"KidsBedroom_E.png",W:"KidsBedroom_W.png"},"Master Bedroom":{N:"MasterBedroom_N.png",S:"MasterBedroom_S.png",E:"MasterBedroom_E.png",W:"MasterBedroom_W.png"}};
    const mapConnections={Van:["Foyer"],Foyer:["Van","Living Room","Kitchen","Bathroom"],"Living Room":["Foyer","Dining Room","Garage","Kids Bedroom","Master Bedroom"],Kitchen:["Foyer","Dining Room"],"Dining Room":["Living Room","Kitchen","Basement"],Garage:["Living Room"],Basement:["Dining Room"],Bathroom:["Foyer"],"Kids Bedroom":["Living Room"],"Master Bedroom":["Living Room"]};
    const allRooms=Object.keys(roomVisuals);
    function randomFromArray(a){return a[Math.floor(Math.random()*a.length)];}
    function logToGame(t){const l=document.getElementById("game-log");const e=document.createElement("div");e.className="log-entry";e.textContent=t;l.appendChild(e);l.scrollTop=l.scrollHeight;setTimeout(()=>{e.classList.add("fade");},8000);}
    function updateSanityBar(){const b=document.getElementById("sanity-bar");b.style.width=game.sanity+"%";if(game.sanity>66)b.style.background="#0f0";else if(game.sanity>33)b.style.background="#ff0";else b.style.background="#f00";}
    function startTitleScreen(){document.getElementById("title-screen").style.display="flex";document.getElementById("main-scene").style.display="none";document.getElementById("loadout-screen").style.display="none";document.getElementById("narrator-ui").style.display="none";document.getElementById("move-overlay").style.display="none";game.playerRoom="Van";game.currentTurn=0;game.sanity=100;updateSanityBar();}
    document.getElementById("startButton").addEventListener("click",()=>{document.getElementById("title-screen").style.opacity="0";setTimeout(()=>{document.getElementById("title-screen").style.display="none";showLoadout();},2000);});
    let tempHeld=[],tempVan=[...allLoadoutItems];
    function showLoadout(){document.getElementById("loadout-screen").style.display="flex";renderLoadout();}
    function renderLoadout(){const h=document.getElementById("held-list"),v=document.getElementById("van-list");h.innerHTML="";v.innerHTML="";tempHeld.forEach(i=>{const b=document.createElement("button");b.textContent=i+" (Remove)";b.className="item-button";b.onclick=()=>{tempVan.push(i);tempHeld=tempHeld.filter(x=>x!==i);renderLoadout();};h.appendChild(b);});tempVan.forEach(i=>{const b=document.createElement("button");b.textContent=i+" (Add)";b.className="item-button";b.onclick=()=>{if(tempHeld.length<3){tempHeld.push(i);tempVan=tempVan.filter(x=>x!==i);renderLoadout();}else alert("You can only hold 3 items!");};v.appendChild(b);});}
    document.getElementById("confirm-loadout").addEventListener("click",()=>{game.inventory=[...tempHeld,"Notebook","Lighter"];game.vanStock=[...tempVan];document.getElementById("loadout-screen").style.display="none";startInvestigation();});
    function startInvestigation(){document.getElementById("main-scene").style.display="block";document.getElementById("narrator-ui").style.display="flex";game.weather=randomFromArray(possibleWeather);assignRandomGhost();assignRandomGhostRoom();logToGame("You are in the van. The weather outside is "+game.weather.toLowerCase()+"...");renderHUD();updateBackground();randomLightning();randomOrbs();}
    function assignRandomGhost(){const g=Object.keys(ghostProfiles);game.ghost=randomFromArray(g);if(game.ghost==="TheMimic")assignMimicForm();}
    function assignRandomGhostRoom(){const r=allRooms.filter(x=>x!=="Van");game.ghostRoom=randomFromArray(r);}
    function assignMimicForm(){const g=Object.keys(ghostProfiles).filter(x=>x!=="TheMimic");game.mimicForm=randomFromArray(g);game.nextMimicShift=game.currentTurn+Math.floor(Math.random()*4)+3;}
    function renderHUD(){document.getElementById("hud-location").textContent=game.playerRoom;document.getElementById("hud-weather").textContent=game.weather;document.getElementById("hud-turns").textContent=game.currentTurn;document.getElementById("held-items-display").textContent=game.inventory.join(", ");updateSanityBar();if(game.inventory.includes("Thermometer")&&game.playerRoom!=="Van"){const t=game.playerRoom===game.ghostRoom?(Math.random()<0.3?-5:2+Math.random()*3):15+Math.random()*5;document.getElementById("hud-temp").textContent=t.toFixed(1)+"°C";}else document.getElementById("hud-temp").textContent="--°C";}
    function updateBackground(d="N"){const v=roomVisuals[game.playerRoom]||roomVisuals["Van"];document.getElementById("background").style.backgroundImage=`url('${v[d]}')`;}
    document.querySelectorAll("#command-buttons button").forEach(b=>{b.addEventListener("click",()=>handleCommand(b.dataset.cmd));});
    function handleCommand(c){switch(c){case"move":openMoveOverlay();break;case"look":lookAround();break;case"use":useItemMenu();break;case"inventory":openVanSwap();break;case"guess":openGuess();break;}}
    function openMoveOverlay(){const o=mapConnections[game.playerRoom]||[],c=document.getElementById("move-options");c.innerHTML="";if(!o.length){logToGame("No available paths from here.");return;}o.forEach(r=>{const b=document.createElement("button");b.textContent="Go to "+r;b.onclick=()=>{document.getElementById("move-overlay").style.display="none";moveToRoom(r);};c.appendChild(b);});document.getElementById("move-overlay").style.display="flex";}
    function moveToRoom(r){game.playerRoom=r;game.currentTurn++;logToGame("You move to "+r+".");renderHUD();updateBackground();checkTurnEvents();}
    function lookAround(){game.currentTurn++;if(game.playerRoom===game.ghostRoom){logToGame("You feel an eerie presence here...");if(game.ghost==="TheMimic"||game.mimicForm==="TheMimic")logToGame("Through the camera, you notice strange ghost orbs flickering in and out...");}else logToGame("Nothing unusual here.");renderHUD();checkTurnEvents();}
    function useItemMenu(){if(!game.inventory.length){logToGame("You have no items to use.");return;}const c=prompt("Use which item? "+game.inventory.join(", "));if(c&&game.inventory.includes(c))useItem(c);else logToGame("Item use canceled or invalid.");}
    function useItem(i){switch(i){case"Smudge Stick":if(game.playerRoom===game.ghostRoom){game.smudgeActive=3;logToGame("You smudge the room, calming the ghost temporarily.");if(game.ghost==="Yurei")logToGame("The Yurei seems locked in place for a while.");}else logToGame("You smudge, but nothing happens.");break;case"Crucifix":if(game.playerRoom===game.ghostRoom)logToGame("You place the crucifix; it should prevent hunts nearby.");else logToGame("You place the crucifix, but this isn't the ghost room.");break;default:logToGame("You use the "+i+", but nothing significant happens.");}game.currentTurn++;renderHUD();checkTurnEvents();}
    document.getElementById("return-van-btn").addEventListener("click",()=>{if(game.playerRoom!=="Van"){logToGame("You need to be in the van to swap items.");return;}tempHeld=game.inventory.filter(i=>i!=="Notebook"&&i!=="Lighter");tempVan=game.vanStock;showVanSwap();});
    function showVanSwap(){document.getElementById("loadout-screen").style.display="flex";renderLoadout();}
    function openGuess(){const p=document.getElementById("guess-popup"),l=document.getElementById("guess-list");l.innerHTML="";Object.keys(ghostProfiles).forEach(g=>{const b=document.createElement("button");b.textContent=g;b.onclick=()=>{makeGuess(g);closeGuess();};l.appendChild(b);});p.style.display="flex";}
    function closeGuess(){document.getElementById("guess-popup").style.display="none";}
    function makeGuess(g){if(g===game.ghost)logToGame("Correct! The ghost was indeed "+g+"!");else logToGame("Wrong. The ghost was "+game.ghost+".");setTimeout(()=>{alert("Game Over. Returning to title.");startTitleScreen();},2000);}
    function checkTurnEvents(){if(game.ghost==="TheMimic"&&game.currentTurn>=game.nextMimicShift){assignMimicForm();logToGame("You sense a change in ghost behavior...");}if(game.playerRoom===game.ghostRoom&&Math.random()<0.4)game.sanity-=3+Math.random()*3;else game.sanity-=1;if(game.sanity<0)game.sanity=0;updateSanityBar();attemptHunt();}
    function attemptHunt(){if(game.smudgeActive>0){game.smudgeActive--;return;}if(game.huntCooldown>0){game.huntCooldown--;return;}if(game.sanity<30&&Math.random()<0.25)startHunt();}
    function startHunt(){logToGame("The ghost is hunting!");flashRed();if(game.playerRoom===game.ghostRoom&&!game.inventory.includes("Crucifix")){setTimeout(()=>{alert("The ghost caught you. You died.");startTitleScreen();},2000);}else logToGame("You survive the hunt.");game.huntCooldown=5;}
    function flashRed(){const l=document.getElementById("lightning");l.style.background="red";l.style.opacity=0.5;setTimeout(()=>{l.style.opacity=0;},500);}
    function randomLightning(){setTimeout(()=>{const l=document.getElementById("lightning");l.style.background="white";l.style.opacity=0.8;setTimeout(()=>{l.style.opacity=0;},200);randomLightning();},Math.random()*8000+4000);}
    function randomOrbs(){const c=document.getElementById("orbCanvas"),x=c.getContext("2d");c.width=window.innerWidth;c.height=window.innerHeight;let o=[];function spawn(){if(o.length<10){o.push({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*3+2,alpha:Math.random(),fade:Math.random()*0.02+0.005});}}function animate(){x.clearRect(0,0,c.width,c.height);for(let i=0;i<o.length;i++){const b=o[i];b.alpha+=b.fade;if(b.alpha<=0||b.alpha>=1)b.fade*=-1;b.y-=0.2;x.beginPath();x.arc(b.x,b.y,b.r,0,Math.PI*2);x.fillStyle="rgba(255,255,255,"+b.alpha+")";x.fill();if(b.y<-10)o.splice(i,1);}requestAnimationFrame(animate);}setInterval(spawn,2000);animate();}
    window.addEventListener("resize",()=>{const c=document.getElementById("orbCanvas");c.width=window.innerWidth;c.height=window.innerHeight;});
    document.addEventListener("DOMContentLoaded",()=>{startTitleScreen();});
  </script>
</body>
</html>
