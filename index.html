function openVanMonitor() {

    alignItems: "center",

  });
  document.body.appendChild(monitor);

  if (!vanMonitorBooted) {
    vanMonitorBooted = true;
    runVanBootSequence(monitor);
  } else {
    renderCameraGrid(monitor);
  }
}

function runVanBootSequence(monitor) {

  const lines = [
    ">C:/boot ghost.os",
    "Loading modules...",
    "Initializing ghost detection services...",
    "Connecting to spectral network...",
    "Starting Phasma‑Phoney Monitoring Service..."
  ];

  let i = 0;
  let progress = 0;
  const bootText = document.getElementById("boot-text");
  const bootBar = document.getElementById("boot-bar");

  function addLine() {
    if (i < lines.length) {
      bootText.innerHTML += `<div>${lines[i++]}</div>`;
      progress += 100 / lines.length;
      bootBar.style.width = progress + "%";
      setTimeout(addLine, 700 + Math.random() * 400);
    } else {
      setTimeout(() => showLogin(monitor), 1000);
    }
  }
  addLine();
}

function showLogin(monitor) {
  monitor.innerHTML = `
    <div style="
      background:#111;
      padding:20px;
      border:2px solid #0f0;
      width:300px;
      text-align:left;
      box-shadow:0 0 12px #0f0;">

  `;

  const output = document.getElementById("login-output");
  const username = "sharkvelocity";
  const password = "********";
  let step = 0;

  function typeLogin() {
    if (step === 0) {
      output.innerHTML += `<div>Username: <span id="user-type"></span></div>`;
      autoType("user-type", username, () => {
        step = 1;
        setTimeout(typeLogin, 500);
      });
    } else if (step === 1) {
      output.innerHTML += `<div>Password: <span id="pass-type"></span></div>`;
      autoType("pass-type", password, () => {
        setTimeout(() => {
          output.innerHTML += `<div>Access Granted.</div>`;
          setTimeout(() => renderCameraGrid(monitor), 800);
        }, 400);
      }, 150);
    }
  }
  typeLogin();
}

function autoType(elementId, text, callback, delay = 100) {
  const el = document.getElementById(elementId);
  let i = 0;
  function type() {
    if (i < text.length) {
      el.textContent += text[i++];
      setTimeout(type, delay);
    } else if (callback) callback();
  }
  type();
}

/* ✅ Unified version: now uses nosignal.gif & orbs */
function generateCameraFeeds() {
  const rooms = Object.keys(roomVisuals).filter(r => r !== "Van");

  return rooms.slice(0, 4).map(r => {
    const hasCameraInRoom =
      (game.roomItems[r] || []).includes("Video Camera") ||
      (game.roomItems[r] || []).includes("Camera");

    let imgSrc = "nosignal.gif";  // ✅ GIF for inactive
    let label = "NO SIGNAL";

    if (hasCameraInRoom) {
      imgSrc = roomVisuals[r].N;
      label = `${r} — ACTIVE`;
      if (r === game.ghostRoom) {
        if (game.ghost === "TheMimic" || game.mimicForm === "TheMimic") {
          label = `${r} — FAKE ORBS DETECTED`;
        } else if (ghostProfiles[game.ghost].evidence.includes("Orbs")) {
          label = `${r} — ORBS DETECTED`;
        }
      }
    }

    return `
      <div class="camera-feed" data-room="${r}" style="
        position:relative;
        background:#000;
        border:1px solid #0f0;
        overflow:hidden;
        cursor:pointer;"
        onclick="openCameraFullscreen('${r}','${imgSrc}','${label}')">
        <img id="camera-img-${r}" src="${imgSrc}" alt="${r}" style="
          width:100%;
          height:100%;
          object-fit:cover;
          filter:contrast(1.2) brightness(0.8) saturate(0.7);">
        <canvas id="camera-orbs-${r}" style="
          position:absolute;
          top:0;left:0;
          width:100%;
          height:100%;
          pointer-events:none;"></canvas>
        <div id="camera-label-${r}" style="
          position:absolute;
          bottom:0;
          width:100%;
          text-align:center;
          font-size:11px;
          background:rgba(0,0,0,0.5);
          color:#0f0;">${label}</div>
      </div>`;
  }).join("");
}

function updateCameraFeeds() {
  const rooms = Object.keys(roomVisuals).filter(r => r !== "Van");
  rooms.slice(0, 4).forEach(r => {
    const img = document.getElementById(`camera-img-${r}`);
    const label = document.getElementById(`camera-label-${r}`);
    if (!img || !label) return;

    const hasCameraInRoom =
      (game.roomItems[r] || []).includes("Video Camera") ||
      (game.roomItems[r] || []).includes("Camera");

    if (!hasCameraInRoom) {
      img.src = "nosignal.gif";  // ✅ Animated offline feed
      label.textContent = "NO SIGNAL";
      return;
    }

    img.src = roomVisuals[r].N;
    if (r === game.ghostRoom) {
      if (game.ghost === "TheMimic" || game.mimicForm === "TheMimic") {
        label.textContent = `${r} — FAKE ORBS DETECTED`;
      } else if (ghostProfiles[game.ghost].evidence.includes("Orbs")) {
        label.textContent = `${r} — ORBS DETECTED`;
      } else {
        label.textContent = `${r} — ACTIVE`;
      }
    } else {
      label.textContent = `${r} — ACTIVE`;
    }
  });
}

function renderCameraGrid(monitor) {
  monitor.innerHTML = `
    <h3 style="color:#0f0;margin-top:0;">Camera Feed</h3>
    <div id="camera-grid" style="
      display:grid;
      grid-template-columns:repeat(2,200px);
      grid-template-rows:repeat(2,150px);
      gap:8px;
      justify-content:center;
      align-items:center;
      margin:10px auto;">
      ${generateCameraFeeds()}

      padding:6px 12px;
      background:#111;
      color:#0f0;
      border:1px solid #0f0;
      cursor:pointer;"
      onclick="closeVanMonitor()">Close Monitor</button>
  `;
  if (vanMonitorInterval) clearInterval(vanMonitorInterval);
  vanMonitorInterval = setInterval(updateCameraFeeds, 1000);
  animateAllCameraOrbs();
}

function closeVanMonitor() {
  const monitor = document.getElementById("van-monitor");
  if (monitor) document.body.removeChild(monitor);
  if (vanMonitorInterval) clearInterval(vanMonitorInterval);
}

/* === Orb Animation === */
function drawCameraOrbs(room) {
  const canvas = document.getElementById(`camera-orbs-${room}`);
  if (!canvas) return;
  const ctx = canvas.getContext("2d");

  canvas.width = canvas.offsetWidth;
  canvas.height = canvas.offsetHeight;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const active =
    (game.roomItems[room] || []).includes("Video Camera") &&
    (room === game.ghostRoom &&
      (ghostProfiles[game.ghost].evidence.includes("Orbs") ||
        game.ghost === "TheMimic" || game.mimicForm === "TheMimic"));

  if (!active) return;

  for (let i = 0; i < 6; i++) {
    const x = Math.random() * canvas.width;
    const y = Math.random() * canvas.height;
    const size = 1.5 + Math.random() * 3;
    const opacity = 0.15 + Math.random() * 0.4;
    ctx.beginPath();
    ctx.arc(x, y, size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(0,255,0,${opacity})`;
    ctx.fill();
  }
}

function animateAllCameraOrbs() {
  const rooms = Object.keys(roomVisuals).filter(r => r !== "Van");
  rooms.slice(0, 4).forEach(r => drawCameraOrbs(r));
  requestAnimationFrame(animateAllCameraOrbs);
}

// === ROLLING MIST FOG SYSTEM ===
const fogCanvas = document.getElementById("fog-layer");
const fogCtx = fogCanvas.getContext("2d");
let fogParticles = [];

function initFog() {
  fogCanvas.width = window.innerWidth;
  fogCanvas.height = window.innerHeight;
  fogParticles = [];

  for (let i = 0; i < 20; i++) {
    fogParticles.push({
      x: Math.random() * fogCanvas.width,
      y: Math.random() * fogCanvas.height,
      radius: 300 + Math.random() * 200,
      speedX: -0.05 + Math.random() * 0.1,
      speedY: -0.03 + Math.random() * 0.06,
      opacity: 0.05 + Math.random() * 0.08
    });
  }
}

function animateFog() {
  fogCtx.clearRect(0, 0, fogCanvas.width, fogCanvas.height);

  if (game.weather === "Foggy") {
    fogParticles.forEach(p => {
      fogCtx.beginPath();
      const gradient = fogCtx.createRadialGradient(p.x, p.y, p.radius * 0.2, p.x, p.y, p.radius);
      gradient.addColorStop(0, `rgba(200,200,200,${p.opacity})`);
      gradient.addColorStop(1, "rgba(200,200,200,0)");
      fogCtx.fillStyle = gradient;
      fogCtx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      fogCtx.fill();

      p.x += p.speedX;
      p.y += p.speedY;
      if (p.x > fogCanvas.width + p.radius) p.x = -p.radius;
      if (p.x < -p.radius) p.x = fogCanvas.width + p.radius;
      if (p.y > fogCanvas.height + p.radius) p.y = -p.radius;
      if (p.y < -p.radius) p.y = fogCanvas.height + p.radius;
    });
  }

  requestAnimationFrame(animateFog);
}

// ✅ Re-init fog on resize
window.addEventListener("resize", () => initFog());

  game.currentTurn++;

    const items = game.roomItems[game.playerRoom] || [];

    if (items.includes("Salt") && Math.random() < 0.5) {

            game.roomItems[game.playerRoom].filter(x => x !== "Footprints");
          logToGame("The footprints have faded."); saveGame(true);

    if (game.ghost === "Onryo" && items.includes("Candle") && Math.random() < 0.5) {
      game.roomItems[game.playerRoom] = items.filter(x => x !== "Candle");
      logToGame("The flame suddenly extinguishes!");

/***********************

************************/
function checkTurnEvents() {
  if (game.ghost === "TheMimic" && game.currentTurn >= game.nextMimicShift) {
    assignMimicForm();
    game.nextMimicShift = game.currentTurn + 3 + Math.floor(Math.random() * 4);
    logToGame("The Mimic shifts behavior...");
  }

  if (game.playerRoom === game.ghostRoom) {
    game.sanity -= 3 + Math.random() * 3;
    if (game.currentTurn % 2 === 0 && Math.random() < 0.3) {
      const g = (game.ghost === "TheMimic" ? game.mimicForm : game.ghost);
      logToGame("[Ambient] " + (ghostProfiles[g].behavior || "The air feels heavy..."));
    }
  } else {
    game.sanity -= 1;
  }

  Object.keys(game.roomItems).forEach(r => {
    if (!game.roomItems[r]?.includes("Motion Sensor")) return;
    if (Math.random() < 0.25) {
      if (game.playerRoom === "Van") {
        logToGame("[Van Monitor] Motion detected in " + r + "!");
      } else if (game.playerRoom === r) {
        logToGame("You hear the motion sensor *beep* nearby.");
      } else if (mapConnections[game.playerRoom]?.includes(r) && Math.random() < 0.4) {
        logToGame("You faintly hear a muffled *beep* through the walls...");
      }
    }
  });

  game.sanity = Math.max(0, game.sanity);
  updateSanityBar();
  attemptHunt();
}

************************/
function attemptHunt() {
  if (game.smudgeActive > 0) { game.smudgeActive--; return; }
  if (game.huntCooldown > 0) { game.huntCooldown--; return; }
  if (game.ghost === "Onryo" && Object.values(game.roomItems).some(a => a.includes("Candle"))) return;
  if (game.sanity < 30 && Math.random() < 0.25) startHunt();
}

function startHunt() {
  logToGame("💀 The ghost is hunting!");
  flashRed();
  logToGame("You hear your heartbeat pounding as the ghost searches...");

  if (game.playerRoom === game.ghostRoom) {
    if (game.placedCrucifix && game.placedCrucifix[game.playerRoom] > 0) {
      game.placedCrucifix[game.playerRoom]--;
      if (game.placedCrucifix[game.playerRoom] === 0) {
        delete game.placedCrucifix[game.playerRoom];
        logToGame("The crucifix has burned away completely.");
      } else {
        logToGame(`The crucifix burns, stopping the hunt. (${game.placedCrucifix[game.playerRoom]} uses left)`);
      }
    } else {
      setTimeout(playerDeath, 1500);
    }
  } else {
    logToGame("You survived the hunt...");
  }

  const aggressiveGhosts = ["Demon", "Oni", "Raiju", "Moroi"];
  game.huntCooldown = aggressiveGhosts.includes(game.ghost)
    ? 3 + Math.floor(Math.random() * 2)
    : 5 + Math.floor(Math.random() * 3);
}

    l.style.opacity = 0.6 + Math.random() * 0.2;
    setTimeout(() => {
      l.style.opacity = 0; count++;
      setTimeout(pulse, 150 + Math.random() * 200);
    }, 150 + Math.random() * 100);
  }
  pulse();
}

  } else {
    game.roomItems[game.playerRoom] = game.roomItems[game.playerRoom] || [];
    if (!game.roomItems[game.playerRoom].includes(i))
      game.roomItems[game.playerRoom].push(i);
    logToGame(`Dropped ${i} here.`);

  game.inventory = game.inventory.filter(x => x !== i);
  renderHUD();

function pickItem(i) {
  // ✅ Don't count Notebook/Lighter toward 3-item limit
  const carryableItems = game.inventory.filter(
    x => x !== "Notebook" && x !== "Lighter"
  );

  if (carryableItems.length >= 3) {
    logToGame("Max 3 investigation items (Notebook & Lighter excluded).");
    return;

  if (cursedItems[i] && i === "Summoning Circle") {
    logToGame("The circle cannot be moved.");
    return;
  }

  game.roomItems[game.playerRoom] =
    game.roomItems[game.playerRoom].filter(x => x !== i);

  if (!game.inventory.includes(i)) {
    game.inventory.push(i);
    game.inventory.sort();
  }

  logToGame(`Picked up ${i}.`);
  renderHUD();
  saveGame(true);
}

        }
      }
      break;

    case "Parabolic Microphone":
      if (game.playerRoom !== "Van") {
        if (game.playerRoom === game.ghostRoom && Math.random() < 0.5) {
          logToGame("You pick up strange whispers on the parabolic mic...");
        } else {
          logToGame("No significant sound detected.");
        }
      } else {
        logToGame("Cannot use parabolic mic in van.");
      }
      break;

    case "Thermometer":
      if (game.playerRoom !== "Van") {
        if (game.playerRoom === game.ghostRoom) {
          const temp = Math.random() < 0.4 ? -4 + Math.random() * 2 : 5 + Math.random() * 3;
          logToGame(`Thermometer reading: ${temp.toFixed(1)}°C`);
          if (temp <= 0) game.selectedEvidence.add("Freezing Temps");
        } else {
          logToGame(`Thermometer reading: ${(15 + Math.random() * 5).toFixed(1)}°C`);
        }
      } else {
        logToGame("No reason to check temperature in van.");
      }
      break;

    // === Cameras & Orbs ===
    case "Camera":
    case "Video Camera":
      if (game.playerRoom !== "Van") {
        game.roomItems[game.playerRoom] = game.roomItems[game.playerRoom] || [];
        if (!game.roomItems[game.playerRoom].includes("Video Camera")) {
          game.roomItems[game.playerRoom].push("Video Camera");
          logToGame("You set up a video camera in this room.");
          game.inventory = game.inventory.filter(x => x !== i);
        } else {
          logToGame("A camera is already set up here.");
        }
      } else {
        logToGame("Cannot place cameras in the van.");
      }
      break;

    // === EMF & Spirit Box ===
    case "EMF Reader":
      if (game.playerRoom !== "Van") {
        if (game.playerRoom === game.ghostRoom && Math.random() < 0.5) {
          logToGame("The EMF Reader spikes to Level 5!");
          game.selectedEvidence.add("EMF Level 5");
        } else {
          logToGame("EMF shows no significant reading.");
        }
      } else {
        logToGame("No EMF readings in the van.");
      }
      break;

    case "Spirit Box":
      if (game.playerRoom !== "Van") {
        if (game.playerRoom === game.ghostRoom && Math.random() < 0.5) {
          logToGame(`The Spirit Box crackles: "${Math.random() < 0.5 ? 'Leave...' : 'Behind you...'}"`);
          game.selectedEvidence.add("Spirit Box");
        } else {
          logToGame("Spirit Box stays silent.");
        }
      } else {
        logToGame("Too far from the ghost to use the Spirit Box.");
      }
      break;

    // === UV Light & D.O.T.S ===
    case "UV Light":
      if (game.roomItems[game.playerRoom]?.includes("Footprints") || Math.random() < 0.3) {
        logToGame("You see glowing fingerprints or footprints under UV!");
        game.selectedEvidence.add("Fingerprints");
      } else {
        logToGame("No visible prints under UV.");
      }
      break;

    case "D.O.T.S Projector":
      if (game.playerRoom !== "Van") {
        if (game.playerRoom === game.ghostRoom && Math.random() < 0.4) {
          logToGame("A faint shadow flickers across the D.O.T.S grid!");
          game.selectedEvidence.add("D.O.T.S");
        } else {
          logToGame("No movement detected in D.O.T.S grid.");
        }
      } else {
        logToGame("D.O.T.S cannot be placed in van.");
      }
      break;

    // === Ghost Writing ===
    case "Ghost Writing Book":
      if (game.playerRoom !== "Van") {
        if (game.playerRoom === game.ghostRoom && Math.random() < 0.5) {
          logToGame("The ghost has written in the book!");
          game.selectedEvidence.add("Ghost Writing");
        } else {
          logToGame("The book remains empty.");
        }
      } else {
        logToGame("Notebook just for notes, not evidence.");
      }
      break;

    // === Notebook (Cheat Sheet) ===
    case "Notebook":
      openNotebook();
      break;

    default:
      if (cursedItems[i]) {
        handleCursedItem(i);
      } else {
        logToGame(`You use the ${i}, but nothing significant occurs.`);
      }
  }

  game.currentTurn++;
  renderHUD();
  checkTurnEvents();
  saveGame(true);
}

function handleCursedItem(i) {
  if (game.usedCursedItems[i]) {
    logToGame(`The ${i} is inert now.`);
    return;
  }

  logToGame(`You use the ${i}...`);
  game.sanity -= getCursedItemCost(i);
  if (game.sanity < 0) game.sanity = 0;
  updateSanityBar();
  logToGame(`Sanity now at ${Math.floor(game.sanity)}%.`);

  switch (i) {
    case "Ouija Board":
      logToGame("The board moves by itself, letters slowly spelling words...");
      if (Math.random() < 0.2) {
        logToGame("The planchette flies violently across the board!");
        startHunt();
      }
      break;

    case "Tarot Cards":
      const r = Math.random();
      if (r < 0.15) {
        logToGame("The Fool — nothing happens.");
      } else if (r < 0.3) {
        logToGame("The Tower — ghost activity spikes!");
      } else if (r < 0.45) {
        logToGame("The Moon — your sanity drops sharply.");
        game.sanity = Math.max(0, game.sanity - 25);
        updateSanityBar();
      } else if (r < 0.6) {
        logToGame("The Death card — the ghost begins hunting!");
        startHunt();
      } else if (r < 0.8) {
        logToGame("The Devil — ghost becomes aggressive for a while!");
        game.huntCooldown = 1; // very short cooldown
      } else {
        logToGame("The Sun — a warm light fills you, sanity restored.");
        game.sanity = Math.min(100, game.sanity + 25);
        updateSanityBar();
      }
      break;

    case "Music Box":
      logToGame("A soft, eerie melody plays... the ghost is drawn to it.");
      if (Math.random() < 0.4) startHunt();
      break;

    case "Haunted Mirror":
      logToGame("You glimpse a distorted reflection... a room you haven’t visited?");
      if (Math.random() < 0.3) startHunt();
      break;

    case "Summoning Circle":
      logToGame("You light the circle... the flames roar! The ghost manifests violently.");
      startHunt();
      break;

    case "Monkey Paw":
      if (Math.random() < 0.5) {
        logToGame("The paw curls, granting your wish... but you feel cursed.");
        if (Math.random() < 0.5) {
          logToGame("Your wish backfires! The ghost starts hunting.");
          startHunt();
        } else {
          logToGame("Your wish succeeds. Sanity restored.");
          game.sanity = Math.min(100, game.sanity + 20);
          updateSanityBar();
        }
      } else {
        logToGame("The paw remains still, as if judging you.");
      }
      break;
  }

  game.usedCursedItems[i] = true;
  saveGame(true);
}

/***********************
 === Save/Load Block ===
************************/
function saveGame() {
  try {
    const saveData = {
      ghost: game.ghost,
      ghostRoom: game.ghostRoom,
      playerRoom: game.playerRoom,
      playerDirection: game.playerDirection,
      inventory: game.inventory,
      vanStock: game.vanStock,
      selectedEvidence: Array.from(game.selectedEvidence),
      currentTurn: game.currentTurn,
      sanity: game.sanity,
      weather: game.weather,
      mimicForm: game.mimicForm,
      nextMimicShift: game.nextMimicShift,
      cameraActive: game.cameraActive,
      huntCooldown: game.huntCooldown,
      smudgeActive: game.smudgeActive,
      placedCrucifix: game.placedCrucifix,
      roomItems: game.roomItems,
      usedCursedItems: game.usedCursedItems
    };
    localStorage.setItem("phasmaPhoneySave", JSON.stringify(saveData));
    showSaveIndicator();
  } catch (e) {
    console.error("Save failed:", e);
    logToGame("⚠️ Save failed.");
  }
}

function showSaveIndicator() {
  const ind = document.getElementById("save-indicator");
  if (!ind) return;
  ind.style.display = "block";
  ind.style.opacity = "1";
  setTimeout(() => { ind.style.opacity = "0.3"; }, 300);
  setTimeout(() => { ind.style.display = "none"; }, 1000);
}

function loadGame() {
  const data = localStorage.getItem("phasmaPhoneySave");
  if (!data) {
    logToGame("⚠ No save data found.");
    return;
  }

  try {
    const s = JSON.parse(data);
    Object.assign(game, s);

    // ✅ Ensure all critical properties exist even if missing in old saves
    game.selectedEvidence = new Set(s.selectedEvidence || []);
    game.placedCrucifix = s.placedCrucifix || {};
    game.roomItems = s.roomItems || {};
    game.usedCursedItems = s.usedCursedItems || {};

    logToGame("📂 Game loaded. Resuming investigation...");

    // ✅ Show the investigation UI
    document.getElementById("title-screen").style.display = "none";
    document.getElementById("loadout-screen").style.display = "none";
    document.getElementById("main-scene").style.display = "block";
    document.getElementById("narrator-ui").style.display = "flex";

    // ✅ Refresh HUD & action buttons
    renderHUD();
    updateBackground();
    renderActionButtons();

    // ✅ Save snapshot immediately (keeps state updated if older saves are missing new data)
    saveGame(true);
  } catch (e) {
    console.error("Load failed:", e);
    logToGame("⚠ Load failed. Starting new game...");
    localStorage.removeItem("phasmaPhoneySave");
    resetGame();
    showLoadout();
  }
}

function clearSave() {
  localStorage.removeItem("phasmaPhoneySave");
  logToGame("🗑️ Save data cleared.");
}


/***********************
 === GHOST GUESS SYSTEM ===
************************/
function openGuess() {
  const popup = document.getElementById("guess-popup");
  const list = document.getElementById("guess-list");
  list.innerHTML = "<h3 style='color:#0ff;margin-top:0;'>Select the Ghost</h3>";

  Object.keys(ghostProfiles).forEach(g => {
    const btn = document.createElement("button");
    Object.assign(btn.style, {
      display: "block",
      width: "100%",
      margin: "4px 0",
      padding: "6px",
      background: "#222",
      color: "#eee",
      border: "1px solid #555",
      cursor: "pointer"
    });
    btn.textContent = g;
    btn.onmouseenter = () => (btn.style.background = "#333");
    btn.onmouseleave = () => (btn.style.background = "#222");
    btn.onclick = () => {
      makeGuess(g);
      closeGuess();
    };
    list.appendChild(btn);
  });

  const closeBtn = document.createElement("button");
  Object.assign(closeBtn.style, {
    marginTop: "8px",
    padding: "6px 12px",
    background: "#111",
    color: "#aaa",
    border: "1px solid #444",
    cursor: "pointer"
  });
  closeBtn.textContent = "Close";
  closeBtn.onclick = closeGuess;
  list.appendChild(closeBtn);

  popup.style.display = "flex";
}

function closeGuess() {
  document.getElementById("guess-popup").style.display = "none";
}

function makeGuess(guess) {
  if (!game.ghost) {
    logToGame("⚠️ No active ghost to guess yet!");
    return;
  }

  if (guess === game.ghost) {
    logToGame(`✅ Correct! The ghost was ${guess}.`);
    alert(`You WON! The ghost was ${guess}.`);
  } else {
    logToGame(`❌ Wrong! The ghost was ${game.ghost}.`);
    alert(`Game Over. The ghost was ${game.ghost}.`);
  }

  // Reset and return to loadout after guess
  resetGame();
  showLoadout();
}

/***********************
 === COMMAND HANDLER ===
************************/
function handleCommand(cmd) {
  switch (cmd) {
    case "move":
      openMoveOverlay();
      break;
    case "look":
      lookAround();
      break;
    case "inventory":
      openInventoryOverlay();
      break;
    case "guess":
      openGuess();
      break;
  case "van":
  if (game.playerRoom !== "Van") {
    moveToRoom("Van");
    logToGame("You return to the van.");
  } else {
    openVanMonitor(); // ✅ Opens the camera feed
  }
  break;

    case "save":
      saveGame(true);
      break;
    case "load":
      loadGame();
      break;
    default:
      logToGame("⚠️ Unknown command: " + cmd);
  }
}

/***********************
 === ACTION BUTTONS ===
************************/
function renderActionButtons() {
  const cmd = document.getElementById("command-buttons");
  cmd.innerHTML = `
    <button data-cmd="move">Move</button>
    <button data-cmd="look">Look Around</button>
    <button data-cmd="inventory">Inventory</button>
    <button data-cmd="guess">Ghost Guess</button>
    <button data-cmd="van">Return to Van</button>
    <button data-cmd="save">Save Game</button>
    <button data-cmd="load">Load Game</button>
  `;
}

/***********************
 === LOADOUT SELECTION ===
************************/
function showLoadout() {
  tempHeld = [];
  tempVan = [...allLoadoutItems];

  const heldList = document.getElementById("held-list");
  const vanList = document.getElementById("van-list");
  const confirmBtn = document.getElementById("confirm-loadout");

function renderLoadout() {
  heldList.innerHTML = tempHeld
    .map(i => `<button class="item-button selected" onclick="removeHeldItem('${i}')">${i}</button>`)
    .join("");

  vanList.innerHTML = tempVan
    .map(i => `<button class="item-button" onclick="addHeldItem('${i}')">${i}</button>`)
    .join("");

  // ✅ You must hold at least 1 investigation item to start
  if (tempHeld.length > 0) {
    confirmBtn.classList.add("active");
    confirmBtn.disabled = false;
  } else {
    confirmBtn.classList.remove("active");
    confirmBtn.disabled = true;
  }
}

window.addHeldItem = function (item) {
  // ✅ Exclude Notebook and Lighter from the 3-item limit
  const carryableHeld = tempHeld.filter(
    x => x !== "Notebook" && x !== "Lighter"
  );

  if (carryableHeld.length >= 3) {
    logToGame("⚠️ You can only hold 3 items (Notebook & Lighter excluded).");
    return;
  }

  tempHeld.push(item);
  tempVan = tempVan.filter(v => v !== item);
  renderLoadout();
};

window.removeHeldItem = function (item) {
  tempVan.push(item);
  tempHeld = tempHeld.filter(h => h !== item);
  renderLoadout();
};

renderLoadout();
document.getElementById("loadout-screen").style.display = "flex";


/***********************
 === DOMContentLoaded ===
************************/
document.addEventListener("DOMContentLoaded", () => {
  // ✅ Reset game state at startup
  resetGame();

  // ✅ Initialize Fog System (so rolling mist is ready if needed)
  initFog();
  animateFog();

  const startBtn = document.getElementById("startButton");
  const confirmBtn = document.getElementById("confirm-loadout");
  const commandContainer = document.getElementById("command-buttons");

  // ✅ Start Button → Title → Loadout
  startBtn.addEventListener("click", () => {
    if (startBtn.disabled) return;
    startBtn.disabled = true;
    const t = document.getElementById("title-screen");
    t.style.opacity = "0";
    setTimeout(() => {
      t.style.display = "none";
      showLoadout();
    }, 1500);
  });

  // ✅ Confirm Loadout → Start Investigation
  confirmBtn.addEventListener("click", () => {
    if (confirmBtn.disabled || !confirmBtn.classList.contains("active")) {
      logToGame("⚠️ Select at least one item before confirming.");
      return;
    }
    confirmBtn.disabled = true;

    if (!Array.isArray(tempHeld)) tempHeld = [];
    if (!Array.isArray(tempVan)) tempVan = [...allLoadoutItems];

    game.inventory = [...tempHeld, "Notebook", "Lighter"];
    game.vanStock = [...tempVan];

    document.getElementById("loadout-screen").style.display = "none";
    startInvestigation();
    renderActionButtons();
    saveGame(true);

    setTimeout(() => {
      confirmBtn.disabled = false;
    }, 1500);
  });

  // ✅ Handle All Action Buttons
  commandContainer.addEventListener("click", (e) => {
    if (e.target.tagName === "BUTTON" && e.target.dataset.cmd) {
      handleCommand(e.target.dataset.cmd);
    }
  });

  // ✅ Auto Resume if Save Exists (No Escaping Your Mistakes)
  if (localStorage.getItem("phasmaPhoneySave")) {
    loadGame();
  }

  // ✅ Auto Save on Close or Refresh
  window.addEventListener("beforeunload", () => saveGame(true));
});
}
</script>
