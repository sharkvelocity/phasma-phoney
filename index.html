<script>
"use strict";

/***********************
 === VAN MONITOR BOOT SYSTEM (v2.9 Master Build) ===
************************/
let vanMonitorBooted = false;

function openVanMonitor() {
  if (document.getElementById("van-monitor")) return;
  const monitor = document.createElement("div");
  monitor.id = "van-monitor";
  Object.assign(monitor.style, {
    position: "fixed", top: "10%", left: "10%",
    width: "80%", height: "80%", background: "#000",
    border: "2px solid #0f0", color: "#0f0",
    fontFamily: "monospace", fontSize: "16px",
    padding: "10px", zIndex: "4000",
    overflow: "hidden", boxShadow: "0 0 15px #0f0 inset"
  });
  document.body.appendChild(monitor);

  if (!vanMonitorBooted) {
    vanMonitorBooted = true;
    runVanBootSequence(monitor);
  } else {
    renderCameraGrid(monitor);
  }
}

function runVanBootSequence(monitor) {
  let lines = [
    ">C:/boot ghost.os",
    "Loading modules [##########] 100%",
    "Starting Phasma‑Phoney Monitoring Service...",
    "Initializing Camera System...",
    "Connecting to ghost network..."
  ];
  let i = 0;
  function addLine() {
    if (i < lines.length) {
      monitor.innerHTML += `<div>${lines[i++]}</div>`;
      setTimeout(addLine, 800);
    } else {
      setTimeout(() => showLogin(monitor), 1000);
    }
  }
  addLine();
}

function showLogin(monitor) {
  monitor.innerHTML += `<br><div>Login: sharkvelocity</div>`;
  let dots = "";
  let interval = setInterval(() => {
    dots += "•";
    monitor.innerHTML = monitor.innerHTML.replace(/•*$/, "") + dots;
    if (dots.length >= 8) {
      clearInterval(interval);
      setTimeout(() => {
        monitor.innerHTML += `<div>Access Granted.</div>`;
        setTimeout(() => renderCameraGrid(monitor), 1000);
      }, 500);
    }
  }, 200);
}

function renderCameraGrid(monitor) {
  monitor.innerHTML = `
    <h3 style="color:#0f0;margin-top:0;">Camera Feed</h3>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;height:70%;">
      ${generateCameraFeeds()}
    </div>
    <button style="margin-top:8px;padding:6px 12px;background:#111;color:#0f0;border:1px solid #0f0;cursor:pointer;"
      onclick="closeVanMonitor()">Close Monitor</button>
  `;
}

function generateCameraFeeds() {
  const rooms = Object.keys(roomVisuals).filter(r => r !== "Van");
  return rooms.slice(0, 4).map(r => {
    const active = (game.ghostRoom === r && Math.random() < 0.6);
    return `<div style="background:#000;border:1px solid #0f0;
      display:flex;justify-content:center;align-items:center;
      color:#0f0;font-size:12px;">
      ${active ? r + " — ACTIVE" : "NO SIGNAL"}
    </div>`;
  }).join("");
}

function closeVanMonitor() {
  const monitor = document.getElementById("van-monitor");
  if (monitor) document.body.removeChild(monitor);
}

/***********************
 === GLOBAL CONSTANTS & GHOST PROFILES ===
************************/
const allLoadoutItems = [
  "EMF Reader", "Spirit Box", "Camera", "UV Light", "D.O.T.S Projector",
  "Thermometer", "Ghost Writing Book", "Video Camera", "Crucifix",
  "Smudge Stick", "Salt", "Parabolic Microphone", "Motion Sensor",
  "Sound Sensor", "Candle"
];

let tempHeld = [];
let tempVan = [...allLoadoutItems]; 

const cursedItems = {
  "Ouija Board": {desc: "Ask ghost questions, drains sanity.", cost: 15},
  "Tarot Cards": {desc: "Random effects, risky.", cost: 5},
  "Music Box": {desc: "Attracts ghost, risky.", cost: 10},
  "Haunted Mirror": {desc: "Reveals ghost room, drains sanity.", cost: 20},
  "Summoning Circle": {desc: "Forces ghost appearance.", cost: 25},
  "Monkey Paw": {desc: "Grants risky wishes.", cost: 10}
};

function getCursedItemCost(i){return cursedItems[i]?.cost||5;}

const possibleWeather = ["Stormy","Clear","Foggy","Blood Moon"];

const ghostProfiles = {
  Spirit:{evidence:["EMF Reader","Spirit Box","Ghost Writing"],behavior:"Standard activity; calmer with smudge."},
  Wraith:{evidence:["EMF Reader","Spirit Box","D.O.T.S Projector"],behavior:"Rarely touches ground; teleporting behavior."},
  Phantom:{evidence:["Spirit Box","Fingerprints","D.O.T.S Projector"],behavior:"Long visual contact drops sanity faster."},
  Poltergeist:{evidence:["Spirit Box","Fingerprints","Ghost Writing"],behavior:"Throws multiple objects at once."},
  Banshee:{evidence:["Fingerprints","Orbs","D.O.T.S Projector"],behavior:"Focuses on one target."},
  Jinn:{evidence:["EMF Reader","Fingerprints","Freezing Temps"],behavior:"Moves quickly when power is on."},
  Mare:{evidence:["Spirit Box","Ghost Writing","Orbs"],behavior:"Prefers darkness; active in dark rooms."},
  Revenant:{evidence:["Ghost Writing","Orbs","Freezing Temps"],behavior:"Very fast during hunts if target seen."},
  Shade:{evidence:["EMF Reader","Ghost Writing","Freezing Temps"],behavior:"Shy; less active with multiple people."},
  Demon:{evidence:["Fingerprints","Ghost Writing","Freezing Temps"],behavior:"Aggressive; hunts more often."},
  Yurei:{evidence:["Orbs","Freezing Temps","D.O.T.S Projector"],behavior:"Strong sanity drain; trapped by smudge."},
  Oni:{evidence:["EMF Reader","Freezing Temps","D.O.T.S Projector"],behavior:"Very active when visible."},
  Yokai:{evidence:["Spirit Box","Orbs","D.O.T.S Projector"],behavior:"Talkative; attracted to voices."},
  Hantu:{evidence:["Fingerprints","Orbs","Freezing Temps"],behavior:"Faster in cold rooms."},
  Goryo:{evidence:["EMF Reader","Fingerprints","D.O.T.S Projector"],behavior:"Seen only through camera; rarely changes rooms."},
  Myling:{evidence:["EMF Reader","Fingerprints","Ghost Writing"],behavior:"Quieter footsteps; active on sound equipment."},
  Onryo:{evidence:["Spirit Box","Orbs","Freezing Temps"],behavior:"Hunts after extinguishing flames; avoids lit candles."},
  TheTwins:{evidence:["EMF Reader","Spirit Box","Freezing Temps"],behavior:"Alternates activity between rooms."},
  Raiju:{evidence:["EMF Reader","Orbs","D.O.T.S Projector"],behavior:"Faster near electronic equipment."},
  Obake:{evidence:["EMF Reader","Fingerprints","Orbs"],behavior:"Rare ghostly fingerprint changes."},
  TheMimic:{evidence:["Spirit Box","Fingerprints","Freezing Temps"],behavior:"Mimics other ghosts; fake orbs appear on camera only."},
  Moroi:{evidence:["Spirit Box","Ghost Writing","Freezing Temps"],behavior:"Curses sanity when responding on Spirit Box."},
  Deogen:{evidence:["Spirit Box","Ghost Writing","D.O.T.S Projector"],behavior:"Always knows player’s location but very slow close."},
  Thaye:{evidence:["Ghost Writing","Orbs","D.O.T.S Projector"],behavior:"Very active early, weaker over time."},
  Succubus:{evidence:["Spirit Box","Ghost Writing","Fingerprints"],behavior:"Drains sanity faster if alone; active at night."}
};

const roomVisuals = {
  Van:{N:"Van_N.png",S:"Van_S.png",E:"Van_E.png",W:"Van_W.png"},
  Foyer:{N:"Foyer_N.png",S:"Foyer_S.png",E:"Foyer_E.png",W:"Foyer_W.png"},
  LivingRoom:{N:"LivingRoom_N.png",S:"LivingRoom_S.png",E:"LivingRoom_E.png",W:"LivingRoom_W.png"},
  Kitchen:{N:"Kitchen_N.png",S:"Kitchen_S.png",E:"Kitchen_E.png",W:"Kitchen_W.png"},
  DiningRoom:{N:"DiningRoom_N.png",S:"DiningRoom_S.png",E:"DiningRoom_E.png",W:"DiningRoom_W.png"},
  Basement:{N:"Basement_N.png",S:"Basement_S.png",E:"Basement_E.png",W:"Basement_W.png"},
  Bathroom:{N:"Bathroom_N.png",S:"Bathroom_S.png",E:"Bathroom_E.png",W:"Bathroom_W.png"},
  Garage:{N:"Garage_N.png",S:"Garage_S.png",E:"Garage_E.png",W:"Garage_W.png"},
  KidsBedroom:{N:"KidsBedroom_N.png",S:"KidsBedroom_S.png",E:"KidsBedroom_E.png",W:"KidsBedroom_W.png"},
  MasterBedroom:{N:"MasterBedroom_N.png",S:"MasterBedroom_S.png",E:"MasterBedroom_E.png",W:"MasterBedroom_W.png"}
};

const mapConnections = {
  Van:["Foyer"],
  Foyer:["Van","LivingRoom","Kitchen","Bathroom"],
  LivingRoom:["Foyer","DiningRoom","Garage","KidsBedroom","MasterBedroom"],
  Kitchen:["Foyer","DiningRoom","Basement"],
  DiningRoom:["Kitchen","LivingRoom"],
  Basement:["Kitchen"],
  Garage:["LivingRoom"],
  Bathroom:["Foyer"],
  KidsBedroom:["LivingRoom"],
  MasterBedroom:["LivingRoom"]
};

/***********************
 === GAME STATE ===
************************/
const game = {
  ghost: null,
  ghostRoom: null,
  playerRoom: "Van",
  playerDirection: "N",
  inventory: [],
  vanStock: [...allLoadoutItems],
  selectedEvidence: new Set(),
  currentTurn: 0,
  sanity: 100,
  weather: null,
  mimicForm: null,
  nextMimicShift: 0,
  cameraActive: false,
  huntCooldown: 0,
  smudgeActive: 0,
  placedCrucifix: {},
  roomItems: {},
  usedCursedItems: {}
};

/***********************
 === UTILITIES ===
************************/
function logToGame(msg) {
  const log = document.getElementById("game-log");
  const e = document.createElement("div");
  e.className = "log-entry";
  e.textContent = msg;
  log.appendChild(e);
  log.scrollTop = log.scrollHeight;
  setTimeout(() => e.classList.add("fade"), 8000);
}

function randomFromArray(arr){return arr[Math.floor(Math.random()*arr.length)];}

function updateSanityBar(){
  const bar=document.getElementById("sanity-bar");
  if(!bar)return;
  const s=Math.max(0,Math.floor(game.sanity));
  bar.style.width=s+"%";
  bar.style.background=s>66?"#0f0":s>33?"#ff0":"#f00";
}

function resetGame(){
  game.ghost=null; game.ghostRoom=null; game.playerRoom="Van"; game.playerDirection="N";
  game.inventory=[]; game.vanStock=[...allLoadoutItems]; game.selectedEvidence.clear();
  game.currentTurn=0; game.sanity=100; game.weather=null; game.mimicForm=null; game.nextMimicShift=0;
  game.huntCooldown=0; game.smudgeActive=0; game.placedCrucifix={}; game.roomItems={}; game.usedCursedItems={};
  updateSanityBar(); renderHUD(); updateBackground();
}
</script>
<script>
"use strict";

/***********************
 === RANDOMIZED INVESTIGATION SETUP ===
************************/
function startInvestigation() {
  // ✅ Show the main scene & clear any previous log
  document.getElementById("main-scene").style.display = "block";
  document.getElementById("narrator-ui").style.display = "flex";
  document.getElementById("game-log").innerHTML = "";

  // ✅ Randomized setup for investigation
  game.weather = randomFromArray(possibleWeather);
  game.ghost = randomFromArray(Object.keys(ghostProfiles));

  if (game.ghost === "TheMimic") assignMimicForm();

  game.ghostRoom = randomFromArray(Object.keys(roomVisuals).filter(r => r !== "Van"));

  // ✅ Place cursed items at start
  placeCursedItems();

  // ✅ First narration log
  logToGame(`You are in the van. The weather is ${game.weather.toLowerCase()}.`);

  // ✅ Update HUD, visuals, and buttons
  renderHUD();
  updateBackground();
  renderActionButtons();

  // ✅ Save immediately after setup
  saveGame();
}


/***********************
 === MIMIC LOGIC ===
************************/
function assignMimicForm(){
  const g=Object.keys(ghostProfiles).filter(x=>x!=="TheMimic");
  game.mimicForm=randomFromArray(g);
  game.nextMimicShift=game.currentTurn+3+Math.floor(Math.random()*4);
}

/***********************
 === HUD & BACKGROUND ===
************************/
function renderHUD(){
  document.getElementById("hud-location").textContent=game.playerRoom;
  document.getElementById("hud-weather").textContent=game.weather||"--";
  document.getElementById("hud-turns").textContent=game.currentTurn;
  document.getElementById("held-items-display").textContent=
    game.inventory.length?game.inventory.join(", "):"None";

  if(game.inventory.includes("Thermometer")&&game.playerRoom!=="Van"){
    const t=game.playerRoom===game.ghostRoom
      ?(Math.random()<0.3?-5:2+Math.random()*3)
      :15+Math.random()*5;
    document.getElementById("hud-temp").textContent=t.toFixed(1)+"°C";
  } else {
    document.getElementById("hud-temp").textContent="--°C";
  }
  updateSanityBar();
}

function updateBackground(){
  const v=roomVisuals[game.playerRoom]||roomVisuals["Van"];
  const d=game.playerDirection||"N";
  const bg=document.getElementById("background");
  if(v&&v[d]) bg.style.backgroundImage=`url('${v[d]}')`;
  else {
    console.warn(`Missing background for ${game.playerRoom} (${d}).`);
    bg.style.backgroundImage=`url('${roomVisuals["Van"]["N"]}')`;
  }
}

/***********************
 === ROOM & MOVEMENT ===
************************/
function openMoveOverlay(){
  const existing=document.getElementById("move-temp");
  if(existing)document.body.removeChild(existing);

  const exits=mapConnections[game.playerRoom]||[];
  if(!exits.length){logToGame("No available exits.");return;}

  const overlay=document.createElement("div");
  overlay.id="move-temp";
  Object.assign(overlay.style,{
    position:"fixed",top:"50%",left:"50%",transform:"translate(-50%,-50%)",
    background:"#111",padding:"10px",maxWidth:"90%",zIndex:"3000",
    border:"1px solid #555",borderRadius:"4px"
  });

  let html=`<h3 style="color:#0ff;margin-top:0;">Available Exits</h3>`;
  html+=exits.map(r=>`<button onclick="goRoomAndClose('${r}')">Go to ${r}</button>`).join("");
  html+=`<button style="margin-top:6px;" onclick="closeMoveOverlay()">Close</button>`;
  overlay.innerHTML=html;
  document.body.appendChild(overlay);

  window.closeMoveOverlay=function(){const t=document.getElementById("move-temp");if(t)document.body.removeChild(t);};
  window.goRoomAndClose=function(room){moveToRoom(room);closeMoveOverlay();saveGame();};
}

function moveToRoom(r){
  if(game.playerRoom===r){logToGame("You are already in "+r+".");return;}
  game.playerRoom=r;game.currentTurn++;game.playerDirection="N";
  logToGame("You move to "+r+".");
  renderHUD();updateBackground();
  const moveOverlay=document.getElementById("move-temp");
  if(moveOverlay)document.body.removeChild(moveOverlay);
  checkTurnEvents();saveGame();
}

/***********************
 === LOOK AROUND ===
************************/
function lookAround(){
  game.currentTurn++;
  if(game.playerRoom===game.ghostRoom){
    logToGame("You feel an eerie presence...");
    const items=game.roomItems[game.playerRoom]||[];

    // Salt footprints
    if(items.includes("Salt")&&Math.random()<0.5){
      logToGame("You notice disturbed salt... Try using a UV Light.");
      if(!items.includes("Footprints")) items.push("Footprints");
      game.roomItems[game.playerRoom]=items;
      setTimeout(()=>{
        if(game.roomItems[game.playerRoom]){
          game.roomItems[game.playerRoom]=
            game.roomItems[game.playerRoom].filter(x=>x!=="Footprints");
          logToGame("The footprints have faded.");saveGame();
        }
      },9000);
    }

    // Onryo snuff candle
    if(game.ghost==="Onryo"&&items.includes("Candle")&&Math.random()<0.5){
      game.roomItems[game.playerRoom]=items.filter(x=>x!=="Candle");
      logToGame("The flame suddenly extinguishes!");
    }

    if(game.ghost==="TheMimic"||game.mimicForm==="TheMimic")
      logToGame("Fake orbs shimmer briefly.");
  } else {logToGame("Nothing unusual.");}

  renderHUD();checkTurnEvents();saveGame();
}

/***********************
 === CURSED ITEMS ===
************************/
function placeCursedItems(){
  const rooms=Object.keys(roomVisuals).filter(r=>r!=="Van");
  const chosen=randomFromArray(rooms);
  game.roomItems[chosen]=game.roomItems[chosen]||[];
  const keys=Object.keys(cursedItems);
  if(!keys.length)return;
  const pick=randomFromArray(keys);
  game.roomItems[chosen].push(pick);
}

/***********************
 === TURN EVENTS & AMBIENCE ===
************************/
function checkTurnEvents(){
  if(game.ghost==="TheMimic"&&game.currentTurn>=game.nextMimicShift){
    assignMimicForm();
    game.nextMimicShift=game.currentTurn+3+Math.floor(Math.random()*4);
    logToGame("The Mimic shifts behavior...");
  }

  if(game.playerRoom===game.ghostRoom){
    game.sanity-=3+Math.random()*3;
    if(game.currentTurn%2===0&&Math.random()<0.3){
      const g=(game.ghost==="TheMimic"?game.mimicForm:game.ghost);
      logToGame("[Ambient] "+(ghostProfiles[g].behavior||"The air feels heavy..."));
    }
  } else {game.sanity-=1;}

  Object.keys(game.roomItems).forEach(r=>{
    if(!game.roomItems[r]?.includes("Motion Sensor"))return;
    if(Math.random()<0.25){
      if(game.playerRoom==="Van"){logToGame("[Van Monitor] Motion detected in "+r+"!");}
      else if(game.playerRoom===r){logToGame("You hear the motion sensor *beep* nearby.");}
      else if(mapConnections[game.playerRoom]?.includes(r)&&Math.random()<0.4){
        logToGame("You faintly hear a muffled *beep* through the walls...");
      }
    }
  });

  game.sanity=Math.max(0,game.sanity);
  updateSanityBar();
  attemptHunt();
}

/***********************
 === HUNT SYSTEM ===
************************/
function attemptHunt(){
  if(game.smudgeActive>0){game.smudgeActive--;return;}
  if(game.huntCooldown>0){game.huntCooldown--;return;}
  if(game.ghost==="Onryo"&&Object.values(game.roomItems).some(a=>a.includes("Candle")))return;
  if(game.sanity<30&&Math.random()<0.25)startHunt();
}

function startHunt(){
  logToGame("💀 The ghost is hunting!");
  flashRed();
  logToGame("You hear your heartbeat pounding as the ghost searches...");

  if(game.playerRoom===game.ghostRoom){
    if(game.placedCrucifix&&game.placedCrucifix[game.playerRoom]>0){
      game.placedCrucifix[game.playerRoom]--;
      if(game.placedCrucifix[game.playerRoom]===0){
        delete game.placedCrucifix[game.playerRoom];
        logToGame("The crucifix has burned away completely.");
      } else {
        logToGame(`The crucifix burns, stopping the hunt. (${game.placedCrucifix[game.playerRoom]} uses left)`);
      }
    } else {
      setTimeout(playerDeath,1500);
    }
  } else {logToGame("You survived the hunt...");}

  const aggressiveGhosts=["Demon","Oni","Raiju","Moroi"];
  game.huntCooldown=aggressiveGhosts.includes(game.ghost)
    ?3+Math.floor(Math.random()*2):5+Math.floor(Math.random()*3);
}

function flashRed(){
  const l=document.getElementById("lightning");
  let flashes=3,count=0;
  function pulse(){
    if(count>=flashes){l.style.opacity=0;return;}
    l.style.background="red";
    l.style.opacity=0.6+Math.random()*0.2;
    setTimeout(()=>{
      l.style.opacity=0;count++;
      setTimeout(pulse,150+Math.random()*200);
    },150+Math.random()*100);
  }
  pulse();
}

function playerDeath(){
  logToGame("💀 The ghost finds you. Everything goes cold...");
  setTimeout(()=>{
    alert("You died.");resetGame();showLoadout();
  },800);
}
</script>
<script>
"use strict";

/***********************
 === INVENTORY OVERLAY ===
************************/
function openInventoryOverlay(){
  const existing=document.getElementById("inventory-temp");
  if(existing)document.body.removeChild(existing);

  const c=document.createElement("div");
  c.id="inventory-temp";
  Object.assign(c.style,{
    position:"fixed",top:"50%",left:"50%",transform:"translate(-50%,-50%)",
    background:"#111",padding:"12px",maxHeight:"75%",overflowY:"auto",
    maxWidth:"92%",zIndex:"3000",border:"1px solid #555",borderRadius:"6px",
    color:"#eee",textAlign:"center",lineHeight:"1.4"
  });

  let html=`<h3 style="margin-top:0;color:#0ff;">Inventory</h3>`;
  if(game.inventory.length>0){
    html+=`<p><strong>Held Items:</strong></p>`;
    game.inventory.forEach(i=>{
      html+=`
        <div style="margin-bottom:4px;">
          <button onclick="inspectItem('${i}')">Inspect: ${i}</button>
          <button onclick="dropItem('${i}');closeInventory()">Drop: ${i}</button>
          <button onclick="useItem('${i}');closeInventory()">Use: ${i}</button>
        </div>`;
    });
  } else {html+=`<p style="opacity:0.7;">No items held.</p>`;}

  const roomInv=game.roomItems[game.playerRoom]||[];
  if(roomInv.length>0){
    html+=`<p><strong>Items in this Room:</strong></p>`;
    roomInv.forEach(i=>{
      html+=`
        <div style="margin-bottom:4px;">
          <button onclick="pickItem('${i}');closeInventory()">Pick up: ${i}</button>
        </div>`;
    });
  }

  html+=`<button style="margin-top:10px;" onclick="closeInventory()">Close</button>`;
  c.innerHTML=html;document.body.appendChild(c);

  window.closeInventory=function(){
    const t=document.getElementById("inventory-temp");
    if(t)document.body.removeChild(t);
    saveGame();
  };
}

function inspectItem(i){
  let desc=cursedItems[i]?.desc||"Standard investigation gear.";
  switch(i){
    case"Crucifix":desc="Placed to prevent hunts. 2 uses.";break;
    case"Camera":case"Video Camera":desc="Detects orbs via night vision.";break;
    case"UV Light":desc="Reveals fingerprints or footprints (salt needed).";break;
    case"Salt":desc="Sprinkle to reveal footprints with UV.";break;
    case"Motion Sensor":desc="Alerts you in van when ghost triggers it.";break;
    case"Candle":desc="Prevents Onryo hunts while lit.";break;
  }
  logToGame(`Inspecting ${i}: ${desc}`);
}

function dropItem(i){
  if(game.playerRoom==="Van"){
    if(!game.vanStock.includes(i)){game.vanStock.push(i);game.vanStock.sort();}
    logToGame(`Returned ${i} to van.`);
  } else {
    game.roomItems[game.playerRoom]=game.roomItems[game.playerRoom]||[];
    if(!game.roomItems[game.playerRoom].includes(i))
      game.roomItems[game.playerRoom].push(i);
    logToGame(`Dropped ${i} here.`);
  }
  game.inventory=game.inventory.filter(x=>x!==i);
  renderHUD();saveGame();
}

function pickItem(i){
  if(game.inventory.length>=3){logToGame("Max 3 items.");return;}
  if(cursedItems[i]&&i==="Summoning Circle"){
    logToGame("The circle cannot be moved.");return;
  }
  game.roomItems[game.playerRoom]=
    game.roomItems[game.playerRoom].filter(x=>x!==i);
  if(!game.inventory.includes(i)){
    game.inventory.push(i);game.inventory.sort();
  }
  logToGame(`Picked up ${i}.`);
  renderHUD();saveGame();
}

/***********************
 === ITEM USE ===
************************/
function useItem(i){
  switch(i){
    case"Smudge Stick":
      if(game.playerRoom===game.ghostRoom){
        game.smudgeActive=3;logToGame("You smudge the room, calming the ghost.");
      } else {logToGame("You smudge, but nothing happens.");}
      break;

    case"Camera":case"Video Camera":
      if(game.playerRoom!=="Van"){
        game.cameraActive=!game.cameraActive;
        logToGame(game.cameraActive?"Camera on: watching for orbs.":"Camera off.");
      } else {logToGame("Cannot use cameras in the van.");}
      break;

    case"Crucifix":
      if(game.playerRoom!=="Van"){
        game.placedCrucifix[game.playerRoom]=2;
        logToGame("You place the crucifix. It may stop two hunts.");
        game.inventory=game.inventory.filter(x=>x!==i);
      } else {logToGame("Cannot place crucifix in van.");}
      break;

    case"Salt":
      if(game.playerRoom!=="Van"){
        game.roomItems[game.playerRoom]=game.roomItems[game.playerRoom]||[];
        if(!game.roomItems[game.playerRoom].includes("Salt")){
          game.roomItems[game.playerRoom].push("Salt");
          logToGame("You sprinkle salt on the ground.");
        }
      }
      break;

    case"UV Light":
      if(game.roomItems[game.playerRoom]?.includes("Footprints")){
        logToGame("You see glowing footprints under UV!");
        game.selectedEvidence.add("Fingerprints");
      } else {logToGame("No visible prints under UV.");}
      break;

    case"Candle":
      if(game.playerRoom!=="Van"){
        game.roomItems[game.playerRoom]=game.roomItems[game.playerRoom]||[];
        if(!game.roomItems[game.playerRoom].includes("Candle")){
          game.roomItems[game.playerRoom].push("Candle");
          logToGame("You place and light a candle here.");
        }
      }
      break;

    case"Motion Sensor":
      if(game.playerRoom!=="Van"){
        game.roomItems[game.playerRoom]=game.roomItems[game.playerRoom]||[];
        if(!game.roomItems[game.playerRoom].includes("Motion Sensor")){
          game.roomItems[game.playerRoom].push("Motion Sensor");
          logToGame("You place a motion sensor in this room.");
        }
      }
      break;

    default:
      if(cursedItems[i])handleCursedItem(i);
      else logToGame("You use the "+i+", but nothing significant occurs.");
  }

  game.currentTurn++;renderHUD();checkTurnEvents();saveGame();
}

function handleCursedItem(i){
  if(game.usedCursedItems[i]){logToGame("The "+i+" is inert now.");return;}
  logToGame("You use the "+i+"...");
  game.sanity-=getCursedItemCost(i);
  if(game.sanity<0)game.sanity=0;

  switch(i){
    case"Ouija Board":if(Math.random()<0.2)startHunt();break;
    case"Tarot Cards":
      const r=Math.random();
      if(r<0.2)logToGame("The Fool — nothing happens.");
      else if(r<0.4)logToGame("The Tower — ghost activity spikes!");
      else if(r<0.6){logToGame("The Death card — hunt triggered!");startHunt();}
      else{logToGame("The Sun — sanity restored.");game.sanity=Math.min(100,game.sanity+10);}
      break;
    case"Music Box":case"Haunted Mirror":if(Math.random()<0.3)startHunt();break;
    case"Summoning Circle":startHunt();break;
    case"Monkey Paw":if(Math.random()<0.5)startHunt();break;
  }

  game.usedCursedItems[i]=true;updateSanityBar();saveGame();
}

/***********************
 === SAVE & LOAD SYSTEM ===
************************/
function saveGame(){
  try{
    const saveData={
      ghost:game.ghost,ghostRoom:game.ghostRoom,playerRoom:game.playerRoom,
      playerDirection:game.playerDirection,inventory:game.inventory,
      vanStock:game.vanStock,selectedEvidence:Array.from(game.selectedEvidence),
      currentTurn:game.currentTurn,sanity:game.sanity,weather:game.weather,
      mimicForm:game.mimicForm,nextMimicShift:game.nextMimicShift,
      cameraActive:game.cameraActive,huntCooldown:game.huntCooldown,
      smudgeActive:game.smudgeActive,placedCrucifix:game.placedCrucifix,
      roomItems:game.roomItems,usedCursedItems:game.usedCursedItems
    };
    localStorage.setItem("phasmaPhoneySave",JSON.stringify(saveData));
    logToGame("💾 Game saved.");
  }catch(e){console.error("Save failed:",e);logToGame("⚠️ Save failed.");}
}

function loadGame(){
  const data=localStorage.getItem("phasmaPhoneySave");
  if(!data){logToGame("No save data found.");return;}
  try{
    const s=JSON.parse(data);
    Object.assign(game,s);
    game.selectedEvidence=new Set(s.selectedEvidence);
    if(!game.placedCrucifix)game.placedCrucifix={};
    if(!game.roomItems)game.roomItems={};
    if(!game.usedCursedItems)game.usedCursedItems={};
    logToGame("📂 Game loaded. Resuming investigation...");
    document.getElementById("title-screen").style.display="none";
    document.getElementById("loadout-screen").style.display="none";
    document.getElementById("main-scene").style.display="block";
    document.getElementById("narrator-ui").style.display="flex";
    renderHUD();updateBackground();renderActionButtons();
  }catch(e){console.error("Load failed:",e);logToGame("⚠️ Load failed.");}
}

function clearSave(){
  localStorage.removeItem("phasmaPhoneySave");
  logToGame("🗑️ Save data cleared.");
}

/***********************
 === ACTION BUTTONS ===
************************/
function renderActionButtons(){
  const cmd=document.getElementById("command-buttons");
  cmd.innerHTML=`
    <button data-cmd="move" onclick="handleCommand('move')">Move</button>
    <button data-cmd="look" onclick="handleCommand('look')">Look Around</button>
    <button data-cmd="inventory" onclick="handleCommand('inventory')">Inventory</button>
    <button data-cmd="guess" onclick="handleCommand('guess')">Ghost Guess</button>
    <button data-cmd="van" onclick="handleCommand('van')">Return to Van</button>
    <button data-cmd="save" onclick="handleCommand('save')">Save Game</button>
    <button data-cmd="load" onclick="handleCommand('load')">Load Game</button>`;
  logToGame("✅ Actions ready. Select an option below.");
}

"use strict";

/***********************
 === LOADOUT SELECTION ===
************************/
function showLoadout() {
  // ✅ Always reset temporary arrays to defaults
  tempHeld = [];
  tempVan = [...allLoadoutItems];

  const heldList = document.getElementById("held-list");
  const vanList = document.getElementById("van-list");
  const confirmBtn = document.getElementById("confirm-loadout");

  function renderLoadout() {
    heldList.innerHTML = tempHeld
      .map(i => `<button class="item-button selected" onclick="removeHeldItem('${i}')">${i}</button>`)
      .join("");

    vanList.innerHTML = tempVan
      .map(i => `<button class="item-button" onclick="addHeldItem('${i}')">${i}</button>`)
      .join("");

    if (tempHeld.length > 0) {
      confirmBtn.classList.add("active");
      confirmBtn.disabled = false;
    } else {
      confirmBtn.classList.remove("active");
      confirmBtn.disabled = true;
    }
  }

  window.addHeldItem = function (item) {
    if (tempHeld.length >= 3) {
      logToGame("⚠️ You can only hold 3 items.");
      return;
    }
    tempHeld.push(item);
    tempVan = tempVan.filter(v => v !== item);
    renderLoadout();
  };

  window.removeHeldItem = function (item) {
    tempVan.push(item);
    tempHeld = tempHeld.filter(h => h !== item);
    renderLoadout();
  };

  renderLoadout();
  document.getElementById("loadout-screen").style.display = "flex";
  logToGame("📦 Select up to 3 starting items. Notebook & Lighter are free.");
}

/***********************
 === STARTUP & EVENT WIRING ===
************************/
document.addEventListener("DOMContentLoaded", () => {
  resetGame();
  const startBtn = document.getElementById("startButton");
  const confirmBtn = document.getElementById("confirm-loadout");
  const commandContainer = document.getElementById("command-buttons");

  startBtn.addEventListener("click", () => {
    if (startBtn.disabled) return;
    startBtn.disabled = true;
    const t = document.getElementById("title-screen");
    t.style.opacity = "0";
    setTimeout(() => {
      t.style.display = "none";
      showLoadout(); // ✅ Now works because it's defined above
    }, 1500);
  });

  confirmBtn.addEventListener("click", () => {
    if (confirmBtn.disabled || !confirmBtn.classList.contains("active")) {
      logToGame("⚠️ Select at least one item before confirming.");
      return;
    }
    confirmBtn.disabled = true;

    if (!Array.isArray(tempHeld)) tempHeld = [];
    if (!Array.isArray(tempVan)) tempVan = [...allLoadoutItems];

    game.inventory = [...tempHeld, "Notebook", "Lighter"];
    game.vanStock = [...tempVan];

    document.getElementById("loadout-screen").style.display = "none";
    startInvestigation();
    renderActionButtons();
    logToGame("🎮 Game state saved after loadout.");
    saveGame();
    window.dispatchEvent(new Event("resize"));

    setTimeout(() => {
      confirmBtn.disabled = false;
    }, 1500);
  });

  commandContainer.addEventListener("click", (e) => {
    if (e.target.tagName === "BUTTON" && e.target.dataset.cmd) {
      handleCommand(e.target.dataset.cmd);
    }
  });

  if (localStorage.getItem("phasmaPhoneySave")) {
    logToGame("💾 Previous save detected. Use 'Load Game'.");
  }
});

</script>

</body>
