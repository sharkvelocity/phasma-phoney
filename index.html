<script>
// === Loadout Menu Display ===
function showLoadoutMenu() {
  const container = document.getElementById("item-selection");
  container.innerHTML = "";
  allLoadoutItems.forEach(item => {
    const label = document.createElement("label");
    label.style = "color:#0ff;font-family:monospace;";
    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.value = item;
    checkbox.onchange = limitLoadoutCheck;
    label.appendChild(checkbox);
    label.append(" " + item);
    container.appendChild(label);
  });
  document.getElementById("loadout-screen").style.display = "block";
}

// === Restrict Loadout to Max 3 Items (Notebook/Lighter exempt) ===
function limitLoadoutCheck() {
  const selected = document.querySelectorAll('#item-selection input:checked');
  if (selected.length > 3) this.checked = false;
}

// === Confirm Loadout and Initialize Game Variables ===
function confirmLoadout() {
  const selected = Array.from(document.querySelectorAll('#item-selection input:checked'));
  if (selected.length > 3) return alert("Max 3 items.");

  game.inventory = selected.map(cb => cb.value).concat("Notebook", "Lighter");

  // Initialize van inventory with remaining items
  game.vanStock = {};
  const remaining = allLoadoutItems.filter(i => !game.inventory.includes(i));
  remaining.forEach(name => {
    game.vanStock[name] = (name === "Smudge" ? 4 : name === "Salt" ? 3 : 1);
  });

  document.getElementById("loadout-screen").style.display = "none";
  startInvestigation(); // Trigger next phase
}
</script>

<script>
// === Investigation Initialization ===
function startLoadout() {
  document.getElementById("title-screen").style.display = "none";
  showLoadoutMenu();
}

function startInvestigation() {
  game.started = true;
  game.active = true;
  game.turn = 0;
  game.sanity = 100;
  game.ghost = Object.keys(ghostProfiles)[Math.floor(Math.random() * Object.keys(ghostProfiles).length)];
  game.ghostRoom = randomRoom(); // Assign random room
  document.getElementById("ada-modal").style.display = "block";
  simulateTyping(introDialogues[Math.floor(Math.random() * introDialogues.length)], "Deo");
  updateStatus();
}

// === Assign Random Room from Room Map ===
function randomRoom() {
  const flatRooms = game.roomNameMap.flat();
  const viable = flatRooms.filter(r => r !== "Van");
  return viable[Math.floor(Math.random() * viable.length)];
}
</script>
<script>
// === ADA Typing Simulation ===
function simulateTyping(text, from = "ADA") {
  const log = document.getElementById("ada-log");
  const line = document.createElement("div");
  line.innerHTML = `<strong>${from}:</strong> `;
  const span = document.createElement("span");
  const cursor = document.createElement("span");
  cursor.setAttribute("id", "ada-typing");
  cursor.textContent = "|";
  line.appendChild(span);
  line.appendChild(cursor);
  log.appendChild(line);

  let i = 0;
  function typeChar() {
    if (i < text.length) {
      span.textContent += text[i++];
      log.scrollTop = log.scrollHeight;
      setTimeout(typeChar, 18 + Math.random() * 20);
    } else {
      cursor.remove();
    }
  }
  typeChar();
}
</script>

<script>
// === ADA Command Handler ===
function handleAdaCommand(cmd) {
  simulateTyping("> " + cmd, "You");
  const response = respondTo(cmd);
  setTimeout(() => simulateTyping(response), 300);
}
</script>

<script>
// === Map Renderer ===
function updateMapDisplay() {
  const [x, y] = game.position;
  let out = "";
  for (let i = 0; i < game.map.length; i++) {
    for (let j = 0; j < game.map[i].length; j++) {
      out += (i === x && j === y) ? "● " : game.map[i][j] + " ";
    }
    out += "\n";
  }
  return out;
}
</script>

<script>
// === Status Bar Update ===
function updateStatus() {
  document.getElementById("turn-counter").textContent = game.turn;
  document.getElementById("sanity-bar").textContent = game.sanity;
}
</script>

<script>
// === ADA Command Logic ===
function respondTo(cmd) {
  const command = cmd.trim().toLowerCase();
  if (!command) return;

  if (!game.started || !game.active) return "The investigation hasn't started.";

  game.turn++;
  game.sanity = Math.max(0, game.sanity - 5);
  updateStatus();

  if (command === "map") return updateMapDisplay();

  if (command === "move") {
    let [x, y] = game.position;
    y = (y + 1) % 3;
    game.position = [x, y];
    const room = game.roomNameMap[x][y];
    const isGhostRoom = room === game.ghostRoom;
    const activity = isGhostRoom ? ghostProfiles[game.ghost].behavior : "You feel watched, but nothing happens.";
    return `You moved to ${room}. ${activity}`;
  }

  if (command === "inventory") {
    return game.inventory.length ? "You have: " + game.inventory.join(", ") : "You have no items.";
  }

  if (command.startsWith("use ")) {
    const item = command.slice(4).trim().toLowerCase();
    return useGameItem(item);
  }

  if (command === "end") {
    game.started = false;
    game.active = false;
    document.getElementById("ada-modal").style.display = "none";
    return "Investigation ended.";
  }

  if (command.startsWith("add evidence ")) {
    const ev = command.replace("add evidence ", "").trim();
    if (!ev) return "Specify which evidence to add.";
    if (!game.evidence.includes(ev)) {
      game.evidence.push(ev);
      return `${ev} added to your journal.`;
    }
    return `${ev} is already recorded.`;
  }

  return "Unknown command. Try: map, move, use [item], inventory, guess, end.";
}
</script>
<script>
// === Game Item Logic ===
function useGameItem(item) {
  const lower = item.toLowerCase();
  if (!game.inventory.map(i => i.toLowerCase()).includes(lower)) {
    return `You don't have a ${item}.`;
  }

  switch (lower) {
    case "smudge":
      if (game.protections.smudgeCount > 0) {
        game.protections.smudgeCount--;
        return "You used a Smudge Stick. The area feels momentarily safer.";
      } else {
        return "You're out of Smudge Sticks.";
      }

    case "salt":
      return "You scatter salt across the doorway.";

    case "crucifix":
      game.protections.crucifixPlaced = true;
      return "You place the Crucifix on the ground.";

    case "emf":
      return "The EMF reader buzzes faintly. Moderate reading.";

    case "spirit box":
      return "You hear a distorted whisper... or was it interference?";

    case "thermometer":
      return "Temperature reads 39°F... it's getting colder.";

    case "camera":
      return "You take a picture... something flickers.";

    case "uv light":
      return "You scan the room... faint smudges glow on the wall.";

    case "d.o.t.s":
      return "You set up the D.O.T.S projector. Wait and watch.";

    case "ghost writing book":
      return "You place the Ghost Writing Book on the floor.";

    case "motion sensor":
      return "You place the motion sensor on the wall.";

    default:
      return `You use the ${item}.`;
  }
}
</script>

<script>
// === Item Use Popup UI ===
function openItemUsePopup() {
  const list = document.getElementById("item-use-list");
  list.innerHTML = "";
  game.inventory.forEach(item => {
    const btn = document.createElement("button");
    btn.textContent = item;
    btn.style.padding = "6px 12px";
    btn.onclick = () => {
      closeItemUsePopup();
      handleAdaCommand("use " + item);
      // Remove consumables from inventory if depleted
      if (["smudge", "salt", "crucifix"].includes(item.toLowerCase())) {
        game.inventory = game.inventory.filter(i => i !== item);
      }
    };
    list.appendChild(btn);
  });
  document.getElementById("item-use-popup").style.display = "block";
}

function closeItemUsePopup() {
  document.getElementById("item-use-popup").style.display = "none";
}
</script>
<script>
// === Ghost Guessing Modal ===
function openGuess() {
  const list = document.getElementById("guess-list");
  list.innerHTML = "";
  Object.keys(ghostProfiles).forEach(ghost => {
    const btn = document.createElement("button");
    btn.textContent = ghost.toUpperCase();
    btn.onclick = () => {
      closeGuess();
      processGuess(ghost);
    };
    list.appendChild(btn);
  });
  document.getElementById("guess-popup").style.display = "block";
}

function closeGuess() {
  document.getElementById("guess-popup").style.display = "none";
}

function processGuess(guess) {
  if (!game.started) return;
  const correct = guess === game.ghost;
  const resultMsg = correct
    ? `✅ Correct! The ghost was ${guess.toUpperCase()}.`
    : `❌ Incorrect. The ghost was ${game.ghost.toUpperCase()}.`;
  endGame(resultMsg);
}
</script>

<script>
// === End Game Handler ===
function endGame(message) {
  simulateTyping(message);
  document.getElementById("end-message").textContent = message;
  document.getElementById("end-screen").style.display = "block";
  game.started = false;
  game.active = false;
}

function startNewGame() {
  location.reload();
}
</script>
<script>
// === Lightning Flash Effect ===
function lightningFlash() {
  const flash = document.getElementById('flash-overlay');
  if (!flash) return;
  flash.style.opacity = '0.4';
  setTimeout(() => flash.style.opacity = '0', 100);
}
setInterval(() => setTimeout(lightningFlash, Math.random() * 2000), 10000);
</script>

<script>
// === Spirit Orb Animation ===
const canvas = document.getElementById('orb-canvas');
const ctx = canvas.getContext('2d');
let width = canvas.width = window.innerWidth;
let height = canvas.height = window.innerHeight;

function createOrb() {
  return {
    x: Math.random() * width,
    y: Math.random() * height,
    vx: (Math.random() - 0.5) * 0.8,
    vy: (Math.random() - 0.5) * 0.8,
    baseRadius: Math.random() * 2 + 1,
    radius: 1,
    opacity: 0,
    fadeIn: true,
    tick: 0,
    changeInterval: Math.floor(Math.random() * 100 + 50)
  };
}

let orbs = Array.from({ length: 12 }, createOrb);

function animateOrbs() {
  ctx.clearRect(0, 0, width, height);
  orbs.forEach((orb, i) => {
    orb.tick++;
    orb.radius = orb.baseRadius + Math.sin(orb.tick / 30) * 0.5;

    // Fade in/out
    if (orb.fadeIn) {
      orb.opacity += 0.01;
      if (orb.opacity >= 0.7) orb.fadeIn = false;
    } else {
      orb.opacity -= 0.001;
    }

    if (orb.opacity <= 0.01) {
      orbs[i] = createOrb();
      return;
    }

    if (orb.tick % orb.changeInterval === 0) {
      const angle = Math.random() * 2 * Math.PI;
      const speed = Math.sqrt(orb.vx ** 2 + orb.vy ** 2);
      orb.vx = Math.cos(angle) * speed;
      orb.vy = Math.sin(angle) * speed;
    }

    orb.x += orb.vx;
    orb.y += orb.vy;

    if (orb.x <= 0 || orb.x >= width) orb.vx *= -1;
    if (orb.y <= 0 || orb.y >= height) orb.vy *= -1;

    ctx.beginPath();
    ctx.arc(orb.x, orb.y, orb.radius, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${orb.opacity})`;
    ctx.shadowColor = `rgba(255,255,255,${orb.opacity * 0.6})`;
    ctx.shadowBlur = 10 + orb.opacity * 10;
    ctx.fill();
  });

  requestAnimationFrame(animateOrbs);
}

animateOrbs();

window.addEventListener('resize', () => {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
});
</script>
<script>
// === Loadout Setup Logic ===
const allLoadoutItems = [
  "EMF", "Spirit Box", "Thermometer", "Crucifix", "Salt", 
  "Smudge", "Camera", "UV Light", "D.O.T.S", "Ghost Writing Book", "Motion Sensor"
];

function showLoadoutMenu() {
  const container = document.getElementById("item-selection");
  container.innerHTML = "";
  allLoadoutItems.forEach(item => {
    const label = document.createElement("label");
    label.style = "color:#0ff;font-family:monospace;";
    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.value = item;
    checkbox.onchange = limitLoadoutCheck;
    label.appendChild(checkbox);
    label.append(" " + item);
    container.appendChild(label);
  });
  document.getElementById("loadout-screen").style.display = "block";
}

function limitLoadoutCheck() {
  const selected = document.querySelectorAll('#item-selection input:checked');
  if (selected.length > 3) this.checked = false;
}

function confirmLoadout() {
  const selected = Array.from(document.querySelectorAll('#item-selection input:checked'));
  if (selected.length > 3) return alert("Max 3 items.");

  game.inventory = selected.map(cb => cb.value).concat("Notebook", "Lighter");

  // Stock van with remaining items
  game.vanStock = {};
  const remaining = allLoadoutItems.filter(i => !game.inventory.includes(i));
  remaining.forEach(name => {
    game.vanStock[name] = (name === "Smudge" ? 4 : name === "Salt" ? 3 : 1);
  });

  document.getElementById("loadout-screen").style.display = "none";
  startInvestigation();
}
</script>
<script>
// === Investigation Start Trigger ===
function startInvestigation() {
  game.started = true;
  game.active = true;
  game.turn = 0;
  game.sanity = 100;
  const ghostKeys = Object.keys(ghostProfiles);
  game.ghost = ghostKeys[Math.floor(Math.random() * ghostKeys.length)];

  // Random ghost room assignment (except Goryo fixed)
  if (game.ghost === "goryo") {
    game.ghostRoom = "Garage"; // Always Garage for Goryo
  } else {
    const flatRooms = game.roomNameMap.flat().filter(r => r !== "Van");
    game.ghostRoom = flatRooms[Math.floor(Math.random() * flatRooms.length)];
  }

  game.ghostRoomLock = 0; // Yurei smudge lock turns
  document.getElementById("ada-modal").style.display = "block";
  simulateTyping(introDialogues[Math.floor(Math.random() * introDialogues.length)], "Deo");
  updateStatus();
}
</script>
<script>
// === ADA Typing Simulation ===
function simulateTyping(text, from = "ADA") {
  const log = document.getElementById("ada-log");
  const line = document.createElement("div");
  line.innerHTML = `<strong>${from}:</strong> `;
  const span = document.createElement("span");
  const cursor = document.createElement("span");
  cursor.setAttribute("id", "ada-typing");
  cursor.textContent = "|";
  line.appendChild(span);
  line.appendChild(cursor);
  log.appendChild(line);

  let i = 0;
  function typeChar() {
    if (i < text.length) {
      span.textContent += text[i++];
      log.scrollTop = log.scrollHeight;
      setTimeout(typeChar, 18 + Math.random() * 20);
    } else {
      cursor.remove();
    }
  }
  typeChar();
}

// === ADA Command Handler ===
function handleAdaCommand(cmd) {
  simulateTyping("> " + cmd, "You");
  const res = respondTo(cmd);
  setTimeout(() => simulateTyping(res), 300);
}

// === Map Display ===
function updateMapDisplay() {
  const [x, y] = game.position;
  let out = "";
  for (let i = 0; i < game.map.length; i++) {
    for (let j = 0; j < game.map[i].length; j++) {
      out += (i === x && j === y) ? "● " : game.map[i][j] + " ";
    }
    out += "\n";
  }
  return out;
}

// === Status Display ===
function updateStatus() {
  document.getElementById("turn-counter").textContent = game.turn;
  document.getElementById("sanity-bar").textContent = game.sanity;
}
</script>
