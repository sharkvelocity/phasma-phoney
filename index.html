<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Phasma‑Phoney</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100%;
      width: 100%;
      background-color: #000;
      font-family: monospace;
    }
    body {
      background: url('Van_N.png') no-repeat center center fixed;
      background-size: cover;
      transition: background 0.8s ease-in-out;
    }
    #flash-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: white;
      opacity: 0;
      pointer-events: none;
      z-index: 9999;
    }
    #orb-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 0;
    }
    footer {
      position: fixed;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      font-size: 0.9em;
      font-family: sans-serif;
      z-index: 9999;
    }
    button {
      background: #111;
      color: #0ff;
      border: 1px solid #444;
      padding: 6px 10px;
      margin: 3px;
      cursor: pointer;
    }
    button:hover {
      background: #222;
      color: #fff;
    }

    /* === GAME UI SPLIT === */
    #game-ui {
      display: none;
      position: fixed;
      top: 10%;
      left: 5%;
      width: 90%;
      height: 80%;
      z-index: 1500;
      pointer-events: none;
    }
    #game-log {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: calc(100% - 100px);
      background-color: rgba(0, 0, 0, 0.6);
      color: #0ff;
      padding: 20px;
      overflow-y: auto;
      border: 1px solid #0ff;
      pointer-events: auto;
    }
    #game-options {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      background-color: rgba(0, 0, 0, 0.85);
      padding: 10px;
      border-top: 1px solid #0ff;
      pointer-events: auto;
    }

    /* === NOTEBOOK POPUP === */
    #notebook {
      display: none;
      position: fixed;
      top: 10%;
      left: 50%;
      transform: translateX(-50%);
      width: 500px;
      max-height: 70vh;
      overflow-y: auto;
      background: rgba(20,20,20,0.95);
      color: #0ff;
      border: 2px solid #0ff;
      border-radius: 10px;
      padding: 20px;
      font-family: monospace;
      z-index: 10000;
    }
    #notebook h2 {
      text-align: center;
      margin-bottom: 10px;
    }
    .evidence-checkbox {
      margin-bottom: 5px;
      display: block;
    }

    /* === DRAG/DROP LOADOUT === */
    #loadout-screen {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 600px;
      background: #111;
      color: #0ff;
      border: 2px solid #444;
      border-radius: 10px;
      padding: 20px;
      z-index: 2000;
      font-family: monospace;
    }
    .drag-container {
      display: flex;
      justify-content: space-between;
      margin-top: 10px;
    }
    .item-box {
      width: 45%;
      min-height: 150px;
      border: 1px solid #444;
      padding: 10px;
      background: rgba(0,0,0,0.5);
    }
    .drag-item {
      margin: 5px;
      padding: 4px 8px;
      background: #222;
      border: 1px solid #555;
      cursor: grab;
    }

    /* === VAN MONITOR POPUP === */
    #monitorPopup {
      display: none;
      position: fixed;
      top: 10%;
      left: 50%;
      transform: translateX(-50%);
      width: 500px;
      height: 300px;
      background: rgba(0,0,0,0.9);
      border: 2px solid #0ff;
      border-radius: 10px;
      z-index: 10000;
      text-align: center;
      color: #0ff;
      overflow: hidden;
    }
    #monitorView {
      width: 100%;
      height: 100%;
      background: #000;
      position: relative;
    }
    .monitor-orb, .monitor-dots {
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #0ff;
      opacity: 0.8;
    }

    /* === WEATHER VISUALS === */
    #weather-fog {
      position: fixed;
      top:0;left:0;
      width:100%;height:100%;
      background: url('fog.png') repeat;
      opacity:0;
      z-index:1;
      pointer-events:none;
      transition: opacity 1s;
    }
    #weather-rain {
      position: fixed;
      top:0;left:0;
      width:100%;height:100%;
      pointer-events:none;
      z-index:1;
      background: repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0.2) 0px,
        rgba(255,255,255,0.2) 2px,
        transparent 2px,
        transparent 10px
      );
      background-size: 100% 100px;
      animation: rain 0.3s linear infinite;
      opacity:0;
      transition:opacity 1s;
    }
    @keyframes rain {
      from {background-position:0 0;}
      to {background-position:0 100px;}
    }
    #weather-bloodmoon {
      position: fixed;
      top:0;left:0;
      width:100%;height:100%;
      background: rgba(100,0,0,0.3);
      z-index:1;
      pointer-events:none;
      opacity:0;
      transition:opacity 1s;
    }
  </style>
</head>
<body>
  <div id="flash-overlay"></div>
  <canvas id="orb-canvas"></canvas>
  <div id="weather-fog"></div>
  <div id="weather-rain"></div>
  <div id="weather-bloodmoon"></div>
  <footer>Shark-Blades — Inspired by Phasmophobia.</footer>

  <!-- NOTEBOOK -->
  <div id="notebook">
    <h2>Notebook</h2>
    <div id="evidence-section">
      <label class="evidence-checkbox"><input type="checkbox" value="EMF Level 5"> EMF Level 5</label>
      <label class="evidence-checkbox"><input type="checkbox" value="Spirit Box"> Spirit Box</label>
      <label class="evidence-checkbox"><input type="checkbox" value="Fingerprints"> Fingerprints</label>
      <label class="evidence-checkbox"><input type="checkbox" value="Ghost Writing"> Ghost Writing</label>
      <label class="evidence-checkbox"><input type="checkbox" value="Freezing Temps"> Freezing Temps</label>
      <label class="evidence-checkbox"><input type="checkbox" value="D.O.T.S"> D.O.T.S</label>
      <label class="evidence-checkbox"><input type="checkbox" value="Ghost Orb"> Ghost Orb</label>
    </div>
    <button id="guessFromNotebook">Guess Ghost</button>
    <button id="closeNotebook">Close</button>
  </div>

  <!-- MONITOR -->
  <div id="monitorPopup">
    <h3>Video Monitor</h3>
    <div id="monitorView"></div>
    <button id="closeMonitor">Close</button>
  </div>

  <!-- LOADOUT -->
  <div id="loadout-screen">
    <h2 style="text-align:center;">Select Your Loadout</h2>
    <div class="drag-container">
      <div class="item-box" id="van-items"></div>
      <div class="item-box" id="held-items"></div>
    </div>
    <p style="font-size:0.85em;margin-top:10px;color:#ccc;">Drag up to 3 items to your held items. Notebook & Lighter always included.</p>
    <div style="text-align:center;margin-top:20px;">
      <button id="confirm-loadout">Confirm</button>
    </div>
  </div>

  <!-- GAME UI -->
  <div id="game-ui">
    <div id="voice-controls" style="margin-bottom:5px;text-align:right;pointer-events:auto;">
      Voice: <select id="voiceSelect"></select>
      <button id="voiceToggle">Mute</button>
      <button id="rulesBtn">Rules</button>
      <button id="openNotebook">Notebook</button>
      <button id="openMonitor">Monitor</button>
    </div>
    <div id="game-log"></div>
    <div id="game-options"></div>
  </div>
<script>
/* === DOM + GAME STATE === */
const gameLog=document.getElementById('game-log');
const gameOptions=document.getElementById('game-options');
const loadoutScreen=document.getElementById('loadout-screen');
const gameUI=document.getElementById('game-ui');
const voiceSelect=document.getElementById('voiceSelect');
const voiceToggle=document.getElementById('voiceToggle');
const notebook=document.getElementById('notebook');
const monitorPopup=document.getElementById('monitorPopup');
const monitorView=document.getElementById('monitorView');

const game={
  inventory:[],vanStock:{},playerRoom:"Van",
  ghostRoom:null,currentGhost:null,mimicForm:null,
  mimicShift:0,sanity:100,turn:0,foundEvidence:[],
  started:false,droppedItems:{},activeHunt:false,
  crucifixUsed:false,smudgeUsed:false,huntCooldown:0,
  weather:"Clear",cameraPlacedRooms:[]
};

/* === MAP VISUALS & WEATHER === */
const roomVisuals={
  "Van":"Van_N.png","Living Room":"LivingRoom_N.png",
  "Kitchen":"Kitchen_N.png","Bathroom":"Bathroom_N.png",
  "Bedroom":"Bedroom_N.png","Garage":"Garage_N.png",
  "Basement":"Basement_N.png"
};
function updateMapVisual(){
  const bg=roomVisuals[game.playerRoom]||"Van_N.png";
  document.body.style.background=`url('${bg}') no-repeat center center fixed`;
  document.body.style.backgroundSize="cover";
}
const weathers=["Clear","Rain","Bloodmoon","Fog"];
function chooseWeather(){
  game.weather=weathers[Math.floor(Math.random()*weathers.length)];
  document.getElementById('weather-rain').style.opacity=(game.weather==="Rain")?1:0;
  document.getElementById('weather-fog').style.opacity=(game.weather==="Fog")?0.4:0;
  document.getElementById('weather-bloodmoon').style.opacity=(game.weather==="Bloodmoon")?0.4:0;
  log("Current Weather: "+game.weather);
}

/* === ADA VOICE === */
let adaVoice=null,adaSpeak=true;
function loadVoices(){
  const voices=speechSynthesis.getVoices().filter(v=>v.lang.startsWith("en"));
  voiceSelect.innerHTML="";
  voices.forEach((v,i)=>{
    const opt=document.createElement("option");
    opt.value=i;opt.textContent=v.name;
    voiceSelect.appendChild(opt);
  });
  if(voices.length) adaVoice=voices.find(v=>v.name.toLowerCase().includes("female"))||voices[0];
}
voiceSelect.onchange=()=>{adaVoice=speechSynthesis.getVoices()[voiceSelect.value];};
voiceToggle.onclick=()=>{adaSpeak=!adaSpeak;voiceToggle.textContent=adaSpeak?"Mute":"Unmute";};
speechSynthesis.onvoiceschanged=loadVoices;

/* === LOG FUNCTION (NO ADA:, NO EMOJIS) === */
function log(msg){
  const line=document.createElement('div');
  line.textContent=msg;
  line.style.marginBottom='6px';
  line.style.whiteSpace='pre-wrap';
  gameLog.appendChild(line);
  gameLog.scrollTop=gameLog.scrollHeight;
  if(adaSpeak && adaVoice){
    setTimeout(()=>{
      const utter=new SpeechSynthesisUtterance(msg);
      utter.voice=adaVoice;
      speechSynthesis.cancel();
      speechSynthesis.speak(utter);
    },150);
  }
  saveGame();
}

/* === SAVE/LOAD === */
function saveGame(){localStorage.setItem("phasmaGame",JSON.stringify(game));}
function loadGame(){
  const data=localStorage.getItem("phasmaGame");
  if(!data) return false;
  Object.assign(game,JSON.parse(data));
  updateMapVisual();
  return true;
}

/* === GHOST PROFILES === */
const ghostProfiles=[
  {name:"Spirit",evidence:["EMF","Spirit Box","Ghost Writing"]},
  {name:"Wraith",evidence:["EMF","Spirit Box","D.O.T.S"]},
  {name:"Phantom",evidence:["Spirit Box","Fingerprints","D.O.T.S"]},
  {name:"Poltergeist",evidence:["Spirit Box","Fingerprints","Ghost Writing"]},
  {name:"Banshee",evidence:["Fingerprints","Ghost Orb","D.O.T.S"]},
  {name:"Jinn",evidence:["EMF","Fingerprints","Freezing"]},
  {name:"Mare",evidence:["Spirit Box","Ghost Orb","Ghost Writing"]},
  {name:"Revenant",evidence:["Ghost Orb","Ghost Writing","Freezing"]},
  {name:"Shade",evidence:["EMF","Ghost Writing","Freezing"]},
  {name:"Demon",evidence:["Fingerprints","Ghost Writing","Freezing"]},
  {name:"Yurei",evidence:["Ghost Orb","Freezing","D.O.T.S"]},
  {name:"Oni",evidence:["EMF","Freezing","D.O.T.S"]},
  {name:"Yokai",evidence:["Spirit Box","Ghost Orb","D.O.T.S"]},
  {name:"Hantu",evidence:["Fingerprints","Ghost Orb","Freezing"]},
  {name:"Goryo",evidence:["EMF","Fingerprints","D.O.T.S"]},
  {name:"Myling",evidence:["EMF","Fingerprints","Ghost Writing"]},
  {name:"Onryo",evidence:["Spirit Box","Ghost Orb","Freezing"]},
  {name:"The Twins",evidence:["EMF","Spirit Box","Freezing"]},
  {name:"Raiju",evidence:["EMF","Ghost Orb","D.O.T.S"]},
  {name:"Obake",evidence:["EMF","Fingerprints","Ghost Orb"]},
  {name:"The Mimic",evidence:["Spirit Box","Fingerprints","Freezing"]},
  {name:"Moroi",evidence:["Spirit Box","Ghost Writing","Freezing"]},
  {name:"Deogen",evidence:["Spirit Box","Ghost Writing","D.O.T.S"]},
  {name:"Thaye",evidence:["Ghost Orb","Ghost Writing","D.O.T.S"]},
  {name:"Succubus",evidence:["Spirit Box","Ghost Writing","D.O.T.S"]}
];
const rooms=["Van","Living Room","Kitchen","Bathroom","Bedroom","Garage","Basement"];

/* === START INVESTIGATION === */
function startInvestigation(){
  game.currentGhost=ghostProfiles[Math.floor(Math.random()*ghostProfiles.length)];
  game.ghostRoom=rooms[Math.floor(Math.random()*(rooms.length-1))+1];
  game.turn=1;
  game.foundEvidence=[];
  game.mimicForm=null;
  game.mimicShift=3+Math.floor(Math.random()*4);
  chooseWeather();
  updateMapVisual();
  log("Ghost profile initialized. Begin your investigation.");
  renderActionButtons();
}

/* === ACTION BUTTONS === */
function renderActionButtons(){
  gameOptions.innerHTML="";
  [
    {label:"Move",handler:openMoveMenu},
    {label:"Use Item",handler:openItemMenu},
    {label:"Drop/Pick Item",handler:openDropMenu},
    {label:"Van Swap",handler:openVanMenu},
    {label:"Notebook",handler:()=>{notebook.style.display='block';}},
    {label:"Guess Ghost",handler:openGuessMenu},
    {label:"End Turn",handler:endTurn}
  ].forEach(btn=>{
    const b=document.createElement("button");
    b.textContent=btn.label;
    b.onclick=btn.handler;
    gameOptions.appendChild(b);
  });
}

/* === MOVE MENU === */
function openMoveMenu(){
  gameOptions.innerHTML="<p>Select a room to move to:</p>";
  rooms.forEach(r=>{
    const btn=document.createElement("button");
    btn.textContent=r;
    btn.onclick=()=>{
      game.playerRoom=r;
      updateMapVisual();
      log("You moved to the "+r+".");
      renderActionButtons();
    };
    gameOptions.appendChild(btn);
  });
}

/* === ITEM USAGE === */
function openItemMenu(){
  gameOptions.innerHTML="<p>Select an item to use:</p>";
  game.inventory.forEach(i=>{
    const btn=document.createElement("button");
    btn.textContent=i;
    btn.onclick=()=>{useItem(i);renderActionButtons();};
    gameOptions.appendChild(btn);
  });
}
function useItem(item){
  const evMap={
    "EMF":"EMF","Spirit Box":"Spirit Box","Camera":"Ghost Orb",
    "UV Light":"Fingerprints","Thermometer":"Freezing",
    "D.O.T.S":"D.O.T.S","Book":"Ghost Writing"
  };
  const ev=evMap[item];
  const inGhostRoom=(game.playerRoom===game.ghostRoom);
  const isMimic=game.currentGhost.name==="The Mimic";
  const mimicEvidence=game.mimicForm?game.mimicForm.evidence:[];
  const evidenceList=(isMimic&&game.mimicForm)?mimicEvidence:game.currentGhost.evidence;
  if(item==="Camera" && inGhostRoom && !game.cameraPlacedRooms.includes(game.playerRoom)){
    game.cameraPlacedRooms.push(game.playerRoom);
    log("You placed a camera in this room.");
  }
  if(!inGhostRoom){log("You use the "+item+", but nothing happens.");return;}
  if(evidenceList.includes(ev)){
    if(Math.random()<=(Math.random()*(0.85-0.5)+0.5)){ //50–85% random chance
      if(!game.foundEvidence.includes(ev)){
        game.foundEvidence.push(ev);
        log("Evidence confirmed: "+ev);
      }else log("You’ve already found that evidence.");
    } else log(item+" gave no reading this time.");
  }else log(item+" shows no useful reading.");
}

/* === ORBS VISIBILITY === */
function shouldShowOrbs(){
  return game.foundEvidence.includes("Ghost Orb") && game.playerRoom===game.ghostRoom;
}

/* === DROP / PICK ITEMS === */
function openDropMenu(){
  gameOptions.innerHTML="<p>Drop or pick up items:</p>";
  const room=game.playerRoom;
  if(!game.droppedItems[room]) game.droppedItems[room]=[];
  game.inventory.filter(i=>!["Notebook","Lighter"].includes(i)).forEach(i=>{
    const btn=document.createElement("button");
    btn.textContent="Drop "+i;
    btn.onclick=()=>{
      game.droppedItems[room].push(i);
      game.inventory=game.inventory.filter(x=>x!==i);
      log("You dropped "+i+" in the "+room+".");
      renderActionButtons();
    };
    gameOptions.appendChild(btn);
  });
  if(game.droppedItems[room].length){
    gameOptions.appendChild(document.createElement("hr"));
    game.droppedItems[room].forEach(i=>{
      const btn=document.createElement("button");
      btn.textContent="Pick "+i;
      btn.onclick=()=>{
        if(game.inventory.length>=5){log("You can't carry more items.");return;}
        game.inventory.push(i);
        game.droppedItems[room]=game.droppedItems[room].filter(x=>x!==i);
        log("You picked up "+i+".");
        renderActionButtons();
      };
      gameOptions.appendChild(btn);
    });
  }
  const cancel=document.createElement("button");
  cancel.textContent="Cancel";
  cancel.onclick=()=>renderActionButtons();
  gameOptions.appendChild(cancel);
}

/* === VAN SWAP === */
function openVanMenu(){
  if(game.playerRoom!=="Van"){log("You must be in the van to swap items.");renderActionButtons();return;}
  gameOptions.innerHTML="<p>Swap items from van:</p>";
  for(let tool in game.vanStock){
    const btn=document.createElement("button");
    btn.textContent="Take "+tool+" ("+game.vanStock[tool]+")";
    btn.onclick=()=>{
      if(game.inventory.length>=5){log("You can't carry more items.");return;}
      game.inventory.push(tool);
      game.vanStock[tool]--;
      if(game.vanStock[tool]<=0) delete game.vanStock[tool];
      log("You took "+tool+" from the van.");
      renderActionButtons();
    };
    gameOptions.appendChild(btn);
  }
  game.inventory.filter(i=>!["Notebook","Lighter"].includes(i)).forEach(i=>{
    const btn=document.createElement("button");
    btn.textContent="Return "+i;
    btn.onclick=()=>{
      game.inventory=game.inventory.filter(x=>x!==i);
      game.vanStock[i]=(game.vanStock[i]||0)+1;
      log("You returned "+i+" to the van.");
      renderActionButtons();
    };
    gameOptions.appendChild(btn);
  });
}

/* === MONITOR VIEW === */
document.getElementById('openMonitor').onclick=()=>{
  monitorPopup.style.display='block';
  monitorView.innerHTML="";
  if(game.cameraPlacedRooms.includes(game.ghostRoom)){
    if(game.currentGhost.evidence.includes("Ghost Orb")){
      for(let i=0;i<5;i++){
        const orb=document.createElement('div');
        orb.className="monitor-orb";
        orb.style.left=Math.random()*480+"px";
        orb.style.top=Math.random()*280+"px";
        monitorView.appendChild(orb);
      }
    }
    if(game.currentGhost.name==="Goryo"||game.currentGhost.evidence.includes("D.O.T.S")){
      const dots=document.createElement('div');
      dots.className="monitor-dots";
      dots.style.left=Math.random()*480+"px";
      dots.style.top=Math.random()*280+"px";
      dots.style.background="#0f0";
      monitorView.appendChild(dots);
    }
  } else monitorView.innerHTML="<p style='color:#555'>No camera feed</p>";
};
document.getElementById('closeMonitor').onclick=()=>monitorPopup.style.display='none';

/* === NOTEBOOK === */
document.getElementById('openNotebook').onclick=()=>{notebook.style.display='block';};
document.getElementById('closeNotebook').onclick=()=>{notebook.style.display='none';};
document.getElementById('guessFromNotebook').onclick=()=>{
  openGuessMenu();
  notebook.style.display='none';
};

/* === GUESS GHOST === */
function openGuessMenu(){
  gameOptions.innerHTML="<p>Who do you think it is?</p>";
  ghostProfiles.forEach(g=>{
    const btn=document.createElement("button");
    btn.textContent=g.name;
    btn.onclick=()=>{
      if(g.name===game.currentGhost.name){
        log("Correct! The ghost was a "+g.name+".");
      } else log("Wrong. It was actually a "+game.currentGhost.name+".");
      gameOptions.innerHTML="<button onclick='location.reload()'>Restart Game</button>";
    };
    gameOptions.appendChild(btn);
  });
}

/* === END TURN === */
function endTurn(){
  game.turn++;
  game.sanity-=Math.floor(Math.random()*6+3);
  if(game.sanity<0) game.sanity=0;
  log("Turn "+game.turn+" complete. Sanity: "+game.sanity+"%");
  const ambients=["A cold chill passes your neck...","You hear distant footsteps...",
  "The walls creak with age...","A soft hum echoes from nowhere...","Your breath hangs in the air."];
  if(Math.random()<0.6) log(ambients[Math.floor(Math.random()*ambients.length)]);
  if(game.currentGhost.name==="The Mimic"){
    game.mimicShift--;
    if(game.mimicShift<=0){
      let pool=ghostProfiles.filter(g=>g.name!=="The Mimic");
      game.mimicForm=pool[Math.floor(Math.random()*pool.length)];
      game.mimicShift=3+Math.floor(Math.random()*4);
      log("Something about the ghost's behavior seems to shift...");
    }
  }
  const huntChance=(100-game.sanity)/100;
  const isInGhostRoom=game.playerRoom===game.ghostRoom;
  if(game.huntCooldown>0) game.huntCooldown--;
  else if(isInGhostRoom && Math.random()<huntChance){
    game.huntCooldown=3+Math.floor(Math.random()*3);
    log("Your flashlight begins flickering...");
    log("The ghost is hunting!");
    if(!game.crucifixUsed && game.inventory.includes("Crucifix")){
      game.crucifixUsed=true;
      log("Your crucifix flares and burns — a hunt was prevented!");
    }else if(!game.smudgeUsed && game.inventory.includes("Smudge")){
      game.smudgeUsed=true;
      log("You burn a smudge stick! The ghost recoils and vanishes!");
    }else{
      log("You feel the breath of death. The ghost has caught you.");
      gameOptions.innerHTML="<button onclick='location.reload()'>Restart</button>";
      return;
    }
  }
  renderActionButtons();
}

/* === CONFIRM LOADOUT DRAG === */
const vanBox=document.getElementById('van-items');
const heldBox=document.getElementById('held-items');
const allLoadout=["EMF","Spirit Box","Camera","UV Light","D.O.T.S","Thermometer","Book","Smudge","Crucifix","Salt"];
allLoadout.forEach(tool=>{
  const div=document.createElement('div');
  div.className='drag-item';
  div.textContent=tool;
  div.draggable=true;
  div.ondragstart=e=>{e.dataTransfer.setData("text/plain",tool);};
  vanBox.appendChild(div);
});
[vanBox,heldBox].forEach(box=>{
  box.ondragover=e=>{e.preventDefault();};
  box.ondrop=e=>{
    e.preventDefault();
    const tool=e.dataTransfer.getData("text/plain");
    if(box===heldBox && heldBox.childNodes.length>=3){alert("Max 3 items!");return;}
    let fromBox=box===heldBox?vanBox:heldBox;
    [...fromBox.childNodes].forEach(n=>{if(n.textContent===tool){fromBox.removeChild(n);}});
    const newDiv=document.createElement('div');
    newDiv.className='drag-item';
    newDiv.textContent=tool;
    newDiv.draggable=true;
    newDiv.ondragstart=ev=>{ev.dataTransfer.setData("text/plain",tool);};
    box.appendChild(newDiv);
  };
});
document.getElementById('confirm-loadout').onclick=()=>{
  game.inventory=[...heldBox.childNodes].map(n=>n.textContent);
  game.vanStock={};game.foundEvidence=[];game.droppedItems={};
  game.sanity=100;game.turn=0;game.started=true;
  game.playerRoom="Van";game.crucifixUsed=false;game.smudgeUsed=false;game.huntCooldown=0;
  allLoadout.forEach(tool=>{if(!game.inventory.includes(tool)){game.vanStock[tool]=(tool==="Smudge"?2:tool==="Salt"?3:1);}});
  game.inventory.push("Notebook","Lighter");
  loadoutScreen.style.display='none';
  gameUI.style.display='block';
  log("Loadout confirmed: "+game.inventory.join(', '));
  log("You are in the van. Your investigation begins.");
  setTimeout(()=>{if(game.started) startInvestigation();},400);
};

/* === SPIRIT ORBS === */
const orbCanvas=document.getElementById('orb-canvas');
const ctx=orbCanvas.getContext('2d');
let width=orbCanvas.width=window.innerWidth;
let height=orbCanvas.height=window.innerHeight;
function createOrb(){
  return {
    x:Math.random()*width,y:Math.random()*height,
    vx:(Math.random()-0.5)*(0.2+Math.random()*0.5),
    vy:(Math.random()-0.5)*(0.2+Math.random()*0.5),
    baseRadius:2+Math.random()*3,
    radius:0,opacity:0,fadeIn:Math.random()>0.5,
    tick:Math.random()*1000,lifetime:200+Math.random()*400,
    pulseSpeed:0.02+Math.random()*0.03
  };
}
let orbs=Array.from({length:10},createOrb);
function animateOrbs(){
  ctx.clearRect(0,0,width,height);
  if(shouldShowOrbs()){
    orbs.forEach(o=>{
      o.tick++;o.lifetime--;
      if(o.fadeIn){
        o.opacity+=0.005+Math.random()*0.01;
        if(o.opacity>0.6+Math.random()*0.3) o.fadeIn=false;
      }else{
        o.opacity-=0.002+Math.random()*0.005;
        if(o.opacity<=0.05||o.lifetime<=0) Object.assign(o,createOrb());
      }
      o.radius=o.baseRadius+Math.sin(o.tick*o.pulseSpeed)*1.5;
      o.x+=o.vx;o.y+=o.vy;
      if(Math.random()<0.01){o.vx+=(Math.random()-0.5)*0.05;o.vy+=(Math.random()-0.5)*0.05;}
      if(o.x<0||o.x>width) o.vx*=-1;
      if(o.y<0||o.y>height) o.vy*=-1;
      const g=ctx.createRadialGradient(o.x,o.y,0,o.x,o.y,o.radius*2);
      g.addColorStop(0,`rgba(255,255,255,${o.opacity})`);
      g.addColorStop(0.4,`rgba(180,220,255,${o.opacity*0.6})`);
      g.addColorStop(1,`rgba(100,150,255,0)`);
      ctx.beginPath();
      ctx.fillStyle=g;
      ctx.ellipse(o.x,o.y,o.radius*(1+Math.sin(o.tick*0.05)*0.3),o.radius,0,0,Math.PI*2);
      ctx.fill();
    });
  }
  requestAnimationFrame(animateOrbs);
}
animateOrbs();
window.addEventListener('resize',()=>{
  width=orbCanvas.width=window.innerWidth;
  height=orbCanvas.height=window.innerHeight;
});

/* === AUTO START === */
document.addEventListener("DOMContentLoaded",()=>{
  if(!loadGame()) loadoutScreen.style.display='block';
  else{gameUI.style.display='block';renderActionButtons();}
});
</script>
