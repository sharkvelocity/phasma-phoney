<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Phasma‑Phoney v2.3.5 — Full Master Build</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Turn-based ghost investigation horror with notebook, cursed items, van monitor, orbs, bloodmoon, hunts, and personality-driven events." />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background: black;
      overflow: hidden;
      font-family: monospace;
      color: #eee;
    }

    /* === TITLE SCREEN === */
    #title-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: black;
      z-index: 100;
      transition: opacity 1.5s ease;
    }
    #title-screen img {
      max-width: 50%;
      max-height: 50%;
      animation: pulse 5s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.9; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.04); }
    }
    #startButton {
      margin-top: 20px;
      padding: 14px 36px;
      font-size: 22px;
      background: #111;
      color: #eee;
      border: 2px solid #444;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    #startButton:hover { background: #222; border-color: #888; }

    /* === MAIN SCENE === */
    #main-scene {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: none;
      overflow: hidden;
      background: black;
    }
    #background, #rain-layer, #lightning, #foreground, #fog-layer, #orbCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    #background { z-index: 1; background-size: cover; background-position: center; }
    #rain-layer { z-index: 2; pointer-events: none; }
    #lightning { z-index: 3; background: white; opacity: 0; pointer-events: none; transition: opacity 0.2s ease; }
    #foreground { z-index: 4; pointer-events: none; }
    #fog-layer { z-index: 5; pointer-events: none; }
    #orbCanvas { z-index: 6; pointer-events: none; }

    /* === HUD & GAME LOG === */
    #hud {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0,0,0,0.5);
      padding: 8px 12px;
      border: 1px solid #444;
      font-size: 14px;
      z-index: 11;
    }
    #sanity-bar-container {
      width: 120px;
      height: 10px;
      background: #222;
      border: 1px solid #555;
      margin-top: 4px;
      position: relative;
    }
    #sanity-bar {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      background: #0f0;
      width: 100%;
      transition: width 0.3s ease;
    }
    #inventory-display {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0,0,0,0.5);
      padding: 6px 10px;
      border: 1px solid #444;
      font-size: 12px;
      z-index: 11;
    }
    #narrator-ui {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 35%;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(4px);
      display: none;
      flex-direction: column;
      justify-content: space-between;
      z-index: 10;
    }
    #game-log {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      font-size: 14px;
      line-height: 1.4;
    }
    #game-log::-webkit-scrollbar { width: 6px; }
    #game-log::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
    .log-entry { opacity: 0.85; transition: opacity 1s ease-in-out; }
    .log-entry.fade { opacity: 0.4; }
    #command-buttons {
      display: flex;
      justify-content: space-around;
      padding: 8px;
      border-top: 1px solid #555;
      background: rgba(0,0,0,0.5);
    }
    #command-buttons button {
      padding: 8px 12px;
      background: #222;
      color: #eee;
      border: 1px solid #555;
      cursor: pointer;
      font-size: 14px;
    }
    #command-buttons button:hover { background: #333; }

    /* === LOADOUT === */
    #loadout-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0,0,0,0.9);
      display: none;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 200;
    }
    #loadout-container {
      background: #111;
      padding: 20px;
      border: 1px solid #555;
      max-width: 500px;
      width: 90%;
      color: #eee;
    }
    #loadout-sections { display: flex; justify-content: space-between; gap: 20px; }
    .loadout-side { flex: 1; background: #222; padding: 10px; border: 1px solid #444; }
    .loadout-side h4 { margin: 0 0 6px; font-size: 14px; color: #0f0; }
    .item-row { display: flex; justify-content: space-between; align-items: center; margin: 2px 0; }
    .item-row button { background: #333; color: #eee; border: 1px solid #555; padding: 2px 6px; cursor: pointer; font-size: 12px; }
    .item-row button:hover { background: #444; }
    #confirm-loadout { margin-top: 10px; padding: 8px 12px; background: #111; color: #eee; border: 1px solid #555; cursor: pointer; }

    /* === NOTEBOOK OVERLAY === */
    #notebook-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0,0,0,0.8);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 400;
    }
    #notebook {
      background: url('notebook-paper.png') no-repeat center center;
      background-size: cover;
      width: 500px;
      height: 600px;
      padding: 20px;
      font-family: "Comic Sans MS", cursive, sans-serif;
      color: #111;
      box-shadow: 0 0 20px rgba(0,0,0,0.8);
    }
    #notebook h3 {
      text-align: center;
      margin-bottom: 10px;
      font-size: 18px;
      text-decoration: underline;
    }
    .evidence-row {
      display: flex;
      justify-content: space-between;
      margin: 4px 0;
      font-size: 14px;
    }
    .ghost-list {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #555;
      font-size: 13px;
    }
    .ghost-list span {
      display: inline-block;
      width: 48%;
      margin: 2px 0;
      color: #444;
    }
    .ghost-list span.possible {
      color: #000;
      font-weight: bold;
    }
    #close-notebook {
      display: block;
      margin: 15px auto 0 auto;
      padding: 6px 12px;
      background: #222;
      color: #eee;
      border: 1px solid #555;
      cursor: pointer;
    }
    #close-notebook:hover { background: #333; }

    footer {
      position: fixed;
      bottom: 0;
      width: 100%;
      text-align: center;
      background: #111;
      color: #555;
      font-size: 10px;
      padding: 2px 0;
      z-index: 500;
    }
  </style>
</head>
<body>
  <!-- === TITLE SCREEN === -->
  <div id="title-screen">
    <img src="logo.png" alt="Phasma-Phoney Logo" />
    <button id="startButton">Start New Game</button>
  </div>

  <!-- === MAIN SCENE === -->
  <div id="main-scene">
    <div id="background"></div>
    <canvas id="rain-layer"></canvas>
    <div id="lightning"></div>
    <canvas id="orbCanvas"></canvas>
  </div>

  <!-- === HUD === -->
  <div id="hud">
    <div>Location: <span id="hud-location">Van</span> | Weather: <span id="hud-weather">--</span></div>
    <div>Turns: <span id="hud-turns">0</span></div>
    <div>Sanity:</div>
    <div id="sanity-bar-container"><div id="sanity-bar"></div></div>
    <div>Temp: <span id="hud-temp">--°C</span></div>
  </div>

  <!-- === INVENTORY DISPLAY (TOP RIGHT) === -->
  <div id="inventory-display">
    <div>Held:</div>
    <div id="held-items-display">None</div>
  </div>

  <!-- === NARRATOR & COMMAND BUTTONS === -->
  <div id="narrator-ui">
    <div id="game-log"></div>
    <div id="command-buttons">
      <button data-cmd="move">Move</button>
      <button data-cmd="look">Look Around</button>
      <button data-cmd="inventory">Inventory</button>
      <button data-cmd="monitor">Monitor</button>
      <button data-cmd="notebook">Notebook</button>
      <button data-cmd="guess">Ghost Guess</button>
    </div>
  </div>

  <!-- === LOADOUT SCREEN === -->
  <div id="loadout-screen">
    <div id="loadout-container">
      <h3>Select Your Starting Loadout (Max 3 Items)</h3>
      <div id="loadout-sections">
        <div class="loadout-side" id="van-side">
          <h4>Van Inventory</h4>
          <div id="van-list"></div>
        </div>
        <div class="loadout-side" id="held-side">
          <h4>Holding (0/3)</h4>
          <div id="held-list"></div>
        </div>
      </div>
      <button id="confirm-loadout">Confirm</button>
    </div>
  </div>

  <!-- === INVENTORY OVERLAY === -->
  <div id="inventory-overlay">
    <div id="inventory-options">
      <div class="inventory-side" id="inventory-held-side"></div>
      <div class="inventory-side" id="inventory-room-side"></div>
    </div>
  </div>

  <!-- === NOTEBOOK OVERLAY === -->
  <div id="notebook-overlay">
    <div id="notebook">
      <h3>Evidence</h3>
      <div class="evidence-row">
        <label><input type="checkbox" class="evidence-check" value="EMF Level 5"> EMF Level 5</label>
        <label><input type="checkbox" class="evidence-check" value="D.O.T.S"> D.O.T.S Projector</label>
      </div>
      <div class="evidence-row">
        <label><input type="checkbox" class="evidence-check" value="Fingerprints"> Fingerprints</label>
        <label><input type="checkbox" class="evidence-check" value="Ghost Orb"> Ghost Orb</label>
      </div>
      <div class="evidence-row">
        <label><input type="checkbox" class="evidence-check" value="Ghost Writing"> Ghost Writing</label>
        <label><input type="checkbox" class="evidence-check" value="Spirit Box"> Spirit Box</label>
      </div>
      <div class="evidence-row">
        <label><input type="checkbox" class="evidence-check" value="Freezing Temps"> Freezing Temperatures</label>
      </div>
      <div class="ghost-list" id="possible-ghosts"></div>
      <button id="close-notebook">Close Notebook</button>
    </div>
  </div>

  <!-- === GUESS POPUP === -->
  <div id="guess-popup">
    <div id="guess-list"></div>
  </div>

  <!-- === MONITOR OVERLAY === -->
  <div id="monitor-overlay">
    <div id="monitor-border"></div>
    <canvas id="orb-game-canvas"></canvas>
    <div id="orb-game-score"></div>
    <div id="orb-game-timer"></div>
    <div id="flip-clock"></div>
  </div>

  <footer>Phasma‑Phoney v2.3.5 — Full Master Build</footer>
<script>
/* === GLOBAL CONSTANTS & GAME STATE === */
const allLoadoutItems = [
  "EMF Reader","Spirit Box","Camera","UV Light","D.O.T.S Projector",
  "Thermometer","Ghost Writing Book","Video Camera","Crucifix",
  "Smudge Stick","Salt","Parabolic Microphone","Motion Sensor","Sound Sensor"
];
const ghostProfiles = {
  Spirit:{evidence:["EMF Level 5","Spirit Box","Ghost Writing"],behavior:"Average activity, standard hunts."},
  Wraith:{evidence:["EMF Level 5","Spirit Box","D.O.T.S"],behavior:"Rarely touches ground, teleports to player."},
  Phantom:{evidence:["Spirit Box","Fingerprints","D.O.T.S"],behavior:"Looking at it drops sanity quickly."},
  Poltergeist:{evidence:["Spirit Box","Fingerprints","Ghost Writing"],behavior:"Throws multiple objects at once."},
  Banshee:{evidence:["Fingerprints","Ghost Orb","D.O.T.S"],behavior:"Targets one player, shrieks on parabolic."},
  Jinn:{evidence:["EMF Level 5","Fingerprints","Freezing Temps"],behavior:"Fast when far, kills power to slow hunts."},
  Mare:{evidence:["Spirit Box","Ghost Writing","Ghost Orb"],behavior:"Prefers darkness, more active with lights off."},
  Revenant:{evidence:["Ghost Writing","Ghost Orb","Freezing Temps"],behavior:"Slow if not hunting, fast when hunting."},
  Shade:{evidence:["EMF Level 5","Ghost Writing","Freezing Temps"],behavior:"Shy, less active with multiple people."},
  Demon:{evidence:["Fingerprints","Ghost Writing","Freezing Temps"],behavior:"Very aggressive, hunts early/often."},
  Yurei:{evidence:["Ghost Orb","Freezing Temps","D.O.T.S"],behavior:"Sanity drain, smudge locks in room."},
  Oni:{evidence:["EMF Level 5","Freezing Temps","D.O.T.S"],behavior:"Very active, throws items often."},
  Hantu:{evidence:["Fingerprints","Ghost Orb","Freezing Temps"],behavior:"Faster in cold, slower in warm."},
  Goryo:{evidence:["EMF Level 5","Fingerprints","D.O.T.S"],behavior:"Only seen on camera, stays in ghost room."},
  Myling:{evidence:["EMF Level 5","Fingerprints","Ghost Writing"],behavior:"Quieter footsteps, frequent sounds."},
  Onryo:{evidence:["Spirit Box","Ghost Orb","Freezing Temps"],behavior:"Flames trigger hunts; extinguishing fire risky."},
  TheTwins:{evidence:["EMF Level 5","Spirit Box","Freezing Temps"],behavior:"Interacts in two spots, different speeds."},
  Raiju:{evidence:["EMF Level 5","Ghost Orb","D.O.T.S"],behavior:"Faster near electronics, disrupts devices."},
  Obake:{evidence:["EMF Level 5","Fingerprints","Ghost Orb"],behavior:"Rare fingerprints, shapeshifts."},
  TheMimic:{evidence:["Spirit Box","Fingerprints","Freezing Temps"],behavior:"Mimics others, always shows fake orbs."},
  Moroi:{evidence:["Spirit Box","Ghost Writing","Freezing Temps"],behavior:"Curses players, sanity drains faster."},
  Deogen:{evidence:["Spirit Box","Ghost Writing","D.O.T.S"],behavior:"Always knows location, slow near player."},
  Thaye:{evidence:["Ghost Orb","Ghost Writing","D.O.T.S"],behavior:"Highly active early, slows over time."},
  Yokai:{evidence:["Spirit Box","Ghost Orb","D.O.T.S"],behavior:"Talkative, hunts near voices."},
  Succubus:{evidence:["Spirit Box","Ghost Writing","Fingerprints"],behavior:"Targets males, faster sanity drain in interactions."}
};
const possibleWeather=["Clear","Rain","Stormy","Foggy","Bloodmoon"];
const roomVisuals={
  Van:{N:"Van_N.png"},Foyer:{N:"Foyer_N.png"},"Living Room":{N:"LivingRoom_N.png"},
  Kitchen:{N:"Kitchen_N.png"},"Dining Room":{N:"DiningRoom_N.png"},
  Garage:{N:"Garage_N.png"},Basement:{N:"Basement_N.png"},Bathroom:{N:"Bathroom_N.png"},
  "Kids Bedroom":{N:"KidsBedroom_N.png"},"Master Bedroom":{N:"MasterBedroom_N.png"}
};
const mapConnections={
  Van:["Foyer"],Foyer:["Van","Living Room","Kitchen","Bathroom"],
  "Living Room":["Foyer","Dining Room","Garage","Kids Bedroom","Master Bedroom"],
  Kitchen:["Foyer","Dining Room"],"Dining Room":["Living Room","Kitchen","Basement"],
  Garage:["Living Room"],Basement:["Dining Room"],Bathroom:["Foyer"],
  "Kids Bedroom":["Living Room"],"Master Bedroom":["Living Room"]
};
const game={
  ghost:null,ghostRoom:null,playerRoom:"Van",inventory:[],vanStock:[...allLoadoutItems],
  roomItems:{},selectedEvidence:new Set(),currentTurn:0,sanity:100,mimicForm:null,
  nextMimicShift:0,huntCooldown:0,smudgeActive:0,weather:null,cameraActive:false,
  placedCrucifix:{},monitorBooted:false,placedCameras:{}
};

/* === UTILITY FUNCTIONS === */
function randomFromArray(arr){return arr[Math.floor(Math.random()*arr.length)];}
function logToGame(text){
  const log=document.getElementById("game-log"),e=document.createElement("div");
  e.className="log-entry";e.textContent=text;log.appendChild(e);
  log.scrollTop=log.scrollHeight;setTimeout(()=>e.classList.add("fade"),8000);
}
function updateSanityBar(){
  const bar=document.getElementById("sanity-bar");
  bar.style.width=game.sanity+"%";
  bar.style.background=game.sanity>66?"#0f0":game.sanity>33?"#ff0":"#f00";
}

/* === STARTUP & LOADOUT === */
document.addEventListener("DOMContentLoaded",()=>{resetGameState();
  document.getElementById("title-screen").style.display="flex";
});
function resetGameState(){
  Object.assign(game,{ghost:null,ghostRoom:null,playerRoom:"Van",inventory:[],
    vanStock:[...allLoadoutItems],roomItems:{},selectedEvidence:new Set(),
    currentTurn:0,sanity:100,mimicForm:null,nextMimicShift:0,huntCooldown:0,
    smudgeActive:0,weather:null,cameraActive:false,placedCrucifix:{},monitorBooted:false,placedCameras:{}});
  updateSanityBar();
}
document.getElementById("startButton").addEventListener("click",()=>{
  document.getElementById("title-screen").style.opacity="0";
  setTimeout(()=>{document.getElementById("title-screen").style.display="none";showLoadout();},1500);
});
let tempHeld=[],tempVan=[...allLoadoutItems];
function showLoadout(){document.getElementById("loadout-screen").style.display="flex";renderLoadout();}
function renderLoadout(){
  const held=document.getElementById("held-list"),van=document.getElementById("van-list");
  held.innerHTML="";van.innerHTML="";
  tempHeld.forEach(i=>{
    const row=document.createElement("div");row.className="item-row";row.textContent=i;
    const b=document.createElement("button");b.textContent="-";
    b.onclick=()=>{tempVan.push(i);tempHeld=tempHeld.filter(x=>x!==i);renderLoadout();};
    row.appendChild(b);held.appendChild(row);
  });
  const count={};tempVan.forEach(i=>count[i]=(count[i]||0)+1);
  Object.keys(count).forEach(i=>{
    const row=document.createElement("div");row.className="item-row";row.textContent=`${i} (${count[i]})`;
    const b=document.createElement("button");b.textContent="+";
    b.onclick=()=>{if(tempHeld.length<3){tempHeld.push(i);tempVan.splice(tempVan.indexOf(i),1);renderLoadout();}else alert("Max 3 items!");};
    row.appendChild(b);van.appendChild(row);
  });
}
document.getElementById("confirm-loadout").addEventListener("click",()=>{
  game.inventory=[...tempHeld,"Notebook","Lighter"];
  game.vanStock=[...tempVan];
  document.getElementById("loadout-screen").style.display="none";
  startInvestigation();
});

/* === START INVESTIGATION === */
function startInvestigation(){
  document.getElementById("main-scene").style.display="block";
  document.getElementById("narrator-ui").style.display="flex";
  document.getElementById("game-log").innerHTML="";
  game.weather=randomFromArray(possibleWeather);
  game.ghost=randomFromArray(Object.keys(ghostProfiles));
  if(game.ghost==="TheMimic")assignMimicForm();
  game.ghostRoom=randomFromArray(Object.keys(roomVisuals).filter(r=>r!=="Van"));
  logToGame(`You are in the van. The weather outside is ${game.weather.toLowerCase()}...`);
  renderHUD();updateBackground();
  if(["Rain","Stormy","Bloodmoon"].includes(game.weather)){animateRain();randomLightning();}
  randomOrbs();
}
function assignMimicForm(){
  game.mimicForm=randomFromArray(Object.keys(ghostProfiles).filter(g=>g!=="TheMimic"));
  game.nextMimicShift=game.currentTurn+Math.floor(Math.random()*4)+3;
}
function renderHUD(){
  document.getElementById("hud-location").textContent=game.playerRoom;
  document.getElementById("hud-weather").textContent=game.weather;
  document.getElementById("hud-turns").textContent=game.currentTurn;
  document.getElementById("held-items-display").textContent=game.inventory.join(", ")||"None";
  updateSanityBar();
}
function updateBackground(){document.getElementById("background").style.backgroundImage=`url('${roomVisuals[game.playerRoom].N}')`;}

/* === COMMAND HANDLING === */
document.querySelectorAll("#command-buttons button").forEach(b=>b.addEventListener("click",()=>handleCommand(b.dataset.cmd)));
function handleCommand(cmd){
  switch(cmd){
    case"move":openMoveOverlay();break;
    case"look":lookAround();break;
    case"inventory":openInventoryOverlay();break;
    case"monitor":openMonitor();break;
    case"notebook":openNotebook();break;
    case"guess":openGuess();break;
  }
}

/* === MOVEMENT === */
function openMoveOverlay(){
  const opts=mapConnections[game.playerRoom]||[];
  if(!opts.length){logToGame("No available paths.");return;}
  const overlay=document.createElement("div");
  overlay.style.position="fixed";overlay.style.top="0";overlay.style.left="0";overlay.style.width="100%";overlay.style.height="100%";
  overlay.style.background="rgba(0,0,0,0.7)";overlay.style.zIndex="400";
  opts.forEach(r=>{
    const b=document.createElement("button");
    b.textContent="Go to "+r;b.style.display="block";b.style.margin="10px auto";b.onclick=()=>{
      document.body.removeChild(overlay);moveToRoom(r);
    };
    overlay.appendChild(b);
  });
  const c=document.createElement("button");
  c.textContent="Cancel";c.onclick=()=>document.body.removeChild(overlay);
  overlay.appendChild(c);
  document.body.appendChild(overlay);
}
function moveToRoom(r){
  game.playerRoom=r;game.currentTurn++;
  logToGame("You move to "+r+".");
  renderHUD();updateBackground();checkTurnEvents();
}
function lookAround(){
  game.currentTurn++;
  if(game.playerRoom===game.ghostRoom){
    logToGame("You feel an eerie presence here...");
    if(game.ghost==="TheMimic"||game.mimicForm==="TheMimic")logToGame("Strange orbs flicker briefly...");
  } else logToGame("Nothing unusual here.");
  renderHUD();checkTurnEvents();
}
<script>
/* === INVENTORY OVERLAY (DROPDOWNS & ACTIONS) === */
function openInventoryOverlay(){
  const overlay=document.createElement("div");
  overlay.style.position="fixed";overlay.style.top="0";overlay.style.left="0";
  overlay.style.width="100%";overlay.style.height="100%";
  overlay.style.background="rgba(0,0,0,0.8)";overlay.style.zIndex="450";
  overlay.style.color="#eee";overlay.style.padding="20px";overlay.style.overflowY="auto";

  const heldTitle=document.createElement("h3");heldTitle.textContent="Held Items";
  overlay.appendChild(heldTitle);

  game.inventory.forEach(i=>{
    const div=document.createElement("div");div.style.marginBottom="5px";
    div.textContent=i+" ";
    const dd=document.createElement("select");
    ["Inspect","Use","Drop","Place"].forEach(a=>{
      const opt=document.createElement("option");opt.textContent=a;dd.appendChild(opt);
    });
    dd.onchange=()=>{
      const a=dd.value;document.body.removeChild(overlay);
      if(a==="Inspect")inspectItem(i);
      if(a==="Use")useItem(i);
      if(a==="Drop")dropItem(i);
      if(a==="Place")placeItem(i);
    };
    div.appendChild(dd);overlay.appendChild(div);
  });

  const nearTitle=document.createElement("h3");
  nearTitle.textContent="Nearby Items";overlay.appendChild(nearTitle);
  const nearby=game.playerRoom==="Van"?game.vanStock:(game.roomItems[game.playerRoom]||[]);
  nearby.forEach(i=>{
    const div=document.createElement("div");
    div.textContent=i+" ";
    const b=document.createElement("button");b.textContent="Pick Up";
    b.onclick=()=>{document.body.removeChild(overlay);pickItem(i);};
    div.appendChild(b);overlay.appendChild(div);
  });

  const c=document.createElement("button");c.textContent="Close";
  c.onclick=()=>document.body.removeChild(overlay);
  overlay.appendChild(c);

  document.body.appendChild(overlay);
}
function inspectItem(i) {
  const title = document.getElementById("inspect-title");
  const description = document.getElementById("inspect-description");

  title.textContent = i;

  if (ghostProfiles[i]) {

/* === ORB MINI-GAME === */
let orbGameActive=false,orbScore=0,orbTime=60,orbOrbs=[],orbCtx,orbTimerInterval;
function startOrbGame(){
  orbGameActive=true;orbScore=0;orbTime=60;orbOrbs=[];
  const canvas=document.createElement("canvas");
  canvas.width=360;canvas.height=240;canvas.style.background="black";
  canvas.style.display="block";canvas.style.margin="10px auto";orbCtx=canvas.getContext("2d");
  document.body.appendChild(canvas);
  canvas.addEventListener("click",shootOrb);
  spawnOrb();updateOrbHUD(canvas);
  orbTimerInterval=setInterval(()=>{
    orbTime--;updateOrbHUD(canvas);
    if(orbTime<=0)endOrbGame(canvas);
  },1000);
  animateOrbGame(canvas);
}
function spawnOrb(){
  if(!orbGameActive)return;
  if(orbOrbs.length<6){
    const rare=Math.random()<0.1;
    orbOrbs.push({x:Math.random()*340+10,y:Math.random()*220+10,r:rare?8:5,
      color:rare?"#00f":"#fff",speed:rare?2:0.5,fade:Math.random()*0.02+0.01});
  }
  setTimeout(spawn,800);
}
function animateOrbGame(canvas){
  if(!orbGameActive)return;
  orbCtx.clearRect(0,0,360,240);
  orbOrbs.forEach((o,i)=>{
    o.y+=Math.sin(o.fade*50)*o.speed;
    orbCtx.beginPath();orbCtx.arc(o.x,o.y,o.r,0,Math.PI*2);
    orbCtx.fillStyle=o.color;orbCtx.fill();
  });
  requestAnimationFrame(()=>animateOrbGame(canvas));
}
function shootOrb(e){
  if(!orbGameActive)return;
  const rect=e.target.getBoundingClientRect(),x=e.clientX-rect.left,y=e.clientY-rect.top;
  orbOrbs.forEach((o,i)=>{
    const dx=o.x-x,dy=o.y-y;
    if(Math.sqrt(dx*dx+dy*dy)<o.r){
      orbScore+=o.color==="#00f"?100:10;orbTime+=o.color==="#00f"?5:1;
      orbOrbs.splice(i,1);
    }
  });
}
function updateOrbHUD(canvas){canvas.previousElementSibling?.remove();
  const score=document.createElement("div");
  score.textContent=`Score: ${orbScore} | Time: ${orbTime}s`;
  score.style.color="#0f0";score.style.textAlign="center";
  canvas.parentNode.insertBefore(score,canvas);
}
function endOrbGame(canvas){
  orbGameActive=false;clearInterval(orbTimerInterval);
  canvas.removeEventListener("click",shootOrb);
  alert(`Game Over — Final Score: ${orbScore}`);
  document.body.removeChild(canvas);
}
</script>

function attemptHunt(){
  if(game.smudgeActive>0){game.smudgeActive--;return;}
  if(game.huntCooldown>0){game.huntCooldown--;return;}
  const aggressiveGhosts=["Demon","Thaye","Oni","Raiju","Yokai","Succubus"];

  if(game.playerRoom===game.ghostRoom){

    setTimeout(()=>{l.style.opacity=0;},200);
    flashes++;
    if(flashes>6)clearInterval(flicker);

/* === ORBS FIXED (REAL FLOATING MOVEMENT) === */
function randomOrbs(){
  const c=document.getElementById("orbCanvas"),ctx=c.getContext("2d");
  c.width=window.innerWidth;c.height=window.innerHeight;
  const orbs=[];
  function spawn(){
    if(orbs.length<15){
      orbs.push({
        x:Math.random()*c.width,
        y:Math.random()*c.height,
        r:Math.random()*3+2,
        alpha:Math.random()*0.8+0.2,
        fade:(Math.random()*0.02+0.005),
        dx:(Math.random()*0.5-0.25),
        dy:(Math.random()*0.4-0.2)
      });
    }
  }
  function animate(){
    ctx.clearRect(0,0,c.width,c.height);
    orbs.forEach((o,i)=>{
      o.alpha+=o.fade;if(o.alpha<=0||o.alpha>=1)o.fade*=-1;
      o.x+=o.dx;o.y+=o.dy;
      if(o.x<0||o.x>c.width)o.dx*=-1;
      if(o.y<0||o.y>c.height)o.dy*=-1;
      ctx.beginPath();
      ctx.arc(o.x,o.y,o.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(255,255,255,${o.alpha})`;ctx.fill();
    });
    requestAnimationFrame(animate);
  }
  setInterval(spawn,2000);animate();
}

}
function ghostEventFlicker(){

}

function ghostRoomShift(){
  if(game.ghost==="Goryo")return;

  }
}

function endTurn(){

}

    return selected.every(e=>ev.includes(e));
  });

  if(filtered.length===0)list.innerHTML="<strong>Possible Ghosts:</strong> No match with current evidence.";
  else list.innerHTML="<strong>Possible Ghosts:</strong> "+filtered.join(", ");
}

/* === EVIDENCE TYPES ARRAY === */
const evidenceTypes=[
  "EMF Level 5","Spirit Box","Fingerprints","Ghost Writing",
  "Freezing Temps","D.O.T.S","Orbs"
];

/* === GHOST BEHAVIOR TRIGGERS === */
function ghostBehaviorTrigger(){
  const ghost=game.ghost==="TheMimic"?game.mimicForm:game.ghost;
  switch(ghost){
    case "Poltergeist":
      if(Math.random()<0.3)logToGame("You hear multiple objects clattering at once nearby.");
      break;
    case "Oni":
      if(Math.random()<0.3)logToGame("Something heavy is thrown violently across the room.");
      break;
    case "Raiju":
      if(Math.random()<0.3 && game.cameraActive)logToGame("Your electronics glitch as if disrupted by EMF surge.");
      break;
    case "Banshee":
      if(Math.random()<0.2)logToGame("A piercing shriek echoes faintly through your parabolic microphone.");
      break;
    case "Thaye":
      if(game.currentTurn<10 && Math.random()<0.4)logToGame("Rapid, aggressive movements are felt all around you.");
      break;
    case "Demon":
      if(Math.random()<0.3)logToGame("The air grows heavy — this ghost seems eager to hunt.");
      break;
    case "Succubus":
      if(Math.random()<0.3)logToGame("You feel an unsettling presence almost draining your will to continue...");
      break;
  }
}

/* === TURN SYSTEM EXPANSION === */
function checkTurnEvents(){
  if(game.ghost==="TheMimic" && game.currentTurn>=game.nextMimicShift){
    assignMimicForm();
    logToGame("You sense a change in ghost behavior...");
  }

  if(game.playerRoom===game.ghostRoom){
    const ghost=game.ghost==="TheMimic"?game.mimicForm:game.ghost;
    if(Math.random()<0.4)game.sanity-=3+Math.random()*3;
    ghostBehaviorTrigger();
    if(Math.random()<ghostEventChance(ghost))logToGame("[Behavior Hint] "+ghostProfiles[ghost].behavior);
    if(Math.random()<0.2)ghostEventFlicker();
  } else {
    if(Math.random()<0.1)ambientNarration();
    game.sanity-=1;
  }

  if(game.sanity<0)game.sanity=0;
  updateSanityBar();
  attemptHunt();
}

/* === FIX INVENTORY NOTEBOOK INTEGRATION === */
function useItem(item){
  switch(item){
    case "Notebook":
      openNotebook();
      logToGame("You open the notebook to review your evidence.");
      return;
    case "Smudge Stick":
      if(game.playerRoom===game.ghostRoom){
        game.smudgeActive=3;
        logToGame("You smudge the room, calming the ghost temporarily.");
        if(game.ghost==="Yurei")logToGame("The Yurei is locked in place for a while.");
      } else logToGame("You smudge, but nothing happens.");
      break;
    case "Camera":
    case "Video Camera":
      game.cameraActive=!game.cameraActive;
      logToGame(game.cameraActive?"You turn on the camera to look for orbs.":"You turn off the camera.");
      break;
    default:
      if(cursedItemDescriptions[item])handleCursedItem(item);
      else logToGame("You use the "+item+", but nothing significant happens.");
  }
  game.currentTurn++;
  renderHUD();
  checkTurnEvents();
}

/* === GAME END HANDLER (WITH NOTEBOOK CLOSE) === */
function endGame(){
  setTimeout(()=>{
    alert("Game Over — Play Again?");
    const notebook=document.getElementById("notebook-overlay");
    if(notebook)document.body.removeChild(notebook);
    resetGameState();
    showLoadout();
  },1500);
}
</script>
<script>
/* === MONITOR FIXED (FULL CAMERA & ORB DETECTION) === */
function openMonitor(){

  }
  if(!game.monitorBooted){

function bootMonitorSequence(){

  overlay.style.display="flex";

  const border=document.getElementById("monitor-border");
  border.innerHTML="<h3 style='color:#0f0;'>Booting system...</h3><div id='boot-status' style='color:#ccc;'>Loading...</div>";

  setTimeout(()=>{
    game.monitorBooted=true;

}

function openMonitorMenu(){
  const overlay=document.getElementById("monitor-overlay");
  const border=document.getElementById("monitor-border");
  overlay.style.display="flex";
  border.innerHTML="<h3 style='color:#0f0;'>Camera Monitor</h3>";

  const cams=Object.keys(game.placedCameras);
  if(!cams.length){
    border.innerHTML+="<div style='color:#555;'>No cameras placed.</div>";
  } else {
    cams.forEach(room=>{

function viewCameraFeed(room){
  const border=document.getElementById("monitor-border");
  border.innerHTML="<h3 style='color:#0f0;'>Camera Feed: "+room+"</h3>";

  if(room===game.ghostRoom){
    border.innerHTML+="<div style='color:#0f0;'>Ghost orbs flicker faintly on screen!</div>";
    const orbBtn=document.createElement("button");
    orbBtn.textContent="Play Orb Capture Mini-Game";

  } else {

  }

  const back=document.createElement("button");
  back.textContent="Back";
  back.onclick=openMonitorMenu;
  border.appendChild(back);
}

    inventory:[], vanStock:[...allLoadoutItems],

/* === ORBS (GLOBAL FIX - RANDOM DIRECTION MOVEMENT) === */
function randomOrbs(){
  const c=document.getElementById("orbCanvas"),ctx=c.getContext("2d");
  c.width=window.innerWidth;c.height=window.innerHeight;
  let orbs=[];
  function spawn(){
    if(orbs.length<12){
      orbs.push({
        x:Math.random()*c.width,
        y:Math.random()*c.height,
        r:Math.random()*3+2,
        alpha:Math.random(),
        fade:Math.random()*0.02+0.005,
        dx:(Math.random()-0.5)*0.5,
        dy:(Math.random()-0.5)*0.5
      });
    }
  }
  function animate(){
    ctx.clearRect(0,0,c.width,c.height);
    for(let i=0;i<orbs.length;i++){
      const o=orbs[i];
      o.alpha+=o.fade;
      if(o.alpha<=0||o.alpha>=1)o.fade*=-1;
      o.x+=o.dx;o.y+=o.dy;
      if(o.x<0||o.x>c.width)o.dx*=-1;
      if(o.y<0||o.y>c.height)o.dy*=-1;
      ctx.beginPath();
      ctx.arc(o.x,o.y,o.r,0,Math.PI*2);
      ctx.fillStyle="rgba(255,255,255,"+o.alpha+")";
      ctx.fill();
    }
    requestAnimationFrame(animate);
  }
  setInterval(spawn,2000);animate();
}

/* === RESTART BINDINGS FOR SAFETY === */
document.getElementById("startButton").addEventListener("click",()=>{
  document.getElementById("title-screen").style.opacity="0";
  setTimeout(()=>{
    document.getElementById("title-screen").style.display="none";
    showLoadout();
  },1500);
});
</script>
