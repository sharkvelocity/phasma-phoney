<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Phasma-Phoney: Turn-based ghost investigation horror game" />
  <meta name="theme-color" content="#000000" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: black;
      font-family: monospace;
      color: #ddd;
      height: 100%;
      width: 100%;
    }

    body {
      background: url('House.png') no-repeat center center fixed;
      background-size: cover;
    }

    #title-screen {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: black;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      opacity: 1;
      transition: opacity 2s ease-in-out;
    }

    #title-screen img {
      max-width: 80%;
      animation: pulse 4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.8; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.04); }
    }

    #loadout-screen, #game-ui, #game-log, #inventory-popup, #guess-popup {
      display: none;
    }

    #main-scene {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
      overflow: hidden;
    }

    .layer {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
    }

    #fog-container canvas, #orbCanvas, #lightning {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 8;
    }

    #lightning {
      background: white;
      opacity: 0;
      transition: opacity 0.1s ease-in-out;
    }

    #footer {
      position: fixed;
      bottom: 0;
      width: 100%;
      background: rgba(0, 0, 0, 0.7);
      color: #aaa;
      font-size: 12px;
      text-align: center;
      z-index: 100;
      padding: 4px;
    }

    button {
      font-family: monospace;
      background: #111;
      color: #eee;
      border: 1px solid #444;
      padding: 6px 12px;
      margin: 4px;
      cursor: pointer;
    }

    #voice-controls {
      position: fixed;
      top: 10px;
      right: 10px;
      background: rgba(0,0,0,0.7);
      padding: 6px;
      border-radius: 4px;
      z-index: 1000;
    }

    #game-log {
      position: fixed;
      left: 5%;
      bottom: 15%;
      width: 90%;
      height: 25%;
      overflow-y: auto;
      background: rgba(0, 0, 0, 0.75);
      padding: 12px;
      border: 1px solid #555;
      font-size: 14px;
      z-index: 50;
    }

    #compass, #hud {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 100;
      background: rgba(0,0,0,0.6);
      padding: 6px;
      border-radius: 4px;
    }

    #hud {
      top: 60px;
    }

    #startButton {
      font-size: 22px;
      padding: 16px 36px;
      background: #111;
      color: #eee;
      border: 2px solid #444;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="title-screen">
    <img src="logo.png" alt="Phasma‑Phoney Logo" />
    <button id="startButton" onclick="startLoadout()">Start Investigation</button>
  </div>
  <div id="loadout-screen"><!-- Will be filled by JS --></div>
  <div id="main-scene">
    <div id="lightning" class="layer"></div>
    <canvas id="orbCanvas" class="layer"></canvas>
    <div id="fog-container" class="layer">
      <canvas id="fogCanvas1"></canvas>
      <canvas id="fogCanvas2"></canvas>
    </div>
  </div>
  <div id="voice-controls">
    <label for="voiceSelect">Voice:</label>
    <select id="voiceSelect"></select>
    <button onclick="toggleMute()">Mute</button>
  </div>
  <div id="compass">Direction: <span id="direction">North</span></div>
  <div id="hud">
    <div>Room: <span id="room">Van</span></div>
    <div>Sanity: <span id="sanity">100%</span></div>
    <div>Turns: <span id="turns">0</span></div>
    <div>Temperature: <span id="temperature">--°C</span></div>
  </div>
  <div id="game-log"></div>
  <div id="guess-popup"><div id="guess-list"></div><button onclick="closeGuess()">Cancel</button></div>
  <div id="inventory-popup"><div id="item-list"></div><button onclick="closeInventory()">Close</button></div>
  <div id="footer">Phasma‑Phoney &copy; 2025 — All systems integrated.</div>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("title-screen").style.display = "flex";
      populateVoices();
      window.speechSynthesis.onvoiceschanged = populateVoices;
    });

    function startLoadout() {
      const formHtml = '<form id="item-selection">' + 
        ["EMF Reader","Spirit Box","Camera","UV Light","D.O.T.S Projector","Thermometer","Ghost Writing Book","Crucifix","Salt","Smudge Stick"]
        .map(i => `<label><input type="checkbox" value="${i}" onchange="limitItems(this)"> ${i}</label><br>`)
        .join("") + '</form><p><button onclick="confirmLoadout()">Confirm Loadout</button></p>';
      document.getElementById("loadout-screen").innerHTML = "<h2>Select Loadout (max 3):</h2>" + formHtml;
      document.getElementById("title-screen").style.display = "none";
      document.getElementById("loadout-screen").style.display = "block";
    }

    function limitItems(checkbox) {
      const checked = document.querySelectorAll("#item-selection input:checked");
      if (checked.length > 3) checkbox.checked = false;
    }
  </script>
</body>
</html>
