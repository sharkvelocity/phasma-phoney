<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Phasma‑Phoney</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      background: black;
      overflow: hidden;
      font-family: monospace;
    }

    body {
      background: url('House.png') no-repeat center center fixed;
      background-size: cover;
    }

    canvas, .layer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
    }

      z-index: 3;
    }

    }

      top: 0;

      width: 100vw;

      overflow: hidden;
      z-index: 1;

    #title-screen {
      position: fixed;
      top: 0;
      left: 0;

      height: 100vh;
      background: black;

</head>

<script>

// Evidence Types
const evidenceTypes = [

// Ghost Profiles (25)

// Evidence Map
const evidenceMap = {};
for (let ghost in ghostProfiles) {
  ghostProfiles[ghost].evidence.forEach(ev => {
    if (!evidenceMap[ev]) evidenceMap[ev] = new Set();
    evidenceMap[ev].add(ghost);

<script>
// === INITIALIZATION ===
document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('startButton').onclick = () => {
      document.getElementById("startButton").style.display = "none";
      document.getElementById('title-screen').style.display = 'none';
      showLoadoutMenu();
};

  };

  document.getElementById('confirm-loadout').onclick = confirmLoadout;
  document.getElementById('restart-button').onclick = () => location.reload();
});

// === LOADOUT ===
function showLoadoutMenu() {
  const container = document.getElementById("item-selection");
  container.innerHTML = "";
  allLoadoutItems.forEach(item => {
    const label = document.createElement("label");
    label.innerHTML = `<input type="checkbox" value="${item}"> ${item}`;
    container.appendChild(label);
    container.appendChild(document.createElement("br"));
  });
  document.getElementById("loadout-screen").style.display = "block";
}

function confirmLoadout() {
  const selected = Array.from(document.querySelectorAll('#item-selection input:checked'));
  if (selected.length > 3) return alert("Max 3 items.");

  game.inventory = selected.map(cb => cb.value).concat("Notebook", "Lighter");

  // Fill vanStock with unselected items
  const all = allLoadoutItems.filter(i => !game.inventory.includes(i));
  all.forEach(name => {
    game.vanStock[name] = name === "Smudge" ? 4 : name === "Salt" ? 3 : 1;
  });

  // Hide loadout screen
  document.getElementById("loadout-screen").style.display = "none";

  // 🔥 START THE GAME
  startInvestigation();
}



// === START INVESTIGATION ===
function startInvestigation() {
  game.ghost = randomGhost();
  game.ghostRoom = randomRoom();
  game.weather = Math.random() < 0.5 ? "Rain" : "Clear";
  updateHUD();
  renderActionButtons();
  document.getElementById("game-ui").style.display = "block";
  document.getElementById("ada-modal").style.display = "block";
  log(`Investigation begins. Weather: ${game.weather}`);
  if (game.weather === "Rain") startRain();
  startOrbs();
  startLightning();
  advanceTurn();
}

function randomGhost() {
  const keys = Object.keys(ghostProfiles).filter(g => g !== "The MimicFake" && g !== "MoroiFake");
  return keys[Math.floor(Math.random() * keys.length)];
}

function randomRoom() {
  const keys = Object.keys(roomMap).filter(r => r !== "Van");
  return keys[Math.floor(Math.random() * keys.length)];
}

// === TURN LOGIC ===
function advanceTurn() {
  game.currentTurn++;
  game.usedVanThisTurn = false;
  if (game.ghost === "The Mimic") handleMimicBehavior();
  if (Math.random() < 0.3) maybeShiftGhostRoom();
  updateHUD();
  renderActionButtons();
}

function handleMimicBehavior() {
  if (game.currentTurn >= game.nextMimicShift) {
    const mimicTargets = Object.keys(ghostProfiles).filter(g => g !== "The Mimic");
    game.mimicForm = mimicTargets[Math.floor(Math.random() * mimicTargets.length)];
    game.nextMimicShift = game.currentTurn + Math.floor(Math.random() * 4) + 3;
    log("Mimic has changed behavior.");
  }
}

function maybeShiftGhostRoom() {
  if (game.ghost === "Goryo") return;
  if (game.ghost === "Yurei" && game.smudgeLockTurns > 0) {
    game.smudgeLockTurns--;
    return;
  }
  const keys = Object.keys(roomMap).filter(r => r !== "Van");
  game.ghostRoom = keys[Math.floor(Math.random() * keys.length)];
}

// === ADA LOG & BUTTONS ===
function log(msg) {
  const logBox = document.getElementById("game-log");
  const div = document.createElement("div");
  div.textContent = msg;
  logBox.appendChild(div);
  logBox.scrollTop = logBox.scrollHeight;
  speak(msg);
}

function renderActionButtons() {
  const cmds = [
    { label: "Check Room", action: () => checkRoom() },
    { label: "Use Item", action: () => openItemMenu() },
    { label: "View Evidence", action: () => openEvidence() },
    { label: "Guess Ghost", action: () => openGuess() },
    { label: "Access Van", action: () => visitVan() },
    { label: "Next Turn", action: () => advanceTurn() }
  ];
  const box = document.getElementById("command-buttons");
  box.innerHTML = "";
  cmds.forEach(c => {
    const b = document.createElement("button");
    b.textContent = c.label;
    b.onclick = c.action;
    box.appendChild(b);
  });
}

// === HUD ===
function updateHUD() {
  document.getElementById("hud-turn").textContent = game.currentTurn;
  document.getElementById("hud-sanity").textContent = `${game.sanity}%`;
  document.getElementById("hud-location").textContent = game.playerRoom;
  document.getElementById("hud-direction").textContent = game.direction;
  document.getElementById("hud-weather").textContent = game.weather;
  const hasThermo = game.inventory.includes("Thermometer");
  document.getElementById("hud-temp").textContent = hasThermo ? getRoomTemp(game.playerRoom) : "-";
}

function getRoomTemp(room) {
  if (room === game.ghostRoom && ghostProfiles[game.ghost].evidence.includes("Freezing Temps")) return "-10°C";
  return "18°C";
}
</script>
<script>
// === ORBS ===
let orbCtx;
let orbCanvas;
let orbs = [];
const MAX_ORBS = 10;

function startOrbs() {
  orbCanvas = document.getElementById("orb-canvas");
  orbCtx = orbCanvas.getContext("2d");
  resizeOrbs();
  window.addEventListener("resize", resizeOrbs);
  for (let i = 0; i < MAX_ORBS; i++) orbs.push(makeOrb());
  animateOrbs();
}

function resizeOrbs() {
  orbCanvas.width = window.innerWidth;
  orbCanvas.height = window.innerHeight;
}

function makeOrb() {
  return {
    x: Math.random() * orbCanvas.width,
    y: Math.random() * orbCanvas.height,
    size: Math.random() * 6 + 3,
    opacity: 0,
    fadeSpeed: Math.random() * 0.01 + 0.002,
    fadeIn: true,
    life: Date.now() + Math.random() * 5000 + 3000
  };
}

function updateOrbs() {
  const now = Date.now();
  for (let i = 0; i < orbs.length; i++) {
    let orb = orbs[i];
    if (orb.fadeIn) {
      orb.opacity += orb.fadeSpeed;
      if (orb.opacity >= 1) orb.fadeIn = false;
    } else {
      orb.opacity -= orb.fadeSpeed / 2;
    }
    if (now > orb.life || orb.opacity <= 0) orbs[i] = makeOrb();
  }
}

function drawOrbs() {
  orbCtx.clearRect(0, 0, orbCanvas.width, orbCanvas.height);
  for (let orb of orbs) {
    orbCtx.beginPath();
    orbCtx.arc(orb.x, orb.y, orb.size, 0, Math.PI * 2);
    orbCtx.fillStyle = `rgba(255,255,255,${orb.opacity})`;
    orbCtx.fill();
  }
}

function animateOrbs() {
  updateOrbs();
  drawOrbs();
  requestAnimationFrame(animateOrbs);
}

// === LIGHTNING EFFECT ===
function startLightning() {
  const flash = document.getElementById("lightning");
  function triggerFlash() {
    flash.style.opacity = "0.7";
    setTimeout(() => flash.style.opacity = "0", 100);
    setTimeout(() => flash.style.opacity = "0.5", 250);
    setTimeout(() => flash.style.opacity = "0", 400);
    setTimeout(() => setTimeout(triggerFlash, Math.random() * 10000 + 3000), 5000 + Math.random() * 5000);
  }
  setTimeout(triggerFlash, Math.random() * 8000 + 2000);
}

// === ADA VOICE ===
let adaVoice = window.speechSynthesis.getVoices().find(v => v.name.toLowerCase().includes("female")) || null;

function speak(text) {
  if (!window.speechSynthesis) return;
  const utterance = new SpeechSynthesisUtterance(text);
  if (adaVoice) utterance.voice = adaVoice;
  utterance.rate = 1;
  window.speechSynthesis.speak(utterance);
}

// === GHOST GUESSING ===
function openGuess() {
  const popup = document.getElementById("guess-popup");
  const list = document.getElementById("guess-list");
  list.innerHTML = "";
  Object.keys(ghostProfiles).forEach(g => {
    if (g === "The MimicFake" || g === "MoroiFake") return;
    const btn = document.createElement("button");
    btn.textContent = g;
    btn.onclick = () => {
      makeGuess(g);
      closeGuess();
    };
    list.appendChild(btn);
  });
  popup.style.display = "block";
}

function closeGuess() {
  document.getElementById("guess-popup").style.display = "none";
}

function makeGuess(name) {
  const resultText = document.getElementById("result-text");
  if (name === game.ghost) {
    resultText.textContent = `Correct! It was a ${game.ghost}.`;
  } else {
    resultText.textContent = `Wrong. It was a ${game.ghost}. You guessed ${name}.`;
  }
  document.getElementById("end-screen").style.display = "block";
  speak(resultText.textContent);
}
</script>
<script>
// === ROOM CHECK ===
function checkRoom() {
  const isGhostRoom = game.playerRoom === game.ghostRoom;
  const evList = ghostProfiles[game.ghost].evidence;
  let clues = [];

  if (isGhostRoom) {
    if (evList.includes("Freezing Temps")) clues.push("It feels freezing here.");
    if (evList.includes("Ghost Writing")) clues.push("You see scribbles in the notebook.");
    if (evList.includes("D.O.T.S")) clues.push("A fast blur flickers through the D.O.T.S.");
    if (evList.includes("Spirit Box")) clues.push("Spirit Box flickers with static.");
    if (evList.includes("EMF Level 5")) clues.push("EMF spikes briefly.");
    if (evList.includes("Fingerprints")) clues.push("Smudged prints on nearby surfaces.");
    if (evList.includes("Orbs")) clues.push("Orbs flicker faintly in your camera.");
    if (game.ghost === "The Mimic") clues.push("You see orbs... suspicious ones.");
  } else {
    clues.push("Nothing abnormal found here.");
  }

  log(clues.join(" "));
  game.sanity -= 5;
  if (game.sanity < 0) game.sanity = 0;
  updateHUD();
}

// === ITEM MENU ===
function openItemMenu() {
  const menu = document.createElement("div");
  menu.style.position = "fixed";
  menu.style.top = "30%";
  menu.style.left = "50%";
  menu.style.transform = "translateX(-50%)";
  menu.style.background = "#111";
  menu.style.color = "#0ff";
  menu.style.border = "2px solid cyan";
  menu.style.padding = "20px";
  menu.style.zIndex = 9999;
  menu.style.borderRadius = "8px";

  game.inventory.forEach(item => {
    const btn = document.createElement("button");
    btn.textContent = item;
    btn.onclick = () => {
      useItem(item);
      document.body.removeChild(menu);
    };
    menu.appendChild(btn);
  });

  const cancel = document.createElement("button");
  cancel.textContent = "Cancel";
  cancel.onclick = () => document.body.removeChild(menu);
  cancel.style.marginTop = "10px";
  menu.appendChild(document.createElement("br"));
  menu.appendChild(cancel);

  document.body.appendChild(menu);
}

// === USE ITEM ===
function useItem(item) {
  if (item === "Smudge" && game.playerRoom === game.ghostRoom) {
    if (game.ghost === "Yurei") {
      game.smudgeLockTurns = 5;
      log("Yurei is trapped in its room for 5 turns!");
    }
    log("You burned a smudge stick. The area feels lighter.");
    game.vanStock["Smudge"] = (game.vanStock["Smudge"] || 0) - 1;
    if (game.vanStock["Smudge"] <= 0) delete game.vanStock["Smudge"];
  } else if (item === "Crucifix" && game.playerRoom === game.ghostRoom) {
    log("You placed a Crucifix. It may protect you.");
  } else {
    log(`You used the ${item}.`);
  }
  game.sanity -= 2;
  if (game.sanity < 0) game.sanity = 0;
  updateHUD();
}

// === VAN ACCESS ===
function visitVan() {
  if (game.usedVanThisTurn) {
    log("You already accessed the van this turn.");
    return;
  }
  game.usedVanThisTurn = true;
  renderVanSwap();
}

function renderVanSwap() {
  const held = document.getElementById("held-items");
  const van = document.getElementById("van-items");
  held.innerHTML = "";
  van.innerHTML = "";

  game.inventory.forEach(item => {
    if (item === "Notebook" || item === "Lighter") return;
    const btn = document.createElement("button");
    btn.textContent = `Drop ${item}`;
    btn.onclick = () => {
      game.inventory = game.inventory.filter(i => i !== item);
      game.vanStock[item] = (game.vanStock[item] || 0) + 1;
      renderVanSwap();
    };
    held.appendChild(btn);
  });

  for (let item in game.vanStock) {
    if (game.inventory.length >= 5) break;
    const btn = document.createElement("button");
    btn.textContent = `Grab ${item} (${game.vanStock[item]})`;
    btn.onclick = () => {
      if (game.vanStock[item] > 0) {
        game.inventory.push(item);
        game.vanStock[item]--;
        if (game.vanStock[item] <= 0) delete game.vanStock[item];
        renderVanSwap();
      }
    };
    van.appendChild(btn);
  }

  document.getElementById("van-swap-screen").style.display = "block";
  document.getElementById("confirm-swap").onclick = () => {
    document.getElementById("van-swap-screen").style.display = "none";
    updateHUD();
  };
}

// === EVIDENCE PANEL ===
function openEvidence() {
  const found = Array.from(game.selectedEvidence).join(", ") || "None selected yet.";
  log(`Evidence so far: ${found}`);
}

</script>
<script>
// === HUNT MECHANICS ===
function checkForHunt() {
  const huntThreshold = 50; // Base threshold for sanity
  const aggression = ghostProfiles[game.ghost]?.behavior || "";
  let chance = 0;

  // Base chance increases as sanity drops
  if (game.sanity < huntThreshold) {
    chance = (huntThreshold - game.sanity) * 0.5; // e.g. 25% chance at 0% sanity
  }

  // Behavior-based modifiers
  if (aggression.includes("Hunts more often") || game.ghost === "Demon") chance += 20;
  if (aggression.includes("Shy") || game.ghost === "Shade") chance -= 10;

  if (Math.random() * 100 < chance) {
    triggerHunt();
  }
}

function triggerHunt() {
  log("⚠️ You feel the air shift. A hunt has begun!");

  flashScreen();
  playHeartbeat();
  
  setTimeout(() => {
    if (checkForDefense()) {
      log("You narrowly escaped using a protective item.");
    } else {
      log("The ghost found you... you're dead.");
      gameOver("You were killed during a hunt.");
    }
  }, 2500); // 2.5 seconds delay before fate is decided
}

function checkForDefense() {
  if (game.inventory.includes("Smudge")) {
    log("You burned a Smudge Stick mid-hunt!");
    game.inventory = game.inventory.filter(i => i !== "Smudge");
    return true;
  }

  if (game.inventory.includes("Crucifix") && game.playerRoom === game.ghostRoom) {
    log("The Crucifix absorbed the ghost’s wrath.");
    return true;
  }

  return false;
}

function gameOver(reason) {
  const resultText = document.getElementById("result-text");
  resultText.textContent = reason + `\nThe ghost was a ${game.ghost}.`;
  document.getElementById("end-screen").style.display = "block";
  speak(resultText.textContent);
}

// === FLASH EFFECT ===
function flashScreen() {
  const flash = document.createElement("div");
  flash.style.position = "fixed";
  flash.style.top = 0;
  flash.style.left = 0;
  flash.style.width = "100vw";
  flash.style.height = "100vh";
  flash.style.background = "red";
  flash.style.opacity = 0.5;
  flash.style.zIndex = 99999;
  document.body.appendChild(flash);
  setTimeout(() => document.body.removeChild(flash), 300);
}

// === HEARTBEAT AUDIO ===
function playHeartbeat() {
  const audio = new Audio("data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=");
  audio.loop = true;
  audio.volume = 0.5;
  audio.play();
  setTimeout(() => audio.pause(), 3000); // 3 seconds of heartbeats
}

// === INSERT INTO advanceTurn() ===
// (AFTER updateHUD(), BEFORE renderActionButtons())
function advanceTurn() {
  game.currentTurn++;
  game.usedVanThisTurn = false;

  if (game.ghost === "The Mimic") handleMimicBehavior();
  if (Math.random() < 0.3) maybeShiftGhostRoom();

  updateHUD();
  checkForHunt(); // <== INSERTED HERE
  renderActionButtons();
}
</script>
<script>
// === CONFIGURABLE COOLDOWNS ===
const huntCooldowns = {
  default: 3,
  Demon: 1,
  Shade: 5,
  Yurei: 4,
  Revenant: 2,
  Thaye: 6
};

let huntCooldownRemaining = 0;

// === OVERRIDE: advanceTurn to include cooldown ===
function advanceTurn() {
  game.currentTurn++;
  game.usedVanThisTurn = false;

  if (game.ghost === "The Mimic") handleMimicBehavior();
  if (Math.random() < 0.3) maybeShiftGhostRoom();

  updateHUD();

  if (huntCooldownRemaining > 0) {
    huntCooldownRemaining--;
    log(`Hunt cooldown: ${huntCooldownRemaining} turn(s) remaining.`);
  } else {
    checkForHunt();
  }

  renderActionButtons();
}

// === MODIFIED triggerHunt WITH VISUAL + AUDIO CUES ===
function triggerHunt() {
  log("⚠️ Hunt is starting... you hear heavy footsteps...");
  playHuntAmbience();
  flashScreen(true); // red, flicker style

  setTimeout(() => {
    if (checkForDefense()) {
      log("You survived the hunt using a protective item.");
    } else {
      gameOver("You were killed during a hunt.");
      return;
    }

    // Smudge disables future hunts for 2–4 turns
    if (game.usedSmudgeDuringHunt) {
      huntCooldownRemaining = 3;
      log("The ghost retreats... it won't hunt again soon.");
    } else {
      const cooldown = huntCooldowns[game.ghost] ?? huntCooldowns.default;
      huntCooldownRemaining = cooldown;
      log(`Ghost is recovering. ${cooldown} turn cooldown.`);
    }

    stopHuntAmbience();
  }, 2500);
}

// === SMUDGE HANDLING DURING HUNT ===
function checkForDefense() {
  game.usedSmudgeDuringHunt = false;

  if (game.inventory.includes("Smudge")) {
    game.inventory = game.inventory.filter(i => i !== "Smudge");
    game.usedSmudgeDuringHunt = true;
    log("🔥 Smudge stick ignited mid-hunt!");
    return true;
  }

  if (game.inventory.includes("Crucifix") && game.playerRoom === game.ghostRoom) {
    log("✝️ Crucifix glows and snaps — it saved you.");
    return true;
  }

  return false;
}

// === FLASH SCREEN (red flicker style) ===
function flashScreen(ghostHunt = false) {
  const flash = document.createElement("div");
  flash.style.position = "fixed";
  flash.style.top = 0;
  flash.style.left = 0;
  flash.style.width = "100vw";
  flash.style.height = "100vh";
  flash.style.background = ghostHunt ? "red" : "white";
  flash.style.opacity = ghostHunt ? "0.6" : "0.8";
  flash.style.zIndex = 99999;
  flash.style.pointerEvents = "none";
  document.body.appendChild(flash);
  setTimeout(() => document.body.removeChild(flash), 300);
}

// === AMBIENT GHOST PRESENCE SOUND ===
let huntSound = null;

function playHuntAmbience() {
  huntSound = new Audio("data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA="); // Replace with real eerie loop if available
  huntSound.loop = true;
  huntSound.volume = 0.4;
  huntSound.play();
}

function stopHuntAmbience() {
  if (huntSound) {
    huntSound.pause();
    huntSound.currentTime = 0;
    huntSound = null;
  }
}
</script>
