<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Phasma‑Phoney</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100%;
      width: 100%;
      background-color: #000;
      font-family: monospace;
    }
    body {
      background: url('Van_N.png') no-repeat center center fixed;
      background-size: cover;
      transition: background 0.8s ease-in-out;
    }
    #flash-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: white;
      opacity: 0;
      pointer-events: none;
      z-index: 9999;
    }
    #orb-canvas, #camera-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 0;
    }
    #camera-overlay {
      background: rgba(0,255,0,0.1);
      mix-blend-mode: screen;
      display: none;
      z-index: 5;
    }
    footer {
      position: fixed;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      font-size: 0.9em;
      font-family: sans-serif;
      z-index: 9999;
    }
    #loadout-screen, #rulesPopup {
      max-width: 90vw;
    }
    button {
      background: #111;
      color: #0ff;
      border: 1px solid #444;
      padding: 6px 10px;
      margin: 3px;
      cursor: pointer;
    }
    button:hover {
      background: #222;
      color: #fff;
    }

    /* === Game UI Panels (more transparent now) === */
    #game-ui {
      display: none;
      position: fixed;
      top: 10%;
      left: 5%;
      width: 90%;
      height: 80%;
      z-index: 1500;
      pointer-events: none;
    }
    #game-log {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: calc(100% - 80px);
      background-color: rgba(0, 0, 0, 0.45);
      color: #0ff;
      padding: 20px;
      overflow-y: auto;
      border: 1px solid #0ff;
      pointer-events: auto;
      font-size: 14px;
      transition: all 0.5s ease-in-out;
    }
    #game-options {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      background-color: rgba(0, 0, 0, 0.55);
      padding: 10px;
      border-top: 1px solid #0ff;
      pointer-events: auto;
    }

    /* === Weather Layers === */
    #fog-layer, #rain-layer, #bloodmoon-layer {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 1;
      display: none;
    }
    #fog-layer { background: url('fog.png') repeat; opacity: 0.4; animation: fogMove 60s linear infinite; }
    #rain-layer { background: url('rain.png') repeat; opacity: 0.5; animation: rainMove 2s linear infinite; }
    #bloodmoon-layer { background: rgba(255,0,0,0.2); }
    @keyframes fogMove { from{background-position:0 0;} to{background-position:1000px 0;} }
    @keyframes rainMove { from{background-position:0 0;} to{background-position:0 1000px;} }

    /* === HUD Elements === */
    #hud {
      position: fixed;
      top: 10px;
      right: 10px;
      background: rgba(0,0,0,0.4);
      color: #0ff;
      padding: 8px 12px;
      border: 1px solid #0ff;
      border-radius: 5px;
      font-size: 14px;
      z-index: 2000;
      font-family: monospace;
    }

    /* === SANITY DISTORTIONS REMOVED (now only hunt visuals) === */

    /* === Loadout Transparency === */
    #loadout-screen {
      background-color: rgba(17, 17, 17, 0.7);
      border: 2px solid rgba(68, 68, 68, 0.7);
      border-radius: 10px;
      color: #fff;
    }
    #van-inventory, #player-inventory {
      background-color: rgba(0,0,0,0.3);
      border: 1px solid #555;
      min-height: 200px;
      padding: 10px;
    }
  </style>
</head>
<body>
  <div id="flash-overlay"></div>
  <canvas id="orb-canvas"></canvas>
  <div id="camera-overlay"></div>
  <div id="fog-layer"></div>
  <div id="rain-layer"></div>
  <div id="bloodmoon-layer"></div>
  <footer>Shark-Blades — Inspired by Phasmophobia.</footer>
  <div id="hud">Sanity: 100%<br>Room: Van<br>Items: None</div>

  <!-- LOADOUT SCREEN -->
  <div id="loadout-screen" style="
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:500px;
    padding:30px;
    z-index:2000;
  ">
    <h2 style="text-align:center;">Select Your Loadout (Drag or Click to Choose)</h2>
    <div style="display:flex;justify-content:space-between;">
      <div id="van-inventory">
        <strong>Van:</strong>
        <div id="van-items"></div>
      </div>
      <div id="player-inventory">
        <strong>Holding:</strong>
        <div id="player-items"></div>
      </div>
    </div>
    <p style="font-size:0.85em;margin-top:10px;color:#ccc;">Drag or click up to 3 items. Notebook & Lighter always included.</p>
    <div style="text-align:center;margin-top:20px;">
      <button id="confirm-loadout" style="margin:5px;padding:8px 24px;">Confirm</button>
    </div>
  </div>

  <!-- GAME UI -->
  <div id="game-ui">
    <div id="game-log"></div>
    <div id="game-options"></div>
  </div>

<script>
/* ==============================
   === GAME STATE & DOM HOOKS ===
============================== */
const gameLog=document.getElementById('game-log');
const gameOptions=document.getElementById('game-options');
const loadoutScreen=document.getElementById('loadout-screen');
const gameUI=document.getElementById('game-ui');
const vanItems=document.getElementById('van-items');
const playerItems=document.getElementById('player-items');
const hud=document.getElementById('hud');
const cameraOverlay=document.getElementById('camera-overlay');
const fogLayer=document.getElementById('fog-layer');
const rainLayer=document.getElementById('rain-layer');
const bloodmoonLayer=document.getElementById('bloodmoon-layer');

const game={
  inventory:[],
  vanStock:{},
  playerRoom:"Van",
  ghostRoom:null,
  currentGhost:null,
  mimicForm:null,
  mimicShift:0,
  sanity:100,
  turn:0,
  foundEvidence:[],
  started:false,
  droppedItems:{},
  activeHunt:false,
  crucifixUsed:false,
  smudgeUsed:false,
  huntCooldown:0,
  weather:"Clear",
  cameraPlaced:{},
  cameraRoom:null,
  saltPlaced:{},
  saltDisturbed:{}
};

function updateHUD(){
  hud.innerHTML = 
    `Sanity: ${game.sanity}%<br>`+
    `Room: ${game.playerRoom}<br>`+
    `Items: ${game.inventory.join(", ")}`;
}

function log(msg){
  const line=document.createElement('div');
  line.textContent=msg;
  line.style.marginBottom='6px';
  gameLog.appendChild(line);
  gameLog.scrollTop=gameLog.scrollHeight;
  updateHUD();
}
/* ==============================
   === MAP VISUALS & WEATHER ===
============================== */
const roomVisuals={
  "Van":"Van_N.png",
  "Living Room":"LivingRoom_N.png",
  "Kitchen":"Kitchen_N.png",
  "Bathroom":"Bathroom_N.png",
  "Bedroom":"Bedroom_N.png",
  "Garage":"Garage_N.png",
  "Basement":"Basement_N.png"
};
function updateMapVisual(){
  const bg=roomVisuals[game.playerRoom]||"Van_N.png";
  document.body.style.background=`url('${bg}') no-repeat center center fixed`;
  document.body.style.backgroundSize="cover";
}
function applyWeather(){
  fogLayer.style.display="none";
  rainLayer.style.display="none";
  bloodmoonLayer.style.display="none";
  if(game.weather==="Fog") fogLayer.style.display="block";
  else if(game.weather==="Rain") rainLayer.style.display="block";
  else if(game.weather==="Bloodmoon") bloodmoonLayer.style.display="block";
}
const weathers=["Clear","Rain","Bloodmoon","Fog"];
function chooseWeather(){
  game.weather=weathers[Math.floor(Math.random()*weathers.length)];
  applyWeather();
  log("The weather's "+game.weather.toLowerCase()+" today.");
}

/* ==============================
   === GHOST PROFILES & ROOMS ===
============================== */
const ghostProfiles=[
  {name:"Spirit",evidence:["EMF","Spirit Box","Ghost Writing"]},
  {name:"Wraith",evidence:["EMF","Spirit Box","D.O.T.S"]},
  {name:"Phantom",evidence:["Spirit Box","Fingerprints","D.O.T.S"]},
  {name:"Poltergeist",evidence:["Spirit Box","Fingerprints","Ghost Writing"]},
  {name:"Banshee",evidence:["Fingerprints","Ghost Orb","D.O.T.S"]},
  {name:"Jinn",evidence:["EMF","Fingerprints","Freezing"]},
  {name:"Mare",evidence:["Spirit Box","Ghost Orb","Ghost Writing"]},
  {name:"Revenant",evidence:["Ghost Orb","Ghost Writing","Freezing"]},
  {name:"Shade",evidence:["EMF","Ghost Writing","Freezing"]},
  {name:"Demon",evidence:["Fingerprints","Ghost Writing","Freezing"]},
  {name:"Yurei",evidence:["Ghost Orb","Freezing","D.O.T.S"]},
  {name:"Oni",evidence:["EMF","Freezing","D.O.T.S"]},
  {name:"Yokai",evidence:["Spirit Box","Ghost Orb","D.O.T.S"]},
  {name:"Hantu",evidence:["Fingerprints","Ghost Orb","Freezing"]},
  {name:"Goryo",evidence:["EMF","Fingerprints","D.O.T.S"]},
  {name:"Myling",evidence:["EMF","Fingerprints","Ghost Writing"]},
  {name:"Onryo",evidence:["Spirit Box","Ghost Orb","Freezing"]},
  {name:"The Twins",evidence:["EMF","Spirit Box","Freezing"]},
  {name:"Raiju",evidence:["EMF","Ghost Orb","D.O.T.S"]},
  {name:"Obake",evidence:["EMF","Fingerprints","Ghost Orb"]},
  {name:"The Mimic",evidence:["Spirit Box","Fingerprints","Freezing"]},
  {name:"Moroi",evidence:["Spirit Box","Ghost Writing","Freezing"]},
  {name:"Deogen",evidence:["Spirit Box","Ghost Writing","D.O.T.S"]},
  {name:"Thaye",evidence:["Ghost Orb","Ghost Writing","D.O.T.S"]},
  {name:"Succubus",evidence:["Spirit Box","Ghost Writing","D.O.T.S"]}
];
const rooms=["Van","Living Room","Kitchen","Bathroom","Bedroom","Garage","Basement"];

/* ==============================
   === START INVESTIGATION ===
============================== */
function startInvestigation(){
  game.currentGhost=ghostProfiles[Math.floor(Math.random()*ghostProfiles.length)];
  game.ghostRoom=rooms[Math.floor(Math.random()*(rooms.length-1))+1];
  game.turn=1;
  game.foundEvidence=[];
  game.mimicForm=null;
  game.mimicShift=3+Math.floor(Math.random()*4);
  chooseWeather();
  updateMapVisual();
  log("This is it... the investigation starts.");
  renderActionButtons();
}

/* ==============================
   === NOTEBOOK LOGIC (CHECK/CROSS) ===
============================== */
function openNotebook(){
  gameOptions.innerHTML="<p>Notebook:</p>";
  const allEvidence=["EMF","Spirit Box","Fingerprints","Ghost Orb","Ghost Writing","Freezing","D.O.T.S"];
  allEvidence.forEach(e=>{
    const btn=document.createElement("button");
    btn.textContent=(game.foundEvidence.includes(e)?"✓ ":"")+e;
    btn.onclick=()=>{
      if(game.foundEvidence.includes(e)){
        game.foundEvidence=game.foundEvidence.filter(x=>x!==e);
        log("Crossed out "+e+" in notebook.");
      } else {
        game.foundEvidence.push(e);
        log("Marked "+e+" in notebook.");
      }
      openNotebook();
    };
    gameOptions.appendChild(btn);
  });

  gameOptions.appendChild(document.createElement("hr"));
  const possibleGhosts = ghostProfiles.filter(g=>
    game.foundEvidence.every(ev=>g.evidence.includes(ev))
  );
  const ghostList=document.createElement("div");
  ghostList.style.marginTop="10px";
  ghostList.innerHTML="<strong>Possible Ghosts:</strong><br>"+
    (possibleGhosts.length?possibleGhosts.map(g=>g.name).join(", "):"None");
  gameOptions.appendChild(ghostList);

  const cancelBtn=document.createElement("button");
  cancelBtn.textContent="Cancel";
  cancelBtn.onclick=renderActionButtons;
  gameOptions.appendChild(cancelBtn);
}

/* ==============================
   === ACTION BUTTONS ===
============================== */
function renderActionButtons(){
  gameOptions.innerHTML="";
  [
    {label:"Move",handler:openMoveMenu},
    {label:"Use Item",handler:openItemMenu},
    {label:"Notebook",handler:openNotebook},
    {label:"Drop/Pick Item",handler:openDropMenu},
    {label:"Van",handler:openVanMenu},
    {label:"Wait",handler:endTurn}
  ].forEach(btn=>{
    const b=document.createElement("button");
    b.textContent=btn.label;
    b.onclick=btn.handler;
    gameOptions.appendChild(b);
  });
}

/* ==============================
   === MOVE MENU ===
============================== */
function openMoveMenu(){
  gameOptions.innerHTML="<p>Select a room to move to:</p>";
  rooms.forEach(r=>{
    const btn=document.createElement("button");
    btn.textContent=r;
    btn.onclick=()=>{
      game.playerRoom=r;
      updateMapVisual();
      cameraOverlay.style.display="none";
      log("Moved to "+r+".");
      endTurn(); // moving counts as a turn
    };
    gameOptions.appendChild(btn);
  });
}

/* ==============================
   === ITEM USAGE (CHANCE SYSTEM + SALT) ===
============================== */
function openItemMenu(){
  gameOptions.innerHTML="<p>Select an item to use:</p>";
  game.inventory.forEach(i=>{
    const btn=document.createElement("button");
    btn.textContent=i;
    btn.onclick=()=>{useItem(i);renderActionButtons();};
    gameOptions.appendChild(btn);
  });
}

function useItem(item){
  const evMap={
    "EMF":"EMF","Spirit Box":"Spirit Box","Camera":"Ghost Orb",
    "UV Light":"Fingerprints","Thermometer":"Freezing",
    "D.O.T.S":"D.O.T.S","Book":"Ghost Writing"
  };
  const ev=evMap[item];
  const inGhostRoom=game.playerRoom===game.ghostRoom;
  const isMimic=game.currentGhost.name==="The Mimic";
  const evidenceList=(isMimic&&game.mimicForm)?game.mimicForm.evidence:game.currentGhost.evidence;
  const chance=0.5+Math.random()*0.35;

  if(item==="Camera"){
    game.cameraPlaced[game.playerRoom]=true;
    game.cameraRoom=game.playerRoom;
    if(game.foundEvidence.includes("Ghost Orb") || (isMimic && inGhostRoom)){
      log("Camera captures faint orbs swirling on screen.");
      cameraOverlay.style.display="block";
    }
    endTurn();
    return;
  }

  if(item==="Salt"){
    if(!game.saltPlaced[game.playerRoom]){
      game.saltPlaced[game.playerRoom]=true;
      game.saltDisturbed[game.playerRoom]=false;
      log("I sprinkled salt carefully on the ground here.");
    } else {
      log("There's already salt here.");
    }
    endTurn();
    return;
  }

  if(!inGhostRoom){
    log("No signs... maybe wrong room.");
    endTurn();
    return;
  }

  if(evidenceList.includes(ev)){
    if(Math.random()<=chance){
      if(!game.foundEvidence.includes(ev)){
        game.foundEvidence.push(ev);
        log("Evidence confirmed: "+ev);
        if(ev==="Ghost Orb") cameraOverlay.style.display="block";
      } else log("Same reading as before.");
    } else log("The reading flickers... nothing solid yet.");
  } else log("No response from this tool.");
  endTurn();
}
/* ==============================
   === VAN MENU (CAMERA + SWAP) ===
============================== */
function openVanMenu(){
  if(game.playerRoom!=="Van"){log("I need to be in the van for this.");renderActionButtons();return;}
  gameOptions.innerHTML="<p>Van Options:</p>";

  const camBtn=document.createElement("button");
  camBtn.textContent="View Camera Monitor";
  camBtn.onclick=()=>{
    if(game.cameraRoom && game.cameraPlaced[game.cameraRoom]){
      document.body.style.background=`url('${roomVisuals[game.cameraRoom]}') no-repeat center center fixed`;
      document.body.style.backgroundSize="cover";
      cameraOverlay.style.display="block";
      log("I stare at the monitor, watching the feed from "+game.cameraRoom+".");
      endTurn(true); // viewing counts as a turn
    } else {
      log("No active cameras connected.");
    }
  };
  gameOptions.appendChild(camBtn);

  const swapBtn=document.createElement("button");
  swapBtn.textContent="Swap Items";
  swapBtn.onclick=()=>{
    gameOptions.innerHTML="<p>Swap items:</p>";
    for(let tool in game.vanStock){
      const take=document.createElement("button");
      take.textContent="Take "+tool+" ("+game.vanStock[tool]+")";
      take.onclick=()=>{
        if(game.inventory.length>=5){log("I can't carry more.");return;}
        game.inventory.push(tool);
        game.vanStock[tool]--;
        if(game.vanStock[tool]<=0) delete game.vanStock[tool];
        log("Took "+tool+" from the van.");
        updateHUD();
        openVanMenu();
      };
      gameOptions.appendChild(take);
    }
    game.inventory.filter(i=>!["Notebook","Lighter"].includes(i)).forEach(i=>{
      const ret=document.createElement("button");
      ret.textContent="Return "+i;
      ret.onclick=()=>{
        game.inventory=game.inventory.filter(x=>x!==i);
        game.vanStock[i]=(game.vanStock[i]||0)+1;
        log("Returned "+i+" to the van.");
        updateHUD();
        openVanMenu();
      };
      gameOptions.appendChild(ret);
    });
    const back=document.createElement("button");
    back.textContent="Back";
    back.onclick=openVanMenu;
    gameOptions.appendChild(back);
  };
  gameOptions.appendChild(swapBtn);

  const cancel=document.createElement("button");
  cancel.textContent="Cancel";
  cancel.onclick=renderActionButtons;
  gameOptions.appendChild(cancel);
}

/* ==============================
   === DROP / PICK ITEMS ===
============================== */
function openDropMenu(){
  gameOptions.innerHTML="<p>Drop or pick items:</p>";
  const room=game.playerRoom;
  if(!game.droppedItems[room]) game.droppedItems[room]=[];

  game.inventory.filter(i=>!["Notebook","Lighter"].includes(i)).forEach(i=>{
    const btn=document.createElement("button");
    btn.textContent="Drop "+i;
    btn.onclick=()=>{
      game.droppedItems[room].push(i);
      game.inventory=game.inventory.filter(x=>x!==i);
      log("Dropped "+i+" in "+room+".");
      updateHUD();
      renderActionButtons();
    };
    gameOptions.appendChild(btn);
  });

  if(game.droppedItems[room].length){
    gameOptions.appendChild(document.createElement("hr"));
    game.droppedItems[room].forEach(i=>{
      const btn=document.createElement("button");
      btn.textContent="Pick "+i;
      btn.onclick=()=>{
        if(game.inventory.length>=5){log("Can't hold more.");return;}
        game.inventory.push(i);
        game.droppedItems[room]=game.droppedItems[room].filter(x=>x!==i);
        log("Picked up "+i+".");
        updateHUD();
        renderActionButtons();
      };
      gameOptions.appendChild(btn);
    });
  }

  const cancelBtn=document.createElement("button");
  cancelBtn.textContent="Cancel";
  cancelBtn.onclick=renderActionButtons;
  gameOptions.appendChild(cancelBtn);
}

/* ==============================
   === HUD UPDATE (Sanity, Room, Items, Salt) ===
============================== */
function updateHUD(){
  const hud=document.querySelector("footer");
  let saltStatus="";
  if(game.saltPlaced[game.playerRoom]){
    saltStatus = game.saltDisturbed[game.playerRoom] ? "Salt: disturbed" : "Salt: placed";
  }
  hud.textContent=`Shark-Blades — Inspired by Phasmophobia. | Sanity: ${game.sanity}% | Room: ${game.playerRoom} | Items: ${game.inventory.join(", ")}${saltStatus? " | "+saltStatus:""}`;
}

/* ==============================
   === END TURN & SANITY LOGIC ===
============================== */
function endTurn(skipSanity){
  if(!skipSanity){
    // Sanity logic: small regen in van or lit areas, slow drain in dark
    let sanityChange = 0;
    if(game.playerRoom==="Van"){ 
      sanityChange = +1; // resting in van regenerates sanity slightly
    } else if(game.weather!=="Clear" && game.playerRoom!=="Van") {
      sanityChange = -Math.floor(Math.random()*3); // bad weather drains
    } else if(game.playerRoom!==game.ghostRoom){
      sanityChange = (Math.random()<0.4)?0: -1;
    } else { // ghost nearby = higher drain
      sanityChange = -Math.floor(Math.random()*6+3);
    }
    game.sanity = Math.min(100,Math.max(0,game.sanity + sanityChange));
  }

  game.turn++;
  updateHUD();
  generateAmbientThought();
  if(game.currentGhost.name==="The Mimic"){
    game.mimicShift--;
    if(game.mimicShift<=0){
      let pool=ghostProfiles.filter(g=>g.name!=="The Mimic");
      game.mimicForm=pool[Math.floor(Math.random()*pool.length)];
      game.mimicShift=3+Math.floor(Math.random()*4);
      log("Its behavior feels... different. Like it's copying something new.");
    }
  }
  handleSaltInteractions();
  handleHunt();
  renderActionButtons();
}

/* ==============================
   === AMBIENT NARRATION PER ROOM ===
============================== */
function generateAmbientThought(){
  const ambientVan=[
    "I glance at the monitors. Still quiet.",
    "The van hums quietly. Safe, for now.",
    "I rest my hands on the desk. No shaking... yet.",
    "It's too calm out here. The house feels alive in the distance."
  ];
  const ambientGeneric=[
    "That creak again... is it following me?",
    "A sudden chill licked my neck.",
    "I swear I heard someone whisper my name.",
    "The air smells stale, wrong, heavy.",
    "My breath caught in my throat... was it watching?",
    "Something brushed my arm just now."
  ];
  const roomSpecific={
    "Living Room":[
      "The couch looks untouched... or is it?",
      "Shadows play tricks on the fireplace walls.",
      "The TV flickers faintly, though it's off."
    ],
    "Kitchen":[
      "The fridge hums louder than usual.",
      "Plates rattle slightly... no one's here.",
      "The smell of old food hangs too thickly."
    ],
    "Bathroom":[
      "The sink drips. Every drop echoes.",
      "The mirror fogged up just now... I didn't breathe on it.",
      "Something scratched the tiles faintly."
    ],
    "Bedroom":[
      "The bed looks slept in... was it?",
      "Curtains sway with no wind.",
      "I feel like someone's under the bed."
    ],
    "Garage":[
      "Tools clinked somewhere on their own.",
      "The car door twitched slightly.",
      "The smell of oil feels too fresh."
    ],
    "Basement":[
      "The air is damp and oppressive.",
      "Footsteps? Or water dripping? Hard to tell.",
      "The pipes groan... or is that something else?"
    ]
  };

  let arr=ambientGeneric;
  if(game.playerRoom==="Van") arr=ambientVan;
  else if(roomSpecific[game.playerRoom]) arr=ambientGeneric.concat(roomSpecific[game.playerRoom]);
  if(Math.random()<0.7){
    log(arr[Math.floor(Math.random()*arr.length)]);
  }
}

/* ==============================
   === SALT INTERACTIONS ===
============================== */
function handleSaltInteractions(){
  for(let room in game.saltPlaced){
    if(game.saltPlaced[room] && !game.saltDisturbed[room]){
      // Ghost passes by random chance if in same or adjacent room
      if(Math.random()<0.3 && (room===game.ghostRoom)){
        game.saltDisturbed[room]=true;
        if(room===game.playerRoom){
          log("I watch as the salt crunches... a footprint forms.");
        } else {
          log("Somewhere... something just disturbed the salt.");
        }
        updateHUD();
      }
    }
  }
}

/* ==============================
   === HUNT SYSTEM ===
============================== */
function handleHunt(){
  if(game.huntCooldown>0){game.huntCooldown--;return;}
  const inGhostRoom = (game.playerRoom===game.ghostRoom);
  const huntChance = (100 - game.sanity) / 100;
  if(inGhostRoom && Math.random()<huntChance){
    game.huntCooldown=3+Math.floor(Math.random()*3);
    log("The air thickens suddenly... It's HUNTING!");

    if(!game.crucifixUsed && game.inventory.includes("Crucifix")){
      game.crucifixUsed=true;
      log("The crucifix glows hot in my hand... the ghost recoils.");
      return;
    }

    if(!game.smudgeUsed && game.inventory.includes("Smudge")){
      game.smudgeUsed=true;
      log("I burn a smudge stick... shrieking fades away.");
      return;
    }

    log("My chest tightens—It's HERE—");
    setTimeout(()=>{
      log("Everything goes black as claws grip me... I'm dead.");
      endGame(false);
    },2000);
  }
}
/* ==============================
   === GAME END & RESTART ===
============================== */
function endGame(victory){
  gameOptions.innerHTML="";
  const msg=document.createElement("div");
  msg.style.marginBottom="10px";
  msg.textContent = victory ? "You solved the case and survived." : "You died. The ghost claimed you.";
  gameOptions.appendChild(msg);

  const restart=document.createElement("button");
  restart.textContent="Restart Game";
  restart.onclick=()=>{
    location.reload();
  };

}

/* ==============================
   === LOADOUT INITIALIZATION ===
============================== */
const allLoadoutItems=["EMF","Spirit Box","Camera","UV Light","D.O.T.S","Thermometer","Book","Smudge","Crucifix","Salt"];

function initLoadout(){
  vanItems.innerHTML="";
  playerItems.innerHTML="";
  allLoadoutItems.forEach(it=>{
    const div=document.createElement("div");
    div.textContent=it;
    div.style.border="1px solid #555";
    div.style.margin="3px";
    div.style.padding="4px";
    div.style.background="#111";
    div.style.color="#0ff";
    div.style.cursor="pointer";
    div.onclick=()=>{
      // Click fallback
      if([...playerItems.querySelectorAll("div")].length>=3){alert("Max 3 items.");return;}
      if([...playerItems.querySelectorAll("div")].some(d=>d.textContent===it))return;
      playerItems.appendChild(div);
    };
    div.draggable=true;
    div.ondragstart=e=>{e.dataTransfer.setData("text/plain",it);};
    vanItems.appendChild(div);
  });

  [vanItems,playerItems].forEach(el=>{
    el.ondragover=e=>e.preventDefault();
  });

  playerItems.ondrop=e=>{
    const it=e.dataTransfer.getData("text/plain");
    if(playerItems.querySelectorAll("div").length>=3){alert("Max 3 items.");return;}
    const node=[...vanItems.querySelectorAll("div")].find(d=>d.textContent===it);
    if(node) playerItems.appendChild(node);
  };

  vanItems.ondrop=e=>{
    const it=e.dataTransfer.getData("text/plain");
    const node=[...playerItems.querySelectorAll("div")].find(d=>d.textContent===it);
    if(node) vanItems.appendChild(node);
  };
}

document.getElementById('confirm-loadout').onclick=()=>{
  game.inventory=[...playerItems.querySelectorAll("div")].map(d=>d.textContent);
  if(game.inventory.length>3){alert("Max 3 items.");return;}
  game.vanStock={};
  allLoadoutItems.forEach(it=>{
    if(!game.inventory.includes(it)) game.vanStock[it]=(it==="Smudge"?2:it==="Salt"?3:1);
  });
  game.inventory.push("Notebook","Lighter");
  loadoutScreen.style.display="none";
  gameUI.style.display="block";
  updateHUD();
  log("I’ve packed: "+game.inventory.join(", "));
  startInvestigation();
};

/* ==============================
   === START INVESTIGATION ===
============================== */
function startInvestigation(){
  game.currentGhost=ghostProfiles[Math.floor(Math.random()*ghostProfiles.length)];
  game.ghostRoom=rooms[Math.floor(Math.random()*(rooms.length-1))+1];
  game.turn=1;
  game.foundEvidence=[];
  game.mimicForm=null;
  game.mimicShift=3+Math.floor(Math.random()*4);
  chooseWeather();
  updateMapVisual();
  log("The investigation starts now...");
  renderActionButtons();
}

/* ==============================
   === CAMERA PLACEMENT & ORBS ===
============================== */
function useItem(item){
  const evMap={
    "EMF":"EMF","Spirit Box":"Spirit Box","Camera":"Ghost Orb",
    "UV Light":"Fingerprints","Thermometer":"Freezing",
    "D.O.T.S":"D.O.T.S","Book":"Ghost Writing"
  };
  const ev=evMap[item];
  const inGhostRoom=game.playerRoom===game.ghostRoom;
  const isMimic=game.currentGhost.name==="The Mimic";
  const evidenceList=(isMimic&&game.mimicForm)?game.mimicForm.evidence:game.currentGhost.evidence;
  const chance=0.5+Math.random()*0.35;

  if(item==="Camera"){
    game.cameraPlaced[game.playerRoom]=true;
    game.cameraRoom=game.playerRoom;
    if(game.foundEvidence.includes("Ghost Orb") || (isMimic && inGhostRoom)){
      log("Camera shows orbs drifting lazily.");
      cameraOverlay.style.display="block";
    }
    updateHUD();
    return;
  }

  if(item==="Salt"){
    if(!game.saltPlaced[game.playerRoom]){
      game.saltPlaced[game.playerRoom]=true;
      game.saltDisturbed[game.playerRoom]=false;
      log("I laid a strip of salt on the ground.");
      updateHUD();
    } else {
      log("There's already salt in this room.");
    }
    return;
  }

  if(!inGhostRoom){
    log("This isn't the right spot... nothing responds.");
    return;
  }

  if(evidenceList.includes(ev)){
    if(Math.random()<=chance){
      if(!game.foundEvidence.includes(ev)){
        game.foundEvidence.push(ev);
        log("I confirm: "+ev+" is present here.");
        if(ev==="Ghost Orb") cameraOverlay.style.display="block";
      } else log("I already noted this.");
    } else log("The tool flickers but shows nothing solid.");
  } else log("No response from this tool.");
  updateHUD();
}

/* ==============================
   === NOTEBOOK (CHECK + CROSS) ===
============================== */
function openNotebook(){
  gameOptions.innerHTML="<p>Notebook:</p>";
  const allEv=["EMF","Spirit Box","Fingerprints","Ghost Orb","Ghost Writing","Freezing","D.O.T.S"];
  allEv.forEach(e=>{
    const btn=document.createElement("button");
    btn.textContent=(game.foundEvidence.includes(e)?"✓ ":"")+e;
    btn.onclick=()=>{
      if(game.foundEvidence.includes(e)){
        game.foundEvidence=game.foundEvidence.filter(x=>x!==e);
        log("Crossed out "+e+" in notebook.");
      } else {
        game.foundEvidence.push(e);
        log("Marked "+e+" in notebook.");
      }
      updateHUD();
      openNotebook();
    };
    gameOptions.appendChild(btn);
  });

  gameOptions.appendChild(document.createElement("hr"));
  const possibleGhosts=ghostProfiles.filter(g=>
    game.foundEvidence.every(ev=>g.evidence.includes(ev))
  );
  const ghostList=document.createElement("div");
  ghostList.style.marginTop="10px";
  ghostList.innerHTML="<strong>Possible Ghosts:</strong><br>"+
    (possibleGhosts.length?possibleGhosts.map(g=>g.name).join(", "):"None");
  gameOptions.appendChild(ghostList);

  const cancelBtn=document.createElement("button");
  cancelBtn.textContent="Cancel";
  cancelBtn.onclick=renderActionButtons;
  gameOptions.appendChild(cancelBtn);
}

/* ==============================
   === MAP VISUALS & WEATHER ===
============================== */
const roomVisuals={
  "Van":"Van_N.png","Living Room":"LivingRoom_N.png",
  "Kitchen":"Kitchen_N.png","Bathroom":"Bathroom_N.png",
  "Bedroom":"Bedroom_N.png","Garage":"Garage_N.png",
  "Basement":"Basement_N.png"
};
function updateMapVisual(){
  const bg=roomVisuals[game.playerRoom]||"Van_N.png";
  document.body.style.background=`url('${bg}') no-repeat center center fixed`;
  document.body.style.backgroundSize="cover";
}
function applyWeather(){
  fogLayer.style.display="none";
  rainLayer.style.display="none";
  bloodmoonLayer.style.display="none";
  if(game.weather==="Fog") fogLayer.style.display="block";
  else if(game.weather==="Rain") rainLayer.style.display="block";
  else if(game.weather==="Bloodmoon") bloodmoonLayer.style.display="block";
}
const weathers=["Clear","Rain","Bloodmoon","Fog"];
function chooseWeather(){
  game.weather=weathers[Math.floor(Math.random()*weathers.length)];
  applyWeather();
  log("Weather today: "+game.weather);
}

/* ==============================
   === SPIRIT ORBS DISPLAY ===
============================== */
const orbCanvas=document.getElementById('orb-canvas');
const ctx=orbCanvas.getContext('2d');
let width=orbCanvas.width=window.innerWidth;
let height=orbCanvas.height=window.innerHeight;
function createOrb(){
  return {
    x:Math.random()*width,
    y:Math.random()*height,
    vx:(Math.random()-0.5)*0.5,
    vy:(Math.random()-0.5)*0.5,
    baseRadius:2+Math.random()*3,
    opacity:0,
    fadeIn:true,
    tick:Math.random()*1000
  };
}
let orbs=Array.from({length:10},createOrb);
function animateOrbs(){
  ctx.clearRect(0,0,width,height);
  if((game.playerRoom===game.ghostRoom && game.foundEvidence.includes("Ghost Orb")) ||
     (game.cameraRoom===game.ghostRoom && cameraOverlay.style.display==="block")){
    orbs.forEach(o=>{
      o.tick++;
      if(o.fadeIn){
        o.opacity+=0.01;
        if(o.opacity>0.6)o.fadeIn=false;
      } else {
        o.opacity-=0.005;
        if(o.opacity<=0.05)Object.assign(o,createOrb());
      }
      o.x+=o.vx;o.y+=o.vy;
      if(o.x<0||o.x>width)o.vx*=-1;
      if(o.y<0||o.y>height)o.vy*=-1;
      const gradient=ctx.createRadialGradient(o.x,o.y,0,o.x,o.y,o.baseRadius*3);
      gradient.addColorStop(0,`rgba(200,255,255,${o.opacity})`);
      gradient.addColorStop(0.5,`rgba(150,200,255,${o.opacity*0.5})`);
      gradient.addColorStop(1,`rgba(100,150,200,0)`);
      ctx.beginPath();
      ctx.fillStyle=gradient;
      ctx.ellipse(o.x,o.y,o.baseRadius*(1+Math.sin(o.tick*0.05)*0.3),o.baseRadius,0,0,Math.PI*2);
      ctx.fill();
    });
  }
  requestAnimationFrame(animateOrbs);
}
animateOrbs();
window.addEventListener('resize',()=>{
  width=orbCanvas.width=window.innerWidth;
  height=orbCanvas.height=window.innerHeight;
});
/* ==============================
   === HUD UPDATE (Sanity, Room, Items, Salt) ===
============================== */
function updateHUD(){
  let hudText = `Sanity: ${game.sanity}% | Room: ${game.playerRoom} | Items: ${game.inventory.join(", ")}`;
  let saltStatus = "";
  if(game.saltPlaced[game.playerRoom]){
    saltStatus = game.saltDisturbed[game.playerRoom] ? " | Salt: disturbed" : " | Salt: placed";
  }
  if(document.querySelector("footer")){
    document.querySelector("footer").textContent = `Shark-Blades — Inspired by Phasmophobia.  ${hudText}${saltStatus}`;
  }
}

/* ==============================
   === VAN MENU (UPDATED) ===
============================== */
function openVanMenu(){
  if(game.playerRoom!=="Van"){log("I need to be in the van.");renderActionButtons();return;}
  gameOptions.innerHTML="<p>Van Options:</p>";

  const camBtn=document.createElement("button");
  camBtn.textContent="View Camera Monitor";
  camBtn.onclick=()=>{
    if(game.cameraRoom && game.cameraPlaced[game.cameraRoom]){
      document.body.style.background=`url('${roomVisuals[game.cameraRoom]}') no-repeat center center fixed`;
      document.body.style.backgroundSize="cover";
      cameraOverlay.style.display="block";
      log("I stare at the monitor, watching the feed from "+game.cameraRoom+".");
      endTurn(true); // Viewing takes a turn
    } else {
      log("No active cameras connected.");
    }
  };
  gameOptions.appendChild(camBtn);

  const swapBtn=document.createElement("button");
  swapBtn.textContent="Swap Items";
  swapBtn.onclick=()=>{
    gameOptions.innerHTML="<p>Swap items:</p>";
    for(let tool in game.vanStock){
      const take=document.createElement("button");
      take.textContent="Take "+tool+" ("+game.vanStock[tool]+")";
      take.onclick=()=>{
        if(game.inventory.length>=5){log("I can't carry more.");return;}
        game.inventory.push(tool);
        game.vanStock[tool]--;
        if(game.vanStock[tool]<=0) delete game.vanStock[tool];
        log("Took "+tool+" from the van.");
        updateHUD();
        openVanMenu();
      };
      gameOptions.appendChild(take);
    }
    game.inventory.filter(i=>!["Notebook","Lighter"].includes(i)).forEach(i=>{
      const ret=document.createElement("button");
      ret.textContent="Return "+i;
      ret.onclick=()=>{
        game.inventory=game.inventory.filter(x=>x!==i);
        game.vanStock[i]=(game.vanStock[i]||0)+1;
        log("Returned "+i+" to the van.");
        updateHUD();
        openVanMenu();
      };
      gameOptions.appendChild(ret);
    });
    const back=document.createElement("button");
    back.textContent="Back";
    back.onclick=openVanMenu;
    gameOptions.appendChild(back);
  };
  gameOptions.appendChild(swapBtn);

  const cancel=document.createElement("button");
  cancel.textContent="Cancel";
  cancel.onclick=renderActionButtons;
  gameOptions.appendChild(cancel);
}

/* ==============================
   === TURN HANDLER (WAIT BUTTON) ===
============================== */
function endTurn(isVanAction=false){
  if(game.playerRoom==="Van" && !isVanAction){
    log("I sit in the van, taking a moment to breathe. (No time passes)");
    return;
  }
  game.turn++;
  let sanityChange = 0;

  // Sanity changes depending on environment
  const isGhostNearby = (game.playerRoom===game.ghostRoom);
  if(game.playerRoom==="Van"){
    sanityChange = +2; // calming
  } else if(!isGhostNearby && game.weather!=="Bloodmoon"){
    if(Math.random()<0.5) sanityChange = +1; // calm if well lit
    else sanityChange = 0;
  } else {
    sanityChange = -(Math.floor(Math.random()*6+3));
  }

  game.sanity = Math.max(0, Math.min(100, game.sanity + sanityChange));
  updateHUD();

  // Ambient Narration Pool (Varied)
  const ambientNarration = {
    "Van": [
      "The hum of the equipment is oddly comforting.",
      "I sip stale coffee... one more case.",
      "The monitors flicker, but everything seems stable."
    ],
    "Living Room": [
      "A couch sits here... but the air feels heavy.",
      "Pictures stare back with hollow eyes.",
      "The old rug muffles my steps—something moved beneath it?"
    ],
    "Kitchen": [
      "Knives hang on the rack, swaying gently.",
      "The smell of stale grease lingers.",
      "The faucet drips... or is it? I didn't hear a drip just now."
    ],
    "Bathroom": [
      "A mirror fogs slightly, though it's cold.",
      "The tiles are wet... I haven't touched anything.",
      "The shower curtain sways... something brushed it."
    ],
    "Bedroom": [
      "The bed creaks as if someone just sat down.",
      "A photo frame lies face down.",
      "Something scratches faintly under the bed."
    ],
    "Garage": [
      "Tools rattle lightly on the workbench.",
      "Tire tracks look fresh... but no one drove here.",
      "Oil stains seem darker, wetter than before."
    ],
    "Basement": [
      "The air is dense, like it's breathing.",
      "Something moved in the shadows.",
      "The stairs creak behind me—no one's there."
    ]
  };

  const roomLines = ambientNarration[game.playerRoom] || [
    "A strange silence fills the air.",
    "Every sound feels louder here.",
    "Shadows shift in my peripheral vision."
  ];
  const randomLine = roomLines[Math.floor(Math.random()*roomLines.length)];
  log(randomLine);

  // Mimic Logic
  if(game.currentGhost.name==="The Mimic"){
    game.mimicShift--;
    if(game.mimicShift<=0){
      let pool=ghostProfiles.filter(g=>g.name!=="The Mimic");
      game.mimicForm=pool[Math.floor(Math.random()*pool.length)];
      game.mimicShift=3+Math.floor(Math.random()*4);
      log("...It feels different now. Like it's someone else.");
    }
  }

  handleHunt();
  renderActionButtons();
}

/* ==============================
   === HUNT LOGIC (DEATH NARRATION) ===
============================== */
function handleHunt(){
  if(game.huntCooldown>0){
    game.huntCooldown--;
    return;
  }

  const huntChance = (100 - game.sanity) / 100;
  const inGhostRoom = (game.playerRoom === game.ghostRoom);

  if(inGhostRoom && Math.random() < huntChance){
    game.huntCooldown = 3 + Math.floor(Math.random()*3);
    log("The air goes heavy... it's starting a hunt!");

    // Crucifix check
    if(!game.crucifixUsed && game.inventory.includes("Crucifix")){
      game.crucifixUsed = true;
      log("The crucifix sizzles hot in my hand, stopping it... for now.");
      return;
    }

    // Smudge check
    if(!game.smudgeUsed && game.inventory.includes("Smudge")){
      game.smudgeUsed = true;
      log("I light the smudge; it recoils with a scream!");
      return;
    }

    // Death outcome
    setTimeout(()=>{
      const deathLines = [
        "Its cold fingers wrap around my neck...",
        "I feel my chest crushed by unseen hands...",
        "I can't scream. It's here. It's over.",
        "It stands over me, laughing without a mouth."
      ];
      log(deathLines[Math.floor(Math.random()*deathLines.length)]);
      endGame(false);
    }, 3000);
  }
}

const orbCanvas=document.getElementById('orb-canvas');

function checkSaltInteraction(){
  // Salt disturbance happens if ghost roams to salt-placed room
  Object.keys(game.saltPlaced).forEach(room=>{
    if(game.saltPlaced[room] && !game.saltDisturbed[room]){
      if(room===game.ghostRoom && Math.random()<0.3){

          log("The salt shifts—footprints smear the line!");

}
