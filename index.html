<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phasma‑Phoney v2.8 — Corrected Master Build</title>
  <style>
    /* === GLOBAL RESET === */
    html, body {
      margin:0;
      padding:0;
      width:100%;
      height:100%;
      background:#000;
      overflow:hidden;
      font-family: monospace;
      color:#eee;
    }

    /* === LOADOUT SCREEN === */
    #loadout-screen {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.9);
      color: #eee;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    #loadout-container {
      display: flex;
      gap: 40px;
      margin-bottom: 20px;
    }

    .loadout-column {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .loadout-column h3 {
      margin-bottom: 6px;
      color: #0f0;
    }

    .loadout-list {
      background: #111;
      border: 1px solid #555;
      width: 180px;
      min-height: 200px;
      max-height: 250px;
      overflow-y: auto;
      padding: 6px;
    }

    .loadout-list button {
      width: 100%;
      text-align: left;
      background: #222;
      border: 1px solid #444;
      color: #ccc;
      margin-bottom: 4px;
      cursor: pointer;
      font-size: 13px;
    }

    .loadout-list button:hover {
      background: #333;
    }

    #confirm-loadout {
      padding: 6px 14px;
      font-size: 14px;
      background: #222;
      color: #eee;
      border: 1px solid #555;
      cursor: pointer;
    }
    #confirm-loadout:hover { background: #444; }

    /* === MAIN SCENE === */
    #main-scene {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #000;
      display: none;
      overflow: hidden;
    }

    #background-layer {
      position: absolute;
      top:0; left:0;
      width:100%; height:100%;
      background: url('House.png') center center no-repeat;
      background-size: cover;
      z-index: 0;
    }

    #fog-layer {
      position: absolute;
      top:0; left:0;
      width:100%; height:100%;
      z-index: 2;
      opacity:0.3;
    }

    #foreground-layer {
      position: absolute;
      top:0; left:0;
      width:100%; height:100%;
      z-index: 3;
    }

    #orb-layer {
      position: absolute;
      top:0; left:0;
      width:100%; height:100%;
      pointer-events:none;
      z-index: 5;
    }

    /* === HUD === */
    #hud {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0,0,0,0.4);
      padding: 6px 10px;
      border: 1px solid rgba(255,255,255,0.3);
      color: #eee;
      z-index: 20;
      font-size:14px;
    }

    /* === NARRATOR UI === */
    #narrator-ui {
      position: absolute;
      bottom:0;
      left:0;
      width:100%;
      height:35%;
      background: rgba(0,0,0,0.7);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      z-index: 25;
    }

    #narrator-log {
      flex: 1;
      overflow-y:auto;
      padding: 8px;
      color: #ccc;
      font-family: monospace;
      font-size: 14px;
    }

    #narrator-log p {
      margin: 2px 0;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn { from {opacity:0;} to {opacity:1;} }

    #narrator-buttons {
      display:flex;
      flex-wrap:wrap;
      gap:6px;
      padding:8px;
      border-top:1px solid rgba(255,255,255,0.2);
    }

    #narrator-buttons button {
      background:#222;
      color:#eee;
      border:1px solid #555;
      border-radius:3px;
      padding:5px 10px;
      font-size:14px;
      cursor:pointer;
    }
    #narrator-buttons button:hover { background:#444; }

    .spirit-orb {
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,0.5);
      box-shadow: 0 0 6px 2px rgba(255,255,255,0.7);
      opacity: 0;
      transition: opacity 2s ease, top 5s linear, left 5s linear;
      z-index: 5;
    }

    @media (max-width: 600px) {
      #hud { font-size: 12px; }
      #narrator-log { font-size: 12px; max-height: 35%; }
      #narrator-buttons button { font-size: 11px; padding: 3px 6px; }
    }
  </style>
</head>

<body>
  <!-- === LOADOUT SCREEN === -->
  <div id="loadout-screen">
    <h2>Select Your Starting Gear (Max 3)</h2>
    <div id="loadout-container">
      <div class="loadout-column">
        <h3>Holding:</h3>
        <div id="held-items" class="loadout-list"></div>
      </div>
      <div class="loadout-column">
        <h3>Van Inventory:</h3>
        <div id="van-items" class="loadout-list"></div>
      </div>
    </div>
    <button id="confirm-loadout" onclick="confirmLoadout()">Start Investigation</button>
  </div>

  <!-- === MAIN SCENE === -->
  <div id="main-scene">
    <div id="background-layer"></div>
    <div id="fog-layer"></div>
    <div id="orb-layer"></div>
    <div id="foreground-layer"></div>

    <div id="hud">
      <div>Sanity: <span id="hud-sanity">100%</span></div>
      <div>Turn: <span id="hud-turn">0</span></div>
      <div>Location: <span id="hud-location">Van</span></div>
      <div>Temp: <span id="hud-temp">--°C</span></div>
      <div>Direction: <span id="hud-direction">N</span></div>
    </div>

    <div id="narrator-ui">
      <div id="narrator-log"></div>
      <div id="narrator-buttons"></div>
    </div>
  </div>

<script>
/* === GAME STATE === */
const game = {
  ghost: null,
  ghostRoom: null,
  playerRoom: "Van",
  playerDirection: "N",
  inventory: [],
  vanStock: {
    "EMF Reader": true,
    "Spirit Box": true,
    "Camera": true,
    "UV Light": true,
    "D.O.T.S Projector": true,
    "Thermometer": true,
    "Crucifix": true,
    "Smudge Stick": true,
    "Salt": true
  },
  currentTurn: 0,
  sanity: 100,
  huntActive: false,
  smudgeCooldown: 0,
  huntCooldown: 0,
  mimicForm: null,
  nextMimicShift: 0
};

/* === ROOMS MAP WITH DIRECTIONS === */
const roomsMap = {
  "Van": { N: "Foyer", S: null, E: null, W: null },
  "Foyer": { N: "Living Room", S: "Van", E: "Dining Room", W: "Bathroom" },
  "Living Room": { N: "Kitchen", S: "Foyer", E: "Garage", W: "Kids Bedroom" },
  "Kitchen": { N: "Basement", S: "Living Room", E: null, W: "Dining Room" },
  "Dining Room": { N: "Kitchen", S: "Foyer", E: null, W: "Master Bedroom" },
  "Garage": { N: null, S: "Living Room", E: null, W: null },
  "Basement": { N: null, S: "Kitchen", E: null, W: null },
  "Bathroom": { N: null, S: null, E: "Foyer", W: null },
  "Kids Bedroom": { N: null, S: null, E: "Living Room", W: null },
  "Master Bedroom": { N: null, S: null, E: "Dining Room", W: null }
};

/* === BACKGROUND UPDATE === */
function updateBackground() {
  const bg = document.getElementById("background-layer");
  const img = `${game.playerRoom.replace(/ /g,"")}_${game.playerDirection}.png`;
  bg.style.background = `url('${img}') center center no-repeat`;
  bg.style.backgroundSize = "cover";
  document.getElementById("hud-location").textContent = game.playerRoom;
  document.getElementById("hud-direction").textContent = game.playerDirection;
}

<script>
/* === GHOST PROFILES === */
const ghostProfiles = {
  "Spirit": {
    evidence: ["EMF Level 5", "Spirit Box", "Ghost Writing"],
    sanityThreshold: "Average", huntCooldown: 20, speedCategory: "Normal",
    behavior: "Standard ghost. Repelled by smudge for ~3 mins."
  },
  "Wraith": {
    evidence: ["EMF Level 5", "Spirit Box", "D.O.T.S Projector"],
    sanityThreshold: "Average", huntCooldown: 20, speedCategory: "Normal",
    behavior: "Can teleport randomly to player."
  },
  "Phantom": {
    evidence: ["Spirit Box", "Fingerprints", "D.O.T.S Projector"],
    sanityThreshold: "Average", huntCooldown: 20, speedCategory: "Normal",
    behavior: "Drops sanity quickly when looked at."
  },
  "Poltergeist": {
    evidence: ["Spirit Box", "Fingerprints", "Ghost Writing"],
    sanityThreshold: "Average", huntCooldown: 20, speedCategory: "Normal",
    behavior: "Throws multiple items at once."
  },
  "Banshee": {
    evidence: ["Fingerprints", "Orbs", "D.O.T.S Projector"],
    sanityThreshold: "Early", huntCooldown: 20, speedCategory: "Normal",
    behavior: "Targets a specific player."
  },
  "Jinn": {
    evidence: ["EMF Level 5", "Fingerprints", "Freezing Temps"],
    sanityThreshold: "Average", huntCooldown: 20, speedCategory: "Fast-LOS",
    behavior: "Moves faster if it has line of sight."
  },
  "Mare": {
    evidence: ["Spirit Box", "Ghost Writing", "Orbs"],
    sanityThreshold: "Average", huntCooldown: 20, speedCategory: "Normal",
    behavior: "Prefers darkness, avoids light."
  },
  "Revenant": {
    evidence: ["Ghost Writing", "Freezing Temps", "Orbs"],
    sanityThreshold: "Average", huntCooldown: 25, speedCategory: "Fast",
    behavior: "Very fast when chasing; slow if no LOS."
  },
  "Shade": {
    evidence: ["EMF Level 5", "Ghost Writing", "Freezing Temps"],
    sanityThreshold: "Late", huntCooldown: 25, speedCategory: "Slow",
    behavior: "Shy, rarely hunts if players are grouped."
  },
  "Demon": {
    evidence: ["Fingerprints", "Freezing Temps", "Ghost Writing"],
    sanityThreshold: "VeryEarly", huntCooldown: 10, speedCategory: "Normal",
    behavior: "Aggressive, frequent hunts; smudge very short."
  },
  "Yurei": {
    evidence: ["Freezing Temps", "Orbs", "D.O.T.S Projector"],
    sanityThreshold: "Average", huntCooldown: 20, speedCategory: "Normal",
    behavior: "Can drop sanity sharply; stuck in room for 5 turns after smudge."
  },
  "Oni": {
    evidence: ["EMF Level 5", "Freezing Temps", "D.O.T.S Projector"],
    sanityThreshold: "Early", huntCooldown: 20, speedCategory: "Fast-LOS",
    behavior: "More visible, very active."
  },
  "Hantu": {
    evidence: ["Fingerprints", "Freezing Temps", "Orbs"],
    sanityThreshold: "Average", huntCooldown: 20, speedCategory: "Fast",
    behavior: "Faster in cold rooms."
  },
  "Goryo": {
    evidence: ["EMF Level 5", "Fingerprints", "D.O.T.S Projector"],
    sanityThreshold: "Average", huntCooldown: 20, speedCategory: "Normal",
    behavior: "Never leaves its ghost room."
  },
  "Myling": {
    evidence: ["EMF Level 5", "Fingerprints", "Ghost Writing"],
    sanityThreshold: "Average", huntCooldown: 20, speedCategory: "Normal",
    behavior: "Quieter footsteps during hunts; has sound timer (~30s)."
  },
  "Onryo": {
    evidence: ["Spirit Box", "Freezing Temps", "Orbs"],
    sanityThreshold: "Average", huntCooldown: 20, speedCategory: "Normal",
    behavior: "Can hunt more often if candles are out."
  },
  "The Twins": {
    evidence: ["EMF Level 5", "Spirit Box", "Freezing Temps"],
    sanityThreshold: "Average", huntCooldown: 20, speedCategory: "Normal",
    behavior: "Interacts in two places at once."
  },
  "Raiju": {
    evidence: ["EMF Level 5", "Orbs", "D.O.T.S Projector"],
    sanityThreshold: "Early", huntCooldown: 20, speedCategory: "Fast",
    behavior: "Faster near active electronics."
  },
  "Obake": {
    evidence: ["EMF Level 5", "Fingerprints", "Orbs"],
    sanityThreshold: "Average", huntCooldown: 20, speedCategory: "Normal",
    behavior: "Rarely leaves unique fingerprints."
  },
  "The Mimic": {
    evidence: ["Spirit Box", "Fingerprints", "Freezing Temps"],
    sanityThreshold: "Average", huntCooldown: 20, speedCategory: "Normal",
    behavior: "Mimics other ghosts every 3–6 turns; always shows fake orbs on camera."
  },
  "Moroi": {
    evidence: ["Spirit Box", "Ghost Writing", "Freezing Temps"],
    sanityThreshold: "Early", huntCooldown: 20, speedCategory: "Fast",
    behavior: "Cursed sanity drain; very fast at low sanity."
  },
  "Deogen": {
    evidence: ["Spirit Box", "Ghost Writing", "D.O.T.S Projector"],
    sanityThreshold: "VeryEarly", huntCooldown: 20, speedCategory: "Slow",
    behavior: "Knows where you are but moves very slowly."
  },
  "Thaye": {
    evidence: ["Ghost Writing", "Orbs", "D.O.T.S Projector"],
    sanityThreshold: "Early", huntCooldown: 20, speedCategory: "Fast",
    behavior: "Very active early; weakens over time."
  },
  "Succubus": {
    evidence: ["Spirit Box", "Fingerprints", "Freezing Temps"],
    sanityThreshold: "VeryEarly", huntCooldown: 15, speedCategory: "Fast",
    behavior: "Aggressive at low sanity; drains extra sanity when near player."
  }
};

/* === WEATHER SYSTEM === */
let currentWeather = "Clear";
let bloodMoonActive = false;

function randomizeWeather() {
  const roll = Math.random();
  if (roll < 0.1) {
    currentWeather = "Blood Moon";
    bloodMoonActive = true;
    narratorLog("🌕 A Blood Moon rises. The air feels cursed.");
  } else if (roll < 0.4) {
    currentWeather = "Rain";
    bloodMoonActive = false;
    narratorLog("🌧️ Rain patters against the windows.");
  } else {
    currentWeather = "Clear";
    bloodMoonActive = false;
    narratorLog("The night is calm and clear.");
  }
  updateWeatherVisuals();
}

function updateWeatherVisuals() {
  const fogLayer = document.getElementById("fog-layer");
  const foreground = document.getElementById("foreground-layer");
  if (currentWeather === "Rain") {
    fogLayer.style.background = `repeating-linear-gradient(
      0deg,
      rgba(200,200,255,0.15),
      rgba(200,200,255,0.15) 2px,
      transparent 3px,
      transparent 6px
    )`;
  } else { fogLayer.style.background = "transparent"; }
  if (bloodMoonActive) { foreground.style.background = "rgba(255,0,0,0.15)"; }
  else { foreground.style.background = "transparent"; }
}

/* === CAMERA ORBS EVIDENCE === */
function showCameraOrbs() {
  const orbLayer = document.getElementById("orb-layer");
  orbLayer.innerHTML = "";
  if (game.playerRoom === game.ghostRoom &&
    (game.ghost === "The Mimic" || ghostProfiles[game.ghost].evidence.includes("Orbs"))) {
    for (let i = 0; i < 3; i++) {
      const orb = document.createElement("div");
      orb.className = "spirit-orb";
      orb.style.width = `${6 + Math.random() * 6}px`;
      orb.style.height = orb.style.width;
      orb.style.top = `${Math.random() * 80}%`;
      orb.style.left = `${Math.random() * 80}%`;
      orb.style.opacity = 0;
      orbLayer.appendChild(orb);
      setTimeout(() => {
        orb.style.opacity = 1;
        setTimeout(() => { orb.style.opacity = 0; orb.remove(); },
          4000 + Math.random() * 2000);
      }, 200 + i * 300);
    }
  }
}

/* === MIMIC SHIFT === */
function mimicShift() {
  const otherGhosts = Object.keys(ghostProfiles).filter(g => g !== "The Mimic");
  game.mimicForm = otherGhosts[Math.floor(Math.random() * otherGhosts.length)];
  narratorLog(`The Mimic alters its behavior... now imitating a ${game.mimicForm}.`);
}

/* === HUNT CHANCE CALCULATION === */
function huntChance() {
  const profile = ghostProfiles[game.ghost];
  let threshold;
  switch (profile.sanityThreshold) {
    case "VeryEarly": threshold = 75; break;
    case "Early": threshold = 50; break;
    case "Average": threshold = 40; break;
    case "Late": threshold = 30; break;
    default: threshold = 40;
  }
  return game.sanity <= threshold ? 30 : 5;
}

/* === START HUNT === */
function startHunt() {
  if (game.huntCooldown > 0) { game.huntCooldown--; return; }
  game.huntActive = true;
  narratorLog("⚠️ The air grows cold... A hunt has begun!");
}

/* === RESOLVE HUNT === */
function resolveHunt() {
  if (!game.huntActive) return;
  if (defendDuringHunt()) return;
  const aggression = getGhostAggression(game.ghost);
  const deathChance = aggression + (100 - game.sanity) * 0.2;
  if (Math.random() * 100 < deathChance) { playerDeath(); }
  else { narratorLog("The ghost stalks you... but you evade it."); endHunt(); }
}

/* === END HUNT === */
function endHunt() {
  game.huntActive = false;
  game.huntCooldown = ghostProfiles[game.ghost].huntCooldown;
}

/* === DEFENSE CHECK === */
function defendDuringHunt() {
  if (game.inventory.includes("Crucifix") && game.playerRoom === game.ghostRoom) {
    narratorLog("✝️ The Crucifix burns and prevents the hunt!");
    game.huntActive = false;
    return true;
  }
  return false;
}

/* === GHOST AGGRESSION === */
function getGhostAggression(ghost) {
  switch (ghost) {
    case "Demon": return 60;
    case "Moroi": return 50;
    case "Thaye": return game.currentTurn < 15 ? 40 : 20;
    case "Succubus": return 55;
    case "The Mimic": return game.mimicForm ? getGhostAggression(game.mimicForm) : 30;
    default: return 30;
  }
}

/* === PLAYER DEATH === */
function playerDeath() {
  game.huntActive = false;
  narratorLog("💀 The ghost catches you! Your vision fades to black...");
  setTimeout(() => {
    narratorLog(`GAME OVER — The ghost was a ${game.ghost}.`);
    const buttons = document.getElementById("narrator-buttons");
    buttons.innerHTML = `<button onclick="restartGame()">Start New Game</button>`;
  }, 2000);
}

<script>
/* === ITEM USE (CAMERA & SMUDGE INCLUDED) === */
function useItem(item) {
  if (!game.inventory.includes(item)) {
    narratorLog(`You aren't carrying a ${item}.`);
    return;
  }
  switch (item) {
    case "Smudge Stick":
      if (game.playerRoom === game.ghostRoom) {
        narratorLog("🔥 You smudge the ghost's room. It retreats!");
        game.smudgeCooldown = game.ghost === "Yurei" ? 5 : 3;
        game.huntActive = false;
        const index = game.inventory.indexOf("Smudge Stick");
        game.inventory.splice(index, 1);
      } else {
        narratorLog("You smudge, but nothing happens here.");
      }
      break;

    case "Camera":
      if (game.playerRoom === game.ghostRoom &&
        (game.ghost === "The Mimic" || ghostProfiles[game.ghost].evidence.includes("Orbs"))) {
        narratorLog("📷 You see ghost orbs through the camera!");
        showCameraOrbs();
      } else {
        narratorLog("📷 No orbs detected in this room.");
      }
      break;

    default:
      narratorLog(`You use the ${item}, but nothing significant happens.`);
  }
  updateHUD();
}

/* === MOVEMENT (ROOM-TO-ROOM) === */
function moveTo(room) {
  if (!Object.values(roomsMap[game.playerRoom]).includes(room)) {
    narratorLog("You can't move there directly.");
    return;
  }
  game.playerRoom = room;
  narratorLog(`You move to the ${room}.`);
  advanceTurn();
  updateBackground();
  if (game.inventory.includes("Camera")) showCameraOrbs();
}

/* === DIRECTIONAL MOVE FUNCTION === */
function moveDirection(dir) {
  const target = roomsMap[game.playerRoom][dir];
  if (!target) {
    narratorLog("You can't go that way.");
    return;
  }
  game.playerRoom = target;
  game.playerDirection = dir;
  narratorLog(`You move ${dir} into the ${target}.`);
  updateBackground();
  advanceTurn();
}

/* === LOADOUT SYSTEM === */
function populateLoadout() {
  const held = document.getElementById("held-items");
  const van = document.getElementById("van-items");
  held.innerHTML = "";
  van.innerHTML = "";

  Object.keys(game.vanStock).forEach(item => {
    if (game.vanStock[item]) {
      const btn = document.createElement("button");
      btn.textContent = item;
      btn.onclick = () => {
        if (game.inventory.length < 3) {
          game.inventory.push(item);
          game.vanStock[item] = false;
          populateLoadout();
        } else {
          alert("You can only hold 3 items.");
        }
      };
      van.appendChild(btn);
    }
  });

  game.inventory.forEach(item => {
    const btn = document.createElement("button");
    btn.textContent = item;
    btn.onclick = () => {
      const idx = game.inventory.indexOf(item);
      if (idx !== -1) {
        game.inventory.splice(idx,1);
        game.vanStock[item] = true;
        populateLoadout();
      }
    };
    held.appendChild(btn);
  });
}

/* === CONFIRM LOADOUT === */
function confirmLoadout() {
  document.getElementById("loadout-screen").style.display = "none";
  document.getElementById("main-scene").style.display = "block";
  initializeGame();
  renderActionButtons();
  updateBackground();
  narratorLog("🎒 Loadout confirmed. The investigation begins!");
}

/* === NARRATOR BUTTON HANDLER === */
function handleNarratorCommand(cmd) {
  switch (cmd) {
    case "move":
      openMoveMenu();
      break;
    case "use-item":
      openUseItemMenu();
      break;
    case "check-gear":
      narratorLog(`Current gear: ${game.inventory.join(", ") || "None"}.`);
      break;
    case "guess-ghost":
      openGhostGuess();
      break;
    case "return-van":
      if (game.playerRoom !== "Van") {
        game.playerRoom = "Van";
        narratorLog("You return to the van to check gear.");
        advanceTurn();
      } else {
        openVanSwapMenu();
      }
      break;
  }
}

/* === MOVE MENU === */
function openMoveMenu() {
  const buttons = document.getElementById("narrator-buttons");
  buttons.innerHTML = "";
  const exits = roomsMap[game.playerRoom];

  Object.keys(exits).forEach(dir => {
    if (exits[dir]) {
      const btn = document.createElement("button");
      btn.textContent = `Go ${dir} to ${exits[dir]}`;
      btn.onclick = () => {
        moveDirection(dir);
        renderActionButtons();
      };
      buttons.appendChild(btn);
    }
  });

  const backBtn = document.createElement("button");
  backBtn.textContent = "Cancel";
  backBtn.onclick = renderActionButtons;
  buttons.appendChild(backBtn);
}

/* === ITEM MENU === */
function openUseItemMenu() {
  const buttons = document.getElementById("narrator-buttons");
  buttons.innerHTML = "";
  if (game.inventory.length === 0) {
    narratorLog("You have no items to use.");
    renderActionButtons();
    return;
  }
  game.inventory.forEach(item => {
    const btn = document.createElement("button");
    btn.textContent = `Use ${item}`;
    btn.onclick = () => {
      useItem(item);
      renderActionButtons();
    };
    buttons.appendChild(btn);
  });
  const backBtn = document.createElement("button");
  backBtn.textContent = "Cancel";
  backBtn.onclick = renderActionButtons;
  buttons.appendChild(backBtn);
}

/* === GHOST GUESS MENU === */
function openGhostGuess() {
  const buttons = document.getElementById("narrator-buttons");
  buttons.innerHTML = "";
  Object.keys(ghostProfiles).forEach(g => {
    const btn = document.createElement("button");
    btn.textContent = g;
    btn.onclick = () => {

<script>
/* === TURN SYSTEM & ADVANCEMENT === */
function advanceTurn() {
  game.currentTurn++;

  // Sanity drain baseline
  if (game.sanity > 0) {
    game.sanity -= (Math.random() * 2 + 1);
    if (game.sanity < 0) game.sanity = 0;
  }

  // Mimic mimicry shift
  if (game.ghost === "The Mimic" && game.currentTurn >= game.nextMimicShift) {
    mimicShift();
    game.nextMimicShift = game.currentTurn + (3 + Math.floor(Math.random() * 4));
  }

  // Ghost room shifting (all except Goryo)
  if (game.ghost !== "Goryo" && Math.random() < 0.2) {
    if (game.ghost === "Yurei" && game.smudgeCooldown > 0) {
      game.smudgeCooldown--;
    } else {
      const rooms = Object.keys(roomsMap).filter(r => r !== "Van");
      game.ghostRoom = rooms[Math.floor(Math.random() * rooms.length)];
    }
  }

  // Hunt trigger
  if (!game.huntActive && Math.random() * 100 < huntChance()) {
    startHunt();

  // Hunt resolution
  if (game.huntActive) resolveHunt();

  renderCompassExits();

}

function randomizeWeather() {

<script>
/* === MIMIC SHIFT LOGIC === */
function mimicShift() {
  const otherGhosts = Object.keys(ghostProfiles).filter(g => g !== "The Mimic");
  game.mimicForm = otherGhosts[Math.floor(Math.random() * otherGhosts.length)];
  narratorLog(`The Mimic alters its behavior... now imitating a ${game.mimicForm}.`);
}

/* === HUNT CHANCE CALCULATION === */
function huntChance() {
  const profile = ghostProfiles[game.ghost];
  let threshold;
  switch (profile.sanityThreshold) {
    case "VeryEarly": threshold = 75; break;
    case "Early": threshold = 50; break;
    case "Average": threshold = 40; break;
    case "Late": threshold = 30; break;
    default: threshold = 40;
  }
  return game.sanity <= threshold ? 30 : 5;
}

/* === START HUNT === */
function startHunt() {
  if (game.huntCooldown > 0) {
    game.huntCooldown--;
    return;
  }
  game.huntActive = true;
  narratorLog("⚠️ The air grows cold... A hunt has begun!");
}

/* === RESOLVE HUNT === */
function resolveHunt() {
  if (!game.huntActive) return;
  if (defendDuringHunt()) return;

  const aggression = getGhostAggression(game.ghost);
  const deathChance = aggression + (100 - game.sanity) * 0.2;
  if (Math.random() * 100 < deathChance) {
    playerDeath();
  } else {
    narratorLog("The ghost stalks you... but you evade it this time.");
    endHunt();
  }
}

/* === END HUNT === */
function endHunt() {
  game.huntActive = false;
  game.huntCooldown = ghostProfiles[game.ghost].huntCooldown;
}

/* === DEFENSE CHECK (SMUDGE & CRUCIFIX) === */
function defendDuringHunt() {
  if (game.inventory.includes("Crucifix") && game.playerRoom === game.ghostRoom) {
    narratorLog("✝️ The Crucifix burns and prevents the hunt!");
    game.huntActive = false;
    return true;
  }
  return false;
}

/* === GHOST AGGRESSION FACTOR === */
function getGhostAggression(ghost) {
  switch (ghost) {
    case "Demon": return 60;
    case "Moroi": return 50;
    case "Thaye": return game.currentTurn < 15 ? 40 : 20;
    case "Succubus": return 55;
    case "The Mimic":
      return game.mimicForm ? getGhostAggression(game.mimicForm) : 30;
    default: return 30;
  }
}

/* === PLAYER DEATH === */
function playerDeath() {
  game.huntActive = false;
  narratorLog("💀 The ghost catches you! Your vision fades to black...");
  setTimeout(() => {
    narratorLog(`GAME OVER — The ghost was a ${game.ghost}.`);
    const buttons = document.getElementById("narrator-buttons");
    buttons.innerHTML = `<button onclick="restartGame()">Start New Game</button>`;
  }, 2000);
}

/* === AMBIENT NARRATION (ATMOSPHERIC HINTS) === */
function ambientNarration() {
  if (Math.random() < 0.2) {
    const hints = [
      "You hear faint footsteps nearby.",
      "A distant creak echoes through the halls.",
      "The temperature seems to drop suddenly.",
      "Your breath fogs slightly as you exhale.",
      "You feel like you're being watched..."
    ];
    narratorLog(hints[Math.floor(Math.random() * hints.length)]);
  }
}

/* === ITEM USE OVERRIDES (SMUDGE, CAMERA) === */
function useItem(item) {
  if (!game.inventory.includes(item)) {
    narratorLog(`You aren't carrying a ${item}.`);
    return;
  }

  switch (item) {
    case "Smudge Stick":
      if (game.playerRoom === game.ghostRoom) {
        narratorLog("🔥 You smudge the ghost's room. It retreats!");
        game.smudgeCooldown = game.ghost === "Yurei" ? 5 : 3;
        game.huntActive = false;
        const index = game.inventory.indexOf("Smudge Stick");
        game.inventory.splice(index, 1);
      } else {
        narratorLog("You smudge, but nothing happens here.");
      }
      break;

    case "Camera":
      if (game.playerRoom === game.ghostRoom &&
        (game.ghost === "The Mimic" || ghostProfiles[game.ghost].evidence.includes("Orbs"))) {
        narratorLog("📷 You see ghost orbs through the camera!");
        showCameraOrbs();
      } else {
        narratorLog("📷 No orbs detected in this room.");
      }
      break;

    default:
      narratorLog(`You use the ${item}, but nothing significant happens.`);
  }
  updateHUD();
}

/* === RESTART GAME === */
function restartGame() {
  game.inventory = [];
  game.vanStock = {
    "EMF Reader": true,
    "Spirit Box": true,
    "Camera": true,
    "UV Light": true,
    "D.O.T.S Projector": true,

    "Smudge Stick": true,

  const log = document.getElementById("narrator-log");
  log.innerHTML = "";

/* === CAMERA ITEM OVERRIDE === */
function useItem(item) {
  if (!game.inventory.includes(item)) {
    narratorLog(`You aren't carrying a ${item}.`);
    return;
  }

  switch (item) {
    case "Smudge Stick":
      if (game.playerRoom === game.ghostRoom) {
        narratorLog("🔥 You smudge the ghost's room. It retreats!");
        game.smudgeCooldown = game.ghost === "Yurei" ? 5 : 3;
        game.huntActive = false;
        const index = game.inventory.indexOf("Smudge Stick");
        game.inventory.splice(index, 1);
      } else {
        narratorLog("You smudge, but nothing happens here.");
      }
      break;

    case "Camera":
      if (
        game.playerRoom === game.ghostRoom &&
        (game.ghost === "The Mimic" || ghostProfiles[game.ghost].evidence.includes("Orbs"))
      ) {
        narratorLog("📷 You see ghost orbs through the camera!");
        showCameraOrbs();
      } else {
        narratorLog("📷 No orbs detected in this room.");
      }
      break;

    default:
      narratorLog(`You use the ${item}, but nothing significant happens.`);
  }
  updateHUD();
}

/* === BACKGROUND UPDATER — DIRECTIONAL FIX === */
function updateBackground() {
  const bg = document.getElementById("background-layer");
  const direction = game.playerDirection || "N";
  const formattedRoom = game.playerRoom.replace(/\s/g, "");
  const roomImage = `${formattedRoom}_${direction}.png`;
  bg.style.background = `url('${roomImage}') center center no-repeat`;
  bg.style.backgroundSize = "cover";

  document.getElementById("hud-location").textContent = game.playerRoom;
  document.getElementById("hud-direction").textContent = direction;
}

/* === TURN SYSTEM — UPDATED WITH WEATHER, CAMERA ORBS === */
function advanceTurn() {
  game.currentTurn++;

  if (game.sanity > 0) {
    game.sanity -= Math.random() * 2 + 1;
    if (game.sanity < 0) game.sanity = 0;
  }

  // Weather re-roll every 5 turns
  if (game.currentTurn % 5 === 0) {
    randomizeWeather();
  }

  // Mimic shifts
  if (game.ghost === "The Mimic" && game.currentTurn >= game.nextMimicShift) {
    mimicShift();
    game.nextMimicShift = game.currentTurn + (3 + Math.floor(Math.random() * 4));
  }

  // Ghost room shifts
  if (game.ghost !== "Goryo" && Math.random() < 0.2) {
    if (game.ghost === "Yurei" && game.smudgeCooldown > 0) {
      game.smudgeCooldown--;
    } else {
      const rooms = Object.keys(roomsMap).filter(r => r !== "Van");
      game.ghostRoom = rooms[Math.floor(Math.random() * rooms.length)];
    }
  }

  // Hunt trigger
  if (!game.huntActive && Math.random() * 100 < huntChance()) {
    startHunt();
  }

  if (game.huntActive) resolveHunt();

  updateHUD();
  if (game.inventory.includes("Camera")) showCameraOrbs();
  ambientNarration();
}

/* === FINAL STARTUP === */
document.addEventListener("DOMContentLoaded", () => {
  document.getElementById("loadout-screen").style.display = "flex";
  document.getElementById("main-scene").style.display = "none";
  populateLoadout();
  narratorLog("Welcome to Phasma‑Phoney v2.7! Select your starting gear.");
});
</script>
</body>
