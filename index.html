<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Phasma‑Phoney v2.2 — Master Build (Complete)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    /* GLOBAL RESET & BASICS */
    html, body {
      margin: 0; padding: 0;
      width: 100vw; height: 100vh;
      overflow: hidden; background: black;
      font-family: monospace, sans-serif; color: #eee;
      box-sizing: border-box;
    }
    body { padding-bottom: 32px; } /* make room for footer */
    button { font-family: monospace; cursor: pointer; }
    button:hover { background: #333; }

    /* TITLE SCREEN */
    #title-screen {
      position: fixed; top:0; left:0;
      width:100vw; height:100vh;
      background:black; display:flex;
      justify-content:center; align-items:center;
      z-index:1000; transition:opacity 2s ease-in-out;
    }
    #title-screen img {
      max-width:80%;
      animation: pulse 5s infinite ease-in-out;
      opacity:0.9;
    }
    @keyframes pulse {
      0%,100% {opacity:0.9; transform:scale(1);}
      50%     {opacity:1;   transform:scale(1.04);}
    }
    #start-btn {
      position:absolute; bottom:20%; left:50%;
      transform:translateX(-50%);
      padding:16px 48px; font-size:24px;
      background:#111; color:#eee; border:2px solid #444;
      z-index:1001;
    }
    #start-btn:hover { background:#222; border-color:#888; }

    /* SCENE & LAYERS */
    #main-scene {
      position:relative; width:100%; height:100%;
      display:none; overflow:hidden;
    }
    .layer {
      position:absolute; top:0; left:0;
      width:100%; height:100%; pointer-events:none;
    }
    #background { z-index:1; background-size:cover; background-position:center; }
    #rain-layer { z-index:2; }
    #bg-blocker  { z-index:3; background:rgba(0,0,0,0.25); }
    #lightning   { z-index:4; background:white; opacity:0; transition:opacity .1s ease-out; }
    #lightning.flash { opacity:1; }
    #fog-layer   { z-index:5; }
    #spirit-canvas { z-index:6; }

    /* HUD & LOG */
    #game-ui {
      position:absolute; bottom:32px; left:0;
      width:100%; height:40%; display:none;
      flex-direction:column; z-index:10;
      background: rgba(0,0,0,0.4); backdrop-filter:blur(4px);
    }
    #game-stats {
      display:flex; flex-wrap:wrap; align-items:center;
      padding:4px; background:rgba(0,0,0,0.5); font-size:12px;
    }
    #game-stats > div { margin-right:12px; white-space:nowrap; }
    #sanity-bar {
      flex:1; height:8px; margin:4px 0;
      background:#222; border:1px solid #555; position:relative;
    }
    #sanity-fill {
      height:100%; width:100%; background:#0f0;
      transition:width .3s, background .3s;
    }
    #game-log {
      flex:1; overflow-y:auto; padding:8px;
      font-size:14px; line-height:1.4;
    }
    .log-entry {
      opacity:1; animation:fadeUp 8s forwards;
      margin-bottom:2px;
    }
    @keyframes fadeUp {
      to { opacity:0.3; transform:translateY(-10px); }
    }
    #action-buttons {
      display:flex; justify-content:space-around;
      padding:4px; background:rgba(0,0,0,0.5);
    }
    #action-buttons button {
      flex:1; margin:0 2px; padding:6px;
      background:#111; border:1px solid #444; color:#eee;
    }

    /* OVERLAYS (fixed modals) */
    .overlay {
      position:fixed; top:20%; left:50%;
      transform:translateX(-50%);
      background:#222; border:2px solid #555;
      padding:16px; color:#eee;
      width:90%; max-width:320px; z-index:1001;
      display:none;
    }
    .overlay h2 { margin-top:0; text-align:center; }
    .options, #notebook-entries {
      max-height:180px; overflow-y:auto; margin:8px 0;
    }
    .overlay button {
      width:100%; margin:4px 0;
      background:#333; border:1px solid #555; padding:6px;
    }

    /* FOOTER */
    #footer {
      position:fixed; bottom:0; left:0;
      width:100%; text-align:center;
      background:rgba(0,0,0,0.5); padding:4px;
      font-size:12px; z-index:1000;
    }
    #footer a { color:#4ec3ff; text-decoration:none; }

    /* RESPONSIVE */
    @media(max-height:600px){ #game-ui { height:50%; } }
    @media(max-width:500px){ #action-buttons button { font-size:12px; } }
  </style>
</head>
<body>

  <!-- TITLE SCREEN -->
  <div id="title-screen">
    <img src="logo.png" alt="Phasma‑Phoney Logo">
    <button id="start-btn">Start New Game</button>
  </div>

  <!-- MAIN SCENE -->
  <div id="main-scene">
    <div id="background" class="layer"></div>
    <canvas id="rain-layer" class="layer"></canvas>
    <div id="bg-blocker" class="layer"></div>
    <div id="lightning" class="layer"></div>
    <canvas id="fog-layer" class="layer"></canvas>
    <canvas id="spirit-canvas" class="layer"></canvas>

    <!-- HUD & Log -->
    <div id="game-ui">
      <div id="game-stats">
        <div id="stat-location">Location: Van</div>
        <div id="stat-turns">Turns: 0</div>
        <div id="stat-weather">Weather: --</div>
        <div id="stat-temp">Temp: --°C</div>
        <div id="stat-smudge">Smudge: 0</div>
        <div id="stat-crucifix">Crucifix: 2</div>
        <div id="sanity-bar"><div id="sanity-fill"></div></div>
        <div style="margin-left:auto; display:flex; align-items:center;">
          <button id="btn-mute">🔇</button>
          <select id="voice-select"></select>
        </div>
      </div>
      <div id="game-log"></div>
      <div id="action-buttons">
        <button id="btn-map">Map</button>
        <button id="btn-move">Move</button>
        <button id="btn-use">Use Item</button>
        <button id="btn-inv">Inventory</button>
        <button id="btn-notebook">Notebook</button>
        <button id="btn-van">Van</button>
        <button id="btn-monitor">Monitor</button>
        <button id="btn-guess">Ghost Guess</button>
      </div>
    </div>
  </div>

  <!-- OVERLAYS -->
  <div id="loadout-popup" class="overlay" onclick="if(event.target===this) closeOverlay('loadout-popup')">
    <h2>Select Your Starting Loadout</h2>
    <div class="options" id="loadout-list"></div>
    <button id="loadout-confirm">Confirm</button>
  </div>

  <div id="van-swap-overlay" class="overlay" onclick="if(event.target===this) closeOverlay('van-swap-overlay')">
    <h2>Return to Van</h2>
    <div class="options" id="van-held"></div>
    <div class="options" id="van-stock"></div>
    <button id="van-swap-confirm">Done</button>
  </div>

  <div id="notebook-overlay" class="overlay" onclick="if(event.target===this) closeOverlay('notebook-overlay')">
    <h2>Evidence Notebook</h2>
    <div id="notebook-entries"></div>
    <button onclick="closeOverlay('notebook-overlay')">Close</button>
  </div>

  <div id="use-popup" class="overlay" onclick="if(event.target===this) closeOverlay('use-popup')">
    <h2>Use Item</h2>
    <div class="options" id="use-list"></div>
    <button onclick="closeOverlay('use-popup')">Cancel</button>
  </div>

  <div id="move-overlay" class="overlay" onclick="if(event.target===this) closeOverlay('move-overlay')">
    <h2>Choose Direction</h2>
    <div class="options" id="move-list"></div>
    <button onclick="closeOverlay('move-overlay')">Cancel</button>
  </div>

  <div id="inv-popup" class="overlay" onclick="if(event.target===this) closeOverlay('inv-popup')">
    <h2>Your Items</h2>
    <div class="options" id="inv-list"></div>
    <button onclick="closeOverlay('inv-popup')">Close</button>
  </div>

  <div id="guess-popup" class="overlay" onclick="if(event.target===this) closeOverlay('guess-popup')">
    <h2>Guess the Ghost</h2>
    <div class="options" id="guess-list"></div>
    <button onclick="closeOverlay('guess-popup')">Cancel</button>
  </div>

  <div id="restart-popup" class="overlay" onclick="if(event.target===this) closeOverlay('restart-popup')">
    <h2 id="end-message">Game Over</h2>
    <button id="restart-btn">Start New Game</button>
  </div>

  <!-- FOOTER -->
  <div id="footer">
    &copy; 2025 SharkVelocity | <a href="#">Updates & Contact</a>
  </div>

  <script>
    // === STATE ===
    const game = {
      ghost: null, ghostRoom: null, playerRoom: 'Van',
      inventory: [], vanStock: [], roomItems: {},
      selectedEvidence: new Set(),
      currentTurn: 0, sanity: 100,
      huntCooldown: 0, smudgeActive: 0, crucifixUses: 2,
      cameraActive: false, monitorBooted: false,
      mimicForm: null, nextMimicShift: 0,
      usedVanThisTurn: false, muted: false, voice: null
    };

    // === DATA ===
    const investigationItems = [
      "EMF Reader","Spirit Box","Camera","UV Light",
      "D.O.T.S Projector","Thermometer","Ghost Writing Book",
      "Video Camera","Crucifix","Smudge Stick"
    ];
    const cursedItems = [
      "Ouija Board","Tarot Cards","Music Box","Voodoo Doll",
      "Haunted Mirror","Summoning Circle","Monkey Paw"
    ];
    const cursedItemCosts = {
      "Ouija Board":10,"Tarot Cards":5,"Music Box":8,
      "Voodoo Doll":6,"Haunted Mirror":15,
      "Summoning Circle":20,"Monkey Paw":25
    };
    const possibleWeather = ["Stormy","Rain","Clear","Foggy"];
    const ghostProfiles = {
      Spirit:    { evidence:["EMF Reader","Spirit Box","Ghost Writing"], behavior:"Standard hunts."},
      Wraith:    { evidence:["EMF Reader","Spirit Box","D.O.T.S"], behavior:"Teleports often."},
      Phantom:   { evidence:["Spirit Box","Fingerprint Kit","D.O.T.S"], behavior:"Fast when unobserved."},
      Poltergeist:{evidence:["Spirit Box","Fingerprint Kit","Ghost Writing"],behavior:"Throws objects."},
      Banshee:   { evidence:["Fingerprint Kit","Orbs","D.O.T.S"], behavior:"Targets one player."},
      Jinn:      { evidence:["EMF Reader","Fingerprint Kit","Freezing Temps"],behavior:"Faster when far."},
      Mare:      { evidence:["Spirit Box","Ghost Writing","Orbs"], behavior:"Active in darkness."},
      Revenant:  { evidence:["Ghost Writing","Orbs","Freezing Temps"],behavior:"Slow then fast."},
      Shade:     { evidence:["EMF Reader","Ghost Writing","Freezing Temps"],behavior:"Shy near players."},
      Demon:     { evidence:["Spirit Box","Ghost Writing","Freezing Temps"],behavior:"Aggressive early."},
      Yurei:     { evidence:["Orbs","Freezing Temps","D.O.T.S"],behavior:"Locked by smudge."},
      Oni:       { evidence:["EMF Reader","Freezing Temps","D.O.T.S"],behavior:"Very active."},
      Hantu:     { evidence:["Fingerprint Kit","Orbs","Freezing Temps"],behavior:"Cold speeds it."},
      Goryo:     { evidence:["EMF Reader","Fingerprint Kit","D.O.T.S"],behavior:"Only on camera."},
      Myling:    { evidence:["EMF Reader","Fingerprint Kit","Ghost Writing"],behavior:"Quiet footsteps."},
      Onryo:     { evidence:["Spirit Box","Orbs","Freezing Temps"],behavior:"Triggered by fire."},
      Raiju:     { evidence:["EMF Reader","Orbs","D.O.T.S"],behavior:"Disrupts electronics."},
      Obake:     { evidence:["EMF Reader","Fingerprint Kit","Orbs"],behavior:"Shape-shifts."},
      Twins:     { evidence:["EMF Reader","Spirit Box","Freezing Temps"],behavior:"Two ghosts."},
      Deogen:    { evidence:["Spirit Box","Ghost Writing","D.O.T.S"],behavior:"Knows your location."},
      Succubus:  { evidence:["Spirit Box","Ghost Writing","Fingerprint Kit"],behavior:"Drains male sanity."},
      Mimic:     { evidence:["EMF Reader","Spirit Box","D.O.T.S"],behavior:"Mimics others."}
    };
    const rooms = {
      Van:{ N:"Foyer" },
      Foyer:{ S:"Van", E:"Living Room", W:"Kitchen", N:"Bathroom" },
      "Living Room":{ W:"Foyer", E:"Dining Room", S:"Garage" },
      Kitchen:{ E:"Foyer", S:"Dining Room" },
      "Dining Room":{ W:"Living Room", N:"Kitchen", S:"Basement" },
      Garage:{ N:"Living Room" },
      Basement:{ N:"Dining Room" },
      Bathroom:{ S:"Foyer" },
      "Kids Bedroom":{ W:"Living Room" },
      "Master Bedroom":{ E:"Living Room" }
    };
    const roomVisuals = {
      Van:{N:"Van_N.png",S:"Van_S.png",E:"Van_E.png",W:"Van_W.png"},
      Foyer:{N:"Foyer_N.png",S:"Foyer_S.png",E:"Foyer_E.png",W:"Foyer_W.png"},
      "Living Room":{N:"Living_N.png",S:"Living_S.png",E:"Living_E.png",W:"Living_W.png"},
      Kitchen:{N:"Kit_N.png",S:"Kit_S.png",E:"Kit_E.png",W:"Kit_W.png"},
      "Dining Room":{N:"Dining_N.png",S:"Dining_S.png",E:"Dining_E.png",W:"Dining_W.png"},
      Garage:{N:"Garage_N.png",S:"Garage_S.png",E:"Garage_E.png",W:"Garage_W.png"},
      Basement:{N:"Base_N.png",S:"Base_S.png",E:"Base_E.png",W:"Base_W.png"},
      Bathroom:{N:"Bath_N.png",S:"Bath_S.png",E:"Bath_E.png",W:"Bath_W.png"},
      "Kids Bedroom":{N:"Kids_N.png",S:"Kids_S.png",E:"Kids_E.png",W:"Kids_W.png"},
      "Master Bedroom":{N:"Master_N.png",S:"Master_S.png",E:"Master_E.png",W:"Master_W.png"}
    };

    // FX
    let rainCanvas, rainCtx, fogCanvas, fogCtx, spiritCanvas, spiritCtx;
    let fogImg = new Image(), spiritParts = [], raindrops = [];
    fogImg.src = "fog.png";

    document.addEventListener("DOMContentLoaded", () => {
      // Canvas setup
      rainCanvas = document.getElementById("rain-layer"); rainCtx = rainCanvas.getContext("2d");
      fogCanvas  = document.getElementById("fog-layer");  fogCtx  = fogCanvas.getContext("2d");
      spiritCanvas = document.getElementById("spirit-canvas"); spiritCtx = spiritCanvas.getContext("2d");
      resize(); window.addEventListener("resize", resize);

      // Title screen
      document.getElementById("start-btn").onclick = () => {
        document.getElementById("title-screen").style.opacity = "0";
        setTimeout(() => {
          document.getElementById("title-screen").style.display = "none";
          showLoadout();
        }, 1000);
      };

      // Mute & voices
      document.getElementById("btn-mute").onclick = () => {
        game.muted = !game.muted;
        document.getElementById("btn-mute").textContent = game.muted ? "🔈" : "🔇";
      };
      speechSynthesis.onvoiceschanged = () => {
        const vs = speechSynthesis.getVoices().filter(v => v.lang.startsWith("en"));
        const sel = document.getElementById("voice-select");
        vs.forEach((v,i)=> sel.add(new Option(v.name,i)));
        game.voice = vs[0];
      };
      document.getElementById("voice-select").onchange = e => {
        const vs = speechSynthesis.getVoices().filter(v => v.lang.startsWith("en"));
        game.voice = vs[e.target.selectedIndex];
      };

      // Bind action buttons
      document.getElementById("btn-map").onclick = showMap;
      document.getElementById("btn-move").onclick = showMove;
      document.getElementById("btn-use").onclick = showUse;
      document.getElementById("btn-inv").onclick = showInv;
      document.getElementById("btn-notebook").onclick = openNotebook;
      document.getElementById("btn-van").onclick = openVanSwap;
      document.getElementById("btn-monitor").onclick = toggleMonitor;
      document.getElementById("btn-guess").onclick = showGuess;
      document.getElementById("restart-btn").onclick = resetGame;

      // Init FX
      initRain(); initFog(); initSpiritParts();
      scheduleLightning(); scheduleAmbient();
      gameLoop();
    });

    function resize(){
      rainCanvas.width = fogCanvas.width = spiritCanvas.width = window.innerWidth;
      rainCanvas.height= fogCanvas.height= spiritCanvas.height= window.innerHeight;
    }

    // --- Rain ---
    function initRain(){
      for(let i=0;i<200;i++){
        raindrops.push({
          x:Math.random()*innerWidth,
          y:Math.random()*innerHeight,
          len:Math.random()*20+10,
          speed:Math.random()*4+2
        });
      }
    }
    function drawRain(){
      rainCtx.clearRect(0,0,innerWidth,innerHeight);
      rainCtx.strokeStyle = "rgba(174,194,224,0.5)";
      rainCtx.lineWidth = 1; rainCtx.beginPath();
      raindrops.forEach(d=>{
        rainCtx.moveTo(d.x,d.y);
        rainCtx.lineTo(d.x,d.y+d.len);
        d.y += d.speed;
        if(d.y>innerHeight){ d.y=0; d.x=Math.random()*innerWidth; }
      });
      rainCtx.stroke();
    }

    // --- Lightning ---
    function triggerLightning(){
      const L = document.getElementById("lightning");
      L.classList.add("flash");
      setTimeout(()=> L.classList.remove("flash"), 200);
    }
    function scheduleLightning(){
      setTimeout(()=>{
        triggerLightning();
        scheduleLightning();
      }, Math.random()*8000+4000);
    }

    // --- Fog Layer ---
    let fogs = [];
    function initFog(){
      for(let i=0;i<30;i++){
        fogs.push({
          x: (Date.now()*0.3 + i*200) % innerWidth,
          y: Math.sin(i + Date.now()/4000)*100 + innerHeight/2,
          r: 60+Math.random()*40
        });
      }
    }
    function drawFog(){
      fogCtx.clearRect(0,0,innerWidth,innerHeight);
      fogs.forEach(f=>{
        fogCtx.beginPath();
        fogCtx.arc(f.x,f.y,f.r,0,2*Math.PI);
        fogCtx.fillStyle="rgba(255,255,255,0.3)";
        fogCtx.fill();
      });
      setTimeout(drawFog,150);
    }

    // --- Spirit Orbs ---
    function initSpiritParts(){
      for(let i=0;i<40;i++){
        spiritParts.push({
          x:Math.random()*innerWidth,
          y:Math.random()*innerHeight,
          r:Math.random()*3+2,
          alpha:0, fade:Math.random()*0.02+0.005
        });
      }
    }
    function drawSpiritParts(){
      spiritCtx.clearRect(0,0,innerWidth,innerHeight);
      spiritParts.forEach(p=>{
        p.alpha += p.fade;
        if(p.alpha<=0||p.alpha>=1) p.fade*=-1;
        p.x += (Math.random()-0.5);
        p.y += (Math.random()-0.5);
        spiritCtx.beginPath();
        spiritCtx.arc(p.x,p.y,p.r,0,Math.PI*2);
        spiritCtx.fillStyle = `rgba(255,255,255,${p.alpha})`;
        spiritCtx.fill();
      });
    }

    // --- Ambient Scheduling ---
    const ambience = [
      "A distant moan...", "You hear a whisper...", "Lights flicker...", "Footsteps echo..."
    ];
    function scheduleAmbient(){
      setTimeout(()=>{
        logToGame(randChoice(ambience));
        scheduleAmbient();
      }, randInt(15000,30000));
    }

    // --- Main Loop ---
    function gameLoop(){
      drawRain();
      drawFog();
      if(game.cameraActive && game.playerRoom===game.ghostRoom){
        drawSpiritParts();
      }
      requestAnimationFrame(gameLoop);
    }

    // --- Utilities ---
    function logToGame(txt){
      const log = document.getElementById("game-log");
      if(log.children.length>100) log.removeChild(log.firstChild);
      const e = document.createElement("div");
      e.className = "log-entry";
      e.textContent = txt;
      log.appendChild(e);
      log.scrollTop = log.scrollHeight;
      speak(txt);
    }
    function speak(txt){
      if(game.muted||!game.voice) return;
      const u = new SpeechSynthesisUtterance(txt);
      u.voice = game.voice;
      speechSynthesis.speak(u);
    }
    function fade(sel){
      document.querySelector(sel).style.opacity=0;
    }
    function randInt(a,b){
      return Math.floor(Math.random()*(b-a+1))+a;
    }
    function randChoice(arr){
      return arr[Math.floor(Math.random()*arr.length)];
    }
    function closeOverlay(id){
      document.getElementById(id).style.display="none";
    }

    // --- Game Setup & Turn Logic ---
    function showLoadout(){
      document.getElementById("loadout-popup").style.display="block";
      const list = document.getElementById("loadout-list");
      list.innerHTML="";
      investigationItems.forEach(item=>{
        const b = document.createElement("button");
        b.textContent=item;
        b.onclick=()=>{
          if(game.inventory.includes(item)){
            game.inventory = game.inventory.filter(x=>x!==item);
            b.style.background="#333";
          } else if(game.inventory.length<3){
            game.inventory.push(item);
            b.style.background="#0a0";
          }
        };
        list.appendChild(b);
      });
    }
    document.getElementById("loadout-confirm").onclick = ()=>{
      document.getElementById("loadout-popup").style.display="none";
      startGame();
    };

    function startGame(){
      document.getElementById("main-scene").style.display="block";
      document.getElementById("game-ui").style.display="flex";
      game.weather = randChoice(possibleWeather);
      game.ghost = randChoice(Object.keys(ghostProfiles));
      game.ghostRoom = randChoice(Object.keys(rooms).filter(r=>"Van"!==r));
      game.nextMimicShift = game.currentTurn + randInt(3,6);
      updateStats();
      logToGame(`Investigation begins. Weather: ${game.weather.toLowerCase()}`);
    }

    function advanceTurn(){
      game.currentTurn++;
      if(game.smudgeActive>0) game.smudgeActive--;
      if(game.huntCooldown>0) game.huntCooldown--;
      game.sanity = Math.max(0, game.sanity - 1);
      // mimic shift
      if(game.ghost==="Mimic" && game.currentTurn>=game.nextMimicShift){
        game.mimicForm = randChoice(Object.keys(ghostProfiles).filter(g=>"Mimic"!==g));
        logToGame(`The Mimic shifts form to ${game.mimicForm}.`);
        game.nextMimicShift = game.currentTurn + randInt(3,6);
      }
      // random drift
      if(Math.random()<0.1){
        const possible = Object.keys(rooms).filter(r=>"Van"!==r && r!==game.ghostRoom);
        game.ghostRoom = randChoice(possible);
        logToGame(`(Ghost drifts to ${game.ghostRoom}.)`);
      }
      attemptHunt();
      updateStats();
    }

    function attemptHunt(){
      if(game.smudgeActive>0) return;
      if(game.huntCooldown>0) return;
      if(game.sanity<30 && Math.random()<0.25){
        logToGame("⚠️ The ghost is hunting!");
        document.getElementById("bg-blocker").style.background="rgba(255,0,0,0.5)";
        setTimeout(()=>document.getElementById("bg-blocker").style.background="rgba(0,0,0,0.25)",200);
        if(game.playerRoom===game.ghostRoom){
          if(game.crucifixUses>0){
            game.crucifixUses--;
            logToGame("Your crucifix repelled the hunt.");
          } else {
            endGame(false); return;
          }
        }
        game.huntCooldown = randInt(5,10);
      }
    }

    function updateStats(){
      document.getElementById("stat-location").textContent = "Location: "+game.playerRoom;
      document.getElementById("stat-turns").textContent = "Turns: "+game.currentTurn;
      document.getElementById("stat-weather").textContent = "Weather: "+game.weather;
      document.getElementById("stat-temp").textContent    = "Temp: "+(game.inventory.includes("Thermometer")? randInt(-5,5)+"°C":"--°C");
      document.getElementById("stat-smudge").textContent  = "Smudge: "+game.smudgeActive;
      document.getElementById("stat-crucifix").textContent= "Crucifix: "+game.crucifixUses;
      const fill = document.getElementById("sanity-fill");
      fill.style.width     = game.sanity + "%";
      fill.style.background= game.sanity>66?"#0f0":game.sanity>33?"#ff0":"#f00";
      // background
      const v = roomVisuals[game.playerRoom] || roomVisuals["Van"];
      document.getElementById("background").style.backgroundImage = `url('${v.N}')`;
    }

    // --- Commands & Overlays --- (move, look, inventory, use, van, monitor, guess, notebook)
    document.getElementById("btn-move").onclick = showMove;
    document.getElementById("btn-map" ).onclick = showMap;
    document.getElementById("btn-inv" ).onclick = showInv;
    document.getElementById("btn-use" ).onclick = showUse;
    document.getElementById("btn-van" ).onclick = openVanSwap;
    document.getElementById("btn-monitor").onclick = toggleMonitor;
    document.getElementById("btn-guess").onclick = showGuess;
    document.getElementById("btn-notebook").onclick = openNotebook;

    function showMove(){
      const opts = rooms[game.playerRoom] || {};
      const list = document.getElementById("move-list");
      list.innerHTML = "";
      for(const dir in opts){
        const dest = opts[dir];
        const b = document.createElement("button");
        b.textContent = dir + " → " + dest;
        b.onclick = ()=>{
          game.playerRoom = dest;
          closeOverlay("move-overlay");
          logToGame("Moved " + dir + " to " + dest);
          advanceTurn();
        };
        list.appendChild(b);
      }
      document.getElementById("move-overlay").style.display = "block";
    }

    function showMap(){
      logToGame("Exits: " + Object.values(rooms[game.playerRoom]).join(", "));
    }

    function showInv(){
      const list = document.getElementById("inv-list");
      list.innerHTML = "";
      game.inventory.forEach(i => {
        const d = document.createElement("div");
        d.textContent = i;
        list.appendChild(d);
      });
      document.getElementById("inv-popup").style.display = "block";
    }

    function showUse(){
      const list = document.getElementById("use-list");
      list.innerHTML = "";
      game.inventory.forEach(i => {
        const b = document.createElement("button");
        b.textContent = i;
        b.onclick = ()=>{
          closeOverlay("use-popup");
          handleUse(i);
        };
        list.appendChild(b);
      });
      document.getElementById("use-popup").style.display = "block";
    }

    function openVanSwap(){
      if(game.usedVanThisTurn){
        logToGame("Van visit used this turn.");
        return;
      }
      const held = document.getElementById("van-held"),
            stock= document.getElementById("van-stock");
      held.innerHTML = stock.innerHTML = "";
      game.inventory.forEach(i=>{
        const b = document.createElement("button");
        b.textContent = "Return " + i;
        b.onclick = ()=>{
          game.inventory = game.inventory.filter(x=>x!==i);
          game.vanStock.push(i);
          openVanSwap();
        };
        held.appendChild(b);
      });
      game.vanStock.forEach(i=>{
        const b = document.createElement("button");
        b.textContent = "Take " + i;
        b.onclick = ()=>{
          if(game.inventory.length<3){
            game.vanStock = game.vanStock.filter(x=>x!==i);
            game.inventory.push(i);
          }
          openVanSwap();
        };
        stock.appendChild(b);
      });
      document.getElementById("van-swap-overlay").style.display = "block";
    }

    function toggleMonitor(){
      game.cameraActive = !game.cameraActive;
      logToGame(game.cameraActive? "Monitor On":"Monitor Off");
    }

    function showGuess(){
      const list = document.getElementById("guess-list");
      list.innerHTML = "";
      Object.keys(ghostProfiles).forEach(g=>{
        const b = document.createElement("button");
        b.textContent = g;
        b.onclick = ()=>{
          closeOverlay("guess-popup");
          endGame(g === game.ghost);
        };
        list.appendChild(b);
      });
      document.getElementById("guess-popup").style.display = "block";
    }

    function openNotebook(){
      const c = document.getElementById("notebook-entries");
      c.innerHTML = "";
      if(game.selectedEvidence.size===0){
        c.textContent = "(No evidence yet.)";
      } else {
        game.selectedEvidence.forEach(e=>{
          const d = document.createElement("div");
          d.textContent = e;
          c.appendChild(d);
        });
      }
      document.getElementById("notebook-overlay").style.display = "block";
    }

    document.getElementById("van-swap-confirm").onclick = ()=>{
      closeOverlay("van-swap-overlay");
      game.usedVanThisTurn = true;
      logToGame("Left van.");
    };

    document.getElementById("restart-btn").onclick = resetGame;

    function resetGame(){
      document.getElementById("restart-popup").style.display = "none";
      document.getElementById("game-log").innerHTML = "";
      document.getElementById("game-ui").style.display = "none";
      document.getElementById("main-scene").style.display = "none";
      document.getElementById("title-screen").style.display = "flex";
      document.getElementById("title-screen").style.opacity = "1";
      game.currentTurn=0; game.sanity=100;
      game.inventory=[]; game.vanStock=[];
      game.roomItems={}; game.selectedEvidence.clear();
      game.huntCooldown=0; game.smudgeActive=0; game.crucifixUses=2;
      game.cameraActive=false; game.monitorBooted=false;
    }

    function handleUse(item){
      // evidence items
      if(["EMF Reader","Spirit Box","Fingerprint Kit","Thermometer","UV Light","D.O.T.S Projector","Camera","Video Camera"].includes(item)){
        if(game.playerRoom===game.ghostRoom){
          const evidenceMap = {
            "EMF Reader":"EMF Reader",
            "Spirit Box":"Spirit Box",
            "Fingerprint Kit":"Fingerprint Kit",
            "Thermometer":"Freezing Temps",
            "UV Light":"Freezing Temps",
            "D.O.T.S Projector":"D.O.T.S Projector",
            "Camera":"Orbs",
            "Video Camera":"Orbs"
          };
          game.selectedEvidence.add(evidenceMap[item]);
          logToGame("Collected evidence: " + evidenceMap[item]);
        } else {
          logToGame("No sign here.");
        }
      }
      // smudge stick
      else if(item==="Smudge Stick"){
        if(game.playerRoom===game.ghostRoom){
          game.smudgeActive = 3;
          logToGame("Room smudged.");
          game.inventory = game.inventory.filter(i=>i!=="Smudge Stick");
        } else logToGame("Nothing to smudge.");
      }
      // crucifix
      else if(item==="Crucifix"){
        logToGame("Crucifix ready.");
      }
      // cursed items
      else if(cursedItems.includes(item)){
        if(game.inventory.includes(item)){
          if(!game.usedVanThisTurn){
            game.sanity = Math.max(0, game.sanity - cursedItemCosts[item]);
            logToGame("Used cursed: " + item);
            if(item==="Ouija Board" && Math.random()<0.3){
              logToGame("Ouija Board cracks! Hunt triggered.");
              attemptHunt();
            }
            game.inventory = game.inventory.filter(i=>i!==item);
          } else logToGame("Cannot use cursed again this turn.");
        }
      } else {
        logToGame("Used " + item + ".");
      }
      updateStats();
      advanceTurn();
    }

    function endGame(victory){
      document.getElementById("end-message").textContent =
        victory? "✅ You win!" : "💀 You died!";
      document.getElementById("restart-popup").style.display = "block";
    }

  </script>
</body>
</html>
