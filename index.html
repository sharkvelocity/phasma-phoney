<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Phasma‑Phoney v2.3.5 — Full Master Build</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Turn-based ghost investigation horror with notebook, cursed items, van monitor, orbs, hunts, and personality-driven events." />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background: black;
      overflow: hidden;
      font-family: monospace;
      color: #eee;
    }

    /* === TITLE SCREEN === */
    #title-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: black;
      z-index: 100;
      transition: opacity 1.5s ease;
    }
    #title-screen img {
      max-width: 50%;
      max-height: 50%;
      animation: pulse 5s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.9; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.04); }
    }
    #startButton {
      margin-top: 20px;
      padding: 14px 36px;
      font-size: 22px;
      background: #111;
      color: #eee;
      border: 2px solid #444;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    #startButton:hover { background: #222; border-color: #888; }

    /* === MAIN SCENE === */
    #main-scene {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: none;
      overflow: hidden;
      background: black;
    }
    #background, #rain-layer, #lightning, #foreground, #fog-layer, #orbCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    #background { 
      z-index: 1; 
      background-size: cover; 
      background-position: center; 
      background-color: #000;
    }
    #rain-layer { z-index: 2; pointer-events: none; }
    #lightning { 
      z-index: 3; 
      background: white; 
      opacity: 0; 
      pointer-events: none; 
      transition: opacity 0.2s ease; 
    }
    #foreground { z-index: 4; pointer-events: none; }
    #fog-layer { z-index: 5; pointer-events: none; }
    #orbCanvas { z-index: 6; pointer-events: none; }
    /* === HUD & GAME LOG === */
    #hud {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0,0,0,0.5);
      padding: 8px 12px;
      border: 1px solid #444;
      font-size: 14px;
      z-index: 11;
    }
    #sanity-bar-container {
      width: 120px;
      height: 10px;
      background: #222;
      border: 1px solid #555;
      margin-top: 4px;
      position: relative;
    }
    #sanity-bar {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      background: #0f0;
      width: 100%;
      transition: width 0.3s ease;
    }
    #inventory-display {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0,0,0,0.5);
      padding: 6px 10px;
      border: 1px solid #444;
      font-size: 12px;
      z-index: 11;
    }
    #narrator-ui {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 35%;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(4px);
      display: none;
      flex-direction: column;
      justify-content: space-between;
      z-index: 10;
    }
    #game-log {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      font-size: 14px;
      line-height: 1.4;
    }
    #game-log::-webkit-scrollbar { width: 6px; }
    #game-log::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
    .log-entry { opacity: 0.85; transition: opacity 1s ease-in-out; }
    .log-entry.fade { opacity: 0.4; }
    #command-buttons {
      display: flex;
      justify-content: space-around;
      padding: 8px;
      border-top: 1px solid #555;
      background: rgba(0,0,0,0.5);
    }
    #command-buttons button {
      padding: 8px 12px;
      background: #222;
      color: #eee;
      border: 1px solid #555;
      cursor: pointer;
      font-size: 14px;
    }
    #command-buttons button:hover { background: #333; }

    /* === LOADOUT === */
    #loadout-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0,0,0,0.9);
      display: none;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 200;
    }
    #loadout-container {
      background: #111;
      padding: 20px;
      border: 1px solid #555;
      max-width: 500px;
      width: 90%;
      color: #eee;
    }
    #loadout-sections { display: flex; justify-content: space-between; gap: 20px; }
    .loadout-side { flex: 1; background: #222; padding: 10px; border: 1px solid #444; }
    .loadout-side h4 { margin: 0 0 6px; font-size: 14px; color: #0f0; }
    .item-row { display: flex; justify-content: space-between; align-items: center; margin: 2px 0; }
    .item-row button { background: #333; color: #eee; border: 1px solid #555; padding: 2px 6px; cursor: pointer; font-size: 12px; }
    .item-row button:hover { background: #444; }
    #confirm-loadout { margin-top: 10px; padding: 8px 12px; background: #111; color: #eee; border: 1px solid #555; cursor: pointer; }

    /* === NOTEBOOK OVERLAY === */
    #notebook-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0,0,0,0.8);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 400;
    }
    #notebook {
      background: url('notebook-paper.png') no-repeat center center;
      background-size: cover;
      width: 500px;
      height: 600px;
      padding: 20px;
      font-family: "Comic Sans MS", cursive, sans-serif;
      color: #111;
      box-shadow: 0 0 20px rgba(0,0,0,0.8);
    }
    #notebook h3 {
      text-align: center;
      margin-bottom: 10px;
      font-size: 18px;
      text-decoration: underline;
    }
    .evidence-row {
      display: flex;
      justify-content: space-between;
      margin: 4px 0;
      font-size: 14px;
    }
    .ghost-list {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #555;
      font-size: 13px;
    }
    .ghost-list span {
      display: inline-block;
      width: 48%;
      margin: 2px 0;
      color: #444;
    }
    .ghost-list span.possible {
      color: #000;
      font-weight: bold;
    }
    #close-notebook {
      display: block;
      margin: 15px auto 0 auto;
      padding: 6px 12px;
      background: #222;
      color: #eee;
      border: 1px solid #555;
      cursor: pointer;
    }
    #close-notebook:hover { background: #333; }

    /* === FOOTER === */
    footer {
      position: fixed;
      bottom: 0;
      width: 100%;
      text-align: center;
      background: #111;
      color: #555;
      font-size: 10px;
      padding: 2px 0;
      z-index: 500;
    }
  </style>
</head>
<body>
  <!-- === TITLE SCREEN === -->
  <div id="title-screen">
    <img src="logo.png" alt="Phasma-Phoney Logo" />
    <button id="startButton">Start New Game</button>
  </div>

  <!-- === MAIN SCENE === -->
  <div id="main-scene">
    <div id="background"></div>
    <canvas id="rain-layer"></canvas>
    <div id="lightning"></div>
    <canvas id="orbCanvas"></canvas>
  </div>

  <!-- === HUD === -->
  <div id="hud">
    <div>Location: <span id="hud-location">Van</span> | Weather: <span id="hud-weather">--</span></div>
    <div>Turns: <span id="hud-turns">0</span></div>
    <div>Sanity:</div>
    <div id="sanity-bar-container"><div id="sanity-bar"></div></div>
    <div>Temp: <span id="hud-temp">--°C</span></div>
  </div>

  <!-- === INVENTORY DISPLAY (TOP RIGHT) === -->
  <div id="inventory-display">
    <div>Held:</div>
    <div id="held-items-display">None</div>
  </div>

  <!-- === NARRATOR & COMMAND BUTTONS === -->
  <div id="narrator-ui">
    <div id="game-log"></div>
    <div id="command-buttons">
      <button data-cmd="move">Move</button>
      <button data-cmd="look">Look Around</button>
      <button data-cmd="inventory">Inventory</button>
      <button data-cmd="monitor">Monitor</button>
      <button data-cmd="notebook">Notebook</button>
      <button data-cmd="guess">Ghost Guess</button>
    </div>
  </div>

  <!-- === LOADOUT SCREEN === -->
  <div id="loadout-screen">
    <div id="loadout-container">
      <h3>Select Your Starting Loadout (Max 3 Items)</h3>
      <div id="loadout-sections">
        <div class="loadout-side" id="van-side">
          <h4>Van Inventory</h4>
          <div id="van-list"></div>
        </div>
        <div class="loadout-side" id="held-side">
          <h4>Holding (0/3)</h4>
          <div id="held-list"></div>
        </div>
      </div>
      <button id="confirm-loadout">Confirm</button>
    </div>
  </div>

  <!-- === INVENTORY OVERLAY === -->
  <div id="inventory-overlay" style="display:none;">
    <div id="inventory-options">
      <div class="inventory-side" id="inventory-held-side"></div>
      <div class="inventory-side" id="inventory-room-side"></div>
    </div>
  </div>

  <!-- === NOTEBOOK OVERLAY === -->
  <div id="notebook-overlay" style="display:none;">
    <div id="notebook">
      <h3>Evidence</h3>
      <div class="evidence-row">
        <label><input type="checkbox" class="evidence-check" value="EMF Level 5"> EMF Level 5</label>
        <label><input type="checkbox" class="evidence-check" value="D.O.T.S"> D.O.T.S Projector</label>
      </div>
      <div class="evidence-row">
        <label><input type="checkbox" class="evidence-check" value="Fingerprints"> Fingerprints</label>
        <label><input type="checkbox" class="evidence-check" value="Ghost Orb"> Ghost Orb</label>
      </div>
      <div class="evidence-row">
        <label><input type="checkbox" class="evidence-check" value="Ghost Writing"> Ghost Writing</label>
        <label><input type="checkbox" class="evidence-check" value="Spirit Box"> Spirit Box</label>
      </div>
      <div class="evidence-row">
        <label><input type="checkbox" class="evidence-check" value="Freezing Temps"> Freezing Temperatures</label>
      </div>
      <div class="ghost-list" id="possible-ghosts"></div>
      <button id="close-notebook">Close Notebook</button>
    </div>
  </div>

  <!-- === GUESS POPUP === -->
  <div id="guess-popup" style="display:none;">
    <div id="guess-list"></div>
  </div>

  <!-- === MONITOR OVERLAY === -->
  <div id="monitor-overlay" style="display:none;">
    <div id="monitor-border"></div>
    <canvas id="orb-game-canvas"></canvas>
    <div id="orb-game-score"></div>
    <div id="orb-game-timer"></div>
    <div id="flip-clock"></div>
  </div>

  <!-- === FOOTER === -->
  <footer>Phasma‑Phoney v2.3.5 — Full Master Build</footer>
<script>
/* === GLOBAL CONSTANTS & GAME STATE === */
const allLoadoutItems = [
  "EMF Reader","Spirit Box","Camera","UV Light","D.O.T.S Projector",
  "Thermometer","Ghost Writing Book","Video Camera","Crucifix",
  "Smudge Stick","Salt","Parabolic Microphone","Motion Sensor","Sound Sensor"
];

const ghostProfiles = {
  Spirit:{evidence:["EMF Level 5","Spirit Box","Ghost Writing"],behavior:"Average activity, standard hunts."},
  Wraith:{evidence:["EMF Level 5","Spirit Box","D.O.T.S"],behavior:"Rarely touches ground, teleports to player."},
  Phantom:{evidence:["Spirit Box","Fingerprints","D.O.T.S"],behavior:"Looking at it drops sanity quickly."},
  Poltergeist:{evidence:["Spirit Box","Fingerprints","Ghost Writing"],behavior:"Throws multiple objects at once."},
  Banshee:{evidence:["Fingerprints","Ghost Orb","D.O.T.S"],behavior:"Targets one player, shrieks on parabolic."},
  Jinn:{evidence:["EMF Level 5","Fingerprints","Freezing Temps"],behavior:"Fast when far, kills power to slow hunts."},
  Mare:{evidence:["Spirit Box","Ghost Writing","Ghost Orb"],behavior:"Prefers darkness, more active with lights off."},
  Revenant:{evidence:["Ghost Writing","Ghost Orb","Freezing Temps"],behavior:"Slow if not hunting, fast when hunting."},
  Shade:{evidence:["EMF Level 5","Ghost Writing","Freezing Temps"],behavior:"Shy, less active with multiple people."},
  Demon:{evidence:["Fingerprints","Ghost Writing","Freezing Temps"],behavior:"Very aggressive, hunts early/often."},
  Yurei:{evidence:["Ghost Orb","Freezing Temps","D.O.T.S"],behavior:"Sanity drain, smudge locks in room."},
  Oni:{evidence:["EMF Level 5","Freezing Temps","D.O.T.S"],behavior:"Very active, throws items often."},
  Hantu:{evidence:["Fingerprints","Ghost Orb","Freezing Temps"],behavior:"Faster in cold, slower in warm."},
  Goryo:{evidence:["EMF Level 5","Fingerprints","D.O.T.S"],behavior:"Only seen on camera, stays in ghost room."},
  Myling:{evidence:["EMF Level 5","Fingerprints","Ghost Writing"],behavior:"Quieter footsteps, frequent sounds."},
  Onryo:{evidence:["Spirit Box","Ghost Orb","Freezing Temps"],behavior:"Flames trigger hunts; extinguishing fire risky."},
  TheTwins:{evidence:["EMF Level 5","Spirit Box","Freezing Temps"],behavior:"Interacts in two spots, different speeds."},
  Raiju:{evidence:["EMF Level 5","Ghost Orb","D.O.T.S"],behavior:"Faster near electronics, disrupts devices."},
  Obake:{evidence:["EMF Level 5","Fingerprints","Ghost Orb"],behavior:"Rare fingerprints, shapeshifts."},
  TheMimic:{evidence:["Spirit Box","Fingerprints","Freezing Temps"],behavior:"Mimics others, always shows fake orbs."},
  Moroi:{evidence:["Spirit Box","Ghost Writing","Freezing Temps"],behavior:"Curses players, sanity drains faster."},
  Deogen:{evidence:["Spirit Box","Ghost Writing","D.O.T.S"],behavior:"Always knows location, slow near player."},
  Thaye:{evidence:["Ghost Orb","Ghost Writing","D.O.T.S"],behavior:"Highly active early, slows over time."},
  Yokai:{evidence:["Spirit Box","Ghost Orb","D.O.T.S"],behavior:"Talkative, hunts near voices."},
  Succubus:{evidence:["Spirit Box","Ghost Writing","Fingerprints"],behavior:"Targets males, faster sanity drain in interactions."}
};

const possibleWeather = ["Clear","Rain","Stormy","Foggy","Bloodmoon"];

const roomVisuals = {
  Van:{N:"Van_N.png"},
  Foyer:{N:"Foyer_N.png"},
  "Living Room":{N:"LivingRoom_N.png"},
  Kitchen:{N:"Kitchen_N.png"},
  "Dining Room":{N:"DiningRoom_N.png"},
  Garage:{N:"Garage_N.png"},
  Basement:{N:"Basement_N.png"},
  Bathroom:{N:"Bathroom_N.png"},
  "Kids Bedroom":{N:"KidsBedroom_N.png"},
  "Master Bedroom":{N:"MasterBedroom_N.png"}
};

const mapConnections = {
  Van:["Foyer"],
  Foyer:["Van","Living Room","Kitchen","Bathroom"],
  "Living Room":["Foyer","Dining Room","Garage","Kids Bedroom","Master Bedroom"],
  Kitchen:["Foyer","Dining Room"],
  "Dining Room":["Living Room","Kitchen","Basement"],
  Garage:["Living Room"],
  Basement:["Dining Room"],
  Bathroom:["Foyer"],
  "Kids Bedroom":["Living Room"],
  "Master Bedroom":["Living Room"]
};

const game = {
  ghost:null, ghostRoom:null, playerRoom:"Van",
  inventory:[], vanStock:[...allLoadoutItems],
  roomItems:{}, selectedEvidence:new Set(),
  currentTurn:0, sanity:100,
  mimicForm:null, nextMimicShift:0,
  huntCooldown:0, smudgeActive:0,
  weather:null, cameraActive:false,
  placedCrucifix:{}, monitorBooted:false,
  placedCameras:{}
};

/* === UTILITY FUNCTIONS === */
function randomFromArray(arr){return arr[Math.floor(Math.random()*arr.length)];}

function logToGame(text){
  const log=document.getElementById("game-log");
  const e=document.createElement("div");
  e.className="log-entry";
  e.textContent=text;
  log.appendChild(e);
  log.scrollTop=log.scrollHeight;
  setTimeout(()=>e.classList.add("fade"),8000);
}

function updateSanityBar(){
  const bar=document.getElementById("sanity-bar");
  bar.style.width=game.sanity+"%";
  bar.style.background = game.sanity>66 ? "#0f0" : (game.sanity>33 ? "#ff0" : "#f00");
}

/* === STARTUP & LOADOUT === */
document.addEventListener("DOMContentLoaded",()=>{
  resetGameState();
  document.getElementById("title-screen").style.display="flex";
});

function resetGameState(){
  Object.assign(game,{
    ghost:null, ghostRoom:null, playerRoom:"Van",
    inventory:[], vanStock:[...allLoadoutItems],
    roomItems:{}, selectedEvidence:new Set(),
    currentTurn:0, sanity:100,
    mimicForm:null, nextMimicShift:0,
    huntCooldown:0, smudgeActive:0,
    weather:null, cameraActive:false,
    placedCrucifix:{}, monitorBooted:false,
    placedCameras:{}
  });
  updateSanityBar();
}

document.getElementById("startButton").addEventListener("click",()=>{
  document.getElementById("title-screen").style.opacity="0";
  setTimeout(()=>{
    document.getElementById("title-screen").style.display="none";
    showLoadout();
  },1500);
});

/* === LOADOUT SYSTEM === */
let tempHeld=[], tempVan=[...allLoadoutItems];

function showLoadout(){
  document.getElementById("loadout-screen").style.display="flex";
  renderLoadout();
}

function renderLoadout(){
  const held=document.getElementById("held-list"),
        van=document.getElementById("van-list");
  held.innerHTML=""; van.innerHTML="";

  // Held Items
  tempHeld.forEach(i=>{
    const row=document.createElement("div");
    row.className="item-row"; row.textContent=i;
    const b=document.createElement("button");
    b.textContent="-";
    b.onclick=()=>{
      tempVan.push(i);
      tempHeld=tempHeld.filter(x=>x!==i);
      renderLoadout();
    };
    row.appendChild(b);
    held.appendChild(row);
  });

  // Van Items
  const count={};
  tempVan.forEach(i=>count[i]=(count[i]||0)+1);
  Object.keys(count).forEach(i=>{
    const row=document.createElement("div");
    row.className="item-row";
    row.textContent=`${i} (${count[i]})`;
    const b=document.createElement("button");
    b.textContent="+";
    b.onclick=()=>{
      if(tempHeld.length<3){
        tempHeld.push(i);
        tempVan.splice(tempVan.indexOf(i),1);
        renderLoadout();
      } else alert("Max 3 items!");
    };
    row.appendChild(b);
    van.appendChild(row);
  });
}

document.getElementById("confirm-loadout").addEventListener("click",()=>{
  game.inventory=[...tempHeld,"Notebook","Lighter"];
  game.vanStock=[...tempVan];
  document.getElementById("loadout-screen").style.display="none";
  startInvestigation();
});
</script>
<script>
/* === START INVESTIGATION === */
function startInvestigation(){
  document.getElementById("main-scene").style.display="block";
  document.getElementById("narrator-ui").style.display="flex";
  document.getElementById("game-log").innerHTML="";

  game.weather = randomFromArray(possibleWeather);
  game.ghost = randomFromArray(Object.keys(ghostProfiles));
  if(game.ghost === "TheMimic") assignMimicForm();

  game.ghostRoom = randomFromArray(Object.keys(roomVisuals).filter(r=>r!=="Van"));
  logToGame(`You are in the van. The weather outside is ${game.weather.toLowerCase()}...`);

  renderHUD();
  updateBackground();

  if(["Rain","Stormy","Bloodmoon"].includes(game.weather)){
    animateRain();
    randomLightning();
  }
  randomOrbs();
}

function assignMimicForm(){
  game.mimicForm = randomFromArray(Object.keys(ghostProfiles).filter(g=>g!=="TheMimic"));
  game.nextMimicShift = game.currentTurn + Math.floor(Math.random()*4) + 3;
}

function renderHUD(){
  document.getElementById("hud-location").textContent = game.playerRoom;
  document.getElementById("hud-weather").textContent = game.weather;
  document.getElementById("hud-turns").textContent = game.currentTurn;
  document.getElementById("held-items-display").textContent = game.inventory.join(", ") || "None";
  updateSanityBar();
}

function updateBackground(){
  if(roomVisuals[game.playerRoom]){
    document.getElementById("background").style.backgroundImage = `url('${roomVisuals[game.playerRoom].N}')`;
  }
}

/* === COMMAND HANDLING === */
document.querySelectorAll("#command-buttons button")
  .forEach(b => b.addEventListener("click",()=>handleCommand(b.dataset.cmd)));

function handleCommand(cmd){
  switch(cmd){
    case "move": openMoveOverlay(); break;
    case "look": lookAround(); break;
    case "inventory": openInventoryOverlay(); break;
    case "monitor": openMonitor(); break;
    case "notebook": openNotebook(); break;
    case "guess": openGuess(); break;
  }
}

/* === MOVEMENT === */
function openMoveOverlay(){
  const opts = mapConnections[game.playerRoom] || [];
  if(!opts.length){
    logToGame("No available paths.");
    return;
  }

  const overlay = document.createElement("div");
  overlay.style.position="fixed";
  overlay.style.top="0";overlay.style.left="0";
  overlay.style.width="100%";overlay.style.height="100%";
  overlay.style.background="rgba(0,0,0,0.7)";
  overlay.style.zIndex="400";
  overlay.style.color="#eee";
  overlay.style.padding="20px";

  const title = document.createElement("h3");
  title.textContent = "Move To:";
  overlay.appendChild(title);

  opts.forEach(r=>{
    const b=document.createElement("button");
    b.textContent = "Go to " + r;
    b.style.display="block";
    b.style.marginBottom="5px";
    b.onclick=()=>{
      document.body.removeChild(overlay);
      moveToRoom(r);
    };
    overlay.appendChild(b);
  });

  const c=document.createElement("button");
  c.textContent="Cancel";
  c.style.marginTop="10px";
  c.onclick=()=>document.body.removeChild(overlay);
  overlay.appendChild(c);

  document.body.appendChild(overlay);
}

function moveToRoom(r){
  game.playerRoom = r;
  game.currentTurn++;
  logToGame("You move to " + r + ".");
  renderHUD();
  updateBackground();
  checkTurnEvents();
}

/* === LOOK AROUND === */
function lookAround(){
  game.currentTurn++;
  if(game.playerRoom === game.ghostRoom){
    logToGame("You feel an eerie presence here...");
    if(game.ghost==="TheMimic" || game.mimicForm==="TheMimic"){
      logToGame("Strange orbs flicker briefly in the air...");
    }
  } else {
    logToGame("Nothing unusual here.");
  }
  renderHUD();
  checkTurnEvents();
}
</script>
<script>
/* === INVENTORY OVERLAY === */
function openInventoryOverlay(){
  const overlay=document.createElement("div");
  overlay.style.position="fixed";overlay.style.top="0";overlay.style.left="0";
  overlay.style.width="100%";overlay.style.height="100%";
  overlay.style.background="rgba(0,0,0,0.85)";
  overlay.style.zIndex="450";overlay.style.color="#eee";
  overlay.style.padding="20px";overlay.style.overflowY="auto";

  const heldTitle=document.createElement("h3");
  heldTitle.textContent="Held Items";
  overlay.appendChild(heldTitle);

  game.inventory.forEach(i=>{
    const div=document.createElement("div");
    div.style.marginBottom="6px";
    div.textContent = i + " ";

    const dd=document.createElement("select");
    ["Inspect","Use","Drop","Place"].forEach(a=>{
      const opt=document.createElement("option");
      opt.textContent=a;dd.appendChild(opt);
    });
    dd.onchange=()=>{
      const a=dd.value;
      document.body.removeChild(overlay);
      if(a==="Inspect")inspectItem(i);
      if(a==="Use")useItem(i);
      if(a==="Drop")dropItem(i);
      if(a==="Place")placeItem(i);
    };
    div.appendChild(dd);
    overlay.appendChild(div);
  });

  const nearTitle=document.createElement("h3");
  nearTitle.textContent="Nearby Items";
  overlay.appendChild(nearTitle);

  const nearby=game.playerRoom==="Van" ? game.vanStock : (game.roomItems[game.playerRoom]||[]);
  nearby.forEach(i=>{
    const div=document.createElement("div");
    div.style.marginBottom="6px";
    div.textContent=i+" ";
    const b=document.createElement("button");
    b.textContent="Pick Up";
    b.onclick=()=>{
      document.body.removeChild(overlay);
      pickItem(i);
    };
    div.appendChild(b);
    overlay.appendChild(div);
  });

  const c=document.createElement("button");
  c.textContent="Close";
  c.style.marginTop="10px";
  c.onclick=()=>document.body.removeChild(overlay);
  overlay.appendChild(c);

  document.body.appendChild(overlay);
}

/* === INSPECT ITEM === */
function inspectItem(i){
  const desc = ghostProfiles[i] ? ghostProfiles[i].behavior :
    (i==="Ghost Writing Book" ? "A book for ghosts to write in. Place in rooms for ghost writing evidence." :
     i==="Thermometer" ? "Reads room temperature; freezing indicates ghost presence." :
     i==="Crucifix" ? "Prevents hunts in the ghost room. Two uses before breaking." :
     i==="Camera"||i==="Video Camera" ? "Captures ghost orbs; best placed in ghost room." :
     i==="Spirit Box" ? "Communicate with the ghost by asking questions; works best in dark active rooms." :
     i==="EMF Reader" ? "Detects EMF levels; 5 indicates strong ghost activity." :
     i==="Smudge Stick" ? "Burn to calm ghost or stop a hunt for a few turns." :
     i==="Salt" ? "Place near doors; tracks ghost footsteps for evidence." :
     "A standard investigation tool.");

  logToGame(`Inspecting: ${i} — ${desc}`);
}

/* === USE ITEM === */
function useItem(i){
  switch(i){
    case "Notebook":
    case "Ghost Writing Book":
      openNotebook();
      logToGame("You open the notebook to review your evidence.");
      return;

    case "Smudge Stick":
      if(game.playerRoom === game.ghostRoom){
        game.smudgeActive = 3;
        logToGame("You smudge the room, calming the ghost temporarily.");
        if(game.ghost==="Yurei") logToGame("The Yurei is locked in its room for a while.");
      } else logToGame("You smudge, but nothing happens.");
      break;

    case "Camera":
    case "Video Camera":
      if(game.playerRoom !== "Van"){
        game.cameraActive = !game.cameraActive;
        logToGame(game.cameraActive ?
          "You turn on the camera to look for orbs." :
          "You turn off the camera.");
      } else logToGame("You cannot use the camera in the van.");
      break;

    default:
      logToGame("You use the " + i + ", but nothing significant happens.");
  }

  game.currentTurn++;
  renderHUD();
  checkTurnEvents();
}

/* === DROP ITEM === */
function dropItem(i){
  if(game.playerRoom === "Van") game.vanStock.push(i);
  else{
    game.roomItems[game.playerRoom] = game.roomItems[game.playerRoom] || [];
    game.roomItems[game.playerRoom].push(i);
  }
  game.inventory = game.inventory.filter(x=>x!==i);
  logToGame("You drop the " + i + ".");
  renderHUD();
}

/* === PLACE ITEM === */
function placeItem(i){
  if(game.playerRoom==="Van"){
    logToGame("You cannot place items in the van.");
    return;
  }
  if(i==="Crucifix"){
    game.placedCrucifix[game.playerRoom]=2;
    logToGame("You place a crucifix in the room.");
  }
  if(i==="Camera"||i==="Video Camera"){
    game.placedCameras[game.playerRoom]=true;
    logToGame("You place a camera in this room.");
  }
  game.inventory = game.inventory.filter(x=>x!==i);
  game.roomItems[game.playerRoom] = game.roomItems[game.playerRoom] || [];
  game.roomItems[game.playerRoom].push(i);
  renderHUD();
}

/* === PICK UP ITEM === */
function pickItem(i){
  if(game.inventory.length >= 3){
    logToGame("You can only hold 3 items.");
    return;
  }
  if(game.playerRoom === "Van") game.vanStock = game.vanStock.filter(x=>x!==i);
  else game.roomItems[game.playerRoom] = game.roomItems[game.playerRoom].filter(x=>x!==i);

  game.inventory.push(i);
  logToGame("You pick up the " + i + ".");
  renderHUD();
}

/* === UPDATE POSSIBLE GHOSTS (DYNAMIC) === */
function updatePossibleGhosts(){
  const list=document.getElementById("possible-ghosts");
  if(!list) return;

  const selected=[...game.selectedEvidence];
  if(selected.length===0){
    list.innerHTML="<strong>Possible Ghosts:</strong> All (no evidence selected).";
    return;
  }

  const filtered=Object.keys(ghostProfiles).filter(g=>{
    const ev=ghostProfiles[g].evidence;
    return selected.every(e=>ev.includes(e));
  });

  if(filtered.length===0){
    list.innerHTML="<strong>Possible Ghosts:</strong> No ghost matches all selected evidence yet.";
  } else {
    list.innerHTML="<strong>Possible Ghosts:</strong> "+filtered.join(", ");
  }
}

/* === FINAL NOTEBOOK SUGGESTION LOG === */
function suggestGhosts(){
  const possible = Object.keys(ghostProfiles).filter(g => {
    return [...game.selectedEvidence].every(ev => ghostProfiles[g].evidence.includes(ev));
  });

  if (possible.length > 0) {
    logToGame("Possible ghosts based on evidence: " + possible.join(", "));
  } else {
    logToGame("No ghost matches all selected evidence yet.");
  }
}

<script>
/* === GHOST BEHAVIOR EVENT TRIGGERS === */
function ghostBehaviorTrigger(){
  const ghost = game.ghost === "TheMimic" ? game.mimicForm : game.ghost;
  switch(ghost){
    case "Poltergeist":
      if(Math.random()<0.3) logToGame("You hear multiple objects clattering violently at once.");
      break;
    case "Oni":
      if(Math.random()<0.3) logToGame("A loud crash startles you — something was thrown hard.");
      break;
    case "Raiju":
      if(Math.random()<0.3 && game.cameraActive) logToGame("Your electronics glitch with static interference.");
      break;
    case "Banshee":
      if(Math.random()<0.2) logToGame("A piercing shriek echoes faintly through your equipment.");
      break;
    case "Thaye":
      if(game.currentTurn < 10 && Math.random()<0.4) logToGame("Rapid, aggressive movements seem to surround you.");
      break;
    case "Demon":
      if(Math.random()<0.3) logToGame("The air grows heavy — the ghost seems eager to hunt.");
      break;
    case "Succubus":
      if(Math.random()<0.3) logToGame("You feel drained as if your willpower is being sapped away...");
      break;
    case "Wraith":
      if(Math.random()<0.25) logToGame("You hear footsteps but no footprints are left behind...");
      break;
    case "Shade":
      if(Math.random()<0.2) logToGame("The ghost seems shy and retreats when you approach.");
      break;
  }
}

/* === AMBIENT NARRATION & HINTS === */
function ambientNarration(){
  if(game.playerRoom === game.ghostRoom){
    const hints = [
      "You feel a sudden chill in the air.",
      "A faint whisper seems to call your name.",
      "The lights flicker briefly as you stand still.",
      "Something brushes past you, but nothing is there.",
      "The temperature feels unnaturally cold here."
    ];
    if(Math.random()<0.5) logToGame("[Ambient] " + randomFromArray(hints));
  } else {
    if(Math.random()<0.25){
      const distant = [
        "You hear a distant creak echoing from another room.",
        "A muffled thump resonates in the house.",
        "A faraway door slams unexpectedly.",
        "A faint static hum lingers in the distance."
      ];
      logToGame("[Ambient] " + randomFromArray(distant));
    }
  }
}

/* === TURN EVENTS & GHOST ROOM SHIFTING === */
function checkTurnEvents(){
  // Mimic shifts form every 3–6 turns
  if(game.ghost === "TheMimic" && game.currentTurn >= game.nextMimicShift){
    assignMimicForm();
    logToGame("You sense a shift — the ghost's behavior changes abruptly...");
  }

  // Sanity drain & behavior triggers
  if(game.playerRoom === game.ghostRoom){
    const ghost = game.ghost === "TheMimic" ? game.mimicForm : game.ghost;
    if(Math.random() < 0.4) game.sanity -= 3 + Math.random()*3;
    ghostBehaviorTrigger();
    if(Math.random() < ghostEventChance(ghost)) logToGame("[Behavior Hint] " + ghostProfiles[ghost].behavior);
    if(Math.random() < 0.2) ghostEventFlicker();
  } else {
    if(Math.random() < 0.1) ambientNarration();
    game.sanity -= 1;
  }

  if(game.sanity < 0) game.sanity = 0;
  updateSanityBar();
  ghostRoomShift();
  attemptHunt();
}

/* === RANDOM GHOST ROOM MOVEMENT === */
function ghostRoomShift(){
  if(game.ghost === "Goryo") return; // Goryo never leaves its ghost room
  if(game.ghost === "Yurei" && game.smudgeActive > 0) return; // Yurei locked after smudge

  if(Math.random() < 0.2){
    const old = game.ghostRoom;
    game.ghostRoom = randomFromArray(Object.keys(roomVisuals).filter(r => r !== "Van"));
    if(game.ghostRoom !== old) logToGame("You hear faint movement — the ghost seems to have changed rooms.");
  }
}

/* === HUNT LOGIC & PERSONALITY-BASED AGGRESSION === */
function ghostEventChance(g){
  switch(g){
    case "Thaye": return 0.5;
    case "Oni": return 0.4;
    case "Poltergeist": return 0.35;
    case "Demon": return 0.45;
    case "Succubus": return 0.4;
    default: return 0.25;
  }
}

function attemptHunt(){
  if(game.smudgeActive > 0){ game.smudgeActive--; return; }
  if(game.huntCooldown > 0){ game.huntCooldown--; return; }

  const aggressiveGhosts = ["Demon","Thaye","Oni","Raiju","Yokai","Succubus"];
  let chance = 0.25;
  if(aggressiveGhosts.includes(game.ghost === "TheMimic" ? game.mimicForm : game.ghost)) chance += 0.1;
  if(game.weather === "Bloodmoon") chance += 0.1;

  if(game.sanity < 30 && Math.random() < chance) startHunt();
}

function startHunt(){
  logToGame("The ghost has entered a hunt!");
  flashRed();
  heartbeatEffect();

  if(game.playerRoom === game.ghostRoom){
    if(game.placedCrucifix[game.playerRoom] && game.placedCrucifix[game.playerRoom] > 0){
      game.placedCrucifix[game.playerRoom]--;
      logToGame("The crucifix glows brightly, preventing the hunt! ("+game.placedCrucifix[game.playerRoom]+" uses left)");
    } else {
      setTimeout(()=>{
        alert("The ghost caught you! You died.");
        endGame();
      }, 2000);
    }
  } else {
    logToGame("You hide quietly — the ghost passes by without finding you.");
  }

  game.huntCooldown = 5;
}

/* === HUNT VISUAL & AUDIO EFFECTS === */
function flashRed(){
  const l=document.getElementById("lightning");
  l.style.background="red";
  l.style.opacity=0.6;
  setTimeout(()=>{ l.style.opacity=0; },400);
}

function heartbeatEffect(){
  const l=document.getElementById("lightning");
  let flashes=0;
  const flicker=setInterval(()=>{
    l.style.background="red";
    l.style.opacity=0.6;
    setTimeout(()=>{ l.style.opacity=0; },200);
    flashes++;
    if(flashes>6) clearInterval(flicker);
  },400);
}

/* === BLOODMOON LOGIC (AGGRESSION BOOST & RANDOM LIGHTNING) === */
function randomLightning(){
  if(!["Rain","Stormy","Bloodmoon"].includes(game.weather)) return;
  setTimeout(()=>{
    const l=document.getElementById("lightning");
    l.style.background = game.weather === "Bloodmoon" ? "red" : "white";
    l.style.opacity = 0.8;
    setTimeout(()=>{ l.style.opacity=0; },200);

    if(game.weather === "Bloodmoon" && Math.random() < 0.3){
      logToGame("The blood moon glows ominously — you feel the ghost's rage rising...");
      if(Math.random() < 0.3) startHunt();
    }
    randomLightning();
  }, Math.random()*8000 + 4000);
}

function ghostEventFlicker(){
  const l=document.getElementById("lightning");
  l.style.background="red";
  l.style.opacity=0.5;
  setTimeout(()=>{ l.style.opacity=0; },500);
}
</script>
<script>
/* === MONITOR SYSTEM (CAMERA FEED & BOOT SEQUENCE) === */
function openMonitor(){
  if(game.playerRoom !== "Van"){
    logToGame("You can only use the monitor in the van.");
    return;
  }
  if(!game.monitorBooted){
    bootMonitorSequence();

}

function bootMonitorSequence(){

}

function openMonitorMenu(){
  const overlay = document.getElementById("monitor-overlay");
  const border = document.getElementById("monitor-border");
  overlay.style.display = "flex";
  border.innerHTML = "<h3 style='color:#0f0;'>Camera Monitor</h3>";

  const cams = Object.keys(game.placedCameras);

    border.innerHTML += "<div style='color:#555;'>No cameras placed yet.</div>";
  } else {
    cams.forEach(room=>{

function viewCameraFeed(room){

  if(room === game.ghostRoom){

/* === ORB MINI-GAME === */
let orbGameActive = false, orbScore = 0, orbTime = 60, orbOrbs = [], orbCtx, orbTimerInterval;

function startOrbGame(){
  orbGameActive = true; orbScore = 0; orbTime = 60; orbOrbs = [];

  const canvas = document.createElement("canvas");
  canvas.width = 360; canvas.height = 240;
  canvas.style.background = "black";
  canvas.style.display = "block";
  canvas.style.margin = "10px auto";
  orbCtx = canvas.getContext("2d");
  document.getElementById("monitor-border").appendChild(canvas);

  canvas.addEventListener("click", shootOrb);

  spawnOrb();
  updateOrbHUD(canvas);

  orbTimerInterval = setInterval(()=>{
    orbTime--;
    updateOrbHUD(canvas);
    if(orbTime <= 0) endOrbGame(canvas);
  }, 1000);

  animateOrbGame(canvas);
}

function spawnOrb(){
  if(!orbGameActive) return;
  if(orbOrbs.length < 8){
    const rare = Math.random() < 0.1;
    orbOrbs.push({
      x: Math.random()*340+10,
      y: Math.random()*220+10,
      r: rare ? 8 : 5,
      color: rare ? "#00f" : "#fff",
      speed: rare ? 1.5 : 0.5,
      fade: Math.random()*0.02+0.01
    });
  }
  setTimeout(spawnOrb, 800);
}

function animateOrbGame(canvas){
  if(!orbGameActive) return;
  orbCtx.clearRect(0,0,360,240);
  orbOrbs.forEach((o,i)=>{
    o.y += Math.sin(o.fade*50)*o.speed;
    orbCtx.beginPath();
    orbCtx.arc(o.x, o.y, o.r, 0, Math.PI*2);
    orbCtx.fillStyle = o.color;
    orbCtx.fill();
  });
  requestAnimationFrame(()=>animateOrbGame(canvas));
}

function shootOrb(e){
  if(!orbGameActive) return;
  const rect = e.target.getBoundingClientRect();
  const x = e.clientX - rect.left, y = e.clientY - rect.top;

  orbOrbs.forEach((o,i)=>{
    const dx = o.x - x, dy = o.y - y;
    if(Math.sqrt(dx*dx + dy*dy) < o.r){
      orbScore += o.color === "#00f" ? 100 : 10;
      orbTime += o.color === "#00f" ? 5 : 1;
      orbOrbs.splice(i,1);
    }
  });
}

function updateOrbHUD(canvas){
  const hud = document.createElement("div");
  hud.textContent = `Score: ${orbScore} | Time: ${orbTime}s`;
  hud.style.color = "#0f0";
  hud.style.textAlign = "center";
  hud.style.marginTop = "4px";

  if(canvas.previousElementSibling) canvas.previousElementSibling.remove();
  canvas.parentNode.insertBefore(hud, canvas);
}

function endOrbGame(canvas){
  orbGameActive = false;
  clearInterval(orbTimerInterval);
  canvas.removeEventListener("click", shootOrb);
  alert(`Orb Capture Complete — Final Score: ${orbScore}`);
  canvas.remove();
}

/* === INVENTORY INTEGRATION (UPDATED FOR NOTEBOOK & ORB MINI-GAME) === */
function openInventoryOverlay(){
  const overlay = document.createElement("div");
  overlay.style.position = "fixed";

    dd.onchange = ()=>{
      const a = dd.value;
      document.body.removeChild(overlay);
      if(a === "Inspect") inspectItem(i);
      if(a === "Use") useItem(i);
      if(a === "Drop") dropItem(i);
      if(a === "Place") placeItem(i);
    };
    div.appendChild(dd);
    overlay.appendChild(div);
  });

  const nearbyTitle = document.createElement("h3");
  nearbyTitle.textContent = "Nearby Items";
  overlay.appendChild(nearbyTitle);

  const nearby = game.playerRoom === "Van" ? game.vanStock : (game.roomItems[game.playerRoom] || []);
  nearby.forEach(i=>{
    const div = document.createElement("div");
    div.textContent = i + " ";

    b.textContent = "Pick Up";
    b.onclick = ()=>{ document.body.removeChild(overlay); pickItem(i); };
    div.appendChild(b);
    overlay.appendChild(div);
  });

  const c = document.createElement("button");
  c.textContent = "Close";
  c.onclick = ()=>document.body.removeChild(overlay);
  overlay.appendChild(c);

  document.body.appendChild(overlay);
}

function updatePossibleGhosts(){
  const list = document.getElementById("possible-ghosts");
  if(!list) return;

  const selected = [...game.selectedEvidence];
  if(selected.length === 0){
    list.innerHTML = "<strong>Possible Ghosts:</strong> All (no evidence selected).";
    return;
  }

  const filtered = Object.keys(ghostProfiles).filter(g=>{
    const ev = ghostProfiles[g].evidence;
    return selected.every(e => ev.includes(e));
  });

  if(filtered.length === 0){
    list.innerHTML = "<strong>Possible Ghosts:</strong> No match with current evidence.";
  } else {
    list.innerHTML = "<strong>Possible Ghosts:</strong> " + filtered.join(", ");
  }
}

      if(game.playerRoom === game.ghostRoom){

  const aggressiveGhosts = ["Demon","Thaye","Oni","Raiju","Yokai","Succubus"];

  if(aggressiveGhosts.includes(game.ghost === "TheMimic" ? game.mimicForm : game.ghost)) chance += 0.1;

<script>
/* === ORB MINI-GAME (FINAL POLISH & FIXES) === */
let orbGameActive = false, orbScore = 0, orbTime = 60, orbOrbs = [], orbCtx, orbTimerInterval;

function startOrbGame() {
  orbGameActive = true;
  orbScore = 0;
  orbTime = 60;
  orbOrbs = [];

  const container = document.createElement("div");
  container.id = "orb-game-container";
  container.style.position = "fixed";
  container.style.top = "0";
  container.style.left = "0";
  container.style.width = "100vw";
  container.style.height = "100vh";
  container.style.background = "rgba(0,0,0,0.9)";
  container.style.display = "flex";
  container.style.flexDirection = "column";
  container.style.justifyContent = "center";
  container.style.alignItems = "center";
  container.style.zIndex = "700";

  const hud = document.createElement("div");
  hud.id = "orb-hud";
  hud.style.color = "#0f0";
  hud.style.marginBottom = "10px";
  hud.textContent = `Score: ${orbScore} | Time: ${orbTime}s`;

  const canvas = document.createElement("canvas");
  canvas.width = 480;
  canvas.height = 320;
  canvas.style.border = "2px solid #0f0";
  canvas.style.background = "black";
  orbCtx = canvas.getContext("2d");

  const close = document.createElement("button");
  close.textContent = "Exit Mini-Game";
  close.style.marginTop = "10px";
  close.onclick = ()=>endOrbGame(container);

  container.appendChild(hud);
  container.appendChild(canvas);
  container.appendChild(close);
  document.body.appendChild(container);

  canvas.addEventListener("click", shootOrb);
  spawnOrb();
  orbTimerInterval = setInterval(()=>{
    orbTime--;
    hud.textContent = `Score: ${orbScore} | Time: ${orbTime}s`;
    if(orbTime <= 0) endOrbGame(container);
  }, 1000);
  animateOrbGame(canvas, hud);
}

function spawnOrb() {
  if(!orbGameActive) return;
  if(orbOrbs.length < 8) {
    const rare = Math.random() < 0.08;
    orbOrbs.push({
      x: Math.random() * 440 + 20,
      y: Math.random() * 280 + 20,
      r: rare ? 10 : 6,
      color: rare ? "#00f" : "#fff",
      speedX: (Math.random() - 0.5) * 1.2,
      speedY: (Math.random() - 0.5) * 1.2,
      alpha: 0.7 + Math.random() * 0.3,
      fade: Math.random() * 0.02 + 0.005
    });
  }
  setTimeout(spawnOrb, 1200);
}

function animateOrbGame(canvas, hud) {
  if(!orbGameActive) return;
  orbCtx.clearRect(0, 0, canvas.width, canvas.height);
  orbOrbs.forEach((o, i)=>{
    o.x += o.speedX;
    o.y += o.speedY;
    if(o.x <= 0 || o.x >= canvas.width) o.speedX *= -1;
    if(o.y <= 0 || o.y >= canvas.height) o.speedY *= -1;
    o.alpha += o.fade;
    if(o.alpha >= 1 || o.alpha <= 0.3) o.fade *= -1;

    orbCtx.beginPath();
    orbCtx.arc(o.x, o.y, o.r, 0, Math.PI * 2);
    orbCtx.fillStyle = `rgba(${o.color === "#00f" ? "0,0,255" : "255,255,255"}, ${o.alpha})`;
    orbCtx.fill();
  });
  requestAnimationFrame(()=>animateOrbGame(canvas, hud));
}

function shootOrb(e) {
  if(!orbGameActive) return;
  const canvas = e.target;
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;

  orbOrbs.forEach((o, i)=>{
    if(Math.sqrt((o.x - x) ** 2 + (o.y - y) ** 2) < o.r) {
      orbScore += o.color === "#00f" ? 100 : 10;
      orbTime += o.color === "#00f" ? 5 : 1;
      orbOrbs.splice(i, 1);
      document.getElementById("orb-hud").textContent = `Score: ${orbScore} | Time: ${orbTime}s`;
    }
  });
}

function endOrbGame(container) {
  orbGameActive = false;
  clearInterval(orbTimerInterval);
  container.remove();
  logToGame(`Orb Mini-Game finished — Final Score: ${orbScore}`);
}

/* ✅ CONSOLIDATED NARRATOR AMBIENCE */
function ambientNarration() {
  const isGhostRoom = game.playerRoom === game.ghostRoom;
  const ghost = game.ghost === "TheMimic" ? game.mimicForm : game.ghost;

  if (isGhostRoom && Math.random() < 0.55) {
    const ghostHints = [
      `A cold breath brushes your neck... (${ghost})`,
      "You hear faint breathing beside you.",
      "A shadow moves independently of yours.",
      "The room feels charged with energy.",
      "Your hairs stand on end for no reason."
    ];

  } else if (Math.random() < 0.2) {
    const houseCues = [
      "A creak echoes from the walls.",
      "Something knocks distantly...",
      "A door hinge squeals somewhere nearby.",
      "Faint whispers are carried by the air."
    ];
    logToGame("[Ambient] " + houseCues[Math.floor(Math.random() * houseCues.length)]);
  }
}

/* ✅ MONITOR + NARRATOR COMBINED IMPROVEMENTS */
function openMonitor() {
  if(game.playerRoom !== "Van") {

  }

/* === LOADOUT & INVENTORY SYNC FIX === */
function syncInventoryDisplay() {
  document.getElementById("held-items-display").textContent =
    game.inventory.length > 0 ? game.inventory.join(", ") : "None";
}

/* OVERRIDING EXISTING pickItem, dropItem, placeItem FOR FULL SYNC */
function pickItem(i) {
  if (game.inventory.length >= 3) {
    logToGame("You can only hold 3 items at a time.");
    return;
  }
  if (game.playerRoom === "Van") {
    const index = game.vanStock.indexOf(i);
    if (index !== -1) game.vanStock.splice(index, 1);
  } else {
    game.roomItems[game.playerRoom] = (game.roomItems[game.playerRoom] || []).filter(x => x !== i);
  }
  game.inventory.push(i);
  logToGame("You pick up the " + i + ".");
  syncInventoryDisplay();
  renderHUD();
}

function dropItem(i) {
  if (game.playerRoom === "Van") {
    game.vanStock.push(i);
  } else {
    if (!game.roomItems[game.playerRoom]) game.roomItems[game.playerRoom] = [];
    game.roomItems[game.playerRoom].push(i);
  }
  game.inventory = game.inventory.filter(x => x !== i);
  logToGame("You drop the " + i + ".");
  syncInventoryDisplay();
  renderHUD();
}

function placeItem(i) {
  if (game.playerRoom === "Van") {
    logToGame("You cannot place items inside the van.");
    return;
  }
  if (i === "Crucifix") {
    game.placedCrucifix[game.playerRoom] = 2;
    logToGame("You place a crucifix here.");
  } else if (i === "Camera" || i === "Video Camera") {
    game.placedCameras[game.playerRoom] = true;
    logToGame("You place a camera here.");
  }
  if (!game.roomItems[game.playerRoom]) game.roomItems[game.playerRoom] = [];
  game.roomItems[game.playerRoom].push(i);
  game.inventory = game.inventory.filter(x => x !== i);
  syncInventoryDisplay();
  renderHUD();
}

/* === COMPLETE LOADOUT CONFIRMATION INTEGRATION === */
document.getElementById("confirm-loadout").addEventListener("click", () => {
  game.inventory = [...tempHeld, "Notebook", "Lighter"];
  game.vanStock = [...tempVan];
  syncInventoryDisplay();
  document.getElementById("loadout-screen").style.display = "none";
  startInvestigation();
  logToGame("You finalized your loadout and stepped out of the van.");
});

/* === AUTO SCROLL FIX AFTER LOADOUT === */
function renderLoadout() {
  const held = document.getElementById("held-list");
  const van = document.getElementById("van-list");
  held.innerHTML = "";
  van.innerHTML = "";

  tempHeld.forEach(i => {
    const row = document.createElement("div");
    row.className = "item-row";
    row.textContent = i;
    const b = document.createElement("button");
    b.textContent = "-";
    b.onclick = () => {
      tempVan.push(i);
      tempHeld = tempHeld.filter(x => x !== i);
      renderLoadout();
    };
    row.appendChild(b);
    held.appendChild(row);
  });

  const count = {};
  tempVan.forEach(i => (count[i] = (count[i] || 0) + 1));
  Object.keys(count).forEach(i => {
    const row = document.createElement("div");
    row.className = "item-row";
    row.textContent = `${i} (${count[i]})`;
    const b = document.createElement("button");
    b.textContent = "+";
    b.onclick = () => {
      if (tempHeld.length < 3) {
        tempHeld.push(i);
        tempVan.splice(tempVan.indexOf(i), 1);
        renderLoadout();
      } else {
        alert("You can only hold 3 items!");
      }
    };
    row.appendChild(b);
    van.appendChild(row);
  });

  document.getElementById("held-side").scrollTop = document.getElementById("held-side").scrollHeight;
}

<script>
/* === CURSED ITEMS BEHAVIOR === */
const cursedItemDescriptions = {
  "Haunted Mirror": "Reveals the ghost room but drains sanity quickly when used.",
  "Tarot Cards": "Draw random effects: sanity boost, instant hunt, or ghost interaction.",
  "Summoning Circle": "Summons ghost for photo; triggers immediate hunt afterwards."
};

function handleCursedItem(item) {
  switch (item) {
    case "Haunted Mirror":
      if (game.sanity > 10) {
        logToGame("You gaze into the mirror... you see the " + game.ghostRoom + ".");
        game.sanity -= 20;
      } else {
        logToGame("You are too weak to use the mirror safely.");
      }
      break;

    case "Tarot Cards":
      const effects = [
        () => { logToGame("The Wheel of Fortune grants you calmness (+10 sanity)."); game.sanity = Math.min(100, game.sanity + 10); },
        () => { logToGame("The Devil causes sudden ghost activity!"); ghostBehaviorTrigger(); },
        () => { logToGame("Death card drawn — the ghost begins hunting!"); startHunt(); }
      ];
      const effect = effects[Math.floor(Math.random() * effects.length)];
      effect();
      break;

    case "Summoning Circle":
      logToGame("You light the summoning circle... the ghost manifests!");
      flashRed();
      setTimeout(startHunt, 2000);
      break;

    default:
      logToGame("Nothing unusual happens.");
  }
  updateSanityBar();
}

/* === DEATH & RESTART OVERLAY === */
function gameOverOverlay(message) {

/* OVERRIDE HUNT DEATH HANDLING */
function startHunt() {
  logToGame("The ghost is hunting!"); 
  flashRed();
  heartbeatEffect();

  if (game.playerRoom === game.ghostRoom) {
    if (game.placedCrucifix[game.playerRoom] && game.placedCrucifix[game.playerRoom] > 0) {
      game.placedCrucifix[game.playerRoom]--;
      logToGame("The crucifix glows, preventing the hunt! (" + game.placedCrucifix[game.playerRoom] + " uses left)");
    } else {
      setTimeout(() => {
        gameOverOverlay("The ghost caught you! You died.");
      }, 1500);
    }
  } else {
    logToGame("You hide as the ghost stalks nearby...");
  }
  game.huntCooldown = 5;
}

<script>
/* === SAVE & LOAD SYSTEM (LOCALSTORAGE) === */
function saveGame() {
  try {
    const saveData = {
      ghost: game.ghost,
      ghostRoom: game.ghostRoom,
      playerRoom: game.playerRoom,
      inventory: game.inventory,
      vanStock: game.vanStock,
      roomItems: game.roomItems,
      selectedEvidence: [...game.selectedEvidence],
      currentTurn: game.currentTurn,
      sanity: game.sanity,
      mimicForm: game.mimicForm,
      nextMimicShift: game.nextMimicShift,
      huntCooldown: game.huntCooldown,
      smudgeActive: game.smudgeActive,
      weather: game.weather,
      cameraActive: game.cameraActive,
      placedCrucifix: game.placedCrucifix,
      monitorBooted: game.monitorBooted,
      placedCameras: game.placedCameras
    };
    localStorage.setItem("phasmaPhoneySave", JSON.stringify(saveData));
    logToGame("Game saved successfully.");
  } catch (err) {
    console.error("Save error:", err);
    logToGame("Save failed.");
  }
}

function loadGame() {
  const data = localStorage.getItem("phasmaPhoneySave");
  if (!data) {
    logToGame("No save data found.");
    return;
  }
  try {
    const saveData = JSON.parse(data);
    Object.assign(game, saveData, {
      selectedEvidence: new Set(saveData.selectedEvidence)
    });
    renderHUD();
    updateBackground();
    logToGame("Game loaded. You are in " + game.playerRoom + ".");
  } catch (err) {
    console.error("Load error:", err);
    logToGame("Load failed.");
  }
}

function clearSave() {
  localStorage.removeItem("phasmaPhoneySave");
  logToGame("Save data cleared.");
}

  const yes = document.createElement("button");
