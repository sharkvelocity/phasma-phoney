<!-- === PHASMA‑PHONEY v2.3.4 — FULL MASTER BUILD === -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Phasma‑Phoney v2.3.4</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
/* === GLOBAL RESET === */
html,body{margin:0;padding:0;width:100vw;height:100vh;background:black;overflow:hidden;font-family:monospace,sans-serif;color:#eee;}
/* === TITLE SCREEN === */
#title-screen{position:fixed;top:0;left:0;width:100vw;height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;background:black;z-index:100;opacity:1;transition:opacity 2s ease-in-out;}
#title-screen img{max-width:65%;max-height:45vh;animation:pulse 5s infinite ease-in-out;opacity:.9;margin-bottom:20px;}
@keyframes pulse{0%,100%{opacity:.9;transform:scale(1);}50%{opacity:1;transform:scale(1.04);}}
#startButton{padding:16px 48px;font-size:24px;background:#111;color:#eee;border:2px solid #444;cursor:pointer;z-index:101;transition:all .3s ease;}
#startButton:hover{background:#222;border-color:#888;}
/* === MAIN SCENE === */
#main-scene{position:relative;width:100vw;height:100vh;display:none;overflow:hidden;background:black;}
#background,#rain-layer,#lightning,#foreground,#fog-layer,#orbCanvas{position:absolute;top:0;left:0;width:100%;height:100%;}
#background{z-index:1;background-size:cover;background-position:center;}
#rain-layer{z-index:1.5;pointer-events:none;}
#lightning{z-index:3;background:white;opacity:0;pointer-events:none;transition:opacity .2s ease;}
#foreground{z-index:4;pointer-events:none;}
#fog-layer{z-index:5;pointer-events:none;}
#orbCanvas{z-index:6;pointer-events:none;}
/* === NARRATOR UI === */
#narrator-ui{position:absolute;bottom:0;left:0;width:100%;height:40%;background:rgba(0,0,0,.4);backdrop-filter:blur(4px);display:none;flex-direction:column;justify-content:space-between;z-index:10;}
#game-log{flex:1;overflow-y:auto;padding:10px;font-size:14px;line-height:1.4;opacity:.95;}
.log-entry{opacity:.85;transition:opacity 1s ease-in-out;}
.log-entry.fade{opacity:.4;}
#command-buttons{display:flex;justify-content:space-around;padding:10px;border-top:1px solid #555;background:rgba(0,0,0,.5);}
#command-buttons button{padding:8px 12px;background:#222;color:#eee;border:1px solid #555;cursor:pointer;font-size:14px;}
#command-buttons button:hover{background:#333;}
/* === HUD === */
#hud{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.5);padding:8px 12px;border:1px solid #444;font-size:14px;z-index:11;}
#sanity-bar-container{width:120px;height:10px;background:#222;border:1px solid #555;margin-top:4px;position:relative;}
#sanity-bar{position:absolute;top:0;left:0;height:100%;background:#0f0;width:100%;transition:width .3s ease;}
/* === INVENTORY HUD === */
#inventory-display{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.5);padding:6px 10px;border:1px solid #444;font-size:12px;z-index:11;}
/* === LOADOUT SCREEN === */
#loadout-screen{position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,.9);display:none;justify-content:center;align-items:center;flex-direction:column;z-index:200;}
#loadout-container{background:#111;padding:20px;border:1px solid #555;max-width:500px;width:90%;color:#eee;}
#loadout-sections{display:flex;justify-content:space-between;gap:20px;}
.loadout-side{flex:1;background:#222;padding:10px;border:1px solid #444;}
.loadout-side h4{margin:0 0 6px 0;font-size:14px;color:#0f0;}
.item-row{display:flex;justify-content:space-between;align-items:center;margin:2px 0;}
.item-row button{background:#333;color:#eee;border:1px solid #555;padding:2px 6px;cursor:pointer;font-size:12px;}
.item-row button:hover{background:#444;}
#confirm-loadout{margin-top:10px;padding:8px 12px;background:#111;color:#eee;border:1px solid #555;cursor:pointer;}
/* === INVENTORY OVERLAY === */
#inventory-overlay{position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,.8);display:none;justify-content:center;align-items:center;flex-direction:column;z-index:250;}
#inventory-options{display:flex;gap:20px;background:#111;padding:20px;border:1px solid #444;max-height:70%;overflow-y:auto;color:#eee;}
.inventory-side{flex:1;background:#222;padding:10px;border:1px solid #444;}
.inventory-side h4{margin:0 0 6px 0;font-size:14px;color:#0f0;}
.inventory-item{margin:4px 0;padding:4px;border:1px solid #333;background:#111;cursor:pointer;}
.inventory-actions{display:none;margin-top:4px;}
.inventory-actions button{display:block;width:100%;margin:2px 0;background:#333;color:#eee;border:1px solid #555;padding:2px 4px;font-size:12px;cursor:pointer;}
.inventory-actions button:hover{background:#444;}
/* === GUESS POPUP === */
#guess-popup{position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,.8);display:none;justify-content:center;align-items:center;z-index:300;}
#guess-list{background:#111;padding:20px;border:1px solid #444;max-height:70%;overflow-y:auto;color:#eee;width:300px;text-align:center;}
#guess-list button{display:block;width:100%;margin:4px 0;padding:6px;background:#222;color:#eee;border:1px solid #555;cursor:pointer;}
#guess-list button:hover{background:#333;}
/* === MONITOR OVERLAY === */
#monitor-overlay{position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,.9);display:none;justify-content:center;align-items:center;z-index:400;}
#monitor-border{background:#111;padding:20px;border:1px solid #444;color:#eee;max-width:400px;width:90%;text-align:center;}
#orb-game-canvas{display:none;background:black;border:1px solid #444;margin-top:10px;}
</style>
</head>
<body>
<div id="title-screen"><img src="logo.png" alt="Phasma-Phoney Logo" /><button id="startButton">Start New Game</button></div>
<div id="main-scene"><div id="background"></div><canvas id="rain-layer"></canvas><div id="lightning"></div><div id="foreground"></div><canvas id="fog-layer"></canvas><canvas id="orbCanvas"></canvas></div>
<div id="hud"><div>Location: <span id="hud-location">Van</span> | Weather: <span id="hud-weather">--</span></div><div>Turns: <span id="hud-turns">0</span></div><div>Sanity:</div><div id="sanity-bar-container"><div id="sanity-bar"></div></div><div>Temp: <span id="hud-temp">--°C</span></div></div>
<div id="inventory-display"><div>Held:</div><div id="held-items-display">None</div></div>
<div id="narrator-ui"><div id="game-log"></div><div id="command-buttons"><button data-cmd="move">Move</button><button data-cmd="look">Look Around</button><button data-cmd="inventory">Inventory</button><button data-cmd="monitor">Monitor</button><button data-cmd="guess">Ghost Guess</button></div></div>
<div id="loadout-screen"><div id="loadout-container"><h3>Select Your Starting Loadout (Max 3 Items)</h3><div id="loadout-sections"><div class="loadout-side" id="van-side"><h4>Van Inventory</h4><div id="van-list"></div></div><div class="loadout-side" id="held-side"><h4>Holding (0/3)</h4><div id="held-list"></div></div></div><button id="confirm-loadout">Confirm</button></div></div>
<div id="inventory-overlay"><div id="inventory-options"><div class="inventory-side" id="inventory-held-side"><h4>Held Items</h4></div><div class="inventory-side" id="inventory-room-side"><h4>Nearby Items</h4></div></div></div>
<div id="guess-popup"><div id="guess-list"></div></div>
<div id="monitor-overlay"><div id="monitor-border"></div><canvas id="orb-game-canvas"></canvas><div id="orb-game-score"></div><div id="orb-game-timer"></div><div id="flip-clock"></div></div>
<script>
/* === CORE GAME STATE === */
const allLoadoutItems=["EMF Reader","Spirit Box","Camera","UV Light","D.O.T.S Projector","Thermometer","Ghost Writing Book","Video Camera","Crucifix","Smudge Stick","Salt"];
const possibleWeather=["Stormy","Rain","Clear","Foggy","Bloodmoon"];
const game={ghost:null,ghostRoom:null,playerRoom:"Van",inventory:[],vanStock:[...allLoadoutItems],roomItems:{},selectedEvidence:new Set(),currentTurn:0,sanity:100,weather:null,placedCrucifix:{},cameraActive:false,smudgeActive:0,huntCooldown:0,bloodmoon:false};
function randomFromArray(a){return a[Math.floor(Math.random()*a.length)];}
function logToGame(t){const l=document.getElementById("game-log"),e=document.createElement("div");e.className="log-entry";e.textContent=t;l.appendChild(e);l.scrollTop=l.scrollHeight;setTimeout(()=>{e.classList.add("fade");},8000);}
function updateSanityBar(){const b=document.getElementById("sanity-bar");b.style.width=game.sanity+"%";if(game.sanity>66)b.style.background="#0f0";else if(game.sanity>33)b.style.background="#ff0";else b.style.background="#f00";}
/* === GHOST PROFILES (25) === */
const ghostProfiles={
 Spirit:{evidence:["EMF Level 5","Spirit Box","Ghost Writing"],behavior:"Average activity, standard hunts."},
 Wraith:{evidence:["EMF Level 5","Spirit Box","D.O.T.S"],behavior:"Rarely touches ground, teleports to player."},
 Phantom:{evidence:["Spirit Box","Fingerprints","D.O.T.S"],behavior:"Looking at it drains sanity quickly."},
 Poltergeist:{evidence:["Spirit Box","Fingerprints","Ghost Writing"],behavior:"Throws multiple objects at once."},
 Banshee:{evidence:["Fingerprints","Orbs","D.O.T.S"],behavior:"Targets one player, shrieks on parabolic."},
 Jinn:{evidence:["EMF Level 5","Fingerprints","Freezing Temps"],behavior:"Fast when far, cuts power often."},
 Mare:{evidence:["Spirit Box","Ghost Writing","Orbs"],behavior:"More active in darkness."},
 Revenant:{evidence:["Ghost Writing","Orbs","Freezing Temps"],behavior:"Slow if not hunting, fast when hunting."},
 Shade:{evidence:["EMF Level 5","Ghost Writing","Freezing Temps"],behavior:"Shy, less active with groups."},
 Demon:{evidence:["Fingerprints","Ghost Writing","Freezing Temps"],behavior:"Very aggressive, early hunts."},
 Yurei:{evidence:["Orbs","Freezing Temps","D.O.T.S"],behavior:"Sanity drain by doors, smudge locks it."},
 Oni:{evidence:["EMF Level 5","Freezing Temps","D.O.T.S"],behavior:"Very active, throws objects."},
 Hantu:{evidence:["Fingerprints","Orbs","Freezing Temps"],behavior:"Faster in cold, slower in warm."},
 Goryo:{evidence:["EMF Level 5","Fingerprints","D.O.T.S"],behavior:"Shows on cameras, stays in room."},
 Myling:{evidence:["EMF Level 5","Fingerprints","Ghost Writing"],behavior:"Quieter steps, frequent sounds."},
 Onryo:{evidence:["Spirit Box","Orbs","Freezing Temps"],behavior:"Fire triggers, extinguish can hunt."},
 TheTwins:{evidence:["EMF Level 5","Spirit Box","Freezing Temps"],behavior:"Two areas active differently."},
 Raiju:{evidence:["EMF Level 5","Orbs","D.O.T.S"],behavior:"Faster near electronics, disrupts."},
 Obake:{evidence:["EMF Level 5","Fingerprints","Orbs"],behavior:"Rare fingerprints, shapeshifts."},
 TheMimic:{evidence:["Spirit Box","Fingerprints","Freezing Temps"],behavior:"Mimics other ghosts, fake orbs."},
 Moroi:{evidence:["Spirit Box","Ghost Writing","Freezing Temps"],behavior:"Curses players, drains sanity."},
 Deogen:{evidence:["Spirit Box","Ghost Writing","D.O.T.S"],behavior:"Knows your location, slow near you."},
 Thaye:{evidence:["Orbs","Ghost Writing","D.O.T.S"],behavior:"Very active early, slows over time."},
 Yokai:{evidence:["Spirit Box","Orbs","D.O.T.S"],behavior:"Hunts near voices, talks more."},
 Succubus:{evidence:["Spirit Box","Ghost Writing","Fingerprints"],behavior:"Targets males, drains sanity faster."}
};
/* === ROOM MAP === */
const roomVisuals={
 Van:{N:"Van_N.png"},Foyer:{N:"Foyer_N.png"}, "Living Room":{N:"LivingRoom_N.png"},
 Kitchen:{N:"Kitchen_N.png"},"Dining Room":{N:"DiningRoom_N.png"},Garage:{N:"Garage_N.png"},
 Basement:{N:"Basement_N.png"},Bathroom:{N:"Bathroom_N.png"},"Kids Bedroom":{N:"KidsBedroom_N.png"},
 "Master Bedroom":{N:"MasterBedroom_N.png"}
};
const mapConnections={Van:["Foyer"],Foyer:["Van","Living Room","Kitchen","Bathroom"],
"Living Room":["Foyer","Dining Room","Garage","Kids Bedroom","Master Bedroom"],Kitchen:["Foyer","Dining Room"],
"Dining Room":["Living Room","Kitchen","Basement"],Garage:["Living Room"],Basement:["Dining Room"],
Bathroom:["Foyer"],"Kids Bedroom":["Living Room"],"Master Bedroom":["Living Room"]};
const allRooms=Object.keys(roomVisuals);

/* === STARTUP === */
document.addEventListener("DOMContentLoaded",()=>{resetGameState();document.getElementById("title-screen").style.display="flex";});
function resetGameState(){
 game.ghost=null;game.ghostRoom=null;game.playerRoom="Van";game.inventory=[];
 game.vanStock=[...allLoadoutItems];game.roomItems={};game.selectedEvidence.clear();
 game.currentTurn=0;game.sanity=100;game.weather=null;game.placedCrucifix={};
 game.smudgeActive=0;game.huntCooldown=0;game.bloodmoon=false;
 updateSanityBar();
}
/* === START BUTTON === */
document.getElementById("startButton").addEventListener("click",()=>{
 document.getElementById("title-screen").style.opacity="0";
 setTimeout(()=>{document.getElementById("title-screen").style.display="none";showLoadout();},1000);
});

/* === LOADOUT === */
let tempHeld=[],tempVan=[...allLoadoutItems];
function showLoadout(){document.getElementById("loadout-screen").style.display="flex";renderLoadout();}
function renderLoadout(){
 const held=document.getElementById("held-list"),van=document.getElementById("van-list");
 held.innerHTML="";van.innerHTML="";
 tempHeld.forEach(i=>{
  const b=document.createElement("button");b.textContent=`${i} (-)`;b.onclick=()=>{
   tempVan.push(i);tempHeld=tempHeld.filter(x=>x!==i);renderLoadout();
  };held.appendChild(b);
 });
 const countMap={};tempVan.forEach(i=>countMap[i]=(countMap[i]||0)+1);
 Object.keys(countMap).forEach(i=>{
  const b=document.createElement("button");b.textContent=`+ (${countMap[i]}) ${i}`;b.onclick=()=>{
   if(tempHeld.length<3){tempHeld.push(i);tempVan.splice(tempVan.indexOf(i),1);renderLoadout();}
   else alert("Max 3 items!");
  };van.appendChild(b);
 });
}
document.getElementById("confirm-loadout").addEventListener("click",()=>{
 game.inventory=[...tempHeld,"Notebook","Lighter"];game.vanStock=[...tempVan];
 document.getElementById("loadout-screen").style.display="none";startInvestigation();
});

/* === INVESTIGATION START === */
function startInvestigation(){
 document.getElementById("main-scene").style.display="block";
 document.getElementById("narrator-ui").style.display="flex";
 document.getElementById("game-log").innerHTML="";
 assignRandomGhost();assignRandomGhostRoom();randomizeWeather();
 logToGame("You are in the van. Weather: "+game.weather);
 renderHUD();updateBackground();
 if(game.weather==="Rain"||game.weather==="Stormy"||game.weather==="Bloodmoon"){animateRain();randomLightning();}
 randomOrbs();
}
function assignRandomGhost(){game.ghost=randomFromArray(Object.keys(ghostProfiles));}
function assignRandomGhostRoom(){game.ghostRoom=randomFromArray(allRooms.filter(x=>x!=="Van"));}
function randomizeWeather(){game.weather=randomFromArray(possibleWeather);game.bloodmoon=(game.weather==="Bloodmoon");}

/* === HUD & BACKGROUND === */
function renderHUD(){
 document.getElementById("hud-location").textContent=game.playerRoom;
 document.getElementById("hud-weather").textContent=game.weather;
 document.getElementById("hud-turns").textContent=game.currentTurn;
 document.getElementById("held-items-display").textContent=game.inventory.join(", ")||"None";
 updateSanityBar();
}
function updateBackground(){document.getElementById("background").style.backgroundImage=`url('${roomVisuals[game.playerRoom].N}')`;}

/* === COMMANDS === */
document.querySelectorAll("#command-buttons button").forEach(b=>b.addEventListener("click",()=>handleCommand(b.dataset.cmd)));
function handleCommand(c){
 if(c==="move")openMove();if(c==="look")lookAround();if(c==="inventory")openInventoryOverlay();
 if(c==="monitor")openMonitor();if(c==="guess")openGuess();
}

/* === MOVEMENT === */
function openMove(){
 const c=document.createElement("div");c.innerHTML="";
 (mapConnections[game.playerRoom]||[]).forEach(r=>{
  const b=document.createElement("button");b.textContent="Go to "+r;
  b.onclick=()=>{moveToRoom(r);document.body.removeChild(c);};c.appendChild(b);
 });
 c.style.position="fixed";c.style.top="50%";c.style.left="50%";c.style.transform="translate(-50%,-50%)";
 c.style.background="#111";c.style.padding="10px";document.body.appendChild(c);
}
function moveToRoom(r){
 game.playerRoom=r;game.currentTurn++;logToGame("You move to "+r);renderHUD();updateBackground();checkTurnEvents();
}
function lookAround(){
 game.currentTurn++;if(game.playerRoom===game.ghostRoom)logToGame("You feel a presence...");
 renderHUD();checkTurnEvents();
}

/* === INVENTORY OVERLAY (CLEAN) === */
function openInventoryOverlay(){
 const heldDiv=document.getElementById("inventory-held-side"),roomDiv=document.getElementById("inventory-room-side");
 heldDiv.innerHTML="<h4>Held Items</h4>";roomDiv.innerHTML="<h4>Nearby Items</h4>";
 game.inventory.forEach(i=>{
  const item=document.createElement("div");item.className="inventory-item";item.textContent=i;
  const actions=document.createElement("div");actions.className="inventory-actions";
  ["Inspect","Use","Drop"].forEach(a=>{const btn=document.createElement("button");btn.textContent=a+" "+i;btn.onclick=()=>{handleInventoryAction(a,i);};actions.appendChild(btn);});
  item.onclick=()=>{actions.style.display=actions.style.display==="block"?"none":"block";};
  item.appendChild(actions);heldDiv.appendChild(item);
 });
 (game.playerRoom==="Van"?game.vanStock:(game.roomItems[game.playerRoom]||[])).forEach(i=>{
  const item=document.createElement("div");item.className="inventory-item";item.textContent=i;
  const actions=document.createElement("div");actions.className="inventory-actions";
  const pick=document.createElement("button");pick.textContent="Pick "+i;pick.onclick=()=>{pickItem(i);};actions.appendChild(pick);
  item.onclick=()=>{actions.style.display=actions.style.display==="block"?"none":"block";};
  item.appendChild(actions);roomDiv.appendChild(item);
 });
 document.getElementById("inventory-overlay").style.display="flex";
}
function handleInventoryAction(a,i){
 document.getElementById("inventory-overlay").style.display="none";
 if(a==="Inspect")logToGame("Inspecting "+i);
 if(a==="Use")useItem(i);
 if(a==="Drop")dropItem(i);
}

/* === GHOST GUESS === */
function openGuess(){
 const list=document.getElementById("guess-list");list.innerHTML="";
 Object.keys(ghostProfiles).forEach(g=>{
  const b=document.createElement("button");b.textContent=g;b.onclick=()=>{makeGuess(g);closeGuess();};list.appendChild(b);
 });
 document.getElementById("guess-popup").style.display="flex";
}
function closeGuess(){document.getElementById("guess-popup").style.display="none";}
function makeGuess(g){if(g===game.ghost)alert("Correct! It was "+g);else alert("Wrong! It was "+game.ghost);resetGameState();showLoadout();}

/* === USE ITEMS & HUNTS === */
function useItem(i){
 if(i==="Smudge Stick"&&game.playerRoom===game.ghostRoom){game.smudgeActive=3;logToGame("Smudge calms ghost.");}
 if(i==="Crucifix"&&game.playerRoom===game.ghostRoom){game.placedCrucifix[game.playerRoom]=2;logToGame("Crucifix placed.");}
 if(i==="Camera"){game.cameraActive=!game.cameraActive;logToGame("Camera "+(game.cameraActive?"on":"off"));}
 game.currentTurn++;renderHUD();checkTurnEvents();
}
function dropItem(i){
 if(game.playerRoom==="Van")game.vanStock.push(i);else{game.roomItems[game.playerRoom]=game.roomItems[game.playerRoom]||[];game.roomItems[game.playerRoom].push(i);}
 game.inventory=game.inventory.filter(x=>x!==i);logToGame(i+" dropped.");renderHUD();
}
function pickItem(i){
 if(game.inventory.length>=3){alert("Max 3 items.");return;}
 if(game.playerRoom==="Van")game.vanStock=game.vanStock.filter(x=>x!==i);
 else game.roomItems[game.playerRoom]=game.roomItems[game.playerRoom].filter(x=>x!==i);
 game.inventory.push(i);logToGame("Picked "+i);renderHUD();
}

/* === TURN EVENTS, BLOODMOON, HUNTS === */
function checkTurnEvents(){
 if(game.playerRoom===game.ghostRoom&&Math.random()<0.3)logToGame("[Event] "+ghostProfiles[game.ghost].behavior);
 if(game.playerRoom===game.ghostRoom&&Math.random()<0.1)ghostEventFlicker();
 game.sanity-=game.playerRoom===game.ghostRoom?3:1;if(game.sanity<0)game.sanity=0;updateSanityBar();
 attemptHunt();
}
function attemptHunt(){
 if(game.smudgeActive>0){game.smudgeActive--;return;}
 if(game.huntCooldown>0){game.huntCooldown--;return;}
 if(game.sanity<30&&Math.random()<(game.bloodmoon?0.5:0.25))startHunt();
}
function startHunt(){
 logToGame("The ghost is hunting!");
 if(game.placedCrucifix[game.playerRoom]>0){game.placedCrucifix[game.playerRoom]--;logToGame("Crucifix blocked hunt.");}
 else alert("You died!");
 game.huntCooldown=5;
}
function ghostEventFlicker(){
 const l=document.getElementById("lightning");l.style.background="red";l.style.opacity=0.5;
 setTimeout(()=>{l.style.opacity=0;},500);
}

/* === LIGHTNING & ORBS === */
function randomLightning(){
 if(game.weather!=="Stormy"&&game.weather!=="Rain"&&!game.bloodmoon)return;
 setTimeout(()=>{const l=document.getElementById("lightning");l.style.background=game.bloodmoon?"red":"white";
 l.style.opacity=0.8;setTimeout(()=>{l.style.opacity=0;},200);randomLightning();},Math.random()*8000+4000);
}
function randomOrbs(){
 const c=document.getElementById("orbCanvas"),x=c.getContext("2d");
 c.width=window.innerWidth;c.height=window.innerHeight;let o=[];
 function spawn(){if(o.length<10)o.push({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*3+2,a:Math.random(),f:Math.random()*0.02+0.005});}
 function animate(){x.clearRect(0,0,c.width,c.height);o.forEach((b,i)=>{b.a+=b.f;if(b.a<=0||b.a>=1)b.f*=-1;b.y-=0.2;x.beginPath();x.arc(b.x,b.y,b.r,0,Math.PI*2);x.fillStyle="rgba(255,255,255,"+b.a+")";x.fill();if(b.y<-10)o.splice(i,1);});requestAnimationFrame(animate);}
 setInterval(spawn,2000);animate();
}

/* === MONITOR & ORB MINI-GAME === */
function openMonitor(){if(game.playerRoom!=="Van"){logToGame("Only usable in van.");return;}
 document.getElementById("monitor-overlay").style.display="flex";viewCameras();}
function viewCameras(){
 const b=document.getElementById("monitor-border");b.innerHTML="<h3>Camera Feeds</h3>";
 Object.keys(game.roomItems).forEach(r=>{
  if(game.roomItems[r].includes("Camera")){
   const btn=document.createElement("button");btn.textContent="View "+r;btn.onclick=()=>viewCameraFeed(r);b.appendChild(btn);
  }
 });
 const close=document.createElement("button");close.textContent="Close";close.onclick=()=>{document.getElementById("monitor-overlay").style.display="none";};b.appendChild(close);
}
function viewCameraFeed(r){
 const b=document.getElementById("monitor-border");b.innerHTML="<h3>Feed: "+r+"</h3>";
 if(r===game.ghostRoom)b.innerHTML+="<p>Ghost orbs visible!</p>";
 const back=document.createElement("button");back.textContent="Back";back.onclick=viewCameras;b.appendChild(back);
}
</script>
</body>
</html>
