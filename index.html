/* === TITLE SCREEN === */

  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;

}

}

    opacity: 0.9;
    transform: scale(1);
  }
  50% {
    opacity: 1;
    transform: scale(1.04);
  }
}

#startButton {

  left: 50%;
  transform: translateX(-50%);

}

}

  position: relative;
  width: 100vw;
  height: 100vh;
  display: none;
  overflow: hidden;
  background: black;
}

#lightning,
#fog-layer,

  top: 0;
  left: 0;

}

}

#orbCanvas {
  z-index: 5;
  pointer-events: none;
}

  left: 1%;

}

#sanity-bar-container {

#sanity-bar {

footer {

/***********************
 === SAVE / LOAD SYSTEM ===
************************/
function saveGame() {
  try {
    localStorage.setItem("phasmaPhoneySave", JSON.stringify(game));
    logToGame("💾 Game saved.");
  } catch (e) {
    console.error("Save failed:", e);
  }
}

function loadGame() {
  const saved = localStorage.getItem("phasmaPhoneySave");
  if (saved) {
    Object.assign(game, JSON.parse(saved));
    logToGame("✅ Save loaded. Continuing investigation...");

    // Restore scene and visuals
    document.getElementById("main-scene").style.display = "block";
    document.getElementById("narrator-ui").style.display = "flex";

    renderHUD();
    updateBackground();
    bootVisuals();
  } else {
    logToGame("No saved game found.");
  }
}

function clearSave() {
  localStorage.removeItem("phasmaPhoneySave");
  logToGame("🗑️ Save data cleared.");
}

/***********************
 === UTILITY HELPERS ===
************************/
function logToGame(msg) {
  const log = document.getElementById("game-log");
  const e = document.createElement("div");
  e.className = "log-entry";
  e.textContent = msg;
  log.appendChild(e);
  log.scrollTop = log.scrollHeight;
  setTimeout(() => {
    e.classList.add("fade");
  }, 8000);
}

function randomFromArray(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function updateSanityBar() {
  const bar = document.getElementById("sanity-bar");
  if (!bar) return;
  const s = Math.max(0, Math.floor(game.sanity));
  bar.style.width = s + "%";
  bar.style.background = s > 66 ? "#0f0" : s > 33 ? "#ff0" : "#f00";
}
/***********************
 === RESET GAME STATE ===
************************/
function resetGame() {
  // ✅ Reset full game state to defaults
  game.ghost = null;
  game.ghostRoom = null;
  game.playerRoom = "Van";
  game.playerDirection = "N";
  game.inventory = [];
  game.vanStock = [...allLoadoutItems];
  game.selectedEvidence.clear();
  game.currentTurn = 0;
  game.sanity = 100;
  game.weather = null;
  game.mimicForm = null;
  game.nextMimicShift = 0;
  game.huntCooldown = 0;
  game.smudgeActive = 0;
  game.placedCrucifix = {};
  game.roomItems = {};
  game.usedCursedItems = {};

  // ✅ Ensure immediate UI refresh (prevents empty HUD or NaN values)
  updateSanityBar();
  renderHUD();
  updateBackground();
}

 === INVESTIGATION STARTUP ===

/***********************
 === RANDOMIZED INVESTIGATION SETUP ===
************************/
function startInvestigation() {
  // ✅ Ensure proper scene visibility
  document.getElementById("main-scene").style.display = "block";
  document.getElementById("narrator-ui").style.display = "flex";
  document.getElementById("game-log").innerHTML = "";

  // ✅ Randomized setup
  game.weather = randomFromArray(possibleWeather);
  game.ghost = randomFromArray(Object.keys(ghostProfiles));
  if (game.ghost === "TheMimic") assignMimicForm();
  game.ghostRoom = randomFromArray(Object.keys(roomVisuals).filter(r => r !== "Van"));

  // ✅ Place cursed items (randomly each investigation)
  placeCursedItems();

  // ✅ Log opening narration
  logToGame(`You are in the van. The weather is ${game.weather.toLowerCase()}.`);

  // ✅ Update UI and visuals immediately
  renderHUD();
  updateBackground();
  bootVisuals();
  renderActionButtons();

  // ✅ Auto-save immediately after starting
  saveGame();
}

/***********************
 === MIMIC LOGIC & HUD RENDERING ===
************************/
function assignMimicForm() {
  // ✅ Randomly assign a ghost form for the Mimic, excluding itself
  const g = Object.keys(ghostProfiles).filter(x => x !== "TheMimic");
  game.mimicForm = randomFromArray(g);
  game.nextMimicShift = game.currentTurn + 3 + Math.floor(Math.random() * 4);
}

/***********************
 === HUD & BACKGROUND UPDATES ===
************************/
function renderHUD() {
  document.getElementById("hud-location").textContent = game.playerRoom;
  document.getElementById("hud-weather").textContent = game.weather || "--";
  document.getElementById("hud-turns").textContent = game.currentTurn;
  document.getElementById("held-items-display").textContent =
    game.inventory.length ? game.inventory.join(", ") : "None";

  // ✅ Temperature logic (Thermometer required)
  if (game.inventory.includes("Thermometer") && game.playerRoom !== "Van") {
    const t =
      game.playerRoom === game.ghostRoom
        ? (Math.random() < 0.3 ? -5 : 2 + Math.random() * 3)
        : 15 + Math.random() * 5;
    document.getElementById("hud-temp").textContent = t.toFixed(1) + "°C";
  } else {
    document.getElementById("hud-temp").textContent = "--°C";
  }

  updateSanityBar();
}

function updateBackground() {
  const v = roomVisuals[game.playerRoom] || roomVisuals["Van"];
  const d = game.playerDirection || "N";
  const bg = document.getElementById("background");

  // ✅ Fallback to van north view if something is missing
  if (v && v[d]) {
    bg.style.backgroundImage = `url('${v[d]}')`;
  } else {
    console.warn(`Missing background for ${game.playerRoom} (${d}).`);
    bg.style.backgroundImage = `url('${roomVisuals["Van"]["N"]}')`;
  }
}

function renderActionButtons() {
  const btns = document.getElementById("command-buttons");
  btns.innerHTML = `
    <button onclick="handleCommand('move')">Move</button>
    <button onclick="handleCommand('look')">Look Around</button>
    <button onclick="handleCommand('inventory')">Inventory</button>
    <button onclick="handleCommand('guess')">Ghost Guess</button>
    <button onclick="handleCommand('van')">Return to Van</button>
    <button onclick="handleCommand('save')">Save Game</button>
    <button onclick="handleCommand('load')">Load Game</button>
  `;
}

function openMoveOverlay() {
  // ✅ Remove any existing overlay before creating a new one
  const existing = document.getElementById("move-temp");
  if (existing) document.body.removeChild(existing);

  const exits = mapConnections[game.playerRoom] || [];
  if (!exits.length) {
    logToGame("No available exits.");
    return;
  }

  const overlay = document.createElement("div");
  overlay.id = "move-temp";
  Object.assign(overlay.style, {
    position: "fixed",
    top: "50%",
    left: "50%",
    transform: "translate(-50%,-50%)",
    background: "#111",
    padding: "10px",
    maxWidth: "90%",
    zIndex: "3000",
    border: "1px solid #555",
    borderRadius: "4px"
  });

  let html = `<h3 style="color:#0ff;margin-top:0;">Available Exits</h3>`;

  // ✅ Create buttons for each exit
  html += exits
    .map(r => `<button onclick="goRoomAndClose('${r}')">Go to ${r}</button>`)
    .join("");

  // ✅ Close button
  html += `<button style="margin-top:6px;" onclick="closeMoveOverlay()">Close</button>`;

  overlay.innerHTML = html;
  document.body.appendChild(overlay);

  // ✅ Safe close function
  window.closeMoveOverlay = function () {

    if (temp) document.body.removeChild(temp);
  };

  // ✅ Combined move + close + save
  window.goRoomAndClose = function (room) {
    moveToRoom(room);
    closeMoveOverlay();
    saveGame(); // ✅ Auto-save after moving
  };
}

/***********************
 === MOVE TO ROOM FUNCTION ===
************************/
function moveToRoom(r) {
  // ✅ Prevent redundant movement
  if (game.playerRoom === r) {
    logToGame("You are already in " + r + ".");
    return;
  }

  // ✅ Update room and turn count
  game.playerRoom = r;
  game.currentTurn++;

  // ✅ Optional: Reset player direction (default facing North; can expand to compass later)
  game.playerDirection = "N";

  // ✅ Narration
  logToGame("You move to " + r + ".");

  // ✅ Update HUD & visuals
  renderHUD();
  updateBackground();

  // ✅ Close move overlay if it’s still open
  const moveOverlay = document.getElementById("move-temp");
  if (moveOverlay) document.body.removeChild(moveOverlay);

  // ✅ Check for ghost events, ambient cues, and hunts
  checkTurnEvents();

  // ✅ Auto-save progress after movement
  saveGame();
}
/***********************
 === LOOK AROUND FUNCTION ===
************************/
function lookAround() {
  game.currentTurn++;

  if (game.playerRoom === game.ghostRoom) {
    logToGame("You feel an eerie presence...");

    // === Salt Footprints Logic ===
    const items = game.roomItems[game.playerRoom] || [];
    if (items.includes("Salt") && Math.random() < 0.5) {
      logToGame("You notice disturbed salt... Try using a UV Light.");
      if (!items.includes("Footprints")) {
        items.push("Footprints");
      }
      game.roomItems[game.playerRoom] = items;

      // Fade footprints after ~9 seconds
      setTimeout(() => {
        if (game.roomItems[game.playerRoom]) {
          game.roomItems[game.playerRoom] =
            game.roomItems[game.playerRoom].filter(x => x !== "Footprints");
          logToGame("The footprints have faded.");
          saveGame();
        }
      }, 9000);
    }

    // === Onryo Candle Snuffing ===
    if (
      game.ghost === "Onryo" &&
      items.includes("Candle") &&
      Math.random() < 0.5
    ) {
      game.roomItems[game.playerRoom] = items.filter(x => x !== "Candle");
      logToGame("The flame suddenly extinguishes!");
    }

    // === Mimic Fake Orbs Cue ===
    if (game.ghost === "TheMimic" || game.mimicForm === "TheMimic") {
      logToGame("Fake orbs shimmer briefly.");
    }

  } else {
    logToGame("Nothing unusual.");
  }

  // ✅ Update HUD, events, and auto-save
  renderHUD();
  checkTurnEvents();
  saveGame();
}

/***********************
 === HANDLE COMMANDS ===
************************/
function handleCommand(cmd) {
  switch (cmd) {
    case "move":
      openMoveOverlay();
      break;

    case "look":
      lookAround();
      break;

    case "inventory":
      openInventoryOverlay();
      break;

    case "guess":
      openGuess();

    case "van":
      if (game.playerRoom === "Van") {
        logToGame("You are already in the van.");
      } else {
        moveToRoom("Van");

      break;

    case "load":
      loadGame();
      break;

    default:
      logToGame("⚠️ Unknown command: " + cmd);
      break;
  }
}

function inspectItem(i) {
  let desc = cursedItems[i]?.desc || "Standard investigation gear.";
  switch (i) {
    case "Crucifix": desc = "Placed to prevent hunts. 2 uses."; break;
    case "Camera":
    case "Video Camera": desc = "Detects orbs via night vision."; break;
    case "UV Light": desc = "Reveals fingerprints or footprints (salt needed)."; break;
    case "Salt": desc = "Sprinkle to reveal footprints with UV."; break;
    case "Motion Sensor": desc = "Alerts you in van when ghost triggers it."; break;
    case "Candle": desc = "Prevents Onryo hunts while lit."; break;
  }
  logToGame(`Inspecting ${i}: ${desc}`);
}

function dropItem(i) {
  if (game.playerRoom === "Van") {
    if (!game.vanStock.includes(i)) {
      game.vanStock.push(i); game.vanStock.sort();
    }
    logToGame(`Returned ${i} to van.`);
  } else {
    game.roomItems[game.playerRoom] = game.roomItems[game.playerRoom] || [];
    if (!game.roomItems[game.playerRoom].includes(i)) {
      game.roomItems[game.playerRoom].push(i);
    }
    logToGame(`Dropped ${i} here.`);
  }
  game.inventory = game.inventory.filter(x => x !== i);
  renderHUD(); saveGame();
}

function pickItem(i) {
  if (game.inventory.length >= 3) { logToGame("Max 3 items."); return; }
  if (cursedItems[i] && i === "Summoning Circle") {
    logToGame("The circle cannot be moved."); return;
  }
  game.roomItems[game.playerRoom] =
    game.roomItems[game.playerRoom].filter(x => x !== i);
  if (!game.inventory.includes(i)) {
    game.inventory.push(i); game.inventory.sort();
  }
  logToGame(`Picked up ${i}.`);
  renderHUD(); saveGame();
}

/***********************
 === ITEM USE ===
************************/
function useItem(i) {
  switch (i) {
    case "Smudge Stick":
      if (game.playerRoom === game.ghostRoom) {
        game.smudgeActive = 3; logToGame("You smudge the room, calming the ghost.");
      } else { logToGame("You smudge, but nothing happens."); }
      break;

    case "Camera":
    case "Video Camera":
      if (game.playerRoom !== "Van") {
        game.cameraActive = !game.cameraActive;
        logToGame(game.cameraActive ? "Camera on: watching for orbs." : "Camera off.");
      } else { logToGame("Cannot use cameras in the van."); }
      break;

    case "Crucifix":
      if (game.playerRoom !== "Van") {
        game.placedCrucifix[game.playerRoom] = 2;
        logToGame("You place the crucifix. It may stop two hunts.");
        game.inventory = game.inventory.filter(x => x !== i);
      } else { logToGame("Cannot place crucifix in van."); }
      break;

    case "Salt":
      if (game.playerRoom !== "Van") {
        game.roomItems[game.playerRoom] = game.roomItems[game.playerRoom] || [];
        if (!game.roomItems[game.playerRoom].includes("Salt")) {
          game.roomItems[game.playerRoom].push("Salt");
          logToGame("You sprinkle salt on the ground.");
        }
      }
      break;

    case "UV Light":
      if (game.roomItems[game.playerRoom]?.includes("Footprints")) {
        logToGame("You see glowing footprints under UV!");
        game.selectedEvidence.add("Fingerprints");
      } else { logToGame("No visible prints under UV."); }
      break;

    case "Candle":
      if (game.playerRoom !== "Van") {
        game.roomItems[game.playerRoom] = game.roomItems[game.playerRoom] || [];
        if (!game.roomItems[game.playerRoom].includes("Candle")) {
          game.roomItems[game.playerRoom].push("Candle");
          logToGame("You place and light a candle here.");
        }
      }
      break;

    case "Motion Sensor":
      if (game.playerRoom !== "Van") {
        game.roomItems[game.playerRoom] = game.roomItems[game.playerRoom] || [];
        if (!game.roomItems[game.playerRoom].includes("Motion Sensor")) {
          game.roomItems[game.playerRoom].push("Motion Sensor");
          logToGame("You place a motion sensor in this room.");
        }
      }
      break;

    default:
      if (cursedItems[i]) { handleCursedItem(i); }
      else { logToGame("You use the " + i + ", but nothing significant occurs."); }
  }

  game.currentTurn++;
  renderHUD(); checkTurnEvents(); saveGame();
}

function handleCursedItem(i) {
  if (game.usedCursedItems[i]) { logToGame("The " + i + " is inert now."); return; }
  logToGame("You use the " + i + "...");
  game.sanity -= getCursedItemCost(i); if (game.sanity < 0) game.sanity = 0;

  switch (i) {
    case "Ouija Board": if (Math.random() < 0.2) startHunt(); break;
    case "Tarot Cards":
      const r = Math.random();
      if (r < 0.2) logToGame("The Fool — nothing happens.");
      else if (r < 0.4) logToGame("The Tower — ghost activity spikes!");
      else if (r < 0.6) { logToGame("The Death card — hunt triggered!"); startHunt(); }
      else { logToGame("The Sun — sanity restored."); game.sanity = Math.min(100, game.sanity + 10); }
      break;
    case "Music Box": case "Haunted Mirror": if (Math.random() < 0.3) startHunt(); break;
    case "Summoning Circle": startHunt(); break;
    case "Monkey Paw": if (Math.random() < 0.5) startHunt(); break;
  }

  game.usedCursedItems[i] = true;
  updateSanityBar(); saveGame();
}

/***********************
 === TURN EVENTS, AMBIENT & HUNT ===
************************/
function checkTurnEvents() {
  // ✅ Mimic shifting & rescheduling
  if (game.ghost === "TheMimic" && game.currentTurn >= game.nextMimicShift) {
    assignMimicForm();
    game.nextMimicShift = game.currentTurn + 3 + Math.floor(Math.random() * 4);
    logToGame("The Mimic shifts behavior...");
  }

  // ✅ Sanity drain with ambient hints every other turn
  if (game.playerRoom === game.ghostRoom) {
    game.sanity -= 3 + Math.random() * 3;
    if (game.currentTurn % 2 === 0 && Math.random() < 0.3) {
      const g = (game.ghost === "TheMimic" ? game.mimicForm : game.ghost);
      logToGame("[Ambient] " + (ghostProfiles[g].behavior || "The air feels heavy..."));
    }
  } else {
    game.sanity -= 1;
  }

  // ✅ Motion sensor alerts (Proximity-Based)
  Object.keys(game.roomItems).forEach(r => {
    if (!game.roomItems[r]?.includes("Motion Sensor")) return;
    if (Math.random() < 0.25) { // 25% chance to trigger per turn
      if (game.playerRoom === "Van") {
        logToGame("[Van Monitor] Motion detected in " + r + "!");
      } 
      else if (game.playerRoom === r) {
        logToGame("You hear the motion sensor *beep* sharply nearby.");
      } 
      else if (
        mapConnections[game.playerRoom]?.includes(r) && Math.random() < 0.4
      ) {
        logToGame("You faintly hear a muffled *beep* through the walls...");
      }
    }
  });

  // ✅ Clamp sanity & check hunts
  game.sanity = Math.max(0, game.sanity);
  updateSanityBar();
  attemptHunt();
}

function attemptHunt() {
  if (game.smudgeActive > 0) { game.smudgeActive--; return; }
  if (game.huntCooldown > 0) { game.huntCooldown--; return; }
  if (game.ghost === "Onryo" &&
      Object.values(game.roomItems).some(a => a.includes("Candle"))) return;
  if (game.sanity < 30 && Math.random() < 0.25) startHunt();
}


/***********************
 === HUNT SYSTEM & VISUALS ===
************************/
function startHunt() {
  logToGame("💀 The ghost is hunting!");
  flashRed();
  logToGame("You hear your heartbeat pounding as the ghost searches...");

  if (game.playerRoom === game.ghostRoom) {
    // ✅ Crucifix defense
    if (game.placedCrucifix && game.placedCrucifix[game.playerRoom] > 0) {
      game.placedCrucifix[game.playerRoom]--;
      if (game.placedCrucifix[game.playerRoom] === 0) {
        delete game.placedCrucifix[game.playerRoom];
        logToGame("The crucifix has burned away completely.");
      } else {
        logToGame(
          "The crucifix burns, stopping the hunt. (" +
          game.placedCrucifix[game.playerRoom] +
          " uses left)"
        );
      }
    } else {
      // ✅ Player death sequence
      setTimeout(playerDeath, 1500);
    }
  } else {
    logToGame("You survived the hunt...");
  }

  // ✅ Hunt cooldown logic based on ghost aggression
  const aggressiveGhosts = ["Demon", "Oni", "Raiju", "Moroi"];
  game.huntCooldown = aggressiveGhosts.includes(game.ghost)
    ? 3 + Math.floor(Math.random() * 2) // faster recovery
    : 5 + Math.floor(Math.random() * 3); // normal cooldown
}

function flashRed() {
  const l = document.getElementById("lightning");

  function pulse() {

    l.style.background = "red";
    l.style.opacity = 0.6 + Math.random() * 0.2; // Slight intensity variation

    setTimeout(() => {
      l.style.opacity = 0;
      count++;
      setTimeout(pulse, 150 + Math.random() * 200); // Random delay = organic feel
    }, 150 + Math.random() * 100);
  }
  pulse();
}

let lightningTimeouts = [];

function randomLightning() {
  const l = document.getElementById("lightning");

  // ✅ Stop if weather isn't supposed to have lightning
  if (game.weather !== "Stormy" && game.weather !== "Blood Moon") {
    stopLightning();
    return;
  }

  // ✅ Clear any existing cycles before starting new ones
  stopLightning();

  function flash() {
    if (game.weather !== "Stormy" && game.weather !== "Blood Moon") {
      stopLightning();
      return;
    }

    l.style.background = game.weather === "Blood Moon" ? "red" : "white";
    l.style.opacity = 0.4 + Math.random() * 0.6;

    setTimeout(() => {
      l.style.opacity = 0;
      lightningTimeouts.push(
        setTimeout(flash, 2500 + Math.random() * 5000)
      );
    }, 100 + Math.random() * 200);
  }

  flash();
}

function stopLightning() {
  lightningTimeouts.forEach(clearTimeout);
  lightningTimeouts = [];
  document.getElementById("lightning").style.opacity = 0;
}



let fogAnimationId = null; // ✅ so we can stop/restart properly

function initFog() {
  const c = document.getElementById("fog-layer"),
        ctx = c.getContext("2d");
  c.width = window.innerWidth;
  c.height = window.innerHeight;

  // ✅ Multi-layer fog, drifting at different speeds & opacities
  const fogs = [];
  for (let i = 0; i < 4; i++) {
    fogs.push({
      x: Math.random() * c.width,
      y: Math.random() * c.height,
      alpha: 0.05 + Math.random() * 0.15, // subtle opacity variation
      speedY: 0.05 + Math.random() * 0.1, // vertical drift
      speedX: 0.02 + Math.random() * 0.05, // slight horizontal drift
      width: c.width * (0.7 + Math.random() * 0.4), // varied size
      height: 200 + Math.random() * 150
    });
  }

  const fogImg = new Image();
  fogImg.src = "fog.png";

  function draw() {
    ctx.clearRect(0, 0, c.width, c.height);

    fogs.forEach(f => {
      ctx.globalAlpha = f.alpha;
      ctx.drawImage(fogImg, f.x, f.y, f.width, f.height);

      // Move fog
      f.y += f.speedY;
      f.x += f.speedX;

      // Wrap-around effect for endless drift
      if (f.y > c.height) f.y = -f.height;
      if (f.x > c.width) f.x = -f.width;
    });

    ctx.globalAlpha = 1;
    fogAnimationId = requestAnimationFrame(draw);
  }

  draw();
}

function initOrbs(){
  const c=document.getElementById("orbCanvas"),x=c.getContext("2d");
  c.width=window.innerWidth; c.height=window.innerHeight;
  let o=[];
  function spawn(){
    if(game.cameraActive && o.length<10){
      const g=(game.ghost==="TheMimic"?game.mimicForm:game.ghost);
      if(ghostProfiles[g].evidence.includes("Orbs") || game.ghost==="TheMimic"){
        o.push({
          x:Math.random()*c.width,
          y:Math.random()*c.height,
          r:Math.random()*3+2,
          alpha:Math.random(),
          fade:Math.random()*0.02+0.005
        });
      }
    }
  }
  function animate(){
    x.clearRect(0,0,c.width,c.height);
    if(game.cameraActive){
      for(let i=0;i<o.length;i++){
        const b=o[i];
        b.alpha+=b.fade;
        if(b.alpha<=0||b.alpha>=1)b.fade*=-1;
        b.y-=0.2;
        x.beginPath();
        x.arc(b.x,b.y,b.r,0,Math.PI*2);
        x.fillStyle="rgba(255,255,255,"+b.alpha+")";
        x.fill();
        if(b.y<-10)o.splice(i,1);
      }
    } else {o=[];}
    requestAnimationFrame(animate);
  }
  setInterval(spawn,2000); animate();
}

/***********************
 === SAVE / LOAD SYSTEM ===
************************/
function saveGame() {
  try {
    const saveData = {
      ghost: game.ghost,
      ghostRoom: game.ghostRoom,
      playerRoom: game.playerRoom,
      playerDirection: game.playerDirection,
      inventory: game.inventory,
      vanStock: game.vanStock,
      selectedEvidence: Array.from(game.selectedEvidence),
      currentTurn: game.currentTurn,
      sanity: game.sanity,
      weather: game.weather,
      mimicForm: game.mimicForm,
      nextMimicShift: game.nextMimicShift,
      cameraActive: game.cameraActive,
      huntCooldown: game.huntCooldown,
      smudgeActive: game.smudgeActive,
      placedCrucifix: game.placedCrucifix,
      roomItems: game.roomItems,
      usedCursedItems: game.usedCursedItems
    };

    localStorage.setItem("phasmaPhoneySave", JSON.stringify(saveData));
    logToGame("💾 Game saved.");
  } catch (e) {
    console.error("Save failed:", e);
    logToGame("⚠️ Save failed. Check browser storage.");
  }
}

function loadGame() {
  const data = localStorage.getItem("phasmaPhoneySave");
  if (!data) {
    logToGame("No save data found.");
    return;
  }

  try {
    const s = JSON.parse(data);
    Object.assign(game, s);

    // ✅ Restore Set object for evidence
    game.selectedEvidence = new Set(s.selectedEvidence);

    // ✅ Ensure defaults if something was missing from old saves
    if (!game.placedCrucifix) game.placedCrucifix = {};
    if (!game.roomItems) game.roomItems = {};
    if (!game.usedCursedItems) game.usedCursedItems = {};

    logToGame("📂 Game loaded. Resuming investigation...");

    // ✅ Show proper UI
    document.getElementById("title-screen").style.display = "none";
    document.getElementById("loadout-screen").style.display = "none";
    document.getElementById("main-scene").style.display = "block";
    document.getElementById("narrator-ui").style.display = "flex";

    // ✅ Refresh HUD, background, and ambient effects
    renderHUD();
    updateBackground();
    bootVisuals();

    // ✅ Re-render command buttons
    renderActionButtons();
  } catch (e) {
    console.error("Load failed:", e);
    logToGame("⚠️ Load failed. Save may be corrupted.");
  }
}

function clearSave() {
  localStorage.removeItem("phasmaPhoneySave");
  logToGame("🗑️ Save data cleared.");
}

"use strict";

let tempHeld = [];
let tempVan = [...allLoadoutItems];

/***********************
 === LOADOUT SELECTION ===
************************/
function showLoadout() {
  // ✅ Always reset temporary arrays to defaults
  tempHeld = [];
  tempVan = [...allLoadoutItems];

  const heldList = document.getElementById("held-list");
  const vanList = document.getElementById("van-list");
  const confirmBtn = document.getElementById("confirm-loadout");

  function renderLoadout() {
    // ✅ Held items display (green highlight)
    heldList.innerHTML = tempHeld
      .map(i => `<button class="item-button selected" onclick="removeHeldItem('${i}')">${i}</button>`)
      .join("");

    // ✅ Van inventory display
    vanList.innerHTML = tempVan
      .map(i => `<button class="item-button" onclick="addHeldItem('${i}')">${i}</button>`)
      .join("");

    // ✅ Confirm button state
    if (tempHeld.length > 0) {
      confirmBtn.classList.add("active");
      confirmBtn.disabled = false;
    } else {
      confirmBtn.classList.remove("active");
      confirmBtn.disabled = true;
    }
  }

  // ✅ Add to held items
  window.addHeldItem = function (item) {
    if (tempHeld.length >= 3) {
      logToGame("⚠️ You can only hold 3 items.");
      return;
    }
    tempHeld.push(item);
    tempVan = tempVan.filter(v => v !== item);
    renderLoadout();
  };

  // ✅ Remove from held items
  window.removeHeldItem = function (item) {
    tempVan.push(item);
    tempHeld = tempHeld.filter(h => h !== item);
    renderLoadout();
  };

  // ✅ Render loadout for the first time
  renderLoadout();
  document.getElementById("loadout-screen").style.display = "flex";
  logToGame("📦 Select up to 3 starting items. Notebook & Lighter are free.");
}

/***********************
 === ACTION BUTTON RENDERING ===
************************/
function renderActionButtons() {
  const cmd = document.getElementById("command-buttons");
  cmd.innerHTML = `
    <button data-cmd="move" onclick="handleCommand('move')">Move</button>
    <button data-cmd="look" onclick="handleCommand('look')">Look Around</button>
    <button data-cmd="inventory" onclick="handleCommand('inventory')">Inventory</button>
    <button data-cmd="guess" onclick="handleCommand('guess')">Ghost Guess</button>
    <button data-cmd="van" onclick="handleCommand('van')">Return to Van</button>
    <button data-cmd="save" onclick="handleCommand('save')">Save Game</button>
    <button data-cmd="load" onclick="handleCommand('load')">Load Game</button>
  `;
  logToGame("✅ Actions ready. Select an option below.");
}

/***********************
 === STARTUP & EVENT WIRING ===
************************/
document.addEventListener("DOMContentLoaded", () => {
  "use strict";
  resetGame(); // ✅ Fresh state on page load

  const startBtn = document.getElementById("startButton");
  const confirmBtn = document.getElementById("confirm-loadout");
  const commandContainer = document.getElementById("command-buttons");

  // === Start New Game ===
  startBtn.addEventListener("click", () => {
    if (startBtn.disabled) return; // ✅ Prevent double-clicks
    startBtn.disabled = true;

    const t = document.getElementById("title-screen");
    t.style.opacity = "0";

    setTimeout(() => {
      t.style.display = "none";
      showLoadout(); // ✅ Open the loadout menu
    }, 1500);
  });

  // === Confirm Loadout & Begin Investigation ===
  confirmBtn.addEventListener("click", () => {
    if (!tempHeld) tempHeld = [];
    if (!tempVan) tempVan = [...allLoadoutItems];

    game.inventory = [...tempHeld, "Notebook", "Lighter"];
    game.vanStock = [...tempVan];

    document.getElementById("loadout-screen").style.display = "none";
    startInvestigation();
    renderActionButtons(); // ✅ Show buttons immediately

    saveGame(); // ✅ Immediate save after starting
    window.dispatchEvent(new Event("resize")); // ✅ HUD adjusts for mobile
  });

  // === Command Button Delegation (Single Listener) ===
  commandContainer.addEventListener("click", (e) => {
    if (e.target.tagName === "BUTTON" && e.target.dataset.cmd) {
      handleCommand(e.target.dataset.cmd);
    }
  });

  // === Auto-Detect Existing Save ===
  if (localStorage.getItem("phasmaPhoneySave")) {
    logToGame("💾 Previous save detected. Use the 'Load Game' button or type loadGame() in console.");
  }
});
</script>
