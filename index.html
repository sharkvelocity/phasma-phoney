<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phasma‑Phoney v2.7 — Narration Master Build</title>
  <style>
    /* === GLOBAL RESET === */
    html, body {
      margin:0;
      padding:0;
      width:100%;
      height:100%;
      background:#000;
      overflow:hidden;
      font-family: monospace;
      color:#eee;
    }

    /* === LOADOUT SCREEN === */
    #loadout-screen {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.9);
      color: #eee;
      font-family: monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    #loadout-container {
      display: flex;
      gap: 40px;
      margin-bottom: 20px;
    }

    .loadout-column {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .loadout-column h3 {
      margin-bottom: 6px;
      color: #0f0;
    }

    .loadout-list {
      background: #111;
      border: 1px solid #555;
      width: 180px;
      min-height: 200px;
      max-height: 250px;
      overflow-y: auto;
      padding: 6px;
    }

    .loadout-list button {
      width: 100%;
      text-align: left;
      background: #222;
      border: 1px solid #444;
      color: #ccc;
      margin-bottom: 4px;
      cursor: pointer;
      font-size: 13px;
    }

    .loadout-list button:hover {
      background: #333;
    }

    #confirm-loadout {
      padding: 6px 14px;
      font-size: 14px;
      background: #222;
      color: #eee;
      border: 1px solid #555;
      cursor: pointer;
    }
    #confirm-loadout:hover {
      background: #444;
    }

    /* === MAIN SCENE === */
    #main-scene {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #000;
      display: none;
      overflow: hidden;
    }

    #background-layer {
      position: absolute;
      top:0; left:0;
      width:100%; height:100%;
      background: url('House.png') center center no-repeat;
      background-size: cover;
      z-index: 0;
    }

    #fog-layer {
      position: absolute;
      top:0; left:0;
      width:100%; height:100%;
      z-index: 2;
      opacity:0.3;
    }

    #orb-layer {
      position: absolute;
      top:0; left:0;
      width:100%; height:100%;
      pointer-events:none;
      z-index: 5;
    }

    #foreground-layer {
      position: absolute;
      top:0; left:0;
      width:100%; height:100%;
      z-index: 3;
    }

    /* === HUD === */
    #hud {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0,0,0,0.4);
      padding: 6px 10px;
      border: 1px solid rgba(255,255,255,0.3);
      color: #eee;
      z-index: 20;
      font-size:14px;
    }

    /* === NARRATOR UI === */
    #narrator-ui {
      position: absolute;
      bottom:0;
      left:0;
      width:100%;
      height:35%;
      background: rgba(0,0,0,0.7);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      z-index: 25;
    }

    #narrator-log {
      flex: 1;
      overflow-y:auto;
      padding: 8px;
      color: #ccc;
      font-family: monospace;
      font-size: 14px;
    }

    #narrator-log p {
      margin: 2px 0;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    #narrator-log p:nth-child(n+15) {
      opacity: 0.3;
    }

    #narrator-buttons {
      display:flex;
      flex-wrap:wrap;
      gap:6px;
      padding:8px;
      border-top:1px solid rgba(255,255,255,0.2);
    }

    #narrator-buttons button {
      background:#222;
      color:#eee;
      border:1px solid #555;
      border-radius:3px;
      padding:5px 10px;
      font-size:14px;
      cursor:pointer;
    }
    #narrator-buttons button:hover {
      background:#444;
    }

    /* === ORBS === */
    .spirit-orb {
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,0.5);
      box-shadow: 0 0 6px 2px rgba(255,255,255,0.7);
      opacity: 0;
      transition: opacity 2s ease, top 5s linear, left 5s linear;
      z-index: 5;
    }

    /* === MOBILE === */
    @media (max-width: 600px) {
      #hud { font-size: 12px; }
      #narrator-log { font-size: 12px; max-height: 35%; }
      #narrator-buttons button { font-size: 11px; padding: 3px 6px; }
    }
  </style>
</head>

<body>
  <!-- === LOADOUT SCREEN === -->

        <button onclick="handleNarratorCommand('move')">Move</button>

        <button onclick="handleNarratorCommand('check-gear')">Check Gear</button>

        <button onclick="handleNarratorCommand('return-van')">Return to Van</button>
      </div>

  </div>

<script>
/* === GAME STATE OBJECT === */
const game = {

  inventory: [],
  vanStock: {

    "Thermometer": true,

    "Smudge Stick": true,
    "Salt": true
  },
  selectedEvidence: {},
  currentTurn: 0,
  sanity: 100,
  huntActive: false,
  smudgeCooldown: 0,

  mimicForm: null,

/* === GHOST PROFILES === */
const ghostProfiles = {
  "Spirit": {

  },

  },

  },

  },
  "Yurei": {
    evidence: ["Freezing Temps", "Orbs", "D.O.T.S"],
    sanityThreshold: "Average",
    huntCooldown: 20,
    speedCategory: "Normal",
    behavior: "Can drop sanity sharply; stuck in room for 5 turns after smudge."
  },
  "Oni": {
    evidence: ["EMF Level 5", "Freezing Temps", "D.O.T.S"],
    sanityThreshold: "Early",
    huntCooldown: 20,
    speedCategory: "Fast-LOS",
    behavior: "More visible, very active."
  },
  "Hantu": {
    evidence: ["Fingerprints", "Freezing Temps", "Orbs"],
    sanityThreshold: "Average",
    huntCooldown: 20,

    behavior: "Faster in cold rooms."
  },
  "Goryo": {

  },

    sanityThreshold: "Average",
    huntCooldown: 20,
    speedCategory: "Normal",
    behavior: "Quieter footsteps during hunts; has sound timer (~30s)."
  },
  "Onryo": {

    behavior: "Can hunt more often if candles are out."
  },
  "The Twins": {

    sanityThreshold: "Average",

  },
  "Raiju": {

    behavior: "Faster near active electronics."
  },
  "Obake": {

    behavior: "Rarely leaves unique fingerprints."
  },
  "The Mimic": {
    evidence: ["Spirit Box", "Fingerprints", "Freezing Temps"],

  },
  "Moroi": {
    evidence: ["Spirit Box", "Ghost Writing", "Freezing Temps"],
    sanityThreshold: "Early",
    huntCooldown: 20,
    speedCategory: "Fast",
    behavior: "Cursed sanity drain; very fast at low sanity."
  },
  "Deogen": {
    evidence: ["Spirit Box", "Ghost Writing", "D.O.T.S"],
    sanityThreshold: "VeryEarly",
    huntCooldown: 20,
    speedCategory: "Slow",
    behavior: "Knows where you are but moves very slowly."
  },
  "Thaye": {
    evidence: ["Ghost Writing", "Orbs", "D.O.T.S"],
    sanityThreshold: "Early",
    huntCooldown: 20,

  },
  "Succubus": {
    evidence: ["Spirit Box", "Fingerprints", "Freezing Temps"],

    huntCooldown: 15,
    speedCategory: "Fast",
    behavior: "Aggressive at low sanity; drains extra sanity when near player."
  }
};

/* === ROOMS MAP === */
const roomsMap = {
  "Van": ["Foyer"],
  "Foyer": ["Van","Living Room","Dining Room"],
  "Living Room": ["Foyer","Kitchen","Garage"],
  "Kitchen": ["Living Room","Dining Room","Basement"],
  "Dining Room": ["Foyer","Kitchen"],
  "Garage": ["Living Room"],
  "Basement": ["Kitchen"],
  "Bathroom": ["Foyer"],
  "Kids Bedroom": ["Foyer"],
  "Master Bedroom": ["Foyer"]
};

/* === GAME INITIALIZATION === */
function initializeGame() {
  // Reset state
  game.currentTurn = 0;
  game.sanity = 100;
  game.huntActive = false;
  game.playerRoom = "Van";

  // Pick random ghost
  const ghosts = Object.keys(ghostProfiles);
  game.ghost = ghosts[Math.floor(Math.random() * ghosts.length)];

  // Pick random ghost room (except Goryo locked)
  const roomKeys = Object.keys(roomsMap).filter(r => r !== "Van");
  game.ghostRoom = roomKeys[Math.floor(Math.random() * roomKeys.length)];
  if (game.ghost === "Goryo") game.ghostRoom = "Garage";

  // Mimic mimicry shift
  if (game.ghost === "The Mimic") {
    game.nextMimicShift = game.currentTurn + (3 + Math.floor(Math.random() * 4));
    mimicShift();
  }

  narratorLog(`You arrive at the location. Ghost chosen. Investigation begins.`);
  narratorLog(`Current location: ${game.playerRoom}`);
  updateHUD();
}

/* === HUD UPDATER === */
function updateHUD() {
  document.getElementById("hud-sanity").textContent = `${game.sanity}%`;
  document.getElementById("hud-turn").textContent = game.currentTurn;
  document.getElementById("hud-location").textContent = game.playerRoom;
  document.getElementById("hud-temp").textContent = 
    game.inventory.includes("Thermometer") 
    ? `${(Math.random() * 10 + 5).toFixed(1)}°C` 
    : "--°C";
}

<script>
/* === TURN SYSTEM & ADVANCEMENT === */
function advanceTurn() {
  game.currentTurn++;

  // Sanity drain baseline
  if (game.sanity > 0) {
    game.sanity -= (Math.random() * 2 + 1); 
    if (game.sanity < 0) game.sanity = 0;
  }

  // Mimic mimicry shift
  if (game.ghost === "The Mimic" && game.currentTurn >= game.nextMimicShift) {
    mimicShift();
    game.nextMimicShift = game.currentTurn + (3 + Math.floor(Math.random() * 4));
  }

  // Ghost room shifting (all except Goryo)
  if (game.ghost !== "Goryo" && Math.random() < 0.2) {
    if (game.ghost === "Yurei" && game.smudgeCooldown > 0) {
      game.smudgeCooldown--;
    } else {
      const rooms = Object.keys(roomsMap).filter(r => r !== "Van");
      game.ghostRoom = rooms[Math.floor(Math.random() * rooms.length)];
    }
  }

  // Hunt trigger
  if (!game.huntActive && Math.random() * 100 < huntChance()) {
    startHunt();
  }

  // Hunt active resolution
  if (game.huntActive) resolveHunt();

  updateHUD();
  ambientNarration();
}

/* === HUNT CHANCE === */
function huntChance() {
  let threshold;
  const profile = ghostProfiles[game.ghost];
  switch (profile.sanityThreshold) {
    case "VeryEarly": threshold = 75; break;
    case "Early": threshold = 50; break;
    case "Average": threshold = 40; break;
    case "Late": threshold = 30; break;
    default: threshold = 40;
  }
  return game.sanity <= threshold ? 30 : 5;
}

/* === START HUNT === */
function startHunt() {
  if (game.huntCooldown > 0) {
    game.huntCooldown--;
    return;
  }
  game.huntActive = true;
  narratorLog("⚠️ The air grows cold... A hunt has begun!");
}

/* === RESOLVE HUNT === */
function resolveHunt() {
  if (!game.huntActive) return;
  if (defendDuringHunt()) return;

  const aggression = getGhostAggression(game.ghost);
  const deathChance = aggression + (100 - game.sanity) * 0.2;
  if (Math.random() * 100 < deathChance) {
    playerDeath();
  } else {
    narratorLog("The ghost stalks you... but you evade it this time.");
    endHunt();
  }
}

/* === END HUNT === */
function endHunt() {
  game.huntActive = false;
  game.huntCooldown = ghostProfiles[game.ghost].huntCooldown;
}

/* === DEFENSE CHECK === */
function defendDuringHunt() {
  // Crucifix defense
  if (game.inventory.includes("Crucifix") && game.playerRoom === game.ghostRoom) {
    narratorLog("✝️ The Crucifix burns and prevents the hunt!");
    game.huntActive = false;
    return true;
  }
  return false;
}

/* === GHOST AGGRESSION FACTOR === */
function getGhostAggression(ghost) {
  switch (ghost) {
    case "Demon": return 60;
    case "Moroi": return 50;
    case "Thaye": return game.currentTurn < 15 ? 40 : 20;
    case "Succubus": return 55;
    case "The Mimic":
      if (game.mimicForm) return getGhostAggression(game.mimicForm);
      return 30;
    default: return 30;
  }
}

/* === PLAYER DEATH === */
function playerDeath() {
  game.huntActive = false;
  narratorLog("💀 The ghost catches you! Your vision fades to black...");
  setTimeout(() => {
    narratorLog(`GAME OVER — The ghost was a ${game.ghost}.`);
    const btnContainer = document.getElementById("narrator-buttons");
    btnContainer.innerHTML = `<button onclick="restartGame()">Start New Game</button>`;
  }, 2000);
}

/* === AMBIENT NARRATION === */
function ambientNarration() {
  if (Math.random() < 0.2) {
    const hints = [
      "You hear faint footsteps nearby.",
      "A distant creak echoes through the halls.",
      "The temperature seems to drop suddenly.",
      "Your breath fogs slightly as you exhale.",
      "You feel like you're being watched..."
    ];
    narratorLog(hints[Math.floor(Math.random() * hints.length)]);
  }
}

/* === ITEM USE === */
function useItem(item) {
  if (!game.inventory.includes(item)) {
    narratorLog(`You aren't carrying a ${item}.`);
    return;
  }
  switch (item) {
    case "Smudge Stick":
      if (game.playerRoom === game.ghostRoom) {
        narratorLog("🔥 You smudge the ghost's room. It retreats!");
        game.smudgeCooldown = game.ghost === "Yurei" ? 5 : 3;
        game.huntActive = false;
        const index = game.inventory.indexOf("Smudge Stick");
        game.inventory.splice(index, 1);
      } else {
        narratorLog("You smudge, but nothing happens here.");
      }
      break;
    case "Camera":
      if (game.playerRoom === game.ghostRoom && (game.ghost === "The Mimic" || ghostProfiles[game.ghost].evidence.includes("Orbs"))) {
        narratorLog("📷 You see ghost orbs through the camera!");
      } else {
        narratorLog("📷 No orbs detected in this room.");
      }
      break;
    default:
      narratorLog(`You use the ${item}, but nothing significant happens.`);
  }
  updateHUD();
}

/* === MIMIC SHIFT === */
function mimicShift() {
  const otherGhosts = Object.keys(ghostProfiles).filter(g => g !== "The Mimic");
  game.mimicForm = otherGhosts[Math.floor(Math.random() * otherGhosts.length)];
  narratorLog(`The Mimic alters its behavior... now imitating a ${game.mimicForm}.`);
}

/* === MOVEMENT === */
function moveTo(room) {
  if (!roomsMap[game.playerRoom].includes(room)) {
    narratorLog("You can't move there directly.");
    return;
  }
  game.playerRoom = room;
  narratorLog(`You move to the ${room}.`);
  advanceTurn();
}

/* === NARRATOR LOG APPEND === */
function narratorLog(message) {
  const log = document.getElementById("narrator-log");
  const p = document.createElement("p");
  p.textContent = message;
  log.appendChild(p);
  log.scrollTop = log.scrollHeight;
}

/* === RESTART === */
function restartGame() {
  // Reset everything
  game.inventory = [];
  game.vanStock = {
    "EMF Reader": true,
    "Spirit Box": true,
    "Camera": true,
    "UV Light": true,
    "D.O.T.S Projector": true,
    "Thermometer": true,
    "Crucifix": true,
    "Smudge Stick": true,
    "Salt": true
  };
  document.getElementById("main-scene").style.display = "none";
  document.getElementById("loadout-screen").style.display = "flex";
  populateLoadout();
}
</script>

<script>
/* === NARRATOR BUTTON HANDLER === */
function handleNarratorCommand(cmd) {
  switch (cmd) {
    case "move":
      openMoveMenu();
      break;
    case "use-item":
      openUseItemMenu();
      break;
    case "check-gear":
      narratorLog(`Current gear: ${game.inventory.join(", ") || "None"}.`);
      break;
    case "guess-ghost":
      openGhostGuess();
      break;
    case "return-van":
      if (game.playerRoom !== "Van") {
        game.playerRoom = "Van";
        narratorLog("You return to the van to check gear.");
        advanceTurn();
      } else {
        openVanSwapMenu();
      }
      break;
  }
}

/* === MOVE MENU === */
function openMoveMenu() {
  const buttons = document.getElementById("narrator-buttons");
  buttons.innerHTML = "";
  roomsMap[game.playerRoom].forEach(room => {
    const btn = document.createElement("button");
    btn.textContent = `Go to ${room}`;
    btn.onclick = () => {
      moveTo(room);
      renderActionButtons();
    };
    buttons.appendChild(btn);
  });
  const backBtn = document.createElement("button");
  backBtn.textContent = "Cancel";
  backBtn.onclick = renderActionButtons;
  buttons.appendChild(backBtn);
}

/* === ITEM MENU === */
function openUseItemMenu() {
  const buttons = document.getElementById("narrator-buttons");
  buttons.innerHTML = "";
  if (game.inventory.length === 0) {
    narratorLog("You have no items to use.");
    renderActionButtons();
    return;
  }
  game.inventory.forEach(item => {
    const btn = document.createElement("button");
    btn.textContent = `Use ${item}`;
    btn.onclick = () => {
      useItem(item);
      renderActionButtons();
    };
    buttons.appendChild(btn);
  });
  const backBtn = document.createElement("button");
  backBtn.textContent = "Cancel";
  backBtn.onclick = renderActionButtons;
  buttons.appendChild(backBtn);
}

/* === GHOST GUESS MENU === */
function openGhostGuess() {
  const buttons = document.getElementById("narrator-buttons");
  buttons.innerHTML = "";
  Object.keys(ghostProfiles).forEach(g => {
    const btn = document.createElement("button");
    btn.textContent = g;
    btn.onclick = () => {
      narratorLog(`You guess the ghost is a ${g}...`);
      endGameGuess(g);
    };
    buttons.appendChild(btn);
  });
  const backBtn = document.createElement("button");
  backBtn.textContent = "Cancel";
  backBtn.onclick = renderActionButtons;
  buttons.appendChild(backBtn);
}

/* === END GAME GUESS === */
function endGameGuess(guess) {
  if (guess === game.ghost) {
    narratorLog(`✅ Correct! The ghost was indeed a ${game.ghost}.`);
  } else {
    narratorLog(`❌ Wrong. The ghost was actually a ${game.ghost}.`);
  }
  const buttons = document.getElementById("narrator-buttons");
  buttons.innerHTML = `<button onclick="restartGame()">Start New Game</button>`;
}

/* === VAN SWAP MENU === */
function openVanSwapMenu() {
  const buttons = document.getElementById("narrator-buttons");
  buttons.innerHTML = "";
  Object.keys(game.vanStock).forEach(item => {
    if (game.vanStock[item]) {
      const btn = document.createElement("button");
      btn.textContent = `Take ${item}`;
      btn.onclick = () => {
        if (game.inventory.length < 3) {
          game.inventory.push(item);
          game.vanStock[item] = false;
          narratorLog(`You take the ${item}.`);
        } else {
          narratorLog("You can only hold 3 items at once.");
        }
        openVanSwapMenu();
      };
      buttons.appendChild(btn);
    }
  });
  game.inventory.forEach(item => {
    const btn = document.createElement("button");
    btn.textContent = `Leave ${item}`;
    btn.onclick = () => {
      const idx = game.inventory.indexOf(item);
      if (idx !== -1) {
        game.inventory.splice(idx,1);
        game.vanStock[item] = true;
        narratorLog(`You leave the ${item} in the van.`);
      }
      openVanSwapMenu();
    };
    buttons.appendChild(btn);
  });
  const backBtn = document.createElement("button");
  backBtn.textContent = "Done";
  backBtn.onclick = renderActionButtons;
  buttons.appendChild(backBtn);
}

/* === RENDER ACTION BUTTONS === */
function renderActionButtons() {
  const buttons = document.getElementById("narrator-buttons");
  buttons.innerHTML = `
    <button onclick="handleNarratorCommand('move')">Move</button>
    <button onclick="handleNarratorCommand('use-item')">Use Item</button>
    <button onclick="handleNarratorCommand('check-gear')">Check Gear</button>
    <button onclick="handleNarratorCommand('guess-ghost')">Guess Ghost</button>
    <button onclick="handleNarratorCommand('return-van')">${game.playerRoom==="Van"?"Check Gear":"Return to Van"}</button>
  `;
}

/* === LOADOUT SYSTEM === */
function populateLoadout() {
  const held = document.getElementById("held-items");
  const van = document.getElementById("van-items");
  held.innerHTML = "";
  van.innerHTML = "";

  Object.keys(game.vanStock).forEach(item => {
    if (game.vanStock[item]) {
      const btn = document.createElement("button");
      btn.textContent = item;
      btn.onclick = () => {
        if (game.inventory.length < 3) {
          game.inventory.push(item);
          game.vanStock[item] = false;
          populateLoadout();
        } else {
          alert("You can only hold 3 items.");
        }
      };
      van.appendChild(btn);
    }
  });

  game.inventory.forEach(item => {
    const btn = document.createElement("button");
    btn.textContent = item;
    btn.onclick = () => {
      const idx = game.inventory.indexOf(item);
      if (idx !== -1) {
        game.inventory.splice(idx,1);
        game.vanStock[item] = true;
        populateLoadout();
      }
    };
    held.appendChild(btn);
  });
}

/* === CONFIRM LOADOUT === */
function confirmLoadout() {
  document.getElementById("loadout-screen").style.display = "none";
  document.getElementById("main-scene").style.display = "block";
  initializeGame();
  renderActionButtons();
}

/* === AMBIENT FOG === */
const fogLayer = document.getElementById("fog-layer");
function animateFog() {
  fogLayer.style.background = `radial-gradient(circle at ${Math.random()*100}% ${Math.random()*100}%, rgba(200,200,200,0.05), transparent 60%)`;
}
setInterval(animateFog,2000);

/* === LIGHTNING EFFECTS === */
function lightningFlash() {
  const foreground = document.getElementById("foreground-layer");
  foreground.style.background = "rgba(255,255,255,0.7)";
  setTimeout(()=>foreground.style.background="transparent",100 + Math.random()*200);
}
setInterval(()=>{
  if(Math.random()<0.1 && document.getElementById("main-scene").style.display==="block"){
    lightningFlash();
  }
},5000);

/* === AUTO-START LOADOUT ON PAGE LOAD === */
document.addEventListener("DOMContentLoaded", () => {
  document.getElementById("loadout-screen").style.display = "flex";
  populateLoadout();
});
</script>
</body>
</html>
