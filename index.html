<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phasma‑Phoney v2.7 — Narration Master Build</title>
  <style>
    /* === GLOBAL RESET === */
    html, body {
      margin:0;
      padding:0;
      width:100%;
      height:100%;
      background:#000;
      overflow:hidden;
      font-family: monospace;
      color:#eee;
    }

    /* === LOADOUT SCREEN === */
    #loadout-screen {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.9);
      color: #eee;
      font-family: monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    #loadout-container {
      display: flex;
      gap: 40px;
      margin-bottom: 20px;
    }

    .loadout-column {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .loadout-column h3 {
      margin-bottom: 6px;
      color: #0f0;
    }

    .loadout-list {
      background: #111;
      border: 1px solid #555;
      width: 180px;
      min-height: 200px;
      max-height: 250px;
      overflow-y: auto;
      padding: 6px;
    }

    .loadout-list button {
      width: 100%;
      text-align: left;
      background: #222;
      border: 1px solid #444;
      color: #ccc;
      margin-bottom: 4px;
      cursor: pointer;
      font-size: 13px;
    }

    .loadout-list button:hover {
      background: #333;
    }

    #confirm-loadout {
      padding: 6px 14px;
      font-size: 14px;
      background: #222;
      color: #eee;
      border: 1px solid #555;
      cursor: pointer;
    }
    #confirm-loadout:hover {
      background: #444;
    }

    /* === MAIN SCENE === */
    #main-scene {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #000;
      display: none;
      overflow: hidden;
    }

    #background-layer {
      position: absolute;
      top:0; left:0;
      width:100%; height:100%;
      background: url('House.png') center center no-repeat;
      background-size: cover;
      z-index: 0;
    }

    #fog-layer {
      position: absolute;
      top:0; left:0;
      width:100%; height:100%;
      z-index: 2;
      opacity:0.3;
    }

    #foreground-layer {
      position: absolute;
      top:0; left:0;
      width:100%; height:100%;
      z-index: 3;
    }

    /* === HUD === */
    #hud {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0,0,0,0.4);
      padding: 6px 10px;
      border: 1px solid rgba(255,255,255,0.3);
      color: #eee;
      z-index: 20;
      font-size:14px;
    }

    /* === NARRATOR UI === */
    #narrator-ui {
      position: absolute;
      bottom:0;
      left:0;
      width:100%;
      height:35%;
      background: rgba(0,0,0,0.7);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      z-index: 25;
    }

    #narrator-log {
      flex: 1;
      overflow-y:auto;
      padding: 8px;
      color: #ccc;
      font-family: monospace;
      font-size: 14px;
    }

    #narrator-log p {
      margin: 2px 0;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    #narrator-log p:nth-child(n+15) {
      opacity: 0.3;
    }

    #narrator-buttons {
      display:flex;
      flex-wrap:wrap;
      gap:6px;
      padding:8px;
      border-top:1px solid rgba(255,255,255,0.2);
    }

    #narrator-buttons button {
      background:#222;
      color:#eee;
      border:1px solid #555;
      border-radius:3px;
      padding:5px 10px;
      font-size:14px;
      cursor:pointer;
    }
    #narrator-buttons button:hover {
      background:#444;
    }

    /* === MOBILE === */
    @media (max-width: 600px) {
      #hud { font-size: 12px; }
      #narrator-log { font-size: 12px; max-height: 35%; }
      #narrator-buttons button { font-size: 11px; padding: 3px 6px; }
    }
  </style>
</head>

<body>
  <!-- === LOADOUT SCREEN === -->
  <div id="loadout-screen">
    <h2>Select Your Starting Gear (Max 3)</h2>
    <div id="loadout-container">
      <div class="loadout-column">
        <h3>Holding:</h3>
        <div id="held-items" class="loadout-list"></div>
      </div>
      <div class="loadout-column">
        <h3>Van Inventory:</h3>
        <div id="van-items" class="loadout-list"></div>
      </div>
    </div>
    <button id="confirm-loadout" onclick="confirmLoadout()">Start Investigation</button>
  </div>

  <!-- === MAIN SCENE === -->
  <div id="main-scene">
    <div id="background-layer"></div>
    <div id="fog-layer"></div>
    <div id="foreground-layer"></div>

    <div id="hud">
      <div>Sanity: <span id="hud-sanity">100%</span></div>
      <div>Turn: <span id="hud-turn">0</span></div>
      <div>Location: <span id="hud-location">Van</span></div>
      <div>Temp: <span id="hud-temp">--°C</span></div>
    </div>

    <div id="narrator-ui">
      <div id="narrator-log"></div>
      <div id="narrator-buttons">
        <button onclick="handleNarratorCommand('move')">Move</button>
        <button onclick="handleNarratorCommand('use-item')">Use Item</button>
        <button onclick="handleNarratorCommand('check-gear')">Check Gear</button>
        <button onclick="handleNarratorCommand('guess-ghost')">Guess Ghost</button>
        <button onclick="handleNarratorCommand('return-van')">Return to Van</button>
      </div>
    </div>
  </div>

<script>
/* === GAME STATE === */
const game = {
  ghost: null,
  ghostRoom: null,
  playerRoom: "Van",
  inventory: [],
  vanStock: {
    "EMF Reader": true,
    "Spirit Box": true,
    "Camera": true,
    "UV Light": true,
    "D.O.T.S Projector": true,
    "Thermometer": true,
    "Crucifix": true,
    "Smudge Stick": true,
    "Salt": true
  },
  selectedEvidence: {},
  currentTurn: 0,
  sanity: 100,
  weather: "Clear", // updated in initializeGame
  huntActive: false,
  smudgeCooldown: 0,
  huntCooldown: 0,
  mimicForm: null,
  nextMimicShift: 0
};

/* === POPULATE LOADOUT === */
function populateLoadout() {
  const held = document.getElementById("held-items");
  const van = document.getElementById("van-items");
  held.innerHTML = "";
  van.innerHTML = "";

  Object.keys(game.vanStock).forEach(item => {
    if (game.vanStock[item]) {
      const btn = document.createElement("button");
      btn.textContent = item;
      btn.onclick = () => {
        if (game.inventory.length < 3) {
          game.inventory.push(item);
          game.vanStock[item] = false;
          populateLoadout();
        } else {
          alert("You can only hold 3 items.");
        }
      };
      van.appendChild(btn);
    }
  });

  game.inventory.forEach(item => {
    const btn = document.createElement("button");
    btn.textContent = item;
    btn.onclick = () => {
      const idx = game.inventory.indexOf(item);
      if (idx !== -1) {
        game.inventory.splice(idx,1);
        game.vanStock[item] = true;
        populateLoadout();
      }
    };
    held.appendChild(btn);
  });
}

/* === CONFIRM LOADOUT === */
function confirmLoadout() {
  if (game.inventory.length === 0) {
    alert("Select at least one item before starting!");
    return;
  }
  document.getElementById("loadout-screen").style.display = "none";
  document.getElementById("main-scene").style.display = "block";
  initializeGame();
  renderActionButtons();
}

/* === INITIALIZE GAME === */
function initializeGame() {
  game.currentTurn = 0;
  game.sanity = 100;
  game.playerRoom = "Van";

  const possibleWeather = ["Clear", "Rain", "Blood Moon"];
  game.weather = possibleWeather[Math.floor(Math.random()*possibleWeather.length)];

  const ghosts = Object.keys(ghostProfiles);
  game.ghost = ghosts[Math.floor(Math.random() * ghosts.length)];

  const roomKeys = Object.keys(roomsMap).filter(r => r !== "Van");
  game.ghostRoom = roomKeys[Math.floor(Math.random() * roomKeys.length)];
  if (game.ghost === "Goryo") game.ghostRoom = "Garage";

  narratorLog(`You arrive at the location. Weather: ${game.weather}. Investigation begins.`);
  narratorLog(`Current location: ${game.playerRoom}`);
  updateHUD();
}

/* === HUD UPDATE === */
function updateHUD() {
  document.getElementById("hud-sanity").textContent = `${game.sanity}%`;
  document.getElementById("hud-turn").textContent = game.currentTurn;
  document.getElementById("hud-location").textContent = game.playerRoom;
  document.getElementById("hud-temp").textContent = 
    game.inventory.includes("Thermometer") 
      ? `${(Math.random() * 10 + 5).toFixed(1)}°C` 
      : "--°C";
}

/* === STARTUP ON PAGE LOAD === */
document.addEventListener("DOMContentLoaded", () => {
  document.getElementById("loadout-screen").style.display = "flex";
  document.getElementById("main-scene").style.display = "none";
  populateLoadout();
});
</script>

<script>

  },

  },
  "Deogen": {

    behavior: "Knows where you are but moves very slowly."
  },
  "Thaye": {
    evidence: ["Ghost Writing", "Orbs", "D.O.T.S Projector"],
    sanityThreshold: "Early",
    huntCooldown: 20,
    speedCategory: "Fast",
    behavior: "Very active early; weakens over time."
  },
  "Succubus": {
    evidence: ["Spirit Box", "Fingerprints", "Freezing Temps"],
    sanityThreshold: "VeryEarly",
    huntCooldown: 15,
    speedCategory: "Fast",
    behavior: "Aggressive at low sanity; drains extra sanity when near player."
  }
};

/* === ROOMS MAP === */
const roomsMap = {
  "Van": ["Foyer"],
  "Foyer": ["Van","Living Room","Dining Room","Bathroom","Kids Bedroom","Master Bedroom"],
  "Living Room": ["Foyer","Kitchen","Garage"],
  "Kitchen": ["Living Room","Dining Room","Basement"],
  "Dining Room": ["Foyer","Kitchen"],
  "Garage": ["Living Room"],
  "Basement": ["Kitchen"],
  "Bathroom": ["Foyer"],
  "Kids Bedroom": ["Foyer"],
  "Master Bedroom": ["Foyer"]
};

/* === TURN SYSTEM & ADVANCEMENT === */
function advanceTurn() {
  game.currentTurn++;

  // Sanity drain baseline
  if (game.sanity > 0) {
    game.sanity -= (Math.random() * 2 + 1);
    if (game.sanity < 0) game.sanity = 0;
  }

  // Mimic mimicry shift
  if (game.ghost === "The Mimic" && game.currentTurn >= game.nextMimicShift) {
    mimicShift();
    game.nextMimicShift = game.currentTurn + (3 + Math.floor(Math.random() * 4));
  }

  // Ghost room shifting (all except Goryo)
  if (game.ghost !== "Goryo" && Math.random() < 0.2) {
    if (game.ghost === "Yurei" && game.smudgeCooldown > 0) {
      game.smudgeCooldown--;
    } else {
      const rooms = Object.keys(roomsMap).filter(r => r !== "Van");
      game.ghostRoom = rooms[Math.floor(Math.random() * rooms.length)];
    }
  }

  // Hunt trigger
  if (!game.huntActive && Math.random() * 100 < huntChance()) {
    startHunt();
  }

  if (game.huntActive) resolveHunt();

  updateHUD();
  ambientNarration();
}

/* === HUNT CHANCE === */
function huntChance() {
  let threshold;
  const profile = ghostProfiles[game.ghost];
  switch (profile.sanityThreshold) {
    case "VeryEarly": threshold = 75; break;
    case "Early": threshold = 50; break;
    case "Average": threshold = 40; break;
    case "Late": threshold = 30; break;
    default: threshold = 40;
  }
  return game.sanity <= threshold ? 30 : 5;
}

/* === START HUNT === */
function startHunt() {
  if (game.huntCooldown > 0) {
    game.huntCooldown--;
    return;
  }
  game.huntActive = true;
  narratorLog("⚠️ The air grows cold... A hunt has begun!");
}

/* === RESOLVE HUNT === */
function resolveHunt() {
  if (!game.huntActive) return;
  if (defendDuringHunt()) return;

  const aggression = getGhostAggression(game.ghost);
  const deathChance = aggression + (100 - game.sanity) * 0.2;
  if (Math.random() * 100 < deathChance) {
    playerDeath();
  } else {
    narratorLog("The ghost stalks you... but you evade it this time.");
    endHunt();
  }
}

/* === END HUNT === */
function endHunt() {
  game.huntActive = false;
  game.huntCooldown = ghostProfiles[game.ghost].huntCooldown;
}

/* === DEFENSE CHECK === */
function defendDuringHunt() {
  if (game.inventory.includes("Crucifix") && game.playerRoom === game.ghostRoom) {
    narratorLog("✝️ The Crucifix burns and prevents the hunt!");
    game.huntActive = false;
    return true;
  }
  return false;
}

/* === GHOST AGGRESSION FACTOR === */
function getGhostAggression(ghost) {
  switch (ghost) {
    case "Demon": return 60;
    case "Moroi": return 50;
    case "Thaye": return game.currentTurn < 15 ? 40 : 20;
    case "Succubus": return 55;
    case "The Mimic":
      if (game.mimicForm) return getGhostAggression(game.mimicForm);
      return 30;
    default: return 30;
  }
}

/* === PLAYER DEATH === */
function playerDeath() {
  game.huntActive = false;
  narratorLog("💀 The ghost catches you! Your vision fades to black...");
  setTimeout(() => {
    narratorLog(`GAME OVER — The ghost was a ${game.ghost}.`);
    const btnContainer = document.getElementById("narrator-buttons");
    btnContainer.innerHTML = `<button onclick="restartGame()">Start New Game</button>`;
  }, 2000);
}

/* === MIMIC SHIFT === */
function mimicShift() {
  const otherGhosts = Object.keys(ghostProfiles).filter(g => g !== "The Mimic");
  game.mimicForm = otherGhosts[Math.floor(Math.random() * otherGhosts.length)];
  narratorLog(`The Mimic alters its behavior... now imitating a ${game.mimicForm}.`);
}

/* === CAMERA ORB CHECK === */
function useItem(item) {
  if (!game.inventory.includes(item)) {
    narratorLog(`You aren't carrying a ${item}.`);
    return;
  }
  switch (item) {
    case "Smudge Stick":
      if (game.playerRoom === game.ghostRoom) {
        narratorLog("🔥 You smudge the ghost's room. It retreats!");
        game.smudgeCooldown = game.ghost === "Yurei" ? 5 : 3;
        game.huntActive = false;
        const index = game.inventory.indexOf("Smudge Stick");
        game.inventory.splice(index, 1);
      } else {
        narratorLog("You smudge, but nothing happens here.");
      }
      break;
    case "Camera":
      if (game.playerRoom === game.ghostRoom &&
          (game.ghost === "The Mimic" || ghostProfiles[game.ghost].evidence.includes("Orbs"))) {
        narratorLog("📷 You see ghost orbs through the camera!");
      } else {
        narratorLog("📷 No orbs detected in this room.");
      }
      break;
    default:
      narratorLog(`You use the ${item}, but nothing significant happens.`);
  }
  updateHUD();
}
</script>

<script>
/* === MOVEMENT LOGIC === */
function moveTo(room) {
  if (!roomsMap[game.playerRoom].includes(room)) {
    narratorLog("You can't move there directly.");
    return;
  }
  game.playerRoom = room;
  narratorLog(`You move to the ${room}.`);
  advanceTurn();
}

/* === NARRATOR LOG APPEND === */
function narratorLog(message) {
  const log = document.getElementById("narrator-log");
  const p = document.createElement("p");
  p.textContent = message;
  log.appendChild(p);
  log.scrollTop = log.scrollHeight;
}

/* === RESTART GAME === */
function restartGame() {
  game.inventory = [];
  game.vanStock = {
    "EMF Reader": true,
    "Spirit Box": true,
    "Camera": true,
    "UV Light": true,
    "D.O.T.S Projector": true,
    "Thermometer": true,
    "Crucifix": true,
    "Smudge Stick": true,
    "Salt": true
  };
  document.getElementById("main-scene").style.display = "none";
  document.getElementById("loadout-screen").style.display = "flex";
  populateLoadout();
}

/* === NARRATOR BUTTON HANDLER === */
function handleNarratorCommand(cmd) {
  switch (cmd) {
    case "move":
      openMoveMenu();
      break;
    case "use-item":
      openUseItemMenu();
      break;
    case "check-gear":
      narratorLog(`Current gear: ${game.inventory.join(", ") || "None"}.`);
      break;
    case "guess-ghost":
      openGhostGuess();
      break;
    case "return-van":
      if (game.playerRoom !== "Van") {
        game.playerRoom = "Van";
        narratorLog("You return to the van to check gear.");
        advanceTurn();
      } else {
        openVanSwapMenu();
      }
      break;
  }
}

/* === MOVE MENU === */
function openMoveMenu() {
  const buttons = document.getElementById("narrator-buttons");
  buttons.innerHTML = "";
  roomsMap[game.playerRoom].forEach(room => {
    const btn = document.createElement("button");
    btn.textContent = `Go to ${room}`;
    btn.onclick = () => {
      moveTo(room);
      renderActionButtons();
    };
    buttons.appendChild(btn);
  });
  const backBtn = document.createElement("button");
  backBtn.textContent = "Cancel";
  backBtn.onclick = renderActionButtons;
  buttons.appendChild(backBtn);
}

/* === ITEM MENU === */
function openUseItemMenu() {
  const buttons = document.getElementById("narrator-buttons");
  buttons.innerHTML = "";
  if (game.inventory.length === 0) {
    narratorLog("You have no items to use.");
    renderActionButtons();
    return;
  }
  game.inventory.forEach(item => {
    const btn = document.createElement("button");
    btn.textContent = `Use ${item}`;
    btn.onclick = () => {
      useItem(item);
      renderActionButtons();
    };
    buttons.appendChild(btn);
  });
  const backBtn = document.createElement("button");
  backBtn.textContent = "Cancel";

/* === INITIALIZE GAME === */
function initializeGame() {
  // Reset state
  game.currentTurn = 0;
  game.sanity = 100;
  game.huntActive = false;
  game.playerRoom = "Van";

  // Pick random ghost
  const ghosts = Object.keys(ghostProfiles);

/* === HUD UPDATER === */

/* === WEATHER SYSTEM === */
let currentWeather = "clear"; // "clear", "rain", "blood-moon"

function determineWeather() {
  const roll = Math.random();
  if (roll < 0.15) {
    currentWeather = "blood-moon";
    narratorLog("🌕 A blood moon casts an eerie red glow over the house...");
  } else if (roll < 0.45) {
    currentWeather = "rain";
    narratorLog("🌧️ Rain patters against the windows outside...");
    startRainEffects();
  } else {
    currentWeather = "clear";
    narratorLog("The night is quiet, the air still.");
  }
  startWeatherLightning();
}

/* === LIGHTNING EFFECTS — Only for Rain or Blood Moon === */
function startWeatherLightning() {
  const foreground = document.getElementById("foreground-layer");
  setInterval(() => {
    if (document.getElementById("main-scene").style.display !== "block") return;
    if (currentWeather === "rain" || currentWeather === "blood-moon") {
      if (Math.random() < 0.15) {
        foreground.style.background =
          currentWeather === "blood-moon"
            ? "rgba(255,0,0,0.4)"
            : "rgba(255,255,255,0.6)";
        setTimeout(() => (foreground.style.background = "transparent"), 100 + Math.random() * 200);
      }
    }
  }, 5000);
}

/* === RAIN EFFECTS (SIMPLE TEXTURE MOVEMENT) === */
let rainCanvas;
function startRainEffects() {
  if (!rainCanvas) {
    rainCanvas = document.createElement("canvas");
    rainCanvas.id = "rain-layer";
    rainCanvas.style.position = "absolute";
    rainCanvas.style.top = 0;
    rainCanvas.style.left = 0;
    rainCanvas.style.width = "100%";
    rainCanvas.style.height = "100%";
    rainCanvas.style.zIndex = 1;
    document.getElementById("main-scene").appendChild(rainCanvas);
  }
  const ctx = rainCanvas.getContext("2d");
  const drops = [];
  for (let i = 0; i < 120; i++) {
    drops.push({
      x: Math.random() * rainCanvas.width,
      y: Math.random() * rainCanvas.height,
      len: Math.random() * 15 + 5,
      speed: Math.random() * 2 + 2,
    });
  }
  function animateRain() {
    ctx.clearRect(0, 0, rainCanvas.width, rainCanvas.height);
    ctx.strokeStyle = "rgba(200,200,255,0.6)";
    ctx.lineWidth = 1;
    drops.forEach(d => {
      ctx.beginPath();
      ctx.moveTo(d.x, d.y);
      ctx.lineTo(d.x, d.y + d.len);
      ctx.stroke();
      d.y += d.speed;
      if (d.y > rainCanvas.height) {
        d.y = -10;
        d.x = Math.random() * rainCanvas.width;
      }
    });
    if (currentWeather === "rain" && document.getElementById("main-scene").style.display === "block") {
      requestAnimationFrame(animateRain);
    }
  }
  rainCanvas.width = window.innerWidth;
  rainCanvas.height = window.innerHeight;
  animateRain();
}

  fogLayer.style.background = `radial-gradient(circle at ${Math.random() * 100}% ${Math.random() * 100}%, rgba(200,200,200,0.05), transparent 60%)`;

  document.getElementById("loadout-screen").style.display = "flex";
  populateLoadout();
});

<script>
/* === ADVANCE TURN SYSTEM === */
function advanceTurn() {
  game.currentTurn++;

  // Baseline sanity drain
  if (game.sanity > 0) {
    game.sanity -= (Math.random() * 2 + 1);
    if (game.sanity < 0) game.sanity = 0;
  }

  // Mimic behavior shifts every 3–6 turns
  if (game.ghost === "The Mimic" && game.currentTurn >= game.nextMimicShift) {
    mimicShift();
    game.nextMimicShift = game.currentTurn + (3 + Math.floor(Math.random() * 4));
  }

  // Ghost room shifting (except Goryo & Yurei with smudge cooldown)
  if (game.ghost !== "Goryo" && Math.random() < 0.2) {
    if (game.ghost === "Yurei" && game.smudgeCooldown > 0) {
      game.smudgeCooldown--;
    } else {
      const rooms = Object.keys(roomsMap).filter(r => r !== "Van");
      game.ghostRoom = rooms[Math.floor(Math.random() * rooms.length)];
    }
  }

  // Hunt trigger logic
  if (!game.huntActive && Math.random() * 100 < huntChance()) {
    startHunt();
  }

  // Hunt resolution if active
  if (game.huntActive) resolveHunt();

  updateHUD();
  ambientNarration();
}

/* === HUNT CHANCE BASED ON SANITY === */
function huntChance() {
  const profile = ghostProfiles[game.ghost];
  let threshold;
  switch (profile.sanityThreshold) {
    case "VeryEarly": threshold = 75; break;
    case "Early": threshold = 50; break;
    case "Average": threshold = 40; break;
    case "Late": threshold = 30; break;
    default: threshold = 40;
  }
  return game.sanity <= threshold ? 30 : 5;
}

/* === START HUNT === */
function startHunt() {
  if (game.huntCooldown > 0) {
    game.huntCooldown--;
    return;
  }
  game.huntActive = true;
  narratorLog("⚠️ The air grows icy... A hunt has begun!");
}

/* === RESOLVE HUNT === */
function resolveHunt() {
  if (!game.huntActive) return;
  if (defendDuringHunt()) return;

  const aggression = getGhostAggression(game.ghost);
  const deathChance = aggression + (100 - game.sanity) * 0.2;
  if (Math.random() * 100 < deathChance) {
    playerDeath();
  } else {
    narratorLog("The ghost prowls nearby, but you manage to evade it.");
    endHunt();
  }
}

/* === END HUNT === */
function endHunt() {
  game.huntActive = false;
  game.huntCooldown = ghostProfiles[game.ghost].huntCooldown;
}

/* === DEFENSE DURING HUNT === */
function defendDuringHunt() {
  if (game.inventory.includes("Crucifix") && game.playerRoom === game.ghostRoom) {
    narratorLog("✝️ Your Crucifix burns, stopping the hunt!");
    game.huntActive = false;
    return true;
  }
  return false;
}

/* === GHOST AGGRESSION FACTOR === */
function getGhostAggression(ghost) {
  switch (ghost) {
    case "Demon": return 60;
    case "Moroi": return 50;
    case "Succubus": return 55;
    case "Thaye": return game.currentTurn < 15 ? 40 : 20;
    case "The Mimic": return game.mimicForm ? getGhostAggression(game.mimicForm) : 30;
    default: return 30;
  }
}

/* === PLAYER DEATH === */
function playerDeath() {
  game.huntActive = false;
  narratorLog("💀 The ghost catches you... Darkness closes in.");
  setTimeout(() => {
    narratorLog(`GAME OVER — The ghost was a ${game.ghost}.`);
    const btnContainer = document.getElementById("narrator-buttons");
    btnContainer.innerHTML = `<button onclick="restartGame()">Start New Game</button>`;
  }, 2000);
}

/* === AMBIENT NARRATION (RANDOM EVENTS) === */
function ambientNarration() {
  if (Math.random() < 0.2) {
    const hints = [
      "You hear faint footsteps in the distance.",
      "A cold draft brushes past you.",
      "The floor creaks softly behind you.",
      "Your breath fogs slightly in the cold air.",
      "You feel an unsettling presence nearby..."
    ];
    narratorLog(hints[Math.floor(Math.random() * hints.length)]);
  }
}

/* === ITEM USE: CAMERA ORBS === */
function useItem(item) {
  if (!game.inventory.includes(item)) {
    narratorLog(`You aren't carrying a ${item}.`);
    return;
  }
  switch (item) {
    case "Smudge Stick":
      if (game.playerRoom === game.ghostRoom) {
        narratorLog("🔥 You smudge the ghost's room. The presence retreats briefly.");
        game.smudgeCooldown = game.ghost === "Yurei" ? 5 : 3;
        game.huntActive = false;
        const index = game.inventory.indexOf("Smudge Stick");
        game.inventory.splice(index, 1);
      } else {
        narratorLog("You smudge, but nothing happens here.");
      }
      break;
    case "Camera":
      if (game.playerRoom === game.ghostRoom) {
        if (game.ghost === "The Mimic" || ghostProfiles[game.ghost].evidence.includes("Orbs")) {
          narratorLog("📷 You see ghost orbs floating in the room!");
        } else {
          narratorLog("📷 The room is clear—no orbs visible.");
        }
      } else {
        narratorLog("📷 No orbs detected here.");
      }
      break;
    default:
      narratorLog(`You use the ${item}, but nothing significant happens.`);
  }
  updateHUD();
}

/* === MIMIC BEHAVIOR SHIFT === */
function mimicShift() {
  const otherGhosts = Object.keys(ghostProfiles).filter(g => g !== "The Mimic");
  game.mimicForm = otherGhosts[Math.floor(Math.random() * otherGhosts.length)];
  narratorLog(`The Mimic shifts its behavior... imitating a ${game.mimicForm}.`);
}
</script>

          game.inventory.push(item);
          game.vanStock[item] = false;
          populateLoadout();
        } else {
          alert("You can only hold 3 items.");
        }
      };
      van.appendChild(btn);
    }
  });

  game.inventory.forEach(item => {
    const btn = document.createElement("button");
    btn.textContent = item;
    btn.onclick = () => {
      const idx = game.inventory.indexOf(item);
      if (idx !== -1) {
        game.inventory.splice(idx, 1);
        game.vanStock[item] = true;
        populateLoadout();
      }
    };
    held.appendChild(btn);
  });
}

/* === CONFIRM LOADOUT === */
function confirmLoadout() {
  document.getElementById("loadout-screen").style.display = "none";
  document.getElementById("main-scene").style.display = "block";
  initializeGame();
  renderActionButtons();
}

/* === PAGE LOAD STARTUP === */
document.addEventListener("DOMContentLoaded", () => {
  document.getElementById("main-scene").style.display = "none";
  document.getElementById("loadout-screen").style.display = "flex";
  populateLoadout();
});
</script>

<script>
/* === HUD UPDATER (FINALIZED) === */
function updateHUD() {
  document.getElementById("hud-sanity").textContent = `${Math.max(0, Math.floor(game.sanity))}%`;
  document.getElementById("hud-turn").textContent = game.currentTurn;
  document.getElementById("hud-location").textContent = game.playerRoom;
  document.getElementById("hud-temp").textContent =
    game.inventory.includes("Thermometer")
      ? `${(Math.random() * 10 + 5).toFixed(1)}°C`
      : "--°C";
}

/* === ADVANCE TURN (FINALIZED) === */
function advanceTurn() {
  game.currentTurn++;

  // Sanity drain baseline
  if (game.sanity > 0) {
    game.sanity -= (Math.random() * 2 + 1);
    if (game.sanity < 0) game.sanity = 0;
  }

  // Mimic mimicry shift
  if (game.ghost === "The Mimic" && game.currentTurn >= game.nextMimicShift) {
    mimicShift();
    game.nextMimicShift = game.currentTurn + (3 + Math.floor(Math.random() * 4));
  }

  // Ghost room shifting (except Goryo; Yurei smudge lock)
  if (game.ghost !== "Goryo" && Math.random() < 0.2) {
    if (game.ghost === "Yurei" && game.smudgeCooldown > 0) {
      game.smudgeCooldown--;
    } else {
      const rooms = Object.keys(roomsMap).filter(r => r !== "Van");
      game.ghostRoom = rooms[Math.floor(Math.random() * rooms.length)];
    }
  }

  // Hunt trigger
  if (!game.huntActive && Math.random() * 100 < huntChance()) {
    startHunt();
  }

  // Resolve active hunt
  if (game.huntActive) resolveHunt();

  updateHUD();
  ambientNarration();
}

/* === CAMERA ORB DETECTION (TRUE EVIDENCE ONLY) === */
function useItem(item) {
  if (!game.inventory.includes(item)) {
    narratorLog(`You aren't carrying a ${item}.`);
    return;
  }

  switch (item) {
    case "Smudge Stick":
      if (game.playerRoom === game.ghostRoom) {
        narratorLog("🔥 You smudge the ghost's room. It retreats!");
        game.smudgeCooldown = game.ghost === "Yurei" ? 5 : 3;
        game.huntActive = false;
        const index = game.inventory.indexOf("Smudge Stick");
        game.inventory.splice(index, 1);
      } else {
        narratorLog("You smudge, but nothing happens here.");
      }
      break;

    case "Camera":
      if (game.playerRoom === game.ghostRoom) {
        if (
          game.ghost === "The Mimic" ||
          ghostProfiles[game.ghost].evidence.includes("Orbs")
        ) {
          narratorLog("📷 Through the camera, you see ghost orbs swirling in the room!");
        } else {
          narratorLog("📷 The room looks clear—no ghost orbs detected.");
        }
      } else {
        narratorLog("📷 You're not in the ghost's room; no orbs detected.");
      }
      break;

    default:
      narratorLog(`You use the ${item}, but nothing significant happens.`);
  }

  updateHUD();
}

/* === FULL RESTART CLEANUP === */
function restartGame() {
  // Reset state
  game.inventory = [];
  game.vanStock = {
    "EMF Reader": true,
    "Spirit Box": true,
    "Camera": true,
    "UV Light": true,
    "D.O.T.S Projector": true,
    "Thermometer": true,
    "Crucifix": true,
    "Smudge Stick": true,
    "Salt": true
  };
  game.currentTurn = 0;
  game.sanity = 100;
  game.huntActive = false;
  game.smudgeCooldown = 0;
  game.huntCooldown = 0;
  game.ghost = null;
  game.ghostRoom = null;
  game.playerRoom = "Van";
  enableLightning = false;

  // Clear logs
  document.getElementById("narrator-log").innerHTML = "";

  // Hide main scene, show loadout
  document.getElementById("main-scene").style.display = "none";
  document.getElementById("loadout-screen").style.display = "flex";

  // Weather reset
  resetWeather();

  populateLoadout();
}

/* === AUTO PAGE LOAD === */
document.addEventListener("DOMContentLoaded", () => {
  document.getElementById("main-scene").style.display = "none";
  document.getElementById("loadout-screen").style.display = "flex";
  populateLoadout();
});
</script>
</body></html>
