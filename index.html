<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Phasma‑Phoney v2.2 — Master Build</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    /* === GLOBAL RESET & BASICS === */
    html, body {
      margin: 0; padding: 0;
      width: 100vw; height: 100vh;
      background: #000; overflow: hidden;
      font-family: monospace, sans-serif;
      color: #eee;
    }
    button { font-family: monospace; }

    /* === TITLE SCREEN === */
    #title-screen {
      position: fixed; top: 0; left: 0;
      width:100vw; height:100vh;
      background:#000; display:flex;
      align-items:center; justify-content:center;
      z-index:1000; transition:opacity 1s;
    }
    #title-screen img {
      max-width:80%;
      animation:pulse 5s infinite ease-in-out;
    }
    @keyframes pulse {
      0%,100% {opacity:0.9; transform:scale(1);}
      50% {opacity:1; transform:scale(1.04);}
    }

    /* === LAYERED SCENE === */
    #main-scene { position:relative; width:100%; height:100%; }
    .layer {
      position:absolute; top:0; left:0;
      width:100%; height:100%; pointer-events:none;
    }
    #background {
      background:url('House.png') no-repeat center/cover;
      z-index:0;
    }
    #rain-canvas { z-index:5; }
    #bg-blocker {
      background:rgba(0,0,0,0.25);
      z-index:10;
    }
    #lightning {
      background:#fff; opacity:0;
      transition:opacity .1s ease-out;
      z-index:20;
    }
    #lightning.flash { opacity:1; }
    #fog-container { z-index:30; }
    #spirit-canvas { z-index:40; }

    /* === GAME UI === */
    #game-ui {
      position:absolute; bottom:0; left:0;
      width:100%; background:rgba(0,0,0,0.7);
      z-index:1000; display:flex; flex-direction:column;
    }
    #game-stats {
      display:flex; flex-wrap:wrap;
      padding:4px; background:rgba(0,0,0,0.5);
      font-size:12px;
    }
    #game-stats > div {
      margin-right:8px;
    }
    #sanity-bar {
      flex:1; background:#333; height:8px; margin-top:2px;
      position:relative; overflow:hidden;
    }
    #sanity-fill {
      background:#0f0; height:100%; width:100%;
      transition:width .5s, background .5s;
    }
    #game-log {
      flex:1; overflow-y:auto;
      font-size:14px; padding:8px;
      background:rgba(0,0,0,0.2);
    }
    #game-log div {
      animation:fadeUp 1s forwards;
    }
    @keyframes fadeUp {
      0% { opacity:1; transform:translateY(0); }
      100% { opacity:.5; transform:translateY(-10px); }
    }
    #action-buttons {
      display:flex; justify-content:space-around;
      padding:4px; background:rgba(0,0,0,0.5);
    }
    #action-buttons button {
      flex:1; margin:0 2px; padding:6px;
      background:#111; border:1px solid #444;
      color:#eee; cursor:pointer;
    }

    /* === POPUPS === */
    .popup {
      position:absolute; top:20%; left:50%;
      transform:translateX(-50%);
      background:#222; border:2px solid #555;
      padding:16px; z-index:2000;
      display:none; width:80%; max-width:300px;
    }
    .popup h2 {
      margin-top:0; font-size:16px;
      text-align:center;
    }
    .popup .options {
      max-height:200px; overflow-y:auto;
      margin:8px 0;
    }
    .popup button {
      width:100%; margin:4px 0;
      background:#333; border:1px solid #555;
    }

    /* === FOOTER === */
    #footer {
      position:fixed; bottom:0; left:0;
      width:100%; text-align:center;
      padding:4px; font-size:12px;
      background:rgba(0,0,0,0.5); z-index:1000;
    }
    #footer a { color:#0af; text-decoration:none; }

    /* === RESPONSIVE === */
    @media (max-height:600px) {
      #game-ui { height:40%; }
    }
    @media (max-width:500px) {
      #action-buttons button { font-size:12px; }
    }
  </style>
</head>
<body>

  <!-- TITLE SCREEN -->
  <div id="title-screen">
    <button id="start-btn">
      <img src="title-logo.png" alt="Phasma‑Phoney">
    </button>
  </div>

  <!-- MAIN SCENE & EFFECT LAYERS -->
  <div id="main-scene">
    <div id="background"    class="layer"></div>
    <canvas id="rain-canvas" class="layer"></canvas>
    <div id="bg-blocker"    class="layer"></div>
    <div id="lightning"     class="layer"></div>
    <div id="fog-container" class="layer"></div>
    <canvas id="spirit-canvas" class="layer"></canvas>
  </div>

  <!-- GAME UI -->
  <div id="game-ui">
    <div id="game-stats">
      <div id="stat-location">Location: Van</div>
      <div id="stat-weather">Weather: Foggy</div>
      <div id="stat-turns">Turns: 0</div>
      <div id="stat-temp">Temp: --°C</div>
      <div id="stat-sanity">Sanity:</div>
      <div id="sanity-bar"><div id="sanity-fill"></div></div>
      <div style="margin-left:auto;">
        <button id="btn-mute">🔇</button>
        <select id="voice-select"></select>
      </div>
    </div>
    <div id="game-log"></div>
    <div id="action-buttons">
      <button id="btn-map">Map</button>
      <button id="btn-move">Move</button>
      <button id="btn-use">Use Item</button>
      <button id="btn-inv">Inventory</button>
      <button id="btn-monitor">Monitor</button>
      <button id="btn-guess">Guess</button>
    </div>
  </div>

  <!-- LOADOUT POPUP -->
  <div id="loadout-popup" class="popup">
    <h2>Choose Loadout</h2>
    <div class="options" id="loadout-list"></div>
    <button id="loadout-confirm">Confirm</button>
  </div>

  <!-- VAN SWAP POPUP -->
  <div id="van-popup" class="popup">
    <h2>Van Inventory</h2>
    <div class="options" id="van-list"></div>
    <button id="van-confirm">Done</button>
  </div>

  <!-- USE ITEM POPUP -->
  <div id="use-popup" class="popup">
    <h2>Use Item</h2>
    <div class="options" id="use-list"></div>
    <button onclick="closePopup('use-popup')">Cancel</button>
  </div>

  <!-- INVENTORY POPUP -->
  <div id="inv-popup" class="popup">
    <h2>Your Items</h2>
    <div class="options" id="inv-list"></div>
    <button onclick="closePopup('inv-popup')">Close</button>
  </div>

  <!-- MOVE POPUP -->
  <div id="move-popup" class="popup">
    <h2>Choose Direction</h2>
    <div id="move-list" class="options"></div>
    <button onclick="closePopup('move-popup')">Cancel</button>
  </div>

  <!-- GHOST GUESS POPUP -->
  <div id="guess-popup" class="popup">
    <h2>Guess Ghost</h2>
    <div class="options" id="guess-list"></div>
    <button onclick="closePopup('guess-popup')">Cancel</button>
  </div>

  <!-- RESTART SCREEN -->
  <div id="restart-popup" class="popup">
    <h2 id="end-message">Game Over</h2>
    <button id="restart-btn">Start New Game</button>
  </div>

  <!-- FOOTER -->
  <div id="footer">
    &copy; 2025 SharkVelocity | <a href="#">Updates & Contact</a>
  </div>

  <script>
  // ==== STATE ====
  const game = {
    ghost: null,
    ghostRoom: null,
    playerRoom: 'Van',
    inventory: [],
    vanStock: [],
    selectedEvidence: new Set(),
    currentTurn: 0,
    sanity: 100,
    huntCooldown: 0,
    smudgeTurns: 0,
    crucifixUses: 2,
    mimicForm: null,
    nextMimicTurn: 0,
    usedVanThisTurn: false,
    muted: false,
    voice: null
  };

  // ==== GHOST PROFILES ====
  const ghostProfiles = {
    Spirit:    { evidence:['EMF Reader','Spirit Box','Ghost Writing'] },
    Wraith:    { evidence:['Spirit Box','DOTS Projector','Freezing Temps'] },
    Phantom:   { evidence:['EMF Reader','DOTS Projector','Spirit Box'] },
    Poltergeist:{evidence:['DOTS Projector','Ghost Writing','Spirit Box']},
    Banshee:   { evidence:['Fingerprint Kit','Ghost Writing','Freezing Temps'] },
    Jinn:      { evidence:['EMF Reader','DOTS Projector','Spirit Box'] },
    Mare:      { evidence:['Spirit Box','Ghost Writing','Freezing Temps'] },
    Revenant:  { evidence:['DOTS Projector','Ghost Writing','Fingerprint Kit'] },
    Shade:     { evidence:['EMF Reader','Ghost Writing','DOTS Projector'] },
    Demon:     { evidence:['Spirit Box','Ghost Writing','Freezing Temps'] },
    Yurei:     { evidence:['Freezing Temps','Ghost Writing','DOTS Projector'] },
    Oni:       { evidence:['EMF Reader','Spirit Box','DOTS Projector'] },
    Yokai:     { evidence:['Spirit Box','Freezing Temps','Ghost Writing'] },
    Hantu:     { evidence:['Freezing Temps','DOTS Projector','Fingerprint Kit'] },
    Goryo:     { evidence:['DOTS Projector','EMF Reader','Fingerprint Kit'] },
    Myling:    { evidence:['EMF Reader','Ghost Writing','Fingerprint Kit'] },
    Onryo:     { evidence:['Ghost Writing','Spirit Box','Freezing Temps'] },
    Raiju:     { evidence:['EMF Reader','Spirit Box','Fingerprint Kit'] },
    Obake:     { evidence:['Fingerprint Kit','Ghost Writing','DOTS Projector'] },
    Twins:     { evidence:['EMF Reader','Spirit Box','Ghost Writing'] },
    Deogen:    { evidence:['Ghost Writing','Freezing Temps','Fingerprint Kit'] },
    Succubus:  { evidence:['Ghost Writing','Freezing Temps','Fingerprint Kit'] },
    Mimic:     { evidence:['EMF Reader','Spirit Box','DOTS Projector'] }
  };

  // ==== ITEMS & LOADOUT ====
  const allLoadoutItems = [
    'EMF Reader','Spirit Box','Camera',
    'UV Light','DOTS Projector','Fingerprint Kit',
    'Smudge Stick','Crucifix','Thermometer'
  ];
  const maxCarry = 3;

  // ==== MAP ====
  const rooms = {
    Van:{ north:'Foyer' },
    Foyer:{ south:'Van', east:'Living Room', west:'Stairs' },
    'Living Room':{ west:'Foyer', south:'Garage' },
    Stairs:{ up:'Upstairs Hall', east:'Foyer' },
    'Upstairs Hall':{ down:'Stairs', west:'Master Bdrm', east:'Kids Bdrm', north:'Bathroom' },
    'Master Bdrm':{}, 'Kids Bdrm':{}, Bathroom:{}, Garage:{}, Basement:{}
  };

  // ==== ASSETS & FX ====
  let rainCanvas, rainCtx, spiritCanvas, spiritCtx, fogImg=new Image();
  fogImg.src='fog.png';
  let voices=[];

  document.addEventListener('DOMContentLoaded',()=>{
    rainCanvas   = document.getElementById('rain-canvas');
    rainCtx      = rainCanvas.getContext('2d');
    spiritCanvas = document.getElementById('spirit-canvas');
    spiritCtx    = spiritCanvas.getContext('2d');
    resize(); window.addEventListener('resize',resize);

    // Title->Loadout
    document.getElementById('start-btn')
      .addEventListener('click', ()=>{ fade('#title-screen'); openLoadout(); });

    // Voice/Mute
    document.getElementById('btn-mute').onclick=()=>{ game.muted=!game.muted; document.getElementById('btn-mute').textContent=game.muted?'🔈':'🔇'; };
    document.getElementById('voice-select').onchange=()=>{ game.voice=voices[this.selectedIndex]; };

    // Bind action buttons
    document.getElementById('btn-map')   .onclick=showMap;
    document.getElementById('btn-move')  .onclick=showMove;
    document.getElementById('btn-use')   .onclick=showUse;
    document.getElementById('btn-inv')   .onclick=showInv;
    document.getElementById('btn-monitor').onclick=toggleMonitor;
    document.getElementById('btn-guess') .onclick=showGuess;
    document.getElementById('restart-btn').onclick=resetGame;

    // Loadout confirm
    document.getElementById('loadout-confirm')
      .addEventListener('click', ()=>{ close('loadout-popup'); startGame(); });

    // Van confirm
    document.getElementById('van-confirm')
      .addEventListener('click', ()=>{ game.usedVanThisTurn=true; close('van-popup'); log('Left van.'); });

    // Speech Synthesis
    window.speechSynthesis.onvoiceschanged = ()=>{
      voices = speechSynthesis.getVoices().filter(v=>v.lang.startsWith('en'));
      const sel = document.getElementById('voice-select');
      voices.forEach((v,i)=>{ let o=new Option(v.name,i); sel.add(o); });
      game.voice = voices[0];
    };

    initRain(); initFog(); initParticles(); scheduleLightning(); scheduleAmbient(); gameLoop();
  });

  function resize(){
    rainCanvas.width=spiritCanvas.width=innerWidth;
    rainCanvas.height=spiritCanvas.height=innerHeight;
  }

  /* RAIN */
  let raindrops=[];
  function initRain(){
    for(let i=0;i<300;i++) raindrops.push({
      x:Math.random()*innerWidth,
      y:Math.random()*innerHeight,
      len:Math.random()*20+10,
      speed:Math.random()*2+2
    });
  }
  function updateRain(){
    raindrops.forEach(d=>{
      d.y+=d.speed;
      if(d.y>innerHeight){ d.y=-20; d.x=Math.random()*innerWidth;}
    });
  }
  function drawRain(){
    rainCtx.clearRect(0,0,innerWidth,innerHeight);
    rainCtx.strokeStyle='rgba(200,200,255,0.2)'; rainCtx.lineWidth=1;
    raindrops.forEach(d=>{
      rainCtx.beginPath();
      rainCtx.moveTo(d.x,d.y);
      rainCtx.lineTo(d.x,d.y+d.len);
      rainCtx.stroke();
    });
  }

  /* LIGHTNING */
  function triggerLightning(){
    const L=document.getElementById('lightning');
    L.classList.add('flash');
    setTimeout(()=>L.classList.remove('flash'),80);
  }
  function scheduleLightning(){
    setTimeout(()=>{
      triggerLightning();
      scheduleLightning();
    },Math.random()*22000+8000);
  }

  /* FOG */
  let fogs=[];
  function initFog(){
    for(let i=0;i<3;i++) fogs.push({
      y:Math.random()*innerHeight,
      speed:0.1+i*0.05,
      alpha:0.1+i*0.05
    });
  }
  function updateFog(){
    fogs.forEach(f=>{
      f.y+=f.speed;
      if(f.y>innerHeight) f.y=-200;
    });
  }
  function drawFog(){
    spiritCtx.clearRect(0,0,innerWidth,innerHeight);
    fogs.forEach(f=>{
      spiritCtx.globalAlpha=f.alpha;
      spiritCtx.drawImage(fogImg,0,f.y,innerWidth,200);
    });
    spiritCtx.globalAlpha=1;
  }

  /* PARTICLES */
  let parts=[];
  function initParticles(){
    for(let i=0;i<40;i++) parts.push({
      x:Math.random()*innerWidth,
      y:Math.random()*innerHeight,
      size:Math.random()*3+2,
      alpha:0,
      fade:Math.random()*0.01+0.005
    });
  }
  function updateParticles(){
    parts.forEach(p=>{
      p.alpha+=p.fade;
      if(p.alpha<=0||p.alpha>=1) p.fade*=-1;
      p.x+=(Math.random()-0.5);
      p.y+=(Math.random()-0.5);
    });
  }
  function drawParticles(){
    parts.forEach(p=>{
      spiritCtx.beginPath();
      spiritCtx.fillStyle=`rgba(255,255,255,${p.alpha})`;
      spiritCtx.arc(p.x,p.y,p.size,0,2*Math.PI);
      spiritCtx.fill();
    });
  }

  /* MAIN LOOP */
  function gameLoop(){
    updateRain(); drawRain();
    updateFog(); drawFog();
    if(game.ghost==='Mimic' && game.playerRoom===game.ghostRoom && game.cameraOn){
      updateParticles(); drawParticles();
    }
    requestAnimationFrame(gameLoop);
  }

  /* UTILS */
  function log(msg){
    const lg=document.getElementById('game-log');
    lg.innerHTML+=`<div>${msg}</div>`;
    if(lg.children.length>100) lg.removeChild(lg.firstChild);
    lg.scrollTop=lg.scrollHeight;
    speak(msg);
  }
  function speak(txt){
    if(game.muted||!game.voice) return;
    const u=new SpeechSynthesisUtterance(txt);
    u.voice=game.voice;
    speechSynthesis.speak(u);
  }
  function fade(sel){ document.querySelector(sel).style.opacity=0; }

  function openLoadout(){
    game.vanStock=[...allLoadoutItems];
    const list=document.getElementById('loadout-list');
    list.innerHTML='';
    allLoadoutItems.forEach(item=>{
      const btn=document.createElement('button');
      btn.textContent=item;
      btn.onclick=()=>{
        if(game.inventory.includes(item)){
          game.inventory.splice(game.inventory.indexOf(item),1);
        } else if(game.inventory.length<maxCarry){
          game.inventory.push(item);
        }
        btn.style.background=game.inventory.includes(item)?'#0a0':'#333';
      };
      list.appendChild(btn);
    });
    document.getElementById('loadout-popup').style.display='block';
  }
  function startGame(){
    close('loadout-popup');
    game.currentTurn=0; game.sanity=100;
    game.ghost=randChoice(Object.keys(ghostProfiles));
    game.ghostRoom=randChoice(Object.keys(rooms).filter(r=>r!=='Van'));
    game.nextMimicTurn = game.currentTurn + randInt(3,6);
    updateStats();
    log('Welcome to Phasma‑Phoney v2.2');
    log('You are in the Van. The weather is foggy...');
    advanceTurn();
  }

  function randChoice(a){ return a[Math.floor(Math.random()*a.length)]; }
  function randInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }

  function updateStats(){
    document.getElementById('stat-location').textContent='Location: '+game.playerRoom;
    document.getElementById('stat-weather').textContent='Weather: Foggy';
    document.getElementById('stat-turns').textContent='Turns: '+game.currentTurn;
    document.getElementById('stat-temp').textContent='Temp: '+(game.inventory.includes('Thermometer')? (randInt(-5,5)+'°C') : '--°C');
    const fill=document.getElementById('sanity-fill');
    fill.style.width=game.sanity+'%';
    fill.style.background= game.sanity>50? '#0f0' : game.sanity>20? '#ff0':'#f00';
  }

  /* ADVANCE TURN & HUNT */
  function advanceTurn(){
    game.currentTurn++;
    game.usedVanThisTurn=false;
    if(game.smudgeTurns>0) game.smudgeTurns--;
    if(game.huntCooldown>0) game.huntCooldown--;
    // sanity decay
    game.sanity = Math.max(0, game.sanity - 2);
    updateStats();
    // Mimic shift
    if(game.ghost==='Mimic' && game.currentTurn>=game.nextMimicTurn){
      game.mimicForm = randChoice(Object.keys(ghostProfiles).filter(g=>'Mimic'!==g));
      log(`The Mimic takes the form of a ${game.mimicForm}...`);
      game.nextMimicTurn = game.currentTurn + randInt(3,6);
    }
    // Hunt check
    if(game.sanity<30 && game.huntCooldown===0 && game.smudgeTurns===0){
      triggerHunt();
      game.huntCooldown = randInt(5,10);
    }
  }

  function triggerHunt(){
    log('💀 The ghost is hunting!');
    // flicker screen
    document.getElementById('bg-blocker').style.background='rgba(255,0,0,0.5)';
    setTimeout(()=>document.getElementById('bg-blocker').style.background='rgba(0,0,0,0.25)',200);
    if(game.playerRoom===game.ghostRoom){
      // defense?
      if(game.crucifixUses>0){
        log('Your Crucifix protected you!');
        game.crucifixUses--;
      } else {
        endGame(false);
        return;
      }
    }
  }

  /* END / RESTART */
  function endGame(win){
    document.getElementById('end-message').textContent = win? '✅ You caught the ghost!' : '💀 You died!';
    document.getElementById('restart-popup').style.display='block';
  }
  function resetGame(){
    close('restart-popup');
    game.inventory=[]; game.selectedEvidence.clear();
    document.getElementById('game-log').innerHTML='';
    fade('#title-screen');
    setTimeout(()=>document.getElementById('title-screen').style.display='flex',500);
  }

  /* POPUP HELPERS */
  function close(id){ document.getElementById(id).style.display='none'; }
  function showMap(){ log('Map: '+JSON.stringify(rooms[game.playerRoom])); }
  function showMove(){
    const list=document.getElementById('move-list');
    list.innerHTML='';
    Object.entries(rooms[game.playerRoom]).forEach(([dir,room])=>{
      const b=document.createElement('button');
      b.textContent=dir+' → '+room;
      b.onclick=()=>{
        game.playerRoom=room;
        log(`Moved ${dir} to ${room}.`);
        close('move-popup');
        advanceTurn(); updateStats();
      };
      list.appendChild(b);
    });
    document.getElementById('move-popup').style.display='block';
  }
  function showUse(){
    const list=document.getElementById('use-list');
    list.innerHTML='';
    game.inventory.forEach(item=>{
      const b=document.createElement('button');
      b.textContent=item;
      b.onclick=()=>{
        useItem(item);
        close('use-popup');
        advanceTurn(); updateStats();
      };
      list.appendChild(b);
    });
    document.getElementById('use-popup').style.display='block';
  }
  function showInv(){
    const list=document.getElementById('inv-list');
    list.innerHTML='';
    game.inventory.forEach(i=>{ let d=document.createElement('div'); d.textContent=i; list.appendChild(d); });
    document.getElementById('inv-popup').style.display='block';
  }
  function showGuess(){
    const list=document.getElementById('guess-list');
    list.innerHTML='';
    Object.keys(ghostProfiles).forEach(g=>{
      const b=document.createElement('button');
      b.textContent=g;
      b.onclick=()=>{
        close('guess-popup');
        endGame(g===game.ghost);
      };
      list.appendChild(b);
    });
    document.getElementById('guess-popup').style.display='block';
  }

  /* ITEM LOGIC */
  function useItem(item){
    log(`You used ${item}.`);
    if(item==='Smudge Stick'){
      game.smudgeTurns = 5;
      game.inventory.splice(game.inventory.indexOf(item),1);
      log('The ghost is repelled for 5 turns.');
    } else if(item==='Crucifix'){
      // passive use in hunt
      log('Your Crucifix stands ready.');
    } else if(item==='Thermometer'){
      log('Thermometer reads '+randInt(-5,5)+'°C.');
    } else if(item==='Camera'){
      game.cameraOn = !game.cameraOn;
      log(game.cameraOn?'Camera on.':'Camera off.');
    } else {
      // evidence detection
      if(game.playerRoom===game.ghostRoom){
        const profile = game.ghost==='Mimic' && game.mimicForm? ghostProfiles[game.mimicForm]: ghostProfiles[game.ghost];
        if(profile.evidence.includes(item)){
          game.selectedEvidence.add(item);
          log(`🔍 You found ${item} evidence!`);
        } else {
          log('Nothing on the camera.');
        }
      } else {
        log('Nothing here.');
      }
    }
    // suggestion
    suggestGhosts();
  }

  function suggestGhosts(){
    if(game.selectedEvidence.size===0) return;
    const matches = Object.entries(ghostProfiles).filter(([g,p])=>
      [...game.selectedEvidence].every(e=>p.evidence.includes(e))
    ).map(([g])=>g);
    if(matches.length>0){
      log('Possible: '+matches.join(', '));
    }
  }

  function toggleMonitor(){
    game.cameraOn = !game.cameraOn;
    log(game.cameraOn?'Camera on.':'Camera off.');
  }

  /* AMBIENT NARRATION */
  const ambience = [
    'You feel a chill down your spine...',
    'Something whispered in the dark.',
    'The lights flicker again.',
    'Footsteps echo somewhere.',
    'You hear a distant moan.'
  ];
  function scheduleAmbient(){
    setTimeout(()=>{
      log(randChoice(ambience));
